<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三省六部控制台 - AIQuant</title>
    <style>
        :root {
            --primary: #1a73e8;
            --success: #34a853;
            --warning: #fbbc04;
            --danger: #ea4335;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --bg-hover: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --crown-prince: #ff6b6b;
            --chancellery: #4ecdc4;
            --secretariat: #45b7d1;
            --libu: #96ceb4;
            --hubu: #feca57;
            --rites: #ff9ff3;
            --war: #54a0ff;
            --justice: #5f27cd;
            --works: #00d2d3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .status-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .status-item {
            background: var(--bg-card);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex: 1;
            min-width: 200px;
        }

        .status-item h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .status-item .value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .status-item .value.success { color: var(--success); }
        .status-item .value.warning { color: var(--warning); }
        .status-item .value.danger { color: var(--danger); }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
        }

        .provinces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .province-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid var(--border);
            transition: all 0.3s ease;
        }

        .province-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .province-card.crown-prince { border-color: var(--crown-prince); }
        .province-card.chancellery { border-color: var(--chancellery); }
        .province-card.secretariat { border-color: var(--secretariat); }

        .province-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .province-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .crown-prince .province-icon { background: var(--crown-prince); }
        .chancellery .province-icon { background: var(--chancellery); }
        .secretariat .province-icon { background: var(--secretariat); }

        .province-title h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .province-title p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .province-content {
            margin-top: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge-success { background: rgba(52, 168, 83, 0.2); color: var(--success); }
        .badge-warning { background: rgba(251, 188, 4, 0.2); color: var(--warning); }
        .badge-danger { background: rgba(234, 67, 53, 0.2); color: var(--danger); }
        .badge-info { background: rgba(26, 115, 232, 0.2); color: var(--primary); }

        .ministries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .ministry-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid var(--border);
            transition: all 0.2s ease;
        }

        .ministry-card:hover {
            background: var(--bg-hover);
        }

        .ministry-card.libu { border-left-color: var(--libu); }
        .ministry-card.hubu { border-left-color: var(--hubu); }
        .ministry-card.rites { border-left-color: var(--rites); }
        .ministry-card.war { border-left-color: var(--war); }
        .ministry-card.justice { border-left-color: var(--justice); }
        .ministry-card.works { border-left-color: var(--works); }

        .ministry-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .ministry-icon {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .libu .ministry-icon { background: var(--libu); }
        .hubu .ministry-icon { background: var(--hubu); }
        .rites .ministry-icon { background: var(--rites); }
        .war .ministry-icon { background: var(--war); }
        .justice .ministry-icon { background: var(--justice); }
        .works .ministry-icon { background: var(--works); }

        .ministry-name {
            font-weight: 600;
        }

        .ministry-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .ministry-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--bg-dark);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: #333;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .flow-diagram {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .flow-diagram h3 {
            margin-bottom: 15px;
        }

        .flow-steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flow-step {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        .flow-arrow {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .log-container {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-secondary);
            margin-right: 10px;
        }

        .log-info { color: var(--primary); }
        .log-success { color: var(--success); }
        .log-warning { color: var(--warning); }
        .log-error { color: var(--danger); }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .provinces-grid { grid-template-columns: 1fr; }
            .ministries-grid { grid-template-columns: 1fr; }
            .flow-steps { flex-direction: column; }
            .flow-arrow { transform: rotate(90deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>三省六部控制台</h1>
        <p>AIQuant 量化投资决策系统 - 分权协同 · 风控闭环</p>
    </div>

    <div class="flow-diagram">
        <h3>决策流程</h3>
        <div class="flow-steps">
            <div class="flow-step" style="background: var(--crown-prince);">太子院<br><small>数据校验</small></div>
            <div class="flow-arrow">→</div>
            <div class="flow-step" style="background: var(--chancellery);">中书省<br><small>策略生成</small></div>
            <div class="flow-arrow">→</div>
            <div class="flow-step" style="background: var(--secretariat);">门下省<br><small>风控审核</small></div>
            <div class="flow-arrow">→</div>
            <div class="flow-step" style="background: var(--war);">尚书省<br><small>执行调度</small></div>
            <div class="flow-arrow">→</div>
            <div class="flow-step" style="background: var(--bg-hover);">六部<br><small>职能执行</small></div>
        </div>
    </div>

    <div class="action-bar">
        <button class="btn btn-primary" onclick="refreshStatus()">🔄 刷新状态</button>
        <button class="btn btn-success" onclick="openIntentModal()">📝 设置策略意图</button>
        <button class="btn btn-warning" onclick="runScan()">🔍 执行扫描</button>
        <button class="btn btn-danger" onclick="clearCache()">🗑️ 清理缓存</button>
    </div>

    <div id="statusBar" class="status-bar">
        <div class="status-item">
            <h3>系统状态</h3>
            <div class="value" id="systemStatus">加载中...</div>
        </div>
        <div class="status-item">
            <h3>待执行订单</h3>
            <div class="value" id="pendingOrders">0</div>
        </div>
        <div class="status-item">
            <h3>已执行订单</h3>
            <div class="value" id="executedOrders">0</div>
        </div>
        <div class="status-item">
            <h3>持仓数量</h3>
            <div class="value" id="holdingPositions">0</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">三省决策层</h2>
        <div class="provinces-grid" id="provincesGrid">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">六部执行层</h2>
        <div class="ministries-grid" id="ministriesGrid">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <div class="section">
        <h2 class="section-title">操作日志</h2>
        <div class="log-container" id="logContainer">
            <div class="log-entry">
                <span class="log-time">--:--:--</span>
                <span class="log-info">系统启动，等待数据加载...</span>
            </div>
        </div>
    </div>

    <div class="modal" id="intentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>设置策略意图</h2>
                <button class="modal-close" onclick="closeIntentModal()">×</button>
            </div>
            <form onsubmit="submitIntent(event)">
                <div class="form-group">
                    <label>市场立场</label>
                    <select id="intentStance" required>
                        <option value="bullish">看多 (Bullish)</option>
                        <option value="neutral" selected>中性 (Neutral)</option>
                        <option value="bearish">看空 (Bearish)</option>
                        <option value="defense">防守 (Defense)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>风险偏好</label>
                    <select id="intentRisk" required>
                        <option value="conservative">保守 (Conservative)</option>
                        <option value="moderate" selected>稳健 (Moderate)</option>
                        <option value="aggressive">激进 (Aggressive)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注说明</label>
                    <textarea id="intentNotes" placeholder="输入策略意图说明..."></textarea>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%;">确认设置</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/governance';

        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                return await res.json();
            } catch (err) {
                addLog('error', `请求失败: ${url} - ${err.message}`);
                return null;
            }
        }

        function addLog(type, message) {
            const container = document.getElementById('logContainer');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${time}</span><span class="log-${type}">${message}</span>`;
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        async function refreshStatus() {
            addLog('info', '刷新三省六部状态...');

            const status = await fetchJSON(`${API_BASE}/status`);
            if (!status || !status.success) {
                addLog('error', '获取状态失败');
                document.getElementById('systemStatus').textContent = '错误';
                document.getElementById('systemStatus').className = 'value danger';
                return;
            }

            const gov = status.governance;
            const min = status.ministries;

            document.getElementById('systemStatus').textContent = '运行中';
            document.getElementById('systemStatus').className = 'value success';
            document.getElementById('pendingOrders').textContent = gov.secretariat.pending_orders;
            document.getElementById('executedOrders').textContent = gov.secretariat.executed_orders;
            document.getElementById('holdingPositions').textContent = min.war.holding_positions;

            renderProvinces(gov);
            renderMinistries(min);

            addLog('success', '状态刷新完成');
        }

        function renderProvinces(gov) {
            const grid = document.getElementById('provincesGrid');

            const crownPrince = gov.crown_prince;
            const chancellery = gov.chancellery;
            const secretariat = gov.secretariat;

            grid.innerHTML = `
                <div class="province-card crown-prince">
                    <div class="province-header">
                        <div class="province-icon">👑</div>
                        <div class="province-title">
                            <h2>太子院</h2>
                            <p>最高决策 · 策略意图</p>
                        </div>
                    </div>
                    <div class="province-content">
                        <div class="info-row">
                            <span class="info-label">当前意图</span>
                            <span class="info-value">${crownPrince.intent ? crownPrince.intent.stance : '未设置'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">风险偏好</span>
                            <span class="info-value">${crownPrince.intent ? crownPrince.intent.risk_appetite : 'moderate'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">执行计划</span>
                            <span class="info-value">${crownPrince.plan ? '<span class="badge badge-success">已生成</span>' : '<span class="badge badge-warning">未生成</span>'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">评分阈值</span>
                            <span class="info-value">${crownPrince.plan ? crownPrince.plan.score_threshold : '20.0'}</span>
                        </div>
                    </div>
                </div>

                <div class="province-card chancellery">
                    <div class="province-header">
                        <div class="province-icon">📜</div>
                        <div class="province-title">
                            <h2>中书省</h2>
                            <p>策略生成 · 信号发现</p>
                        </div>
                    </div>
                    <div class="province-content">
                        <div class="info-row">
                            <span class="info-label">计划加载</span>
                            <span class="info-value">${chancellery.plan_loaded ? '<span class="badge badge-success">已加载</span>' : '<span class="badge badge-warning">未加载</span>'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">融合权重</span>
                            <span class="info-value">${chancellery.params.fusion_weights ? chancellery.params.fusion_weights.join(', ') : '默认'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">止损比例</span>
                            <span class="info-value">${(chancellery.params.stop_loss * 100).toFixed(1)}%</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">止盈比例</span>
                            <span class="info-value">${(chancellery.params.take_profit * 100).toFixed(1)}%</span>
                        </div>
                    </div>
                </div>

                <div class="province-card secretariat">
                    <div class="province-header">
                        <div class="province-icon">⚙️</div>
                        <div class="province-title">
                            <h2>尚书省</h2>
                            <p>执行调度 · 订单管理</p>
                        </div>
                    </div>
                    <div class="province-content">
                        <div class="info-row">
                            <span class="info-label">待执行订单</span>
                            <span class="info-value">${secretariat.pending_orders}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">已执行订单</span>
                            <span class="info-value">${secretariat.executed_orders}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">执行状态</span>
                            <span class="info-value">${secretariat.pending_orders > 0 ? '<span class="badge badge-warning">执行中</span>' : '<span class="badge badge-success">空闲</span>'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMinistries(min) {
            const grid = document.getElementById('ministriesGrid');

            grid.innerHTML = `
                <div class="ministry-card libu">
                    <div class="ministry-header">
                        <div class="ministry-icon">📋</div>
                        <div class="ministry-name">吏部</div>
                    </div>
                    <div class="ministry-desc">策略注册 · 生命周期管理 · 版本控制</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">策略管理</span>
                        <span class="stat-chip">热插拔</span>
                    </div>
                </div>

                <div class="ministry-card hubu">
                    <div class="ministry-header">
                        <div class="ministry-icon">💰</div>
                        <div class="ministry-name">户部</div>
                    </div>
                    <div class="ministry-desc">资金核算 · 仓位管理 · 净值计算</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">资金管理</span>
                        <span class="stat-chip">成本控制</span>
                    </div>
                </div>

                <div class="ministry-card rites">
                    <div class="ministry-header">
                        <div class="ministry-icon">📊</div>
                        <div class="ministry-name">礼部</div>
                    </div>
                    <div class="ministry-desc">数据源管理 · 业绩报表 · 可视化</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">数据源: ${min.rites.sources ? min.rites.sources.length : 0}</span>
                        <span class="stat-chip">主数据源: ${min.rites.primary || 'akshare'}</span>
                    </div>
                </div>

                <div class="ministry-card war">
                    <div class="ministry-header">
                        <div class="ministry-icon">⚔️</div>
                        <div class="ministry-name">兵部</div>
                    </div>
                    <div class="ministry-desc">交易执行 · 订单管理 · 撮合引擎</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">待执行: ${min.war.pending_orders}</span>
                        <span class="stat-chip">持仓: ${min.war.holding_positions}</span>
                    </div>
                </div>

                <div class="ministry-card justice">
                    <div class="ministry-header">
                        <div class="ministry-icon">⚖️</div>
                        <div class="ministry-name">刑部</div>
                    </div>
                    <div class="ministry-desc">风险事件 · 违规记录 · 审计日志</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">风控审核</span>
                        <span class="stat-chip">一票否决</span>
                    </div>
                </div>

                <div class="ministry-card works">
                    <div class="ministry-header">
                        <div class="ministry-icon">🔧</div>
                        <div class="ministry-name">工部</div>
                    </div>
                    <div class="ministry-desc">行情清洗 · 指标计算 · 数据质量</div>
                    <div class="ministry-stats">
                        <span class="stat-chip">系统监控</span>
                        <span class="stat-chip">数据质量</span>
                    </div>
                </div>
            `;
        }

        function openIntentModal() {
            document.getElementById('intentModal').classList.add('active');
        }

        function closeIntentModal() {
            document.getElementById('intentModal').classList.remove('active');
        }

        async function submitIntent(e) {
            e.preventDefault();

            const stance = document.getElementById('intentStance').value;
            const risk = document.getElementById('intentRisk').value;
            const notes = document.getElementById('intentNotes').value;

            addLog('info', `设置策略意图: stance=${stance}, risk=${risk}`);

            const res = await fetch(`${API_BASE}/decision`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stance, risk, notes })
            });

            const data = await res.json();

            if (data.success) {
                addLog('success', `策略意图设置成功: ${data.plan.plan_id}`);
                closeIntentModal();
                refreshStatus();
            } else {
                addLog('error', `设置失败: ${data.error || '未知错误'}`);
            }
        }

        async function runScan() {
            addLog('info', '执行策略扫描...');

            const res = await fetch('/api/governance/strategy');
            const data = await res.json();

            if (data.success) {
                addLog('success', '扫描完成，策略引擎运行正常');
            } else {
                addLog('error', '扫描失败');
            }
        }

        async function clearCache() {
            addLog('warning', '清理系统缓存...');

            const res = await fetch('/api/system/cache', { method: 'DELETE' });

            if (res.ok) {
                addLog('success', '缓存清理完成');
            } else {
                addLog('error', '缓存清理失败');
            }
        }

        window.addEventListener('load', () => {
            addLog('info', '三省六部控制台初始化完成');
            refreshStatus();

            setInterval(refreshStatus, 30000);
        });

        document.getElementById('intentModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('intentModal')) {
                closeIntentModal();
            }
        });
    </script>
</body>
</html>
