// ─── 机构席位建仓跟踪（龙虎榜机构专用席位）────────────────────────────
// ⚠ 定位：资金动向与成本位参考，**不是收益信号**。实测（2024-07~2026-09，13350 样本）：
//   · 单日：机构净买 +0.72% vs 机构净卖 +0.66%，Δ=+0.058pp t=+0.53（不显著）
//   · 同「近20日上榜>=4次」下：净买 +0.94% vs **净卖 +1.19%**（方向反了）
//   · 「近20日机构净买>=4次」+1.22%（t=+2.24）看似显著，但剔除任一年即不显著
//   ⇒ 机构买卖方向对次日收益无区分度，别当买点用。真正有效的是「频繁上榜」本身。
// 有价值的部分是**价位**：机构在什么价位建的仓、现价相对成本在哪。
// cost = Σ(机构净买额 × 上榜日收盘价) / Σ(机构净买额)，按净买额加权（估算，非真实成交价）
async function loadJgTrack() {
    const box = document.getElementById('jgTrackTable');
    if (!box) return;
    const days = (document.getElementById('jgDays') || {}).value || 20;
    const minCnt = (document.getElementById('jgMinCnt') || {}).value || 2;
    const sort = (document.getElementById('jgSort') || {}).value || 'cum_ratio';
    box.innerHTML = '<div class="skeleton-stack"><i></i><i></i><i></i></div>';
    try {
        const resp = await RequestManager.fetch(
            'jg-track',
            `${API}/investor/lhb_jg_track?days=${days}&min_cnt=${minCnt}&sort=${sort}&limit=40`,
            {cacheTtl: RequestManager.CACHE_TTL});
        const d = (resp && resp.data) || {};
        const items = d.items || [];
        const hint = document.getElementById('jgTrackHint');
        if (hint && d.as_of) {
            hint.textContent = `${d.start_date} ~ ${d.as_of} · 机构专用席位（单日口径）· 资金动向参考`;
        }
        renderJgMetrics(d);
        if (!items.length) {
            box.innerHTML = `<div class="empty-state">近 ${days} 个交易日无「机构净买 ≥ ${minCnt} 次」的股票<br><span style="color:var(--text-muted);font-size:var(--fs-2)">本栏目只收录有本地行情的主板/创业板票（科创板、北交所未接入行情）</span></div>`;
            return;
        }
        box.innerHTML = renderJgTable(items);
    } catch (e) {
        box.innerHTML = panelError('loadJgTrack');
    }
}

function _jgFmtAmt(v) {
    if (v == null) return '--';
    const a = Math.abs(v);
    if (a >= 1e8) return (v / 1e8).toFixed(2) + '亿';
    if (a >= 1e4) return (v / 1e4).toFixed(0) + '万';
    return Number(v).toFixed(0);
}

function renderJgMetrics(d) {
    const el = document.getElementById('jgTrackMetrics');
    if (!el) return;
    const card = (val, lbl, cls, tip, tier) =>
        `<div class="metric-card ${tier || 'secondary'}"${tip ? ` title="${tip}"` : ''}><div class="val ${cls || ''}">${val}</div><div class="lbl">${lbl}</div></div>`;
    el.innerHTML =
        card(d.count || 0, `命中（机构净买≥${d.min_cnt || 2}次）`) +
        card(d.above_cost || 0, '现价高于机构成本', '', '机构浮盈') +
        card(d.below_cost || 0, '现价低于机构成本', '', '机构浮亏：已跌破机构建仓成本区 —— 风险提示，不是买点', 'primary') +
        card(d.skipped_no_price || 0, '无行情未纳入', '', '科创板(688)/北交所(920)未接入本地行情');
}

function renderJgTable(items) {
    const rows = items.map(it => {
        const vs = it.vs_cost;
        const vsCls = vs == null ? '' : (vs >= 0 ? 'positive' : 'negative');
        const vsTxt = vs == null ? '--' : (vs >= 0 ? '+' : '') + Number(vs).toFixed(2) + '%';
        const band = (it.band_low != null && it.band_high != null)
            ? `${Number(it.band_low).toFixed(2)} ~ ${Number(it.band_high).toFixed(2)}`
            : '--';
        return `<tr style="cursor:pointer" onclick="openKline('${it.code}')">
            <td><b>${it.name || it.code}</b><div style="font-size:var(--fs-1);color:var(--text-muted)">${it.code}</div></td>
            <td><b>${it.cnt_in}</b><span style="color:var(--text-muted)">/${it.cnt_total}次</span></td>
            <td>${_jgFmtAmt(it.cum_net)}</td>
            <td>${it.cum_ratio != null ? Number(it.cum_ratio).toFixed(2) + '%' : '--'}</td>
            <td><b>${it.cost_est != null ? Number(it.cost_est).toFixed(2) : '--'}</b><div style="font-size:var(--fs-1);color:var(--text-muted)" title="各上榜日最低~最高（前复权）">带 ${band}</div></td>
            <td>${it.last_close != null ? Number(it.last_close).toFixed(2) : '--'}</td>
            <td class="${vsCls}"><b>${vsTxt}</b></td>
            <td>${it.buyers_max || 0} / ${it.sellers_max || 0}</td>
            <td style="font-size:var(--fs-1);color:var(--text-muted)">${it.last_date || ''}</td>
        </tr>`;
    }).join('');
    return `<div class="table-wrapper" style="max-height:460px;overflow-y:auto">
        <table><thead style="position:sticky;top:0;z-index:1;background:var(--bg-panel)"><tr>
        <th>股票</th><th>机构净买</th><th>累计净买额</th><th>占流通市值</th>
        <th>成本估算 / 价格带</th><th>现价</th><th>现价 vs 成本</th><th>机构 买/卖</th><th>最后上榜</th>
        </tr></thead><tbody>${rows}</tbody></table>
        <div class="panel-note">
        ⚠ 本栏目是<b>资金动向与成本位参考，不是收益信号</b>。实测机构买卖方向对次日收益<b>无区分度</b>：
        机构净买 +0.72% vs 机构净卖 +0.66%（Δ 不显著）；同样「近20日上榜≥4次」时净卖方反而略高（+1.19% vs +0.94%）。
        有用的只是「价位」——<b>现价低于机构成本＝机构被套</b>，属风险提示。<br>
        成本 = 按机构净买额加权的上榜日收盘价（<b>估算值</b>，交易所不披露机构真实成交价）；
        同榜若有「连续三个交易日」口径不并入（其金额是累计额，与单日额不可比）。
        </div>
    </div>`;
}

// ── 反转首日观察（first_reversal 信号线：首次站上 MA20 那天的低位入场池，独立于今日推荐）──
// ⚠ 定位：**首日位置观察池，不是买入推荐**。用户反馈「600641 已涨 4 天才推荐、反转第一天没推荐」，
//   本线只回答「今天哪些票刚完成 首破 MA20 × 大阳 × 放量」，即入场位最低的那天（600641 首日 +4.90%，
//   而被推荐的 09-23 已 +39.93%）。现有短线线（pure_bottom_v2 奖励「刚回踩」、隔日动量需龙虎榜上榜）
//   **结构上无法在首日响**，故独立成线。实测（2024-07~2026-09，OC 现实口径）：
//     n=15841、日均 29.1、原始 OC +0.328%、胜率 49.5%、市场中性超额 +0.174pp（t=+2.80）分年一致；
//     但胜率未达 §6C 的 52% 门槛、扣成本后不足 0.1%/笔 ⇒ 不构成可交易 alpha；出场纪律为负贡献。
//   故不占今日推荐名额；但自 2026-09-24 起**纳入推荐复盘**（strategy='反转首日' 独立成组，
//   见 renderReversalTracked），不改动短线推荐线成绩。
const REVERSAL_LIMIT = 12;
// 历史表现窗口（天）：与「推荐复盘」同尺度（后端上限 180）。
// ⚠ 与上方「实盘跟踪」的 90 天窗**不是一个数** —— 两处都标了窗口，别混读。
const REVERSAL_HISTORY_DAYS = 60;
// 历史表现面板状态（收起态/已加载窗口）。默认收起 + 懒加载：60 天 400+ 条
// 明细没必要在首页首屏就拉下来（实测 ~230ms，但首屏已并发十几个请求）。
//   settledOnly：结算有 5~10 个交易日滞后 ⇒ 按信号日降序时最上面几十行全是
//     未结算的「--」，加个「只看已结算」把它们折叠掉（纯前端过滤，不重新请求）。
//   data：缓存上一次响应 ⇒ 切换过滤/展开都不重复打接口。
var _revHist = { open: false, days: REVERSAL_HISTORY_DAYS, loading: false,
                 settledOnly: false, data: null };

async function loadReversalPicks() {
    const box = document.getElementById('reversalPicks');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch(
            'reversal-picks', API + '/investor/reversal_picks?limit=' + REVERSAL_LIMIT,
            {cacheTtl: RequestManager.CACHE_TTL});
        const data = (resp && resp.data) || {};
        const items = data.items || [];
        const hint = document.getElementById('reversalPicksHint');
        if (hint && data.date) {
            const mp = (items[0] && items[0].mkt_pct_day);
            const srcTxt = data.source === 'hist'
                ? ' · 来源：历史回填'
                : (data.source === 'mixed' ? ' · 来源：实时+历史' : '');
            hint.textContent = '信号日 ' + data.date
                + (mp != null ? '（全市场均涨 ' + (mp >= 0 ? '+' : '') + mp.toFixed(2) + '%）' : '')
                + ' · 首日大阳 × 放量 × 首破 MA20 · 只标位置不推荐买入 · 观察池' + srcTxt;
        }
        let html = renderReversalStats(data.stats || {}, data.enabled);
        if (!items.length) {
            html += `<div class="empty-state" style="grid-column:1 / -1">今日无「反转首日」候选<br><span style="color:var(--text-muted);font-size:var(--fs-2)">条件：首破 MA20 + 大阳 ≥5% + 量比 ≥1.5 + 非涨停${data.enabled === false ? '（信号线当前关闭）' : ''}</span></div>`;
        } else {
            html += items.map(it => renderReversalCard(it)).join('');
        }
        html += renderReversalTracked(data.tracked);
        box.innerHTML = html;
        _hydrateRevHist();   // 面板重绘后把展开态的历史表现列表灌回去
    } catch (e) {
        box.innerHTML = panelError('loadReversalPicks');
    }
}

// 反转首日 · 诚实统计条 + 免责横幅（成绩单不随当日有无信号消失）
function renderReversalStats(s, enabled) {
    const numCard = (val, lbl, cls, tip, tier) =>
        `<div class="metric-card ${tier || 'secondary'}"${tip ? ` title="${tip}"` : ''}><div class="val ${cls || ''}">${val}</div><div class="lbl">${lbl}</div></div>`;
    const by = s.excess_by_year || {};
    const bySeq = ['2024', '2025', '2026']
        .map(y => by[y] != null ? (by[y] >= 0 ? '+' : '') + by[y] : null)
        .filter(Boolean).join('/');
    const byTxt = bySeq ? `${bySeq}pp（24/25/26）` : '--';
    // R2：胜率/超额等判断类数字保持中性，好坏只进徽标；收益类（原始 T+1 收益）仍走 R1 涨跌色
    const wrBadge = s.win_rate == null ? '' : (s.win_rate >= 52
        ? '<span class="badge badge-good">达标</span>' : '<span class="badge badge-warn">未达52门槛</span>');
    const exCls = s.excess_pp == null ? '' : (s.excess_pp > 0 ? 'positive' : 'negative');
    const nCls = s.oc1_mean == null ? '' : (s.oc1_mean >= 0 ? 'positive' : 'negative');
    const exHtml = v => v == null ? '--' : (v >= 0 ? '+' : '') + v;
    const offnote = enabled === false
        ? '<b style="color:var(--status-warn)">⚠ 信号线当前为关闭状态（需将 FIRST_REVERSAL[\'enabled\'] 置 True 才产出）</b>'
        : '';
    return `
        <div style="grid-column:1 / -1">
            <div style="margin-bottom:6px;padding:6px 11px;border-radius:6px;background:rgba(60,180,255,0.07);border:1px solid rgba(60,180,255,0.28);font-size:var(--fs-1);color:var(--text-secondary);line-height:1.6">
                ⚠ 观察池，非买入推荐 · 只标「首破 MA20 当日」的低位入场
                <details style="display:inline-block;margin-left:6px;vertical-align:baseline"><summary style="display:inline;cursor:pointer;color:var(--accent)">详情</summary><div style="margin-top:6px;line-height:1.7">
                <b>⚠ 观察池，不是买入推荐</b>：本线唯一确定的价值＝<b>入场位低</b>——首次站上 MA20 那天，信号日中位偏离 MA20 仅 ${s.median_ext != null ? s.median_ext : '--'}%，且只响一次。
                实测市场中性超额 <b>${exHtml(s.excess_pp)}pp（t=${exHtml(s.t)}）</b>、分年 ${byTxt} 三年一致，
                但<b>胜率 ${s.win_rate != null ? s.win_rate : '--'}% 未达 52% 门槛</b>，扣交易成本后不足 0.1%/笔 ⇒ 不构成独立可交易 alpha。
                本线<b>不占今日推荐名额</b>；自 2026-09-24 起<b>纳入推荐复盘</b>
                （strategy='反转首日' 独立成组，不改变短线推荐线成绩）。${offnote}
                </div></details>
            </div>
            <div style="margin-bottom:6px;padding:6px 11px;border-radius:6px;background:rgba(217,119,6,0.07);border:1px solid rgba(217,119,6,0.30);font-size:var(--fs-1);color:var(--text-secondary);line-height:1.6">
                <b style="color:#8a5a00">⚠ 收益集中于创业板（未开通不可交易）</b> · 可交易子集明显更弱
                <details style="display:inline-block;margin-left:6px;vertical-align:baseline"><summary style="display:inline;cursor:pointer;color:#8a5a00">详情</summary><div style="margin-top:6px;line-height:1.7">
                实盘跟踪 951→<b>485</b> 条按主板口径重算后，
                创业板子样本 n=466 胜率 <b>58.9%</b>／均 +2.38%（PF 1.99），
                主板子样本 n=485 胜率 <b>47.1%</b>／均 +0.79% ⇒
                <b>可交易子集明显更弱</b>，本线对当前账户的实用价值需打折看待。
                </div></details>
            </div>
            <div class="metrics-row">
                ${numCard(s.n != null ? s.n : '--', '全样本信号数', '', '2024-07~2026-09 / 544 交易日 / 4500 只（OC 现实口径）')}
                ${numCard(s.per_day != null ? s.per_day : '--', '日均信号', '', '本线是「广撒网」型：日均近 30 只，需自行精选')}
                ${numCard(s.oc1_mean != null ? exHtml(s.oc1_mean) + '%' : '--', '原始 T+1 收益', nCls, '信号日收盘→次日开盘买→次日收盘卖 的均值')}
                ${numCard(s.win_rate != null ? s.win_rate + '%' : '--', 'T+1 胜率 ' + wrBadge, '', '未达报告 §6C 的 52% 门槛 ⇒ 只能当观察池')}
                ${numCard(s.excess_pp != null ? exHtml(s.excess_pp) + 'pp' : '--', '市场中性超额', exCls, '剔除当日全市场同口径后的超额收益（含系统性普涨）', 'primary')}
                ${numCard(s.t != null ? exHtml(s.t) : '--', '超额 t 值', exCls, '分年：' + byTxt, 'primary')}
            </div>
        </div>`;
}

// 反转首日 · 实盘前向跟踪（2026-09-24 起纳入推荐复盘，**独立成组**）
// 口径：与回踩线不同 —— 本线次日本身就是「首日窗口」，故次一交易日开盘建仓，
// 出场＝移动止盈 / 止损 / 到期（复用与推荐复盘同一套出场数学）。
// ⚠ 该组与短线推荐线分开统计，不会拉低/拉高推荐线成绩。
function renderReversalTracked(t) {
    t = t || {};
    const head = `style="grid-column:1 / -1;margin-top:4px;border-top:1px dashed var(--border, rgba(128,128,128,0.25));padding-top:8px"`;
    if (!t.total) {
        return `<div ${head}>
            <span style="font-weight:600;font-size:var(--fs-2)">实盘跟踪（已纳入推荐复盘 · 独立成组）</span>
            <div style="margin-top:6px;padding:6px 10px;border-radius:6px;background:rgba(60,180,255,0.05);border:1px dashed rgba(60,180,255,0.30);font-size:var(--fs-1);color:var(--text-muted);line-height:1.7">
                等待首批信号结算：本线自 2026-09-24 起写入推荐复盘（strategy='反转首日'），
                后续交易日按「次日开盘建仓 → 移动止盈/止损/到期」自动评估。
                该组与短线推荐线<b>分开统计</b>，不会拉低或拉高短线成绩。
            </div>
        </div>`;
    }
    const num = (v, lbl, cls, tip, tier) =>
        `<div class="metric-card ${tier || 'secondary'}"${tip ? ` title="${tip}"` : ''}><div class="val ${cls || ''}">${v}</div><div class="lbl">${lbl}</div></div>`;
    const wr = t.win_rate, avg = t.avg_return, pf = t.profit_factor, t1 = t.t1 || {};
    // R2：胜率数字中性，达标与否进徽标；平均收益是涨跌语义保留 R1
    const wrBadge = wr == null ? '' : (wr >= 50
        ? '<span class="badge badge-good">达标</span>' : '<span class="badge badge-warn">偏低</span>');
    const avgCls = avg == null ? '' : (avg > 0 ? 'positive' : 'negative');
    const exHtml = v => v == null ? '--' : (v >= 0 ? '+' : '') + v;
    return `
        <div ${head}>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
                <span style="font-weight:600;font-size:var(--fs-2)">实盘跟踪（纳入推荐复盘 · 独立成组）</span>
                <span class="text-muted" style="font-size:var(--fs-1)">次日开盘建仓 → 移动止盈/止损/到期 · 与短线推荐线分开统计</span>
                <span class="reason-chip" style="background:rgba(128,128,128,0.10);color:var(--text-muted)" title="跟踪组与卡片同口径，只统计可交易的主板（未开通创业板/科创板权限）；上方全样本统计仍是全线口径（含创业板），故两者数值不可直接对比">主板口径</span>
            </div>
            <div class="metrics-row">
                ${num(t.total, '跟踪样本')}
                ${num(wr != null ? wr + '%' : '--', '结算胜率 ' + wrBadge, '', null, 'primary')}
                ${num(avg != null ? exHtml(avg) + '%' : '--', '平均收益', avgCls, null, 'primary')}
                ${num(pf != null ? pf.toFixed(2) : '--', '盈亏比')}
                ${num(t1.win_rate != null ? t1.win_rate + '%' : '--', 'T+1 胜率')}
                ${num(t.stop_loss_count || 0, '触发止损 <span class="badge badge-bad">亏损离场</span>')}
                ${num(t.take_profit_count || 0, '触发止盈 <span class="badge badge-good">盈利离场</span>')}
            </div>
            ${renderReversalHistoryShell()}
        </div>`;
}

// ── 反转首日 · 历史表现（近 N 天逐条明细）───────────────────────────────
// 懒加载：默认收起，点「查看近 N 天列表」才请求（见 toggleReversalHistory）。
// 数据源 = /api/investor/reversal_history，与上方「实盘跟踪」同源同数学
// （都读 recommend_outcome 的 strategy='反转首日'），故两者只有窗口不同、口径相同。
function renderReversalHistoryShell() {
    const opts = [30, 60, 90, 180].map(d =>
        `<option value="${d}"${d === _revHist.days ? ' selected' : ''}>近 ${d} 天</option>`).join('');
    return `
        <div style="margin-top:10px;border-top:1px dashed var(--border, rgba(128,128,128,0.25));padding-top:8px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <span style="font-weight:600;font-size:var(--fs-2)">历史表现</span>
                <select id="revHistDays" class="btn btn-sm" style="padding:3px 8px"
                        title="统计窗口（改窗口后已展开的列表会自动重取）"
                        onchange="onReversalHistDaysChange()">${opts}</select>
                <button id="revHistBtn" class="btn btn-sm" onclick="toggleReversalHistory()">查看近 ${_revHist.days} 天列表</button>
                <label class="text-muted" style="font-size:var(--fs-1);display:flex;align-items:center;gap:4px;cursor:pointer"
                       title="结算滞后 5~10 个交易日，最近几十行尚未出场（收益列为空）⇒ 勾选后只列已出场的行">
                    <input type="checkbox" id="revHistSettled"${_revHist.settledOnly ? ' checked' : ''}
                           onchange="onReversalHistSettledChange()" style="margin:0">只看已结算
                </label>
                <span class="text-muted" style="font-size:var(--fs-1)">主板口径 · 与上方实盘跟踪同源同数学（仅窗口不同）</span>
            </div>
            <div id="revHistBox" style="display:none;margin-top:8px"></div>
        </div>`;
}

// 「历史表现」内容的**唯一注入口**：面板整体重绘（box.innerHTML=）/ 点击展开
// 都走这里，否则展开态会与 DOM 脱节（按钮写着「收起」但内容被重绘成空）。
// 有缓存 ⇒ 直接渲染（不重复打接口）；无缓存且处于展开态 ⇒ 发请求。
function _hydrateRevHist() {
    const box = document.getElementById('revHistBox');
    if (!box) return;
    box.style.display = _revHist.open ? '' : 'none';
    if (!_revHist.open) return;
    if (_revHist.data) box.innerHTML = renderReversalHistory(_revHist.data);
    else loadReversalHistory();
}

function _revHistBtnLabel() {
    return (_revHist.loading ? '加载中…' : (_revHist.open ? '收起列表' : '查看近 ' + _revHist.days + ' 天列表'));
}

function _syncRevHistBtn() {
    const b = document.getElementById('revHistBtn');
    if (b) b.textContent = _revHistBtnLabel();
}

function toggleReversalHistory() {
    const box = document.getElementById('revHistBox');
    if (!box) return;
    if (_revHist.open) {
        _revHist.open = false;
        box.style.display = 'none';
        _syncRevHistBtn();
        return;
    }
    _revHist.open = true;
    _syncRevHistBtn();
    loadReversalHistory();   // 展开恒重取，保证看到的是最新结算结果
}

function onReversalHistDaysChange() {
    const sel = document.getElementById('revHistDays');
    const d = parseInt(sel && sel.value, 10);
    if (!d || d === _revHist.days) return;
    _revHist.days = d;
    _revHist.data = null;        // 缓存按窗口失效
    const box = document.getElementById('revHistBox');
    if (box) box.innerHTML = '';
    _syncRevHistBtn();
    if (_revHist.open) loadReversalHistory();   // 已展开 ⇒ 换窗即重取
}

// 纯前端过滤：复用缓存的上一次响应，不重新打接口
function onReversalHistSettledChange() {
    const cb = document.getElementById('revHistSettled');
    _revHist.settledOnly = !!(cb && cb.checked);
    const box = document.getElementById('revHistBox');
    if (box && _revHist.data) box.innerHTML = renderReversalHistory(_revHist.data);
}

async function loadReversalHistory() {
    const box = document.getElementById('revHistBox');
    if (!box) return;
    const days = _revHist.days;
    _revHist.loading = true;
    _syncRevHistBtn();
    // 显形由本函数负责：shell 渲染出的容器恒为 display:none
    box.style.display = _revHist.open ? '' : 'none';
    box.innerHTML = '<div class="skeleton-stack"><i></i><i></i></div>';
    try {
        // key 按窗口区分：RequestManager 会 cancel 同 key 的在途请求，
        // 用同一个 key 切窗口会互相打断
        const resp = await RequestManager.fetch('reversal-hist-' + days,
            API + '/investor/reversal_history?days=' + days + '&limit=600',
            {cacheTtl: RequestManager.CACHE_TTL});
        _revHist.loading = false;
        _syncRevHistBtn();
        const d = (resp && resp.data) || {};
        _revHist.data = d;   // 缓存 ⇒ 切换「只看已结算」不再打接口
        box.innerHTML = renderReversalHistory(d);
    } catch (e) {
        _revHist.loading = false;
        _syncRevHistBtn();
        box.innerHTML = panelError('loadReversalHistory');
    }
}

// 出场结果 → 配色。⚠ 本项目 A 股约定「红涨绿跌」：止盈类走 --positive(红)、
// 止损走 --negative(绿)。不要抄「推荐复盘」那边用 var(--green) 画止盈的写法，
// 那是历史遗留的反向配色。
const REV_TONE_COLOR = {
    positive: 'var(--positive)',
    negative: 'var(--negative)',
    neutral: 'var(--text-muted)',
    holding: 'var(--gold, #e0b34d)',
};

function renderReversalHistory(d) {
    d = d || {};
    const all = d.items || [];
    // 「只看已结算」纯前端过滤：成绩单仍按整窗统计（否则一勾就把胜率改了）
    const items = _revHist.settledOnly ? all.filter(it => it.settled) : all;
    const s = d.summary || {};
    if (!all.length) {
        return `<div class="empty-state">近 ${d.days || _revHist.days} 天无「反转首日」复盘记录<br><span style="color:var(--text-muted);font-size:var(--fs-2)">本线主板口径日均约 10 条；若整个窗口为空，先确认每日同步链路已跑到本线</span></div>`;
    }
    if (!items.length) {
        return `<div class="empty-state">近 ${d.days} 天还没有已结算的记录<br><span style="color:var(--text-muted);font-size:var(--fs-2)">共 ${all.length} 条待结算（结算滞后 5~10 个交易日）；取消勾选「只看已结算」可查看全部</span></div>`;
    }
    const fmt = v => (v != null ? Number(v).toFixed(2) : '--');
    const pct = v => (v != null
        ? `<span class="${v >= 0 ? 'positive' : 'negative'}">${v >= 0 ? '+' : ''}${Number(v).toFixed(2)}%</span>`
        : '--');
    const card = (val, lbl, cls, tip, tier) =>
        `<div class="metric-card ${tier || 'secondary'}"${tip ? ` title="${tip}"` : ''}><div class="val ${cls || ''}">${val}</div><div class="lbl">${lbl}</div></div>`;

    // 已结算 = 有出场原因的行（未结算仍列出但标「持仓中」，不进胜率 —— 与后端一致）
    const settled = (d.exit_breakdown || [])
        .filter(b => b.reason).reduce((a, b) => a + b.n, 0);
    // R2：胜率/盈亏比等判断类数字中性，好坏进徽标；收益类保留 R1 涨跌色
    const wrBadge = s.win_rate == null ? '' : (s.win_rate >= 50
        ? '<span class="badge badge-good">达标</span>' : '<span class="badge badge-warn">偏低</span>');
    const avgCls = s.avg_return == null ? '' : (s.avg_return > 0 ? 'positive' : 'negative');
    const chips = (d.exit_breakdown || []).map(b =>
        `<span class="exit-group-stat" title="占本窗口样本 ${(b.n / d.total * 100).toFixed(1)}%"
               style="color:${REV_TONE_COLOR[b.tone] || 'var(--text-muted)'}">${b.label} ${b.n}</span>`).join('');
    const rng = d.range && d.range.start
        ? `${d.range.start} ~ ${d.range.end}` : '--';
    const lowSample = settled > 0 && settled < 30
        ? `<div style="margin-bottom:8px;padding:6px 10px;border-radius:6px;background:rgba(217,119,6,0.10);border:1px solid rgba(217,119,6,0.30);font-size:var(--fs-1);color:var(--text-secondary)">
             ⚠ 已结算样本不足 30 条（${settled} 条）：单笔就值约 ±${(100 / settled).toFixed(0)}pp 的胜率台阶，<b>胜率不具统计意义</b>，请以盈亏比与逐条明细为准
           </div>` : '';

    const rows = items.map(it => {
        const color = REV_TONE_COLOR[it.exit_tone] || 'var(--text-muted)';
        const kk = it.kdj_k;
        const kd = kk == null ? '--'
            : `<span${kk > 80 ? ' style="color:var(--status-warn)" title="⚠ K>80 高位，本线实测该档胜率最低"' : ''}>${Number(kk).toFixed(0)}</span>`;
        return `<tr>
            <td style="font-size:var(--fs-1)">${it.scan_date || '--'}</td>
            <td><span class="code-link" onclick="openKline('${it.code}')">${it.code}</span></td>
            <td>${it.name || ''}</td>
            <td>${it.ext_pct != null ? (it.ext_pct >= 0 ? '+' : '') + Number(it.ext_pct).toFixed(2) + '%' : '--'}</td>
            <td>${it.vol_ratio != null ? Number(it.vol_ratio).toFixed(1) : '--'}</td>
            <td>${kd}</td>
            <td>${fmt(it.entry_price)}</td>
            <td>${pct(it.t1_return)}</td>
            <td>${pct(it.t2_return)}</td>
            <td>${pct(it.t3_return)}</td>
            <td>${pct(it.t5_return)}</td>
            <td style="font-weight:600">${pct(it.exit_return)}</td>
            <td style="color:${color}" title="${it.exit_date ? '出场日 ' + it.exit_date : '尚未出场'}">${it.exit_label}</td>
        </tr>`;
    }).join('');

    return `
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <span style="font-weight:600;font-size:var(--fs-2)">历史表现 · 近 ${d.days} 天信号真实成绩</span>
            <span class="text-muted" style="font-size:var(--fs-1)">信号日次日开盘建仓 → 移动止盈/止损/到期 · 豁免回踩确认（本线即首日窗口）</span>
            ${chips}
        </div>
        ${lowSample}
        <div class="metrics-row" style="margin-bottom:10px">
            ${card(d.total, '跟踪样本', '', '近 ' + d.days + ' 天全部复盘记录（含未结算）')}
            ${card(settled, '已结算', '', '已触发出场的原因行；未结算不计入胜率')}
            ${card(s.win_rate != null ? s.win_rate + '%' : '--', '结算胜率 ' + wrBadge, '', '仅有效已出场收益，>0 记胜；不以 T+n 补齐未结算交易', 'primary')}
            ${card(s.avg_return != null ? (s.avg_return >= 0 ? '+' : '') + s.avg_return + '%' : '--', '平均收益', avgCls, null, 'primary')}
            ${card(s.profit_factor != null ? Number(s.profit_factor).toFixed(2) : '--', 'Profit factor', '', '总盈利 / 总亏损绝对值；无亏损样本时未知')}
            ${card(s.best_return != null ? '+' + s.best_return + '%' : '--', '最佳', 'positive')}
            ${card(s.worst_return != null ? s.worst_return + '%' : '--', '最差', 'negative')}
            ${card(s.stop_loss_count || 0, '触发止损 <span class="badge badge-bad">亏损离场</span>')}
            ${card(s.take_profit_count || 0, '触发止盈 <span class="badge badge-good">盈利离场</span>')}
        </div>
        <div class="table-wrapper" style="max-height:440px;overflow-y:auto">
            <div style="font-size:var(--fs-2);color:var(--text-muted);margin-bottom:6px">
                共 ${d.total} 条（信号日 ${rng}，按信号日降序，同日按收益降序）
                ${_revHist.settledOnly ? `· <b>已过滤：仅已结算 ${items.length} 条</b>` : ''}
                ${d.truncated ? ' · ⚠ 已达返回上限，更早的记录未列出' : ''}
            </div>
            <table><thead style="position:sticky;top:0;z-index:1;background:var(--bg-panel)"><tr>
                <th>信号日</th><th>代码</th><th>名称</th>
                <th title="信号日收盘相对 MA20 的偏离；越低＝入场位越低">首日位置</th>
                <th title="信号日量比（≥1.5 为放量确认）">量比</th>
                <th title="信号日 KDJ 的 K 值；本线只做提示，非过滤条件">KDJ K</th>
                <th title="旧记录的诊断收益基准，不代表模拟成交价">信号参考价</th>
                <th>T+1</th><th>T+2</th><th>T+3</th><th>T+5</th><th>收益</th><th>出场</th>
            </tr></thead><tbody>${rows}</tbody></table>
            <div class="panel-note">
                ⚠ 本线是<b>入场位置观察池，不是买入推荐</b>：实测市场中性超额 +0.174pp(t=+2.80)、
                分年三年一致，但胜率 49.5% 未达 52% 门槛、扣成本后不足 0.1%/笔，
                且<b>出场纪律对本线为负贡献</b>（止损把胜率换上去、期望反而跑输「随便买一只持有 5 天」）。
                T+n 为信号后第 n 个交易日收盘相对信号参考价的<b>诊断收益</b>（非成交收益）；旧记录未保存模拟成交价时为未知，
                仅已结算行进胜率/均值；「持仓中」= 未触发止损止盈、尚未出场。
                板块只含<b>主板</b>（未开通创业板/科创板权限）；未过滤时创业板子样本胜率 58.9%、主板 47.1%，两者不可混读。
            </div>
        </div>`;
}

// 反转首日卡片：轻量 action-card，突出「首日位置（偏离 MA20）」与 KDJ 提示（K>80 标风险）
function renderReversalCard(it) {
    const fmt = v => v != null ? Number(v).toFixed(2) : '--';
    const pctDay = it.pct_day;
    const pctHtml = pctDay != null
        ? `<span class="${pctDay >= 0 ? 'positive' : 'negative'}" style="font-weight:700">${pctDay >= 0 ? '+' : ''}${pctDay.toFixed(2)}%</span>`
        : '';
    const ext = it.ext_pct;
    const extHtml = ext != null ? `${ext >= 0 ? '+' : ''}${ext.toFixed(2)}%` : '--';
    const mkt = it.mkt_pct_day;
    const hotDay = mkt != null && mkt >= 1.5;   // 普涨日：本线信号数天然放大
    const triggers = (it.triggers || []).map(t => {
        const isHigh = t.indexOf('高位') >= 0;
        return `<span class="reason-chip"${isHigh ? ' style="background:rgba(217,119,6,0.14);color:var(--warning, #d97706)"' : ''}>${t}</span>`;
    }).join('');
    let statusHtml = '';
    if (it.missed) {
        statusHtml = '<div class="price-sub" style="color:var(--text-muted)">已越过止盈，首日窗口已过</div>';
    } else if (!it.started) {
        statusHtml = '<div class="price-sub" style="color:var(--gold, #e0b34d)">⚠ 次日开盘＝首日窗口</div>';
    }
    return `
        <div class="action-card" style="border-color:rgba(60,180,255,0.35)${it.missed ? ';opacity:.6' : ''}" onclick="openKline('${it.code}')">
            <div class="action-head">
                <div>
                    <div class="action-name">${it.name || it.code} <span class="strategy-badge" style="background:var(--tint-accent);color:var(--accent)">反转首日</span></div>
                    <div class="action-code">${it.code}${it.industry ? ` · ${it.industry}` : ''}</div>
                </div>
                <div class="action-score" title="首日分：量比与涨幅强度合成（30~50），非收益预测">
                    <div class="score-num">${it.fusion_score || '--'}</div>
                    <div class="score-lbl">首日分</div>
                </div>
            </div>
            <div class="action-prices">
                <div class="price-cell buy">
                    <div class="price-lbl">信号日收盘</div>
                    <div class="price-val">${fmt(it.signal_price)}</div>
                    <div class="price-sub">当日 ${pctHtml}</div>
                    ${it.latest_close != null ? `<div class="price-sub" title="该股最近一个有行情的交易日的收盘价（非实时）">最新 <b>${Number(it.latest_close).toFixed(2)}</b></div>` : ''}
                    ${statusHtml}
                </div>
                <div class="action-arrow">·</div>
                <div class="price-cell sell">
                    <div class="price-lbl">止盈参考</div>
                    <div class="price-val">${fmt(it.take_profit)}</div>
                    <div class="price-sub">${it.reward_pct != null ? `+${it.reward_pct}%` : '--'}</div>
                </div>
                <div class="price-arrow">·</div>
                <div class="price-cell stop">
                    <div class="price-lbl">止损参考</div>
                    <div class="price-val">${fmt(it.stop_loss)}</div>
                    <div class="price-sub">${it.risk_pct != null ? `-${it.risk_pct}%` : '--'}</div>
                </div>
            </div>
            <div class="action-foot">
                <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:5px">
                    <span style="font-size:var(--fs-1);color:var(--text-muted)">首日位置（偏离 MA20）</span>
                    <span style="font-size:var(--fs-4);font-weight:700;color:var(--text-primary)">${extHtml}</span>
                    <span style="font-size:var(--fs-1);color:var(--text-muted)">越低＝越早；越低并不更优，仅为位置标尺</span>
                </div>
                <div class="reasons">${triggers}</div>
                ${hotDay ? `<div class="reasons" style="margin-top:4px"><span class="reason-chip" style="background:rgba(217,119,6,0.12);color:var(--warning, #d97706)">⚠ 普涨日：当日全市场均涨 ${mkt.toFixed(2)}%，本线信号数会天然放大，注意甄别</span></div>` : ''}
            </div>
        </div>`;
}

// ─── 个股深度 · 买卖建议（切换个股 → 学习历史走势/量价关系 → 识别涨跌节奏 → 近期建议）──
var _sd = { list: [], idx: -1, data: null, code: null };

function _sdColor(name, fb) {
    name = String(name || '');
    if (name.charAt(0) === '#' || name.indexOf('rgb') === 0 || name.indexOf('hsl') === 0) return name;
    name = name.replace(/^var\(\s*/, '').replace(/\s*\)$/, '');
    return cssVar(name, fb || '#8a93b5');
}

function _sdSignalColor(level) {
    var m = { buy: '--green', add: '#ffaa3c', hold: '--accent', sell: '--danger' };
    return m[level] || '--text-secondary';
}

// ─── 个股搜索历史缓存（非内置；最近搜索在前，可删除）───
var _SD_HIST_KEY = 'aiq_sd_history';
var _SD_HIST_MAX = 14;

function _sdLoadHistory() {
    try {
        var h = JSON.parse(localStorage.getItem(_SD_HIST_KEY) || '[]');
        return (Array.isArray(h) ? h : []).filter(function(x) { return x && x.code; });
    } catch(e) { return []; }
}
function _sdSaveHistory() {
    try { localStorage.setItem(_SD_HIST_KEY, JSON.stringify(_sd.list.slice(0, _SD_HIST_MAX))); } catch(e) {}
}

// ─── 个股深度 · 详情弹窗（详情从板块主体剥出，进居中弹窗；板块主区只放极简占位）───
var _sdDeepMode = false;
function _sdGetBody()       { return document.getElementById(_sdDeepMode ? 'sdDeepBody' : 'stockDeepContent'); }
function _sdGetChart()      { return document.getElementById(_sdDeepMode ? 'sdDeepChart' : 'stockDeepChart'); }
function _sdGetIndicators() { return document.getElementById(_sdDeepMode ? 'sdDeepIndicators' : 'sdIndicators'); }

async function openSdDeep(code) {
    var panel = document.getElementById('sdDeepPanel');
    if (!panel) return;
    _sdDeepMode = true;                                 // 先切模式，refreshStockDeep 内的 _sdGetBody 才指向弹窗
    panel.classList.add('open');
    var body = _sdGetBody();
    if (body) body.innerHTML = '<div class="empty-state" style="padding:60px 14px;font-size:var(--fs-3)">⏳ 正在深度学习该股历史走势、量价关系与涨跌节奏…</div>';
    try {
        await refreshStockDeep(code, { reorder: true });
    } catch (e) {
        if (body) body.innerHTML = '<div class="empty-state">分析失败：' + (e.message || e) + '</div>';
    }
    var popup = panel.querySelector('.sd-deep-popup');
    if (popup) popup.scrollTop = 0;
}

function closeSdDeep() {
    var panel = document.getElementById('sdDeepPanel');
    if (panel) panel.classList.remove('open');
    _sdDeepMode = false;
    // 弹窗内的 ECharts 实例 detach（避免后台持续监听 resize 造成内存增长）
    var ch = document.getElementById('sdDeepChart');
    if (ch && window.echarts) {
        try { var inst = echarts.getInstanceByDom(ch); if (inst) inst.dispose(); } catch (e) {}
    }
    // 关弹窗后刷新板块主区占位（用最新 _sd.code）
    if (typeof renderSdPanelPlaceholder === 'function') renderSdPanelPlaceholder();
}

// 抽屉遮罩点击：先命中测试遮罩下方元素——若是可打开详情的行/卡片，关闭抽屉后把这一击转发过去
// （P3「列表可见可点」：点行换内容不用先关再点）；其余情况仅关闭。
function _drawerScrimClick(e, closeFn) {
    if (e.target !== e.currentTarget) return;
    var scrim = e.currentTarget;
    var hit = null;
    scrim.style.pointerEvents = 'none';
    try { hit = document.elementFromPoint(e.clientX, e.clientY); } finally { scrim.style.pointerEvents = ''; }
    var target = null;
    if (hit) {
        var cand = hit.closest('.action-card, .sum-row, .pick-mini-row, .idx-clickable, .code-link, .sd-chip, [onclick]');
        if (cand) {
            var oc = cand.getAttribute('onclick') || '';
            if (/openKline|openSdDeep|openStockDeep|openIndexKline|showFactor/.test(oc)
                || cand.matches('.action-card, .sum-row, .pick-mini-row, .idx-clickable, .code-link, .sd-chip')) {
                target = cand;
            }
        }
    }
    if (typeof window[closeFn] === 'function') window[closeFn]();
    if (target) setTimeout(function () { try { target.click(); } catch (err) {} }, 250);
}

// Esc 关闭抽屉（报告全宽抽屉优先，其次深析，最后 K 线）
document.addEventListener('keydown', function (e) {

        var r = document.getElementById('rpPanel');
        if (r && r.classList.contains('open')) { closeRpPanel(); return; }
        var p = document.getElementById('sdDeepPanel');
        if (p && p.classList.contains('open')) { closeSdDeep(); return; }
        var k = document.getElementById('klinePanel');
        if (k && k.classList.contains('open')) closeKline();
    }
});

// ── P4 N-1/N-2：抽屉焦点管理 ──
// 记录抽屉外最后一次可交互点击元素，关闭后焦点归位；打开/Tab 时焦点锁在抽屉内。
var _drawerTrigger = null;
document.addEventListener('click', function (e) {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest('.kline-overlay')) return;   // 抽屉内点击不更新触发器
    var t = e.target.closest('button, a, input, select, [onclick], .action-card, .sum-row, .pick-mini-row, .idx-clickable, .sd-chip, .code-link');
    if (t) _drawerTrigger = t;
}, true);
(function () {
    function focusables(popup) {
        return Array.prototype.filter.call(
            popup.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'),
            function (el) { return !el.disabled && el.offsetParent !== null; });
    }
    ['klinePanel', 'sdDeepPanel', 'rpPanel'].forEach(function (id) {
        var panel = document.getElementById(id);
        if (!panel || !('MutationObserver' in window)) return;
        new MutationObserver(function () {
            if (panel.classList.contains('open')) {
                var btn = panel.querySelector('.close-btn');
                if (btn && !panel.contains(document.activeElement)) { try { btn.focus(); } catch (e) {} }
            } else if (_drawerTrigger && document.contains(_drawerTrigger)) {
                try {
                    // N-1 归位（✕/Esc/遮罩统一在此处理）；div 类触发器（卡片/行）原生不可聚焦，补 tabindex=-1
                    if (!_drawerTrigger.matches('button, a, input, select, textarea, [tabindex]')) {
                        _drawerTrigger.setAttribute('tabindex', '-1');
                    }
                    _drawerTrigger.focus();
                } catch (e) {}
            }
        }).observe(panel, { attributes: true, attributeFilter: ['class'] });
    });
    // N-2 焦点陷阱：抽屉打开时 Tab 循环限定在抽屉内
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        var panel = document.querySelector('.kline-overlay.open');
        if (!panel) return;
        var popup = panel.querySelector('.kline-popup, .sd-deep-popup, .rp-popup') || panel;
        var f = focusables(popup);
        if (!f.length) return;
        var first = f[0], last = f[f.length - 1];
        if (!panel.contains(document.activeElement)) { e.preventDefault(); first.focus(); return; }
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
})();

// 切换 chip 选中态：点未选中的 → 选中并打开弹窗；点当前已选中的 → 取消并关弹窗
function _sdToggleChip(i) {
    if (i < 0 || i >= _sd.list.length) return;
    if (i === _sd.idx) {
        // 再点同一只 → 取消选中
        _sd.idx = -1; _sd.code = null; _sd.data = null;
        closeSdDeep();
        renderSdChips();
        renderSdPanelPlaceholder();
        return;
    }
    // 切到新的 chip
    _sd.idx = i;
    _sd.code = _sd.list[i].code;
    renderSdChips();
    renderSdPanelPlaceholder();
    openSdDeep(_sd.list[i].code);
}

function selectSdByIndex(i) {
    if (i < 0 || i >= _sd.list.length) return;
    _sd.idx = i;
    renderSdChips();
    openSdDeep(_sd.list[i].code);   // 详情进弹窗，不再渲染到板块主区
}

function sdCycle(dir) {
    if (!_sd.list.length) return;
    var n = _sd.list.length;
    var nxt = ((_sd.idx + dir) % n + n) % n;
    selectSdByIndex(nxt);
}

function _sdRemoveHistory(code) {
    _sd.list = _sd.list.filter(function(x) { return x.code !== code; });
    _sdSaveHistory();
    // 删的是否当前选中：原 _sd.code 是否还在列表里
    var stillIn = _sd.list.some(function(x) { return x.code === _sd.code; });
    if (!stillIn) {
        // 删的正是当前 → 关弹窗不重选（保持「不默认选」）
        _sd.idx = -1; _sd.data = null; _sd.code = null;
        closeSdDeep();
    }
    if (!_sd.list.length) {
        var box = document.getElementById('stockDeepContent');
        if (box) box.innerHTML = '<div class="empty-state">暂无历史股票<br><span style="color:var(--text-muted);font-size:var(--fs-2)">在上方搜索框输入代码或名称，回车查看</span></div>';
        var s = document.getElementById('sdSearch'); if (s) s.value = '';
    }
    renderSdChips();
    if (!stillIn) renderSdPanelPlaceholder();
}

function onSdSearchPick() {
    var input = document.getElementById('sdSearch');
    if (!input) return;
    var raw = input.value.trim();
    if (!raw) return;
    // ① 值里含 6 位代码（如 datalist 选出的 "600100 TCL科技"）
    var mc = raw.match(/^\s*(\d{6})/);
    if (mc) {
        var code = mc[1];
        var item = _sd.list.find(function(it) { return it.code === code; });
        if (item) { selectSdByIndex(_sd.list.indexOf(item)); return; }
        openSdDeep(code); return;
    }
    // ② 名称匹配历史缓存
    var matched = _sd.list.find(function(it) { return it.name && raw.indexOf(it.name) >= 0; });
    if (matched) { selectSdByIndex(_sd.list.indexOf(matched)); return; }
    // ③ 后端按名称搜索（B-1 修复②：同值回车不重复发请求——双触发/连按回车时
    // 同 key 去重会 abort 前一请求，abort 的失败分支会覆盖成功正文）
    if (raw === _sdLastSearch) return;
    _sdLastSearch = raw;
    RequestManager.fetch('sd-search-' + raw, API + '/investor/stocks/search?q=' + encodeURIComponent(raw))
      .then(function(resp) {
          var items = (resp && resp.data && resp.data.items) || [];
          if (items.length) openSdDeep(items[0].code);
          else showToast('未找到该股票，请核对代码或名称', 'warning');
      });
}
var _sdLastSearch = null;

var _sdSearchTimer = null;
function onSdSearchInput(v) {
    if (_sdSearchTimer) clearTimeout(_sdSearchTimer);
    _sdSearchTimer = setTimeout(function() {
        var dl = document.getElementById('sdDatalist');
        if (!dl) return;
        RequestManager.fetch('sd-dl-' + v, API + '/investor/stocks/search?q=' + encodeURIComponent(v))
          .then(function(resp) {
              var items = (resp && resp.data && resp.data.items) || [];
              dl.innerHTML = items.map(function(it) { return `<option value="${it.code} ${it.name}">`; }).join('');
          });
    }, 250);
}

async function refreshStockDeep(code, opts) {
    opts = opts || {};
    var box = _sdGetBody();
    if (!box) return;
    box.innerHTML = '<div class="empty-state">正在深度学习该股历史走势、量价关系与涨跌节奏…</div>';
    try {
        // 个股深析服务端计算较重，5s 内重复查看同一只票直接命中前端缓存
        var resp = await RequestManager.fetch('sd-deep-' + code,
            API + '/investor/stock_deep/' + code,
            {cacheTtl: RequestManager.CACHE_TTL});
        var data = (resp && resp.data) || {};
        _sd.data = data; _sd.code = code;
        // 换股必须清掉锁定日与待触发的回今日定时器，两只票可能有同名交易日
        if (_sdPinTimer) { clearTimeout(_sdPinTimer); _sdPinTimer = null; }
        _sdPinnedDate = null; _sdPinMode = null; _sdPress = null;
        var name = data.name || code;
        // 入历史：reorder=true 置顶（新搜索）；false 保持原位置（点历史）
        if (opts.reorder) {
            _sd.list = _sd.list.filter(function(x) { return x.code !== code; });
            _sd.list.unshift({ code: code, name: name });
            if (_sd.list.length > _SD_HIST_MAX) _sd.list.length = _SD_HIST_MAX;
            _sd.idx = 0;
        } else {
            var ni = -1;
            for (var i = 0; i < _sd.list.length; i++) if (_sd.list[i].code === code) { ni = i; break; }
            if (ni < 0) { _sd.list.unshift({ code: code, name: name }); if (_sd.list.length > _SD_HIST_MAX) _sd.list.length = _SD_HIST_MAX; _sd.idx = 0; }
            else _sd.idx = ni;
        }
        // 用后端更全的名称更新缓存项
        var cur = _sd.list[_sd.idx];
        if (cur && data.name) cur.name = data.name;
        _sdSaveHistory();
        renderSdChips();
        var searchEl = document.getElementById('sdSearch');
        if (searchEl && data.code) searchEl.value = data.code + ' ' + (data.name || '');
        renderStockDeep(data);
    } catch(e) {
        // B-1 修复③：切页 cancelAll / 同 key 双请求去重产生的 AbortError 不写失败态正文，
        // 正文交给仍在途的同 key 请求渲染；其余异常照常给出可读失败态。
        if (e && (e.name === 'AbortError' || /abort/i.test(String(e.message || e)))) return;
        box.innerHTML = '<div class="empty-state">分析失败：' + (e.message || e) + '</div>';
    }
}

function _renderSdMarket() {

// ─────────────────────────────────────────────
// 个股深度 · 推荐跟踪
// 每日 19:00 盘后：全市场深析扫描出候选 → 自动建跟踪单 → 逐日按买点建仓、卖点出场，
// 这里只负责展示与手动干预（推进 / 回补 / 平仓 / 删除）。

// 列表分页：回补后动辄几百笔，一次全塞进 DOM 会卡，所以首屏只取一批，

var _SD_TRACK_PAGE = 100;      // 每批条数
var _sdTrackLimit = _SD_TRACK_PAGE;
var _sdTrackTotal = 0;

function _sdPct(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '--';

}
function _sdPctCls(v) {

    return v > 0 ? 'pos' : 'neg';
}
function _sdPx(v) {

}

// 默认展示「持仓中」与「已出场」；点击统计卡可切换为单一状态。
var _SD_TRACK_STATUS = 'holding,closed';

    holding: '持仓中',
    closed: '已出场',

};

var _SD_TRACK_STATUS_ALL = 'holding,closed,watching,expired';
function setSdTrackFilter(status) {

async function loadSdTrack(opts) {
    opts = opts || {};
    var box = document.getElementById('sdTrackBox');
    if (!box) return;
    // 非「加载更多」的调用都回到首屏条数，否则推进/回补/平仓后刷新会沿用上次累加的 limit
    if (!opts.keepLoading) {
        _sdTrackLimit = _SD_TRACK_PAGE;
    }
    if (!opts.keepLoading) {
        box.innerHTML = '<div class="empty-state" style="padding:10px;font-size:var(--fs-2)">正在读取推荐跟踪…</div>';
    }
    try {
        // 推进/平仓/删除均为 POST，RequestManager 会自动清空只读缓存，刷新必取新值
        var resp = await RequestManager.fetch('sd-track',
            API + '/investor/deep_track?status=' + encodeURIComponent(_SD_TRACK_STATUS) + '&limit=' + _sdTrackLimit,
            {cacheTtl: RequestManager.CACHE_TTL});
        var d = (resp && resp.data) || {};
        var items = d.items || [];
        // total 是「符合当前状态过滤」的总笔数；老版本接口没有该字段时退化为本次条数
        _sdTrackTotal = (d.total != null) ? d.total : items.length;
        renderSdTrack(items, d.stats || {}, d.updated_at);
        if (opts.scrollToMore) {
            var btn = document.getElementById('sdTrackMoreBtn');
            if (btn && btn.scrollIntoView) btn.scrollIntoView({ block: 'center' });
        }
    } catch (e) {
        if (box) box.innerHTML = panelError('loadSdTrack');
    }
}

function loadMoreSdTrack() {
    _sdTrackLimit += _SD_TRACK_PAGE;
    loadSdTrack({ keepLoading: true, scrollToMore: true });
}

function renderSdTrack(items, st, updatedAt) {
    var box = document.getElementById('sdTrackBox');
    if (!box) return;
    var p = st.params || {};
    var stat = function(lbl, val, cls, key, tier) {
        var isActive = key && (
            (key === 'all' && _SD_TRACK_STATUS === _SD_TRACK_STATUS_ALL) ||
            (key !== 'all' && _SD_TRACK_STATUS === key)
        );
        var active = isActive ? ' active' : '';
        var click = key ? ' onclick="setSdTrackFilter(\'' + key + '\')"' : '';
        return '<div class="sd-track-stat' + (tier === 'primary' ? ' primary' : '') + (key ? ' clickable' : '') + active + '"' + click + '>' +
               '<div class="lbl">' + lbl + '</div>' +
               '<div class="val ' + (cls || '') + '">' + val + '</div></div>';
    };
    // 口径长说明收进板块头 ⓘ tooltip（spec §3c：信息不删除、只移位）
    var noteTip = '口径：买点=推荐日收盘，其后 ' + (p.entry_window_days || 5) +
        ' 个交易日内回踩才成交（涨上去不追，未回踩判失效且不计胜率）；' +
        '同一股票在持有期内再次推荐并入原单不重复建仓（推荐日后标 +N）；' +
        '出场用推荐自带止损/止盈（止盈=本股平均上涨波幅×' +
        Math.round((p.tp_amp_ratio || 0.33) * 100) + '% 标定的可达位，收盘达价即卖），持满 ' +
        (p.max_hold_days || 10) + ' 个交易日按收盘了结。持仓时间按交易日计。';
    var head =
        '<div class="sd-track-head">' +
          '<span style="font-size:var(--fs-3);font-weight:600;color:var(--text-primary)" title="' + noteTip + '">推荐跟踪 · 每笔持仓与收益 ⓘ</span>' +
          '<button class="btn btn-sm" onclick="refreshSdTrack(0)" title="立即按最新行情推进一次：检查是否触发建仓/出场，并结算收益">推进</button>' +
          '<input id="sdBackfillDays" type="number" class="bt-mini-input" value="30" min="1" max="90" style="width:54px;text-align:center;padding:3px 6px" title="回补交易日的天数（每个交易日都要全市场扫描一次，约 45 秒）" onkeydown="if(event.key===\'Enter\')refreshSdTrackFromInput()">' +
          '<button class="btn btn-sm" onclick="refreshSdTrackFromInput()" title="先补跑这些交易日的全市场深析扫描（用当天及之前的行情，无未来函数），再建跟踪单并推进出场。后台执行，约 45 秒/天">回补</button>' +
          '<span class="text-muted" style="font-size:var(--fs-1)">每日 19:00 盘后自动跑 · 买点回踩才成交 · 卖点=止损/止盈/到期</span>' +
          (updatedAt ? '<span class="text-muted" style="font-size:var(--fs-1);margin-left:auto">更新 ' + updatedAt + '</span>' : '') +
        '</div>';

    var totalAll = (st.holding || 0) + (st.closed || 0) + (st.watching || 0) + (st.expired || 0);
    var stats =
        '<div class="sd-track-stats">' +
          stat('全部', totalAll + ' 笔', '', 'all') +
          stat('已平仓', (st.total_closed || 0) + ' 笔', '', 'closed') +
          stat('胜率', st.win_rate == null ? '--' : st.win_rate + '%', '', null, 'primary') +
          stat('平均持仓', st.avg_hold_tdays == null ? '--' : st.avg_hold_tdays + ' 日') +
          stat('平均收益', _sdPct(st.avg_return), _sdPctCls(st.avg_return), null, 'primary') +
          stat('盈亏比', st.profit_factor == null ? '--' : st.profit_factor, '', null, 'primary') +
          /* 「累计收益 = Σ单笔收益率」2026-09-11 移除：单笔百分比相加无资金含义（610 单会累出巨大数字），
             与左侧「平均收益」表达同一批数据；要看资金曲线请用带复利的等权口径 */
          stat('持仓中', (st.holding || 0) + ' 笔', '', 'holding') +
          stat('待回踩', (st.watching || 0) + ' 笔', '', 'watching') +
          stat('已失效', (st.expired || 0) + ' 笔', '', 'expired') +
        '</div>';

    if (!items.length) {
        var statusText = (_SD_TRACK_STATUS === _SD_TRACK_STATUS_ALL)
            ? '全部'
            : (_SD_TRACK_STATUS || 'holding,closed').split(',').map(function(s) {
                return _SD_TRACK_STATUS_LABELS[s] || s;
            }).join(' / ');
        var waiting = st.watching || 0;
        box.innerHTML = head + stats +
            '<div class="empty-state" style="padding:14px;font-size:var(--fs-2)">暂无「' + statusText + '」的跟踪记录<br>' +
            '<span style="color:var(--text-muted)">' +
            (waiting > 0 && _SD_TRACK_STATUS.indexOf('holding') >= 0
                ? '当前 ' + waiting + ' 笔候选还在等回踩买点，成交后自动进入本列表'
                : '每日盘后同步后自动建单；也可输入天数后点「回补」补建历史样本') +
            '</span></div>';
        return;
    }

    var ST_CLS = { holding: 'sd-st-holding', watching: 'sd-st-watching',
                   closed: 'sd-st-closed', expired: 'sd-st-expired' };
    var rows = items.map(function(it) {
        var isClosed = it.status === 'closed';
        var ret = isClosed ? it.return_pct : it.float_return;
        var retTxt = isClosed ? _sdPct(ret) : (ret == null ? '--' : _sdPct(ret) + '<span style="opacity:.6"> 浮</span>');
        var holdTxt = it.hold_tdays != null ? it.hold_tdays + ' 日' : '--';
        var entryTxt = it.entry_date
            ? it.entry_date.slice(5) + ' @' + _sdPx(it.entry_price)
            : '<span style="opacity:.65" title="等待回踩到买点才成交；窗口期 ' + (p.entry_window_days || 5) + ' 个交易日">待回踩 @' + _sdPx(it.sig_entry) + '</span>';
        var exitTxt = it.exit_date ? it.exit_date.slice(5) + ' @' + _sdPx(it.exit_price) : '--';
        var stTxt = it.status_label + (it.exit_reason_label ? ' · ' + it.exit_reason_label : '');
        // 持有期内被再次推荐：合并进本单不另建，推荐日列标 +N，悬停看合并日期
        var rerec = (it.rerec_dates && it.rerec_dates.length)
            ? ' <span style="color:var(--accent, #e0b34d);cursor:help" title="持有期内又推荐：' +
              it.rerec_dates.map(function(x){return String(x).slice(5);}).join('、') +
              '（已并入本单，不重复建仓）">+' + it.rerec_dates.length + '</span>'
            : '';
        var ops = (it.status === 'holding' || it.status === 'watching'
                     ? '<button class="sd-op" onclick="closeSdTrack(' + it.id + ',\'' + (it.name || it.code) + '\')">平仓</button>' : '') +
                  '<button class="sd-op danger" onclick="delSdTrack(' + it.id + ',\'' + (it.name || it.code) + '\')">删</button>';
        return '<tr>' +
            '<td class="name-td"><span style="cursor:pointer;color:var(--text-primary)" onclick="pickSdCandidate(\'' + it.code + '\')">' +
                (it.name || it.code) + '</span>' +
                '<span class="text-muted" style="margin-left:6px">' + it.code + '</span></td>' +
            '<td class="num">' + (it.scan_date || '--').slice(5) + rerec + '</td>' +
            '<td class="num">' + _sdPx(it.sig_entry) + '</td>' +
            '<td class="num">' + entryTxt + '</td>' +
            '<td class="num">' + exitTxt + '</td>' +
            '<td class="num">' + holdTxt + '</td>' +
            '<td class="num ' + _sdPctCls(ret) + '">' + retTxt + '</td>' +
            '<td><span class="sd-st ' + (ST_CLS[it.status] || '') + '">' + stTxt + '</span></td>' +
            '<td style="white-space:nowrap">' + ops + '</td>' +
        '</tr>';
    }).join('');

    // 回补后会有几百笔，一次全渲染既卡又难找，这里分批 + 「加载更多」
    var moreHtml = '';
    if (_sdTrackTotal > items.length) {
        var nextN = Math.min(_SD_TRACK_PAGE, _sdTrackTotal - items.length);
        moreHtml = '<div style="text-align:center;padding:10px 0">' +
            '<div class="text-muted" style="font-size:var(--fs-1);margin-bottom:6px">已显示 ' +
            items.length + ' / 共 ' + _sdTrackTotal + ' 笔（按推荐日从新到旧）</div>' +
            '<button id="sdTrackMoreBtn" class="btn btn-sm" onclick="loadMoreSdTrack()">加载更多（+' + nextN + '）</button>' +
            '</div>';
    } else if (items.length > _SD_TRACK_PAGE) {
        moreHtml = '<div class="text-muted" style="text-align:center;padding:8px 0;font-size:var(--fs-1)">已显示全部 ' +
            items.length + ' 笔</div>';
    }

    box.innerHTML = head + stats +
        '<div style="max-height:420px;overflow:auto">' +
        '<table class="sd-trade-table sd-track-table"><thead><tr>' +
        '<th>股票</th><th>推荐日</th><th>买点</th><th>建仓</th><th>卖出</th>' +
        '<th>持仓</th><th>收益</th><th>状态</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' + moreHtml;
}

function refreshSdTrackFromInput() {
    var input = document.getElementById('sdBackfillDays');
    var days = input ? parseInt(input.value, 10) : 30;
    if (isNaN(days) || days < 1) days = 1;
    if (days > 90) days = 90;
    if (input) input.value = days;
    startBackfillScan(days);
}

// ── 历史扫描日回补（后台独立进程 + 轮询进度）──────────
// 回补一天要对 4500+ 只股票跑全套指标（8 进程约 46s/天），30 天就是 20+ 分钟，
// 绝不能同步等待；这里拉起后台进程后按 2s 轮询进度文件，完成后再刷新列表。
// 轮询定时器统一登记在 timerManager（key='bfPoll'），切页自动清理。
var _bfPollKey = 'sd-track-bf-status';

function _bfProgressHtml(pct, msg) {
    return '<div class="empty-state" style="padding:18px;font-size:var(--fs-2)">' +
        '<div style="font-size:var(--fs-3);font-weight:600;color:var(--text-primary);margin-bottom:10px">⏳ 正在回补历史扫描日…</div>' +
        '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;height:8px;overflow:hidden;max-width:420px;margin:0 auto">' +
          '<div style="width:' + (pct || 0) + '%;height:100%;background:var(--accent);transition:width .3s"></div>' +
        '</div>' +
        '<div style="font-size:var(--fs-1);color:var(--text-muted);margin-top:8px">' + (msg || '') + '</div>' +
        '<div style="font-size:var(--fs-1);color:var(--text-muted);margin-top:2px">每天扫描只用当天及之前的行情，无未来函数</div>' +
        '</div>';
}

function _bfStopPoll() {
    timerManager.clear('bfPoll');
    RequestManager.cancel(_bfPollKey);
}

async function startBackfillScan(days) {
    var box = document.getElementById('sdTrackBox');
    if (box) box.innerHTML = _bfProgressHtml(0, '正在启动…');
    try {
        await RequestManager.fetch('sd-track-bf-start',
            API + '/investor/deep_track/backfill_scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days: days, procs: 8 })
            });
        showToast('已启动回补（' + days + ' 个交易日），后台扫描中…', 'success');
        _bfStartPoll();
    } catch (e) {
        showToast('启动回补失败：' + (e.message || e), 'error');
        loadSdTrack();
    }
}

function _bfStartPoll() {
    _bfStopPoll();
    var box = document.getElementById('sdTrackBox');
    // 单轮失败不中止（可能瞬时超时），由 poll 原语吞掉异常后下一轮继续
    timerManager.poll('bfPoll', async function () {
        try {
            var resp = await RequestManager.fetch(_bfPollKey,
                API + '/investor/deep_track/backfill_scan/status');
            var d = (resp && resp.data) || {};
            if (d.status === 'running' && box) {
                box.innerHTML = _bfProgressHtml(d.progress, d.message);
                return;
            }
            _bfStopPoll();
            if (d.status === 'success') {
                var r = d.result || {};
                showToast('回补完成：扫描 ' + (r.scanned || 0) + ' 天，新增 ' + (r.added || 0) +
                          ' 单，建仓 ' + (r.filled || 0) + ' 笔，出场 ' + (r.closed || 0) + ' 笔' +
                          (r.errors ? '｜⚠ ' + r.errors + ' 笔异常' : ''), 'success');
            } else if (d.status === 'error') {
                showToast('回补失败：' + (d.error || '未知错误'), 'error');
            } else {
                showToast('回补结束：' + (d.message || ''), 'info');
            }
            loadSdTrack();
        } catch (e) {
            // 单次轮询失败不中止（可能瞬时超时），下一轮继续
        }
    }, 2000);
}

async function refreshSdTrack(backfillDays) {
    var box = document.getElementById('sdTrackBox');
    var label = backfillDays ? ('回补最近 ' + backfillDays + ' 天') : '推进';
    try {
        if (box) box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:var(--fs-2)">⏳ 正在' + label + '…</div>';
        var resp = await RequestManager.fetch('sd-track-refresh', API + '/investor/deep_track/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ backfill_days: backfillDays || 0 })
        });
        var d = (resp && resp.data) || {};
        var u = d.update || {};
        var s = d.sync || {};
        var msg;
        if (d.mode === 'backfill') {
            var avail = d.avail_days, req = d.requested_days || backfillDays, got = d.days;
            // 数据源不足是最常见的"点了没反应"原因，必须说清楚，否则用户以为接口坏了
            var srcTip = (avail != null && req && got < req)
                ? ('（数据源仅 ' + avail + ' 个扫描日，不足 ' + req + ' 天）')
                : (avail != null ? '（数据源共 ' + avail + ' 个扫描日）' : '');
            msg = '回补 ' + got + ' 个扫描日' + srcTip + '：新增 ' + (d.added || 0) +
                  ' 单，已存在跳过 ' + (d.skipped || 0) + ' 单，建仓 ' + (u.filled || 0) +
                  ' 笔，出场 ' + (u.closed || 0) + ' 笔';
            if (u.errors) {
                msg += '｜⚠ ' + u.errors + ' 笔处理异常' +
                       (u.error_samples && u.error_samples[0] ? '（' + u.error_samples[0] + '）' : '');
            }
            if (!d.added && !u.filled && !u.closed) {
                // 区分三种"看起来什么都没发生"的原因，否则用户只能猜
                msg += d.skipped
                    ? ('｜这些扫描日已建过单（跳过 ' + d.skipped + ' 单）' +
                       (got && avail && got >= avail ? '，数据源已用尽，需先跑新的全市场深析扫描' : ''))
                    : '｜无可补样本';
            }
        } else {
            msg = '推进完成：新增 ' + (s.added || 0) + ' 单，建仓 ' + (u.filled || 0) +
                  ' 笔，出场 ' + (u.closed || 0) + ' 笔';
        }
        showToast(msg, 'success');
        loadSdTrack();
    } catch (e) {
        showToast(label + '失败：' + (e.message || e), 'error');
        loadSdTrack();
    }
}

async function closeSdTrack(id, name) {
    if (!confirm('按最新收盘价平仓「' + name + '」？\n这笔将计入已平仓统计（胜率/持仓天数/收益）。')) return;
    try {
        await RequestManager.fetch('sd-track-close-' + id, API + '/investor/deep_track/' + id + '/close', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({})
        });
        showToast('已平仓：' + name, 'success');
        loadSdTrack();
    } catch (e) {
        showToast('平仓失败：' + (e.message || e), 'error');
    }
}

async function delSdTrack(id, name) {
    if (!confirm('删除跟踪「' + name + '」？\n删除后不进入收益统计。')) return;
    try {
        await RequestManager.fetch('sd-track-del-' + id, API + '/investor/deep_track/' + id, { method: 'DELETE' });
        showToast('已删除：' + name, 'success');
        loadSdTrack();
    } catch (e) {
        showToast('删除失败：' + (e.message || e), 'error');
    }
}

// 手动触发全市场深析扫描（异步），并实时显示进度条，完成时刷新候选。
// 轮询登记在 timerManager（key='sdScanPoll'），切页即停，避免离开首页后空转。
function triggerSdScan() {
    var box = document.getElementById('sdMarketBox');
    if (!box) return;
    box.innerHTML = `<div class="sd-scan-progress">
        <div class="row"><span>⏳ 正在启动全市场深析扫描…</span><span id="sdScanPct">0%</span></div>
        <div class="bar"><div class="fill" id="sdScanBar"></div></div>
        <div class="msg" id="sdScanMsg">逐只扫描全市场股票，约几分钟；完成后自动刷新下方候选</div>
    </div>`;
    RequestManager.fetch('scan-start', API + '/investor/stock_deep/scan', { method: 'POST' })
      .then(function(resp) {
          timerManager.poll('sdScanPoll', function() {
              return RequestManager.fetch('scan-status', API + '/investor/stock_deep/scan_status')
                .then(function(sr) {
                    var d = (sr && sr.data) || {};
                    var pctEl = document.getElementById('sdScanPct');
                    var barEl = document.getElementById('sdScanBar');
                    var msgEl = document.getElementById('sdScanMsg');
                    if (pctEl) pctEl.textContent = (d.progress != null ? Number(d.progress).toFixed(0) : 0) + '%';
                    if (barEl) barEl.style.width = Math.min(100, Math.max(0, d.progress || 0)) + '%';
                    if (msgEl) msgEl.textContent = d.message || '全市场深析扫描中…';
                    if (!d.running && d.candidates != null) {
                        timerManager.clear('sdScanPoll');
                        showToast('全市场深析扫描完成，候选 ' + d.candidates + ' 只', 'success');
                        loadSdMarket();
                    }
                });
          }, 3000);
      })
      .catch(function(e) {
          box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:var(--fs-2)">启动失败：' + (e.message || e) + '</div>';
      });
}

function renderStockDeep(data) {
    var box = _sdGetBody();
    if (!box) return;
    if (data && data.insufficient) {
        box.innerHTML = '<div class="empty-state">该股历史数据不足，暂无法深度分析<br><span style="color:var(--text-muted);font-size:var(--fs-2)">' + (data.reason || '请先同步该股行情') + '</span></div>';
        return;
    }
    var sig = data.signal || {};
    var plan = sig.action_plan || {};
    var trend = data.trend || {};
    var vp = data.volume_price || {};
    var rhythm = data.rhythm || {};
    var latest = data.latest || {};
    var sigColor = _sdColor(_sdSignalColor(sig.level));
    var fmt = function(v, d) { return (v != null && !isNaN(v)) ? Number(v).toFixed(d == null ? 2 : d) : '--'; };

    var pctCls = (latest.pct_change != null) ? (latest.pct_change >= 0 ? 'idx-up' : 'idx-down') : '';
    var pctHtml = latest.pct_change != null ?
        `<span class="${pctCls}">${latest.pct_change >= 0 ? '+' : ''}${fmt(latest.pct_change)}%</span>` : '--';

    var reasonsHtml = (sig.reasons || []).map(function(r){ return '<li>' + r + '</li>'; }).join('');
    var risksHtml = (sig.risks || []).map(function(r){ return '<li class="sd-risk">' + r + '</li>'; }).join('');

    // 近期建议时间线（source=recompute 的日级弱化：无当日落库快照，标签由最新数据重算）
    var tls = (data.recent_advice || []).map(function(a) {
        var pctCls2 = a.pct_change != null ? (a.pct_change >= 0 ? 'idx-up' : 'idx-down') : '';
        var pctTxt = a.pct_change != null ? (a.pct_change >= 0 ? '+' : '') + fmt(a.pct_change) + '%' : '--';
        var dim = a.source === 'recompute' ? ' tl-recompute' : '';
        return `<div class="sd-tl-item${dim}">
            <span class="date">${a.date}</span>
            <span class="close">${fmt(a.close)}</span>
            <span class="pct ${pctCls2}">${pctTxt}</span>
            <span class="lvl"><span class="sd-lvl-chip sd-lvl-${a.level}">${a.emoji} ${a.label}</span></span>
            <span class="brief">${a.brief || ''}</span>
        </div>`;
    }).join('');

// ─── 持仓统计：把 buy/add 建议转成逐笔模拟持仓并聚合收益（回测每日候选票的收益）──
function renderSdPositionStats(data) {
    var ps = data.position_stats;
    if (!ps || !ps.summary) {
        return `<div class="sd-card">
            <h4>持仓统计 · 建议回测</h4>
            <div class="empty-state" style="padding:14px;font-size:var(--fs-2)">近期（近 ${(data.recent_advice||[]).length} 个交易日）暂无 buy/add 建议可回测</div>
        </div>`;
    }
    var s = ps.summary || {};
    var fmt = function(v, d) { return (v != null && !isNaN(v)) ? Number(v).toFixed(d == null ? 2 : d) : '--'; };
    var pctCls = function(v) { return (v != null && v >= 0) ? 'idx-up' : 'idx-down'; };
    var pct = function(v, d) {
        if (v == null || isNaN(v)) return '--';
        return `<span class="${pctCls(v)}">${v >= 0 ? '+' : ''}${fmt(v, d == null ? 2 : d)}%</span>`;
    };
    var capNote = (s.max_hold_cap != null) ? ` · 最长持有 ${s.max_hold_cap} 个交易日` : '';
    var basisNote = s.basis_pct ? `<span style="color:var(--text-muted);font-size:var(--fs-1)">（口径：${s.basis_pct}）</span>` : '';
    // 小样本降级：已了结 <5 笔时胜率是噪声不是信号——数字保留但灰色弱化 + 提示笔数有限（纯展示，不动任何计算）
    var closedN = s.n_closed == null ? 0 : s.n_closed;
    var smallSample = closedN < 5;
    var winVal = smallSample
        ? `<span style="color:var(--text-muted)">${fmt(s.win_rate, 1)}%</span>`
        : fmt(s.win_rate, 1) + '%';
    var winSub = `最佳 ${pct(s.best_return_pct)} · 最差 ${pct(s.worst_return_pct)}`
        + (smallSample ? ` · 仅 ${closedN} 笔了结，参考性有限` : '');

    // 指标卡
    var metricCells = [
        ['建议笔数', s.n_trades, `${s.n_closed} 了结 · ${s.n_open} 持仓中`],
        ['胜率', winVal, winSub],
        ['平均单笔', pct(s.avg_return_pct), `中位 ${pct(s.median_return_pct)}`],
        ['盈亏比', fmt(s.profit_factor, 2), `期望 ${pct(s.expectancy_pct)}`],
        ['均持仓天数', s.avg_hold_days != null ? fmt(s.avg_hold_days, 1) : '--', `最长 ${s.max_hold_days != null ? s.max_hold_days : '--'} 天`],
        ['最大回撤', s.max_drawdown_pct != null ? fmt(s.max_drawdown_pct, 2) + '%' : '--', '组合净值口径'],
    ].map(function(c) {
        return `<div class="sd-metric"><div class="lbl">${c[0]}</div><div class="val">${c[1]}</div><div class="sub">${c[2] || ''}</div></div>`;
    }).join('');

    // 出场原因分布
    var er = ps.exit_reasons || {};
    var erKeys = Object.keys(er);
    var erHtml = erKeys.length
        ? erKeys.map(function(k) { return `<span class="reason-chip">${k} ×${er[k]}</span>`; }).join(' ')
        : '<span class="reason-chip">暂无已了结</span>';

    // 每笔明细
    var trades = (ps.trades || []);
    var trHtml = trades.map(function(t) {
        var status = t.status === 'clear' ? '已了结' : '持仓中';
        var stColor = t.status === 'clear' ? 'var(--accent)' : '#ffaa3c';
        // 当日快照判 buy/add 但被候选筛选剔除的行：三点价为回退重算估计，轻量角标提示（口径同时间线弱化）
        var estTag = t.plan_source === 'recompute_fallback' ? '<span class="sd-est-tag">三点价为重算估计</span>' : '';
        return `<tr>
            <td>${t.signal_date || '--'}</td>
            <td>${fmt(t.entry_price)}</td>
            <td>${t.entry_date || '--'}</td>
            <td>${t.exit_date || '--'}</td>
            <td>${t.exit_price != null ? fmt(t.exit_price) : '--'}</td>
            <td>${pct(t.return_pct)}${estTag}</td>
            <td>${t.hold_days != null ? t.hold_days + '天' : '--'}</td>
            <td style="color:${stColor}">${t.exit_reason || status}</td>
        </tr>`;
    }).join('');

    return `<div class="sd-card">
        <h4>持仓统计 · 建议回测${capNote}${basisNote}</h4>
        <div class="sd-summary" style="grid-template-columns:repeat(3,1fr)">${metricCells}</div>
        <div class="sd-kv" style="margin-top:10px">
            <span>回测口径：信号日次日开盘买入、T+1，按收盘价判定止损/止盈/到期出场</span>
            <span>样本范围：仅计入 buy/add 信号日，不含观望/减仓段</span>
            <span>出场原因：${erHtml}</span>
        </div>
        <h4 style="margin-top:10px">每笔明细（近期 buy/add 建议 → 模拟持仓）</h4>
        <div style="max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:8px">
            <table class="sd-trade-table">
                <thead><tr>
                    <th>信号日</th><th>买入价</th><th>买入日</th><th>出场日</th><th>出场价</th>
                    <th>收益</th><th>持有</th><th>状态/原因</th>
                </tr></thead>
                <tbody>${trHtml || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">无可回测明细</td></tr>'}</tbody>
            </table>
        </div>
    </div>`;
}

// ─── 个股深度 K 线：与「个股 K 线弹窗」完全一致的结构（复用 buildKlineOption）──
var _sdIndicators = { vol: true, macd: false, kdj: false };

function _sdBuildKlineInputs(data) {
    var c = data.chart || {};
    var dates = c.dates || [];
    if (!dates.length) return null;
    var code = data.code || '', ra = data.recent_advice || [];
    var kdata = [];
    for (var i = 0; i < dates.length; i++) {
        var o = c.open[i] != null ? c.open[i] : c.close[i];
        var cl = c.close[i], l = c.low[i] != null ? c.low[i] : cl, h = c.high[i] != null ? c.high[i] : cl;
        var v = c.volume[i] || 0;
        var prev = i > 0 ? c.close[i - 1] : o;
        var chg = prev > 0 ? (cl / prev - 1) * 100 : 0;
        var n = /^30/.test(code) || /^688/.test(code) ? 19.5 : (/^[48]/.test(code) ? 29.5 : 9.5);
        var lt = chg >= n ? 'limit_up' : (chg <= -n ? 'limit_down' : 'normal');
        kdata.push({ date: dates[i], open: o, close: cl, low: l, high: h, vol: v, chgPct: chg, limitType: lt });
    }
    var ohlc = kdata.map(function(d) {
        var color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    var volData = kdata.map(function(d) {
        return { value: d.vol, itemStyle: { color: d.chgPct >= 0 ? _klinePalette.up : _klinePalette.down } };
    });
    // 买卖点标记（仅在信号切换当天标注）
    // 买点锚定在当日最低价（买在支撑/回调低点），卖点锚定在当日最高价，让标记贴住蜡烛而非悬空
    // 方案A：只挂 source=scan_snapshot 的档位切换日——重算日档位可能被 zigzag 事后改写，
    // 且三点价恒为 null，严禁由其他字段补画标记
    var dateK = {};
    kdata.forEach(function(d) { dateK[d.date] = d; });
    var marks = [];
    for (var j = 0; j < ra.length; j++) {
        var a = ra[j], pA = j > 0 ? ra[j - 1] : null;
        if (a.source !== 'scan_snapshot') continue;
        var inBuy = a.level === 'buy' || a.level === 'add';
        var prevInBuy = pA && (pA.level === 'buy' || pA.level === 'add');
        var inSell = a.level === 'sell';
        var k = dateK[a.date];
        if (!k) continue;
        if (inBuy && !prevInBuy) marks.push({ date: a.date, price: k.low, type: 'buy', adv: a });
        if (inSell && (!pA || pA.level !== 'sell')) marks.push({ date: a.date, price: k.high, type: 'sell', adv: a });
    }
    // 跟踪单的**实际成交点**：与上面的 B/S 不同源 —— B/S 是每日规则档位（y 无价格含义），
    // 这里的 y 是真金白银的成交价。两套同屏必须分色分形，否则用户会把档位读成成交。
    var trackMarks = [];
    (data.track_events || []).forEach(function(e) {
        if (!e || !e.date || e.price == null || !dateK[e.date]) return;   // 事件在绘图窗口外
        trackMarks.push(e);
    });
    return { kdata: kdata, dates: dates, ohlc: ohlc, volData: volData, marks: marks, trackMarks: trackMarks };
}

function sdToggleIndicator(name) {
    _sdIndicators[name] = !_sdIndicators[name];
    sdUpdateIndicatorButtons();
    if (_sd.data) renderStockDeepChart(_sd.data);
}

function sdUpdateIndicatorButtons() {
    var bar = _sdGetIndicators();
    if (!bar) return;
    bar.querySelectorAll('.indicator-btn').forEach(function(btn) {
        var k = btn.dataset.indicator;
        if (_sdIndicators[k]) btn.classList.add('active'); else btn.classList.remove('active');
    });
}

// 点/按 K 线任意一根蜡烛 → 三条虚线切到该日计划。
// 短按（点击）= 预览，5 秒后自动回到今日；长按 = 持续锁定，点图外空白才回今日。
var _sdPinnedDate = null;
var _sdPinMode = null;          // 'temp' 预览 | 'hold' 长按锁定
var _sdPinTimer = null;
var _sdPress = null;
var SD_PRESS_LONG_MS = 400;
var SD_PLAN_PREVIEW_MS = 5000;
var _SD_LEVEL_NAME = { buy: '建议买入', add: '可加仓', hold: '观望持有', sell: '偏空·减仓' };

// chart.plan 与 chart.dates 同长同序（后端逐根 force_plan 推演），所以任意一天都取得到
function _sdPlanAt(data, date) {
    var c = (data && data.chart) || {};
    var plan = c.plan, dates = c.dates || [];
    if (!plan || !plan.entry) return null;
    var i = dates.indexOf(date);
    if (i < 0) return null;
    return {
        entry_price: plan.entry[i], stop_loss: plan.stop[i], take_profit: plan.take[i],
        level: (plan.level || [])[i]
    };
}

// 价格轴当前覆盖的区间（y 轴按全部蜡烛自动取值，不随缩放窗口变化）
function _sdPriceExtent(data) {
    var c = (data && data.chart) || {};
    var lo = Infinity, hi = -Infinity, i;
    for (i = 0; i < (c.low || []).length; i++) if (c.low[i] != null && c.low[i] < lo) lo = c.low[i];
    for (i = 0; i < (c.high || []).length; i++) if (c.high[i] != null && c.high[i] > hi) hi = c.high[i];
    return { min: lo, max: hi };
}

function _sdPlanLines(data, marks) {
    var src = null;
    if (_sdPinnedDate) {
        src = _sdPlanAt(data, _sdPinnedDate);
        if (!src) { _sdPinnedDate = null; _sdPinMode = null; }   // 换股 / 该日不在图表窗口内
    }
    var pinned = !!_sdPinnedDate;
    if (!pinned) src = ((data && data.signal && data.signal.action_plan) || {});
    var tag = pinned ? _sdPinnedDate.slice(5) + ' ' : '';
    var muted = cssVar('--text-muted', '#8A94A6');
    var noPlan = pinned && src.stop_loss == null;
    var ml = [];
    var line = function(px, name, color) {
        if (px == null) return;
        ml.push({ yAxis: px, lineStyle: { color: color, type: 'dashed' }, label: { formatter: tag + name, color: color } });
    };
    // 选中的那一列用竖线标出来：非建仓日没有价位可画，至少让用户看见自己点的是哪天
    if (pinned) ml.push({ xAxis: _sdPinnedDate, lineStyle: { color: muted, width: 1 }, label: { show: false } });
    if (!noPlan) {
        line(src.entry_price, '参考入场', '#f39c12');
        line(src.stop_loss, '止损', '#e74c3c');
        line(src.take_profit, '止盈', '#2ecc71');
    }
    // 止损/止盈落在价格轴外会被裁掉看不见，只在这时撑开轴；否则保持自动取值不动画跳
    var ext = _sdPriceExtent(data), yMin = null, yMax = null;
    if (src.stop_loss != null && src.stop_loss < ext.min) yMin = src.stop_loss;
    if (src.take_profit != null && src.take_profit > ext.max) yMax = src.take_profit;
    var fmtPx = function(v) { return (v == null) ? '--' : Number(v).toFixed(2); };
    var modeTxt = _sdPinMode === 'hold' ? '长按已锁定，点图外空白回到今日'
                                        : (SD_PLAN_PREVIEW_MS / 1000) + ' 秒后回到今日';
    var hint;
    if (noPlan) {
        // 不写任何价位数字：观望/减仓日没有建仓动作，画出来的止损/止盈会被当成真实计划读
        hint = _sdPinnedDate + ' 未给出止损/止盈（该日信号：' + (_SD_LEVEL_NAME[src.level] || '未覆盖')
             + '，非建仓日）· ' + modeTxt;
    } else if (pinned) {
        hint = '虚线 = ' + _sdPinnedDate + ' 当日计划 入场 ' + fmtPx(src.entry_price)
             + ' / 止损 ' + fmtPx(src.stop_loss) + ' / 止盈 ' + fmtPx(src.take_profit) + ' · ' + modeTxt;
    } else {
        hint = '虚线 = 今日计划 · 点蜡烛看当天，长按锁定 · ▲建/◆卖 = 跟踪单实际成交价（B/S 只是档位信号，非成交）';
    }
    return {
        markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', width: 1 }, label: { position: 'insideEndTop', fontSize: 10 }, data: ml },
        yMin: yMin, yMax: yMax, hint: hint
    };
}

function _sdApplyPlanLines(chart, opt) {
    var pl = _sdPlanLines(_sd.data, chart.__sdMarks);
    if (opt.title) {
        opt.title.subtext = pl.hint;
        opt.title.subtextStyle = { color: cssVar('--text-muted', '#8A94A6'), fontSize: 10 };
    }
    if (opt.series[0]) opt.series[0].markLine = pl.markLine;
    if (opt.yAxis && opt.yAxis[0]) { opt.yAxis[0].min = pl.yMin; opt.yAxis[0].max = pl.yMax; }
}

function _sdRefreshPlanLines(chart) {
    var pl = _sdPlanLines(_sd.data, chart.__sdMarks);
    // 只改虚线、价格轴与副标题，不整图重画 —— 保留用户当前的缩放区间与副图展开状态
    chart.setOption({
        title: { subtext: pl.hint },
        yAxis: [{ id: 'price', min: pl.yMin, max: pl.yMax }],
        series: [{ id: 'kline', markLine: pl.markLine }]
    });
}

// 像素 → 该列对应的交易日；点在所有副图之外（坐标轴、标题、缩放条）返回 null
function _sdDateAtPixel(chart, xy) {
    var dates = chart.__sdDates || [];
    for (var g = 0; g < (chart.__sdGridCount || 1); g++) {
        if (!chart.containPixel({ gridIndex: g }, xy)) continue;
        var px = chart.convertFromPixel({ gridIndex: g }, xy);
        if (!px) continue;
        var i = Math.round(px[0]);
        return (i >= 0 && i < dates.length) ? dates[i] : null;
    }
    return null;
}

function _sdSetPin(chart, date, mode) {
    if (_sdPinTimer) { clearTimeout(_sdPinTimer); _sdPinTimer = null; }
    if (!date && !_sdPinnedDate) return;
    _sdPinnedDate = date;
    _sdPinMode = date ? mode : null;
    _sdRefreshPlanLines(chart);
    if (date && mode === 'temp') {
        _sdPinTimer = setTimeout(function () { _sdPinTimer = null; _sdSetPin(chart, null, null); }, SD_PLAN_PREVIEW_MS);
    }
}

function _sdBindMarkFocus(chart) {
    if (chart.__sdFocusBound) return;
    chart.__sdFocusBound = true;
    var zr = chart.getZr();
    zr.on('mousedown', function (e) {
        var d = _sdDateAtPixel(chart, [e.offsetX, e.offsetY]);
        _sdPress = { date: d, long: false, timer: null };
        if (d) _sdSetPin(chart, d, 'temp');   // 按下即出线，长按再升级为锁定
        _sdPress.timer = setTimeout(function () {
            if (!_sdPress || !_sdPress.date) return;
            _sdPress.long = true;
            _sdSetPin(chart, _sdPress.date, 'hold');
        }, SD_PRESS_LONG_MS);
    });
    zr.on('mouseup', function () {
        var press = _sdPress;
        _sdPress = null;
        if (press && press.timer) clearTimeout(press.timer);
        if (!press) return;
        if (!press.date) { _sdSetPin(chart, null, null); return; }   // 点图外空白 = 回到今日
        if (press.long) return;                                       // 长按锁定，保持显示
        _sdSetPin(chart, press.date, 'temp');                         // 短按：重新计满 5 秒
    });
}

function renderStockDeepChart(data) {
    var dom = _sdGetChart();
    if (!dom) return;
    resolveKlinePalette();
    var inx = _sdBuildKlineInputs(data);
    if (!inx) return;
    var activeCount = Object.keys(_sdIndicators).filter(function(k) { return _sdIndicators[k]; }).length;
    var baseH = window.innerWidth < 480 ? 280 : (window.innerWidth < 768 ? 360 : 440);
    var h = Math.min(baseH + (activeCount - 1) * 90, window.innerWidth < 768 ? 520 : 800);
    dom.style.height = h + 'px';
    var chart = ChartManager.get('stockdeep', dom);
    var opt = buildKlineOption(inx.kdata, inx.dates, inx.ohlc, inx.volData, inx.marks, _sdIndicators, inx.trackMarks);
    opt.title.text = (data.code ? (data.code + ' · ' + (data.name || '')) : '') + '  K线';
    chart.__sdMarks = inx.marks;
    chart.__sdDates = inx.dates;
    chart.__sdGridCount = opt.grid.length;
    _sdBindMarkFocus(chart);
    _sdApplyPlanLines(chart, opt);
    // P4 任务16 批次1（管理A 授权：仅 ECharts 布局参数）：460px 深析抽屉窄版下
    // 撑开 grid 左右边距防成交量轴长标签裁切；副标题 hint 按图宽换行不再溢出。
    // 数据字段 / 计算 / 接口零触碰。
    _fitKlineNarrowLayout(opt, dom);
    chart.clear();
    chart.setOption(opt);
    chart.resize();
}

// P4#8/#7 批次共用：窄容器（深析抽屉 460 / K线抽屉 375 bottom sheet）下撑开 grid 边距、
// 副标题按宽换行。只动布局参数（grid 边距 / subtextStyle），数据字段零触碰。
function _fitKlineNarrowLayout(opt, dom) {
    var cw = dom && dom.getBoundingClientRect ? dom.getBoundingClientRect().width : 0;
    if (!cw || cw >= 560) return;
    var grids = Array.isArray(opt.grid) ? opt.grid : (opt.grid ? [opt.grid] : []);
    grids.forEach(function (g) { g.left = cw < 430 ? 88 : 64; g.right = 12; });   // N-1：375 下十亿级量轴 13 位标签需 88px
    if (opt.title && opt.title.subtextStyle) {
        opt.title.subtextStyle = Object.assign({}, opt.title.subtextStyle,
            { fontSize: 9, width: Math.max(140, cw - 32), overflow: 'break' });
    }
}

// 切换 tab 后恢复缓存时，重新渲染个股深度图表（ECharts 实例绑定到新 DOM 失效）
function restoreStockDeep() {
