async function l06SubmitIdea() {
    var title = (document.getElementById('l06Title').value || '').trim();
    var hypo = (document.getElementById('l06Hypo').value || '').trim();
    var condText = (document.getElementById('l06Cond').value || '').trim();
    var hold = parseInt(document.getElementById('l06Hold').value, 10);
    if (title.length < 4 || title.length > 120) { showToast('标题需 4~120 字', 'warning'); return; }
    if (!hypo) { showToast('一句话假设必填', 'warning'); return; }
    var conditions = [];
    if (condText) {
        try { conditions = JSON.parse(condText); } catch (e) { showToast('条件 JSON 解析失败：' + e.message, 'error'); return; }
        if (!Array.isArray(conditions) || !conditions.length) { showToast('条件至少一条', 'warning'); return; }
    }
    var indicators = [];
    conditions.forEach(function (c) { if (c && c.field && indicators.indexOf(c.field) < 0) indicators.push(c.field); });
    try {
        var resp = await rpJsonPost('l06-idea-new', API + '/l06/idea', {
            title: title, hypothesis: hypo, conditions_json: JSON.stringify(conditions),
            indicators_json: JSON.stringify(indicators), implied_hold_days: isNaN(hold) ? null : hold,
        });
        var d = (resp && resp.data) || {};
        showToast('想法已保存，分诊计时开始', 'success');
        l06OpenTriage({
            id: d.idea_id != null ? d.idea_id : d.id, title: title,
            deadline_at: d.deadline_at, created_at: d.created_at, status: 'triaging',
        }, 1);
        loadL06Queue();
    } catch (e) {
        showToast('保存失败：' + (e.message || e), 'error');
    }
}

function l06DeadlineDate(idea) {
    if (idea.deadline_at) return rpLocalDate(idea.deadline_at);
    var d = rpLocalDate(idea.created_at);
    d.setSeconds(d.getSeconds() + L06_TRIAGE_BUDGET);
    return d;
}

function l06OpenTriage(idea, attempt) {
    _l06Active = { idea: idea, attempt: attempt || 1, overtimeShown: false, verdict: null, bundleId: null };
    var host = document.getElementById('panelL06Active');
    if (!host) return;
    host.style.display = '';
    host.innerHTML =
        '<div class="panel-header"><h3>分诊闸 · ' + rpEsc(idea.title) + '（第 ' + (attempt || 1) + ' 次）</h3>' +
        '<span class="rp-count" id="l06Countdown">--</span></div>' +
        '<div class="rp-triage-note">30 分钟预算从<b>想法录入瞬间</b>起算，只管这一关。超时不自动判死，但必须当场二选一：补 defer（写明缺什么）或判 fail。' +
        '「深跑」按钮在 verdict=pass 前锁定。</div>' +
        l06ChecklistHtml() +
        '<div class="rp-verdict-row" id="l06VerdictRow">' +
        '<button class="btn btn-primary" onclick="l06SubmitVerdict(\'pass\')">pass · 允许深跑</button>' +
        '<button class="btn" onclick="l06SubmitVerdict(\'fail\')">fail</button>' +
        '<button class="btn" onclick="l06SubmitVerdict(\'defer\')">defer（补齐再来）</button>' +
        '</div>';
    _l06StartTick();
}

function l06ChecklistHtml() {
    var rows = L06_CHECKS.map(function (c) {
        return '<div class="rp-check-row" data-check="' + c[0] + '">' +
            '<span class="rp-check-id">' + c[0] + '</span>' +
            '<span class="rp-check-name">' + c[1] + '<em>' + c[2] + '</em></span>' +
            '<span class="rp-check-opts">' +
            '<label><input type="radio" name="chk_' + c[0] + '" value="pass" checked>pass</label>' +
            '<label><input type="radio" name="chk_' + c[0] + '" value="fail">fail</label>' +
            '<label><input type="radio" name="chk_' + c[0] + '" value="not_evaluated">未做</label>' +
            '</span>' +
            '<input class="rp-check-note" data-note="' + c[0] + '" placeholder="依据数字（可选）" maxlength="200" aria-label="' + c[0] + ' 依据">' +
            '</div>';
    }).join('');
    return '<div class="rp-check-list" id="l06CheckList">' + rows + '</div>';
}

function l06CollectChecks() {
    return L06_CHECKS.map(function (c) {
        var row = document.querySelector('.rp-check-row[data-check="' + c[0] + '"]');
        var state = 'not_evaluated';
        if (row) {
            var checked = row.querySelector('input[type=radio]:checked');
            if (checked) state = checked.value;
        }
        var noteEl = document.querySelector('.rp-check-note[data-note="' + c[0] + '"]');
        var note = (noteEl && noteEl.value || '').trim();
        return { id: c[0], result: state, note: note };   // §8.1：checks 键名用 result
    });
}

function _l06StartTick() {
    timerManager.clear('l06-tick');
    if (!_l06Active) return;
    var deadline = l06DeadlineDate(_l06Active.idea);
    timerManager.setInterval('l06-tick', function () {
        var el = document.getElementById('l06Countdown');
        if (!el || !_l06Active) { timerManager.clear('l06-tick'); return; }
        var left = (deadline - Date.now()) / 1000;
        el.textContent = rpCountdownText(deadline);
        el.classList.toggle('over', left < 0);
        if (left < 0 && !_l06Active.overtimeShown && !_l06Active.verdict) l06ShowOvertime(deadline);
    }, 1000);
}

// L06_spec §2 超时后展示三块：① 已用时长+超时限 ② 检查项清单 ③ 二选一（补 defer / 判 fail）
function l06ShowOvertime(deadline) {
    if (!_l06Active) return;
    _l06Active.overtimeShown = true;
    var row = document.getElementById('l06VerdictRow');
    if (!row) return;
    var used = Math.round((Date.now() - (deadline.getTime() - L06_TRIAGE_BUDGET * 1000)) / 1000);
    row.innerHTML =
        '<div class="rp-overtime">' +
        '<div class="rp-overtime-1">⏱ 已用 ' + rpMmss(used) + ' / 预算 30:00 —— 超时不自动判死，但不许「再跑一会儿」：当场二选一。</div>' +
        '<div class="rp-overtime-2">检查项状态见上表，未做的项会随 defer/fail 一并入库留痕。</div>' +
        '<div class="rp-overtime-3">' +
        '<button class="btn btn-primary" onclick="l06SubmitVerdict(\'defer\')">补 defer（写明缺什么，≥10 字）</button>' +
        '<button class="btn btn-danger" onclick="l06SubmitVerdict(\'fail\')">判 fail（放弃此想法）</button>' +
        '</div></div>';
}

async function l06SubmitVerdict(verdict) {
    if (!_l06Active || _l06Active.verdict) return;
    var idea = _l06Active.idea;
    var checks = l06CollectChecks();
    var body = { triage_attempt: _l06Active.attempt, checks: checks, verdict: verdict };
    if (verdict === 'pass') {
        var t2 = checks.filter(function (c) { return c.id === 'T2'; })[0];
        if (!t2 || t2.result !== 'pass') { showToast('T2 未来函数是硬门，不通过不许 pass（服务端也会重算兜底）', 'error'); return; }
        var t6 = checks.filter(function (c) { return c.id === 'T6'; })[0];
        if (t6 && t6.result === 'fail' && (t6.note || '').replace(/\s/g, '').length < 10) {
            showToast('T6 判为重复覆盖：pass 前须在 T6 依据里写满 10 字「与已有规则不同在哪」', 'warning'); return;
        }
    }
    if (verdict === 'fail') {
        var code = prompt('死因码（LOGIC / DATA / SAMPLE / LIQUIDITY / REGIME 之一）：', 'LOGIC');
        if (code == null) return;
        code = code.trim().toUpperCase();
        if (L06_DEATH_CODES.indexOf(code) < 0) { showToast('死因码不在枚举内', 'error'); return; }
        body.death_step = code;
    }
    if (verdict === 'defer') {
        var reason = prompt('缺什么（数据/口径，≥10 字，进欠账列表）：', '');
        if (reason == null) return;
        if (reason.replace(/\s/g, '').length < 10) { showToast('defer 理由需 ≥10 字', 'warning'); return; }
        body.defer_reason = reason.trim();
    }
    try {
        await rpJsonPost('l06-triage', API + '/l06/idea/' + idea.id + '/triage', body);
        _l06Active.verdict = verdict;
        timerManager.clear('l06-tick');
        var host = document.getElementById('panelL06Active');
        if (verdict === 'pass') {
            host.innerHTML = '<div class="panel-header"><h3>分诊通过 · ' + rpEsc(idea.title) + '</h3><span class="rp-badge ok">pass</span></div>' +
                '<div class="rp-triage-note">深跑是异步任务，不计入 30 分钟、无倒计时。提交后自动并行跑 3 组对照。</div>' +
                '<div id="l06RunBlock"><button class="btn btn-primary" onclick="l06StartRun()">启动一题三跑（A近窗现实 / B全窗现实 / C近窗理想）</button></div>';
        } else {
            host.innerHTML = '<div class="panel-header"><h3>分诊落定 · ' + rpEsc(idea.title) + '</h3>' +
                '<span class="rp-badge ' + (verdict === 'defer' ? 'warn' : 'bad') + '">' + verdict + '</span></div>' +
                '<div class="rp-triage-note">' + (verdict === 'defer' ? '已进欠账列表（不排队周末批量）。补齐后可再分诊一次，第二次仍超时将强制 fail。' : '想法终止，未产生任何回测任务（省算力也省「不忍关」）。') + '</div>';
        }
        loadL06Queue();
    } catch (e) {
        showToast('分诊提交失败：' + (e.message || e), 'error');
    }
}

async function l06StartRun() {
    var idea = _l06Active && _l06Active.idea;
    if (!idea) return;
    try {
        var resp = await rpJsonPost('l06-run', API + '/l06/idea/' + idea.id + '/run', {});
        var d = (resp && resp.data) || {};
        _l06Active.bundleId = d.bundle_id != null ? d.bundle_id : d.id;
        showToast('三跑已提交，异步执行中', 'success');
        _l06PollBundle();
    } catch (e) {
        showToast('启动失败：' + (e.message || e), 'error');
    }
}

function _l06PollBundle() {
    timerManager.poll('l06-run-poll', async function () {
        if (!_l06Active || !_l06Active.bundleId) { timerManager.clear('l06-run-poll'); return; }
        var host = document.getElementById('l06RunBlock');
        try {
            var resp = await RequestManager.fetch('l06-bundle-poll', API + '/l06/bundle/' + _l06Active.bundleId);
            var d = (resp && resp.data) || {};
            var ready = d.ready === true || (d.metrics && d.combos);
            if (!ready) {
                if (host) host.innerHTML = _l06RunProgressHtml(d);
                return;
            }
            timerManager.clear('l06-run-poll');
            if (host) host.innerHTML = '<button class="btn btn-primary" onclick="openRpReport(' + _l06Active.bundleId + ')">打开验证报告</button>';
            openRpReport(_l06Active.bundleId);
            loadL06Queue();
        } catch (e) {
            if (host) host.innerHTML = panelError('loadL06Queue');
            timerManager.clear('l06-run-poll');
        }
    }, 5000, true);
}

function _l06RunProgressHtml(d) {
    // 深跑阶段无倒计时（spec §2）：只展示 3 个 task 进度轮询
    var combos = d.combos || [];
    var rows = combos.map(function (c) {
        var st = (d.statuses && d.statuses[c.code]) || c.status || 'running';
        return '<div class="rp-run-row"><b>' + rpEsc(c.code) + '</b> ' + rpEsc(c.window || '') + ' × ' + rpEsc(c.cost_tier || '') +
            '<span class="rp-run-st st-' + rpEsc(st) + '">' + rpEsc(st) + '</span></div>';
    }).join('');
    return '<div class="rp-run">' + (rows || '<div class="rp-run-row">三跑进行中，每 5 秒刷新…</div>') + '</div>';
}

var L06_QUEUE_GROUPS = [
    ['new', '待分诊'], ['triaging', '分诊中'], ['deferred', '欠账（defer）'],
    ['passed', '已过闸未跑'], ['run_complete', '已完成'], ['failed', '已判死'], ['timeout', '超时'],
];

async function loadL06Queue() {
    var box = document.getElementById('l06QueueBody');
    if (!box) return;
    try {
        var resp = await RequestManager.fetch('l06-queue', API + '/l06/queue');
        var items = ((resp && resp.data) || {}).items || [];
        _l06QueueCache = {};
        items.forEach(function (it) { _l06QueueCache[it.id] = it; });
        if (!items.length) { box.innerHTML = '<div class="empty-state">队列是空的。录入第一个想法吧。</div>'; return; }
        var byStatus = {};
        items.forEach(function (it) { (byStatus[it.status] = byStatus[it.status] || []).push(it); });
        var html = '';
        L06_QUEUE_GROUPS.forEach(function (g) {
            var list = byStatus[g[0]];
            if (!list || !list.length) return;
            html += '<div class="rp-q-group"><div class="rp-q-title">' + g[1] + ' · ' + list.length + '</div>';
            list.forEach(function (it) { html += _l06QueueRow(it); });
            html += '</div>';
        });
        box.innerHTML = html;
    } catch (e) {
        box.innerHTML = '<div class="panel-error">队列加载失败（后端 /api/l06/queue 未就绪？） ' +
            '<button class="btn btn-sm" onclick="loadL06Queue()">重试</button></div>';
    }
}

function _l06QueueRow(it) {
    var act = '';
    var deadlineHint = '';
    if (it.status === 'new' || it.status === 'triaging') {
        act = '<button class="sd-op" onclick=' + JSON.stringify('l06ResumeTriage(' + it.id + ')') + '>进入分诊</button>';
        if (it.created_at) deadlineHint = '<span class="rp-q-deadline" data-created="' + rpEsc(it.created_at) + '"></span>';
    } else if (it.status === 'deferred') {
        act = '<button class="sd-op" onclick=' + JSON.stringify('l06ResumeTriage(' + it.id + ', 2)') + '>再分诊（第2次）</button>';
        if (it.defer_reason) act += '<span class="rp-q-defer">' + rpEsc(it.defer_reason) + '</span>';
    } else if (it.status === 'passed') {
        act = '<button class="sd-op" onclick=' + JSON.stringify('l06ResumeTriage(' + it.id + ')') + '>启动深跑</button>';
    } else if (it.status === 'run_complete') {
        act = it.bundle_id ? '<button class="sd-op" onclick="openRpReport(' + it.bundle_id + ')">看报告</button>' : '';
    } else if (it.death_step) {
        act = '<span class="rp-death rp-d-' + rpEsc(it.death_step.toLowerCase()) + '">' + rpEsc(L06_DEATH_LABEL[it.death_step] || it.death_step) + '</span>';
    }
    return '<div class="rp-q-row" data-id="' + it.id + '"><span class="rp-q-name">' + rpEsc(it.title) + '</span>' +
        deadlineHint + act + '</div>';
}

// 从队列恢复分诊现场（attempt=2 用于 defer 后补齐再分诊）；直接用队列缓存，不自造 spec 外参数
var _l06QueueCache = {};
async function l06ResumeTriage(ideaId, attempt) {
    var it = _l06QueueCache[ideaId];
    if (!it) {
        try {
            await loadL06Queue();
            it = _l06QueueCache[ideaId];
        } catch (e) { /* 提示在下一行统一给 */ }
    }
    if (!it) { showToast('想法不存在，先刷新队列', 'error'); return; }
    if (it.status === 'passed') {
        _l06Active = { idea: it, attempt: 1, overtimeShown: false, verdict: 'pass', bundleId: it.bundle_id || null };
        var host = document.getElementById('panelL06Active');
        if (host) {
            host.style.display = '';
            host.innerHTML = '<div class="panel-header"><h3>已过闸 · ' + rpEsc(it.title) + '</h3><span class="rp-badge ok">pass</span></div>' +
                '<div id="l06RunBlock">' + (it.bundle_id
                    ? '<button class="btn btn-primary" onclick="openRpReport(' + it.bundle_id + ')">打开验证报告</button>'
                    : '<button class="btn btn-primary" onclick="l06StartRun()">启动一题三跑</button>') + '</div>';
        }
        if (!it.bundle_id) return;
        return;
    }
    l06OpenTriage(it, attempt || 1);
}

function resumeL06Timers() {

    if (_l06Active && _l06Active.bundleId && document.getElementById('l06RunBlock')) _l06PollBundle();
}

async function loadL06Review() {
    var box = document.getElementById('l06ReviewBody');
    if (!box) return;
    var week = (document.getElementById('l06ReviewWeek') || {}).value || rpIsoWeek(new Date());
    try {
        var resp = await RequestManager.fetch('l06-review', API + '/l06/review?week=' + encodeURIComponent(week));

            chips += '<span class="rp-stat-chip"><b>' + rpEsc(k) + '</b> ' + rpEsc(v) + '</span>';
        });
        var items = d.items || [];
        var tbl = items.length ? '<table class="rp-tbl"><thead><tr><th>想法</th><th>verdict</th><th>死因</th><th>分诊用时</th></tr></thead><tbody>' +
            items.map(function (it) {
                return '<tr><td>' + rpEsc(it.title) + '</td><td>' + rpEsc(it.verdict || it.status || '--') + '</td><td>' +
                    (it.death_step ? rpEsc(L06_DEATH_LABEL[it.death_step] || it.death_step) : '--') + '</td><td>' +
                    (it.elapsed_seconds != null ? rpMmss(it.elapsed_seconds) : '--') + '</td></tr>';
            }).join('') + '</tbody></table>' : '';

        box.innerHTML = '<div class="panel-error">复盘加载失败：' + rpEsc(e.message || e) + '（后端 /api/l06/review 未就绪？）</div>';
    }
}

// ═══ L06 报告抽屉（全宽：现实实线 + 理想虚线 同坐标叠两线 + 差异表；B 走切换，不三条同叠）═══
var rpState = { bundle: null, mode: 'cost', curves: {} };

function rpOpenDrawer(bodyHtml) {
    var body = document.getElementById('rpBody');
    if (body) body.innerHTML = bodyHtml;
    document.getElementById('rpPanel').classList.add('open');
}
function closeRpPanel() {
    document.getElementById('rpPanel').classList.remove('open');
    ChartManager.dispose('rp-nav');
}
function rpBody(html) {
    var el = document.getElementById('rpBody');
    if (el) el.innerHTML = html;
}

async function openRpReport(bundleId) {
    rpOpenDrawer('<div class="rp-loading">报告加载中…</div>');
    var resp;
    try {
        resp = await RequestManager.fetch('l06-bundle-open', API + '/l06/bundle/' + bundleId);
    } catch (e) {
        rpBody('<div class="panel-error">报告加载失败：' + rpEsc(e.message || e) + '</div>');
        return;
    }
    var d = (resp && resp.data) || {};
    rpState.bundle = d;
    rpState.mode = 'cost';
    rpState.curves = {};
    rpBody(rpReportHtml(d));
    await rpLoadCurves(d);
    rpRenderNavChart();
}

function _rpCombo(d, code) {
    return (d.combos || []).filter(function (c) { return c.code === code; })[0];
}
function _rpParseMaybeJson(v) {
    if (v == null) return null;
    if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
    return v;
}

function rpReportHtml(d) {
    var title = d.idea_title || d.title || '验证报告';
    var step = (d.death_step || '').toUpperCase();
    var triage = _rpParseMaybeJson(d.triage) || d.triage || {};
    var mmss = triage.elapsed_seconds != null ? rpMmss(triage.elapsed_seconds) : '--';
    var checks = _rpParseMaybeJson(triage.checks_json || triage.checks) || [];
    var checkLine = Array.isArray(checks) ? checks.map(function (c) {
        var st = c.result || c.state;
        var mark = st === 'pass' ? '✓' : (st === 'fail' ? '✗' : '·');
        return c.id + ' ' + mark + (c.note ? '(' + rpEsc(c.note) + ')' : '');
    }).join('　') : '';
    var ec = d.execution_config || d._execution_config || {};
    var wActual = d.window_days_actual || {};
    var comboB = _rpCombo(d, 'B');
    var clamp = d.window_clamped
        ? '<span class="rp-warn">窗口不足已截断：B 实际 ' + rpEsc(wActual.B != null ? wActual.B : ((comboB && comboB.window_days) || '?')) + ' 交易日，勿当 3 年结论读</span>' : '';
    var cannotProve = _rpParseMaybeJson(d.cannot_prove);
    var proveHtml = Array.isArray(cannotProve) && cannotProve.length
        ? '<ul class="rp-noprov">' + cannotProve.map(function (x) { return '<li>' + rpEsc(x) + '</li>'; }).join('') + '</ul>'
        : '<div class="rp-warn">⚠ 本报告缺「不能证明什么」段落 —— spec §7.3/R7 硬约束，后端补齐前此报告不可作为下单依据</div>';

    return '' +
    '<div class="rp-head">' +
        '<h2>' + rpEsc(title) + '</h2>' +
        '<div class="rp-concl"><span class="rp-death rp-d-' + rpEsc((step || 'none').toLowerCase()) + '">死因：' + rpEsc(L06_DEATH_LABEL[step] || '—') + '</span>' +
        '<span class="rp-concl-text">' + rpEsc(d.conclusion_text || '') + '</span></div>' +
        '<div class="rp-meta">分诊：用时 ' + mmss + ' / 预算 30:00，verdict=' + rpEsc(triage.verdict || d.triage_verdict || '--') +
        '，attempt=' + rpEsc(triage.attempt != null ? triage.attempt : (d.triage_attempt != null ? d.triage_attempt : 1)) +
        (triage.over_budget ? '，超时 ' + rpMmss(triage.over_budget) + '（超时后 pass 入口已关闭）' : '') + '</div>' +
        (checkLine ? '<div class="rp-checks">' + checkLine + '</div>' : '') +
    '</div>' +
    '<div class="rp-sec"><h4>执行配置与数据版本（同框可比的前提）</h4>' +
        '<div class="rp-kv">' +
        '<span>A/B 窗口：<b>' + rpEsc((_rpCombo(d, 'A') || {}).window_days || '?') + ' / ' + rpEsc((_rpCombo(d, 'B') || {}).window_days || '?') + ' 交易日</b></span>' +
        '<span>数据版本：<b>' + rpEsc(d.data_version || '--') + '</b></span>' +
        Object.keys(ec).map(function (k) { return '<span>' + rpEsc(k) + '：<b>' + rpEsc(ec[k]) + '</b></span>'; }).join('') +
        '</div>' + clamp +
    '</div>' +
    '<div class="rp-sec"><h4>净值同框</h4>' +
        '<div class="segmented" role="group" aria-label="对比轴切换">' +
        '<button class="seg-btn active" id="rpSegCost" onclick="rpSetMode(\'cost\')">成本轴：A 现实 vs C 理想（同近窗）</button>' +
        '<button class="seg-btn" id="rpSegRegime" onclick="rpSetMode(\'regime\')">环境轴：A 近窗 vs B 全窗（同现实）</button>' +
        '</div>' +
        '<div class="rp-chart" id="rpNavChart" role="img" aria-label="净值曲线对比"></div>' +
        '<div id="rpMetricsTable"></div>' +
    '</div>' +
    '<div class="rp-sec"><h4>死因推导</h4><div class="rp-text">' + rpEsc(d.death_detail || d.conclusion_text || '（后端未给出推导过程）') + '</div></div>' +
    '<div class="rp-sec"><h4>本报告不能证明什么</h4>' + proveHtml + '</div>' +
    (d.report_md_path ? '<div class="rp-sec rp-fpath">存档：' + rpEsc(d.report_md_path) + '</div>' : '');
}

function rpSetMode(mode) {
    rpState.mode = mode;
    var c = document.getElementById('rpSegCost'), r = document.getElementById('rpSegRegime');
    if (c) c.classList.toggle('active', mode === 'cost');
    if (r) r.classList.toggle('active', mode === 'regime');
    rpRenderNavChart();
}

async function rpLoadCurves(d) {
    // 曲线数据源：优先 bundle 内联 equity_curve；缺则回落现成 per-task 结果接口（后端已实现）
    var combos = d.combos || [];
    await Promise.all(combos.map(async function (c) {
        if (Array.isArray(c.equity_curve) && c.equity_curve.length) { rpState.curves[c.code] = c.equity_curve; return; }
        if (!c.task_id) return;
        try {
            var resp = await RequestManager.fetch('rp-curve-' + c.code, API + '/backtest/' + c.task_id + '/result');
            var r = ((resp || {}).data || {}).data || {};
            if (Array.isArray(r.equity_curve)) rpState.curves[c.code] = r.equity_curve;
        } catch (e) { /* 单条曲线缺失不阻塞整页 */ }
    }));
}

function _rpNavPoints(curve) {
    if (!curve || !curve.length) return [];
    var base = Number(curve[0].total) || 1;
    return curve.map(function (p) { return [p.date, Number(((Number(p.total) || 0) / base).toFixed(5))]; });
}

function rpRenderNavChart() {
    var d = rpState.bundle;
    if (!d) return;
    var dom = document.getElementById('rpNavChart');
    var tblBox = document.getElementById('rpMetricsTable');
    if (dom) {
        var pair = rpState.mode === 'cost' ? ['C', 'A'] : ['A', 'B'];
        var labelOf = { A: '现实·近窗', B: '现实·全窗', C: '理想·零成本', D: '理想·全窗' };
        // 两版同框：现实实线 / 理想虚线；不做三条同叠（COST 与 REGIME 两轴不混读）
        var baseDates = (rpState.curves[pair[1]] || []).map(function (p) { return p[0]; });
        if (!baseDates.length) baseDates = (rpState.curves[pair[0]] || []).map(function (p) { return p[0]; });
        var series = pair.map(function (code) {
            var pts = rpState.curves[code] || [];
            var map = {};
            pts.forEach(function (p) { map[p[0]] = p[1]; });
            var aligned = baseDates.map(function (dt) { return map[dt] != null ? map[dt] : null; });
            var ideal = code === 'C' || code === 'D';
            var color = code === 'A' ? cssVar('--accent', '#2f6fed')
                : code === 'B' ? cssVar('--status-warn', '#e6a23c')
                : cssVar('--text-secondary', '#8a93a6');
            return {
                name: code + ' ' + (labelOf[code] || code),
                type: 'line', showSymbol: false, connectNulls: false,
                lineStyle: { type: ideal ? 'dashed' : 'solid', width: 2, color: color },
                itemStyle: { color: color },
                data: aligned,
            };
        });
        var chart = ChartManager.get('rp-nav', dom);
        chart.setOption({
            animation: false,
            color: [cssVar('--text-secondary', '#8a93a6'), cssVar('--accent', '#2f6fed')],
            tooltip: { trigger: 'axis', valueFormatter: function (v) { return v == null ? '--' : Number(v).toFixed(3); } },
            legend: { top: 0, textStyle: { color: cssVar('--text-secondary', '#555'), fontSize: 11 } },
            grid: { left: 46, right: 18, top: 30, bottom: 26 },
            xAxis: { type: 'category', data: baseDates, axisLabel: { color: cssVar('--text-muted', '#999'), fontSize: 10 }, axisLine: { lineStyle: { color: cssVar('--border', '#ddd') } } },
            yAxis: { type: 'value', scale: true, axisLabel: { color: cssVar('--text-muted', '#999'), fontSize: 10 }, splitLine: { lineStyle: { color: cssVar('--border', '#eee') } } },
            series: series,
        }, true);
    }
    if (tblBox) tblBox.innerHTML = rpMetricsTableHtml(d);
}

function _rpMetricRow(label, key, fmt) {
    var m = (rpState.bundle && rpState.bundle.metrics) || {};
    fmt = fmt || rpPct;
    var av = (m.A || {})[key], bv = (m.B || {})[key], cv = (m.C || {})[key];
    return { label: label, a: av, b: bv, c: cv, fmt: fmt };
}

function rpMetricsTableHtml(d) {
    var m = d.metrics || {};
    if (!m || (!m.A && !m.C && !m.B)) return '<div class="empty-state">指标未就绪</div>';
    var rows = [
        _rpMetricRow('累计收益', 'cumulative_return'),
        _rpMetricRow('年化收益', 'annual_return'),
        _rpMetricRow('胜率', 'win_rate'),
        _rpMetricRow('Sharpe', 'sharpe_ratio', function (v) { return v == null || isNaN(v) ? '--' : Number(v).toFixed(2); }),
        _rpMetricRow('最大回撤', 'max_drawdown'),
        _rpMetricRow('交易数', 'total_trades', function (v) { return v == null || isNaN(v) ? '--' : String(v); }),
    ];
    var html;
    if (rpState.mode === 'cost') {
        html = '<table class="rp-tbl"><thead><tr><th>指标</th><th>理想 C</th><th>现实 A</th><th>差（C−A）</th></tr></thead><tbody>' +
            rows.map(function (r) {
                var gap = (typeof r.c === 'number' && typeof r.a === 'number') ? fmtGap(r.c - r.a, r.fmt) : '--';
                var rawGap = (typeof r.c === 'number' && typeof r.a === 'number') ? r.c - r.a : null;
                return '<tr><td>' + r.label + '</td><td>' + r.fmt(r.c) + '</td><td>' + r.fmt(r.a) + '</td><td>' +
                    (rawGap == null ? gap : rpSigned(rawGap, gap)) + '</td></tr>';
            }).join('') +
            (m.cost_gap != null ? '<tr class="rp-costgap"><td>成本蚕食 cost_gap</td><td colspan="3">' + rpPct(m.cost_gap) + '（同期收益被佣金/印花/滑点吃掉的量）</td></tr>' : '') +
            '</tbody></table>';
    } else {
        var wa = d.window_days_actual || {};
        var aD = wa.A != null ? wa.A : ((_rpCombo(d, 'A') || {}).window_days || '?');
        var bD = wa.B != null ? wa.B : ((_rpCombo(d, 'B') || {}).window_days || '?');
        html = '<table class="rp-tbl"><thead><tr><th>指标</th><th>A ' + rpEsc(aD) + 'td（近窗）</th><th>B ' + rpEsc(bD) + 'td（全窗）</th></tr></thead><tbody>' +
            rows.map(function (r) { return '<tr><td>' + r.label + '</td><td>' + r.fmt(r.a) + '</td><td>' + r.fmt(r.b) + '</td></tr>'; }).join('') +
            '</tbody></table>';
    }
    return html;
}
function fmtGap(v, fmt) {
    if (fmt === rpPct) return (v >= 0 ? '+' : '') + rpPct(v);
    var s = fmt(v);
    return v >= 0 ? '+' + s : s;
}

// ═══ Tab 纪律(disc)：交易计划卡 / 偏离单 / 校准 / 封存盲核 / 判例档案（JH4_spec §8/§9）═══

function intDirChange() {
    var box = document.getElementById('intStopRow');
    if (box) box.style.display = document.getElementById('intDir').value === 'stop_change' ? '' : 'none';
}

async function postRaw(url, body) {
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    let j = null;
    try { j = await resp.json(); } catch (e) {}
    return { status: resp.status, j: j || {} };
}

async function discSubmitIntent() {
    var body = {
        code: (document.getElementById('intCode').value || '').trim(),
        direction: document.getElementById('intDir').value,
        qty: Number(document.getElementById('intQty').value) || 0,
        price: Number(document.getElementById('intPrice').value) || 0,
        tier: document.getElementById('intTier').value,
        intent_reason: (document.getElementById('intReason').value || '').trim(),
    };
    if (!body.code) { showToast('代码必填', 'warning'); return; }
    if (body.direction === 'stop_change') {
        body.stop_old = Number(document.getElementById('intStopOld').value) || null;
        body.stop_new = Number(document.getElementById('intStopNew').value) || null;
    }
    var box = document.getElementById('discIntentResult');
    var out = await postRaw(API + '/deviation', body);
    var d = out.j.data || {};
    if (out.status === 200 && d.is_deviation === false) {
        box.innerHTML = '<div class="rp-intent-res ok">计划内' +
            (d.exempt ? '（降风险出场 · 全豁免，无延迟）' : '') + '：' + rpEsc(d.action_class) +
            '，可直接执行。已登记留痕。</div>';
        loadDiscPending();
        return;
    }
    if (out.status === 200 && d.is_deviation) {
        box.innerHTML = '<div class="rp-intent-res dev">判定为偏离单（命中 ' + rpEsc((d.rules || []).join('/')) + '）。' +
            '放行：' + rpEsc(d.release_at || '') + ' · 逾期失效：' + rpEsc(d.expire_at || '') + '。已在下方列表倒计时。' +
            (d.required_seal ? '<br>本单属高风险（' + rpEsc((d.seal_triggers || []).join('/')) + '），执行前须先有封存件。' : '') + '</div>';
        loadDiscPending();
        return;
    }
    if (out.j.error_code === 'SEAL_REQUIRED' || (out.j.message || '').indexOf('先封存') >= 0) {
        box.innerHTML = discSealMiniFormHtml({ code: body.code, qty: body.qty, ref_price: body.price, action: body.direction, triggers: d.seal_triggers || out.j.seal_triggers });
        return;
    }
    box.innerHTML = '<div class="rp-intent-res err">' + rpEsc(out.j.error || out.j.message || ('提交失败 HTTP ' + out.status)) + '</div>';
}

function discSealMiniFormHtml(ctx) {

function _discStartTick() {
    timerManager.setInterval('disc-tick', function () {
        document.querySelectorAll('#discPendingBody [data-release]').forEach(function (el) {
            var rel = rpLocalDate(el.getAttribute('data-release'));
            var exp = rpLocalDate(el.getAttribute('data-expire'));
            if (!el.getAttribute('data-release') || isNaN(rel.getTime())) { el.textContent = ''; return; }
            if (Date.now() < rel.getTime()) el.textContent = '距放行 ' + rpCountdownText(rel);
            else if (exp && Date.now() > exp.getTime()) { el.textContent = '已过失效时点（以服务端为准）'; el.classList.add('over'); }
            else el.textContent = '已放行 · ' + rpCountdownText(exp) + '后失效';
        });
    }, 1000);
}

function pfAnchorKindChange(sel) {
    var row = sel.closest('.pf-anchor');
    var ind = row.querySelector('.pf-ind');
    var thr = row.querySelector('.pf-thr');
    ind.style.display = sel.value === 'indicator_below' ? '' : 'none';
    if (sel.value === 'drawdown_from_peak' || sel.value === 'giveback_from_peak' || sel.value === 'drawdown_from_entry') {
        thr.placeholder = '负小数，如 -0.12'; thr.value = '';
    } else if (sel.value === 'deadline') {
        thr.placeholder = '到期日 YYYYMMDD 数字';
    } else if (sel.value === 'unlock_event') {
        thr.placeholder = '解禁/减持比例，如 0.05';
    } else {
        thr.placeholder = '数字阈值（必填）';
    }

async function discSubmitPlan() {
    var g = function (id) { return document.getElementById(id); };
    var anchors = [];
    document.querySelectorAll('.pf-anchor').forEach(function (row) {
        var kind = row.querySelector('.pf-kind').value;
        var thrRaw = (row.querySelector('.pf-thr').value || '').trim();
        var thr = Number(thrRaw);
        if (!thrRaw || isNaN(thr)) return;   // 无数字锚直接不收（R3 前端镜像）
        var a = { anchor_kind: kind, threshold_num: thr };
        if (kind === 'indicator_below') a.indicator = row.querySelector('.pf-ind').value;
        anchors.push(a);
    });
    if (!anchors.length) { showToast('至少一条带数字的失效锚（ANCHOR_NO_NUMBER）', 'error'); return; }
    var thesis = (g('pfThesis').value || '').trim();
    if (thesis.length < 15 || thesis.length > 500) { showToast('thesis 需 15~500 字', 'warning'); return; }
    var conf = Number(g('pfConf').value);
    if (!(conf >= 0.05 && conf <= 0.95)) { showToast('信心度限 0.05~0.95（1.0 视为未填写）', 'warning'); return; }
    var maxBuy = Number(g('pfMaxBuy').value);
    if (!(maxBuy > 0)) { showToast('追价上限必填且 >0（偏离判定 D3 用）', 'warning'); return; }
    var risk = {};
    if (g('pfStop').value !== '') risk.stop_loss_pct = Number(g('pfStop').value) / 100;
    if (g('pfTrail').value !== '') risk.trailing_pct = Number(g('pfTrail').value) / 100;
    if (g('pfMaxHold').value !== '') risk.max_hold_days = Number(g('pfMaxHold').value);
    var body = {
        code: (g('pfCode').value || '').trim(),
        thesis: thesis,
        entry_trigger: { max_buy_price: maxBuy },
        anchors: anchors,
        expected_return_pct: Number(g('pfExpRet').value) / 100,
        expected_horizon_days: Number(g('pfExpDays').value),
        confidence: conf,
        position_pct: Number(g('pfPosPct').value) / 100,
        risk_params: risk,
    };
    try {
        await rpJsonPost('disc-plan-new', API + '/plan', body);
        showToast('计划卡已存（原件 append-only，修订=新 revision）', 'success');
        closeModal();
        loadDiscPlans('alive');
    } catch (e) {
        showToast('建卡被拒：' + (e.message || e), 'error');
    }
}

        '<div class="rp-sec"><h4>当时封存的原话</h4>' +

        '<div class="rp-kv"><span>预期：<b>' + rpPct(sealed.expected_return_pct) + '</b></span>' +
        '<span>信心：<b>' + rpEsc(sealed.confidence) + '</b></span>' +
        '<span>最坏情形：<b>' + rpPct(sealed.worst_case_pct) + '</b></span></div>' +
        '<div class="rp-text"><b>反证（当时的你写的「可能错在哪」）：</b>' + rpEsc(sealed.falsifier || '--') + '</div></div>' +
        '<div class="rp-sec"><h4>对照结果</h4><div class="rp-stats">' +
        '<span class="rp-stat-chip"><b>记忆偏差 gap_expected</b> ' + (cmp.gap_expected != null ? rpSigned(cmp.gap_expected, rpPct(cmp.gap_expected)) : '--') + '</span>' +
        '<span class="rp-stat-chip"><b>信心命中</b> ' + (cmp.confidence_hit != null ? (cmp.confidence_hit ? '命中' : '未命中') : '--') + '</span>' +
        '<span class="rp-stat-chip"><b>最坏情形成真</b> ' + (cmp.worst_case_hit != null ? (cmp.worst_case_hit ? '是' : '否') : '--') + '</span>' +
        '<span class="rp-stat-chip"><b>解释漂移度</b> ' + (cmp.explanation_diverged != null ? Number(cmp.explanation_diverged).toFixed(2) : '--') + '</span>' +
        '</div>' +
        '<div class="rp-triage-note">gap 系统性为正 = 你在事后抬地平线；worst_case_hit 为否 = 你事前想象的风险承受比真实承受轻。逐案攒着，不做曲线。</div></div>';
}

async function discBlindReveal(id) {
    rpBody('<div class="rp-loading">揭示中…</div>');
    try {
        var r2 = await rpJsonPost('l09-reveal-' + id, API + '/l09/' + id + '/reveal', {});
        rpBody(_discRevealHtml((r2 && r2.data) || {}));
        loadDiscSeal();
    } catch (e) {
        rpBody('<div class="panel-error">揭示失败：' + rpEsc(e.message || e) + '</div>');
    }
}

async function discBlindSubmit(id) {
    var rcvEl = document.querySelector('input[name=rcv]:checked');
    if (!rcvEl) { showToast('先作答是否兑现', 'warning'); return; }
    var exp = document.getElementById('blExp').value;
    var reason = (document.getElementById('blReason').value || '').trim();
    if (exp === '' || isNaN(Number(exp))) { showToast('填写你现在记得的预期收益（%）', 'warning'); return; }
    var answer = { recall_verdict: rcvEl.value, recall_expected_return_pct: Number(exp) / 100, recall_reason: reason };
    // JH4_spec §8 裁定 2：作答与揭示严格两步，无「reveal 带答案」回退——合并调用=盲核失效
    var d;
    try {
        await rpJsonPost('l09-answer-' + id, API + '/l09/' + id + '/blind', answer);
        var r2 = await rpJsonPost('l09-reveal-' + id, API + '/l09/' + id + '/reveal', {});
        d = (r2 && r2.data) || {};
    } catch (e) {
        rpBody('<div class="panel-error">盲核流程中断：' + rpEsc(e.message || e) +
            '<br>作答与揭示是两次独立提交，此处不合并重试；已作答再点提交会返回 BLIND_ALREADY_ANSWERED，直接刷新即可进入揭示。 ' +
            '<button class="btn btn-sm" onclick="discBlindStart(' + id + ')">重试</button></div>');
        return;
    }
    rpBody(_discRevealHtml(d));
    loadDiscSeal();
}

async function loadDiscCases() {
    var box = document.getElementById('discCaseBody');
    if (!box) return;
    var week = (document.getElementById('discCaseWeek') || {}).value || rpIsoWeek(new Date());
    try {
        var resp = await RequestManager.fetch('disc-cases', API + '/case-file?week=' + encodeURIComponent(week));
        var d = (resp && resp.data) || {};
        var items = d.cases || [];
        var byStatus = d.by_status || {};
        var chips = '<span class="rp-stat-chip"><b>自动过期率</b> ' + (d.auto_expire_rate != null ? rpPct(d.auto_expire_rate) : '--') + '</span>' +
            '<span class="rp-stat-chip"><b>区间单量</b> ' + rpEsc(d.ticket_count != null ? d.ticket_count : '--') + '</span>' +
            Object.keys(byStatus).map(function (k) {
                return '<span class="rp-stat-chip"><b>' + rpEsc(k) + '</b> ' + rpEsc(byStatus[k]) + '</span>';
            }).join('');
        if (!items.length) { box.innerHTML = '<div class="rp-stats">' + chips + '</div><div class="empty-state">本周无判例</div>'; return; }
        var tbl = '<table class="rp-tbl"><thead><tr><th>代码</th><th>动作</th><th>结局</th>' +
            '<th colspan="3">买了（执行后 5/10/20 日）</th><th colspan="3">拦住了（反事实 5/10/20 日）</th><th>最大逆行</th></tr></thead><tbody>' +
            items.map(function (it) {
                // JH4_spec §7.1：新表收益/回撤/比例一律带符号小数，统一 ×100 显示
                var bought = ['exec_ret_5', 'exec_ret_10', 'exec_ret_20'].map(function (k) { return '<td>' + rpPct(it[k]) + '</td>'; }).join('');
                var blocked = ['counterfactual_ret_5', 'counterfactual_ret_10', 'counterfactual_ret_20'].map(function (k) { return '<td>' + rpPct(it[k]) + '</td>'; }).join('');
                return '<tr><td>' + rpEsc(it.code) + '</td><td>' + rpEsc(it.action || '') + '</td><td>' + rpEsc(it.outcome || '') + '</td>' +
                    bought + blocked + '<td>' + rpPct(it.worst_adverse_ret) + '</td></tr>';
            }).join('') + '</tbody></table>';
        box.innerHTML = '<div class="rp-stats">' + chips + '</div>' + tbl +
            '<div class="rp-triage-note">两列并看：拦住的多数是涨是跌 → 装置在创造价值还是只造摩擦。季度回看，别用一周样本下结论。</div>';
    } catch (e) {
        box.innerHTML = '<div class="panel-error">判例加载失败（/api/case-file 未就绪？）<button class="btn btn-sm" onclick="loadDiscCases()">重试</button></div>';
    }
}

// ─── Init ───
resolveKlinePalette();  // 图表配色一次性初始化（浅色定版后 token 静态，无主题切换重建链路）
loadTab('home');
</script>

<script>
// ─── Tab 4: 系统维护 ───
async function loadMaintenanceTab(c) {
    c.innerHTML = `
    <div class="page" style="padding:20px;">
        <div class="panel" style="margin-bottom:20px;">
        <div class="panel-header"><h3>系统维护 · 数据修正</h3></div>
        
        <!-- 全量历史修正 -->
        <div style="background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:20px;">
            <h3 style="margin:0 0 16px 0; font-size:var(--fs-4); color:var(--text-primary);">全量历史数据修正</h3>
            <p style="color:var(--text-secondary); font-size:var(--fs-3); margin:0 0 16px 0; line-height:1.6;">
                从东方财富和腾讯双数据源重新拉取全量历史K线数据，检测并修正确价格偏差、成交量缺失、OHLC关系错误等问题。<br>
                <strong>耗时预估：</strong>5000+只股票约需2-3小时（2线程，1秒限速）。
            </p>
            
            <!-- 定时任务设置 -->
            <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:16px;">
                <h4 style="margin:0 0 12px 0; font-size:var(--fs-3); color:var(--text-primary);">定时任务设置</h4>
                <div style="display:flex; gap:12px; align-items:end; margin-bottom:12px;">
                    <div style="flex:1;">
                        <label style="display:block; font-size:var(--fs-2); color:var(--text-secondary); margin-bottom:4px;">执行时间</label>
                        <input type="time" id="scheduleTime" value="10:00" class="field-block">
                    </div>
                    <div style="flex:1;">
                        <label style="display:block; font-size:var(--fs-2); color:var(--text-secondary); margin-bottom:4px;">数据源</label>
                        <select id="scheduleSource" class="field-block">
                            <option value="tx">腾讯 (稳定)</option>
                            <option value="em">东方财富 (偶尔反爬)</option>
                            <option value="both">双源交叉验证</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label style="display:block; font-size:var(--fs-2); color:var(--text-secondary); margin-bottom:4px;">并发数</label>
                        <input type="number" id="scheduleThreads" value="2" min="1" max="8" class="field-block">
                    </div>
                    <div style="flex:1;">
                        <label style="display:block; font-size:var(--fs-2); color:var(--text-secondary); margin-bottom:4px;">限速 (秒/只)</label>
                        <input type="number" id="scheduleRateLimit" value="1.0" min="0.1" max="10" step="0.1" class="field-block">
                    </div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-primary" onclick="scheduleFixHistory()" style="max-width:280px; padding:10px 16px;">
                        添加定时任务
                    </button>
                    <button class="btn" onclick="loadScheduledJobs()" style="padding:10px 16px;">
                        刷新列表
                    </button>
                </div>
            </div>
            
            <!-- 定时任务列表 -->
            <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:16px;">
                <h4 style="margin:0 0 12px 0; font-size:var(--fs-3); color:var(--text-primary);">定时任务列表</h4>
                <div id="scheduledJobsList" style="color:var(--text-secondary); font-size:var(--fs-3);">加载中...</div>
            </div>
            
            <!-- 立即执行 -->
            <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px; padding:16px;">
                <h4 style="margin:0 0 12px 0; font-size:var(--fs-3); color:var(--text-primary);">立即执行</h4>
                <p style="color:var(--text-secondary); font-size:var(--fs-2); margin:0 0 12px 0;">
                    立即启动全量历史修正（不定时），任务将在后台运行。
                </p>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-danger" onclick="runFixHistoryNow(false)" style="max-width:280px; padding:10px 16px;">
                        立即执行 (实际修正)
                    </button>
                    <button class="btn btn-primary" onclick="runFixHistoryNow(true)" style="max-width:280px; padding:10px 16px;">
                        试运行 (只检测)
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 任务进度 -->
        <div id="fixHistoryProgress" style="background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:20px; display:none;">
            <h3 style="margin:0 0 12px 0; font-size:var(--fs-4); color:var(--text-primary);">任务进度</h3>
            <div id="fixHistoryProgressContent" style="color:var(--text-secondary); font-size:var(--fs-3);"></div>
        </div>
        </div><!-- /panel 系统维护 -->
    </div>
    `;
    
    // 加载定时任务列表
    await loadScheduledJobs();
}

async function scheduleFixHistory() {
    const time = document.getElementById('scheduleTime').value;
    const source = document.getElementById('scheduleSource').value;
    const threads = parseInt(document.getElementById('scheduleThreads').value);
    const rateLimit = parseFloat(document.getElementById('scheduleRateLimit').value);
    
    try {
        const data = await RequestManager.fetch(
            'fh-schedule-add', API + '/sync/fix-history/schedule', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({time, source, threads, rate_limit: rateLimit})
        });
        if (data.success) {
            showToast(data.data.message, 'success');
            await loadScheduledJobs();
        } else {
            showToast(data.message || '添加定时任务失败', 'error');
        }
    } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
    }
}

async function loadScheduledJobs() {
    try {
        const data = await RequestManager.fetch(
            'fh-schedule-list', API + '/sync/fix-history/schedule');
        const jobs = (data.data && data.data.jobs) || [];
        const container = document.getElementById('scheduledJobsList');
        
        if (!jobs.length) {
            container.innerHTML = '<div style="color:var(--text-muted);">暂无定时任务</div>';
            return;
        }
        
        container.innerHTML = jobs.map(job => `
            <div style="background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-sm); padding:12px; margin-bottom:8px;">
                <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:8px;">
                    <div>
                        <div style="font-size:var(--fs-3); font-weight:500; color:var(--text-primary);">每天 ${job.time}</div>
                        <div style="font-size:var(--fs-2); color:var(--text-secondary); margin-top:4px;">
                            数据源: ${job.source === 'tx' ? '腾讯' : job.source === 'em' ? '东方财富' : '双源交叉'} · 
                            并发: ${job.threads} · 限速: ${job.rate_limit}s
                        </div>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="cancelScheduledJob('${job.id}')">
                        取消
                    </button>
                </div>
                ${job.last_run ? `
                    <div style="font-size:var(--fs-1); color:var(--text-muted); border-top:1px solid var(--border); padding-top:8px; margin-top:8px;">
                        上次执行: ${job.last_run} · 
                        状态: <span style="color:${job.last_status === 'success' ? 'var(--success)' : 'var(--danger)'}">${job.last_status === 'success' ? '成功' : '失败'}</span>
                        ${job.last_error ? `<br>错误: ${job.last_error}` : ''}
                    </div>
                ` : ''}
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('scheduledJobsList').innerHTML = 
            '<div style="color:var(--danger);">加载失败: ' + e.message + '</div>';
    }
}

async function cancelScheduledJob(jobId) {
    if (!confirm('确定要取消这个定时任务吗？')) return;
    
    try {
        const data = await RequestManager.fetch(
            'fh-schedule-del-' + jobId,
            API + '/sync/fix-history/schedule/' + jobId, {method: 'DELETE'});
        if (data.success) {
            showToast('定时任务已取消', 'success');
            await loadScheduledJobs();
        } else {
            showToast(data.message || '取消失败', 'error');
        }
    } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
    }
}

async function runFixHistoryNow(dryRun) {
    const source = document.getElementById('scheduleSource').value;
    const threads = parseInt(document.getElementById('scheduleThreads').value);
    const rateLimit = parseFloat(document.getElementById('scheduleRateLimit').value);
    
    const mode = dryRun ? '试运行' : '实际修正';
    if (!confirm(`确定要立即执行全量历史修正（${mode}）吗？\n\n任务将在后台运行，预计耗时2-3小时。`)) return;
    
    try {
        const data = await RequestManager.fetch('fh-run', API + '/sync/fix-history/run', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({source, threads, rate_limit: rateLimit, dry_run: dryRun})
        });
        if (data.success) {
            showToast(data.data.message, 'success');
            // 显示进度面板
            document.getElementById('fixHistoryProgress').style.display = 'block';
            pollFixHistoryProgress(data.data.task_id);
        } else {
            showToast(data.message || '启动任务失败', 'error');
        }
    } catch (e) {
        showToast('请求失败: ' + e.message, 'error');
    }
}

// 轮询登记 timerManager（key='fixHistoryPoll'），切页自动停；旧实现单轮请求异常时
// 仅展示"轮询失败"并继续，status 缺失才终止，这里保持同一语义。
async function pollFixHistoryProgress(taskId) {
    const content = document.getElementById('fixHistoryProgressContent');

    const poll = async () => {
        try {
            const data = await RequestManager.fetch(
                'fh-status-' + taskId, API + '/sync/status/' + taskId);
            const status = data.data;

            if (!status) {
                content.innerHTML = '<div style="color:var(--warning);">任务状态查询失败</div>';
                timerManager.clear('fixHistoryPoll');
                return;
            }

            const statusText = status.status === 'running' ? '运行中' :
                             status.status === 'completed' ? '已完成' :
                             status.status === 'failed' ? '失败' : status.status;

            content.innerHTML = `
                <div style="margin-bottom:12px;">
                    <strong>状态:</strong> <span style="color:${status.status === 'running' ? 'var(--accent)' : status.status === 'completed' ? 'var(--success)' : 'var(--danger)'}">${statusText}</span>
                </div>
                ${status.progress ? `
                    <div style="margin-bottom:8px;">
                        <strong>进度:</strong> ${status.progress.current || 0} / ${status.progress.total || '?'}
                        (${status.progress.success || 0} 成功, ${status.progress.failed || 0} 失败)
                    </div>
                ` : ''}
                ${status.message ? `<div style="margin-bottom:8px;"><strong>消息:</strong> ${status.message}</div>` : ''}
                ${status.error ? `<div style="color:var(--danger);"><strong>错误:</strong> ${status.error}</div>` : ''}
            `;

            if (status.status === 'completed' || status.status === 'failed') {
                timerManager.clear('fixHistoryPoll');
                showToast(`全量历史修正${status.status === 'completed' ? '完成' : '失败'}`,
                         status.status === 'completed' ? 'success' : 'error');
            }
        } catch (e) {
            content.innerHTML = '<div style="color:var(--danger);">轮询失败: ' + e.message + '</div>';
        }
    };

    timerManager.poll('fixHistoryPoll', poll, 3000, true); // 立即一次，之后每 3 秒
}
</script>
