    <style id="stockDeepCss">
        .sd-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .sd-search{flex:1;min-width:220px;max-width:420px;padding:8px 12px;background:var(--bg);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;font-size:13px}

        .sd-count{font-size:12px;color:var(--text-secondary);font-family:var(--font-mono)}
        .sd-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .sd-chip{cursor:pointer;padding:4px 10px;font-size:12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;color:var(--text-secondary)}
        .sd-chip:hover{border-color:var(--accent);color:var(--text-primary)}

        .sd-chip-del{margin-left:6px;background:transparent;border:none;color:var(--text-muted);font-size:14px;line-height:1;cursor:pointer;padding:0 2px}
        .sd-chip-del:hover{color:var(--danger)}
        .sd-chips-empty{font-size:12px;color:var(--text-muted)}
        .sd-market-title{font-size:13px;font-weight:600;color:var(--text-primary);margin:10px 0 8px;display:flex;align-items:center;gap:6px}
        .sd-market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        @media(max-width:1280px){.sd-market-grid{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:900px){.sd-market-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:560px){.sd-market-grid{grid-template-columns:1fr}}
        .sd-market-card{cursor:pointer;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 11px;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:5px;min-height:108px}
        .sd-market-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.18)}
        .sd-market-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px}
        .sd-market-name{font-size:13px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
        .sd-market-meta{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
        .sd-market-prices{display:flex;gap:3px 8px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);line-height:1.6}
        .sd-market-prices b{color:var(--text-muted);font-weight:500;margin-right:2px;font-family:inherit}
        .sd-market-prices .sd-price-entry{color:var(--accent);font-weight:600}
        .sd-market-reasons{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}

        .sd-market-empty-col{grid-column:1/-1;text-align:center;padding:30px 14px;color:var(--text-muted);font-size:12px}
        .sd-scan-progress{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}

        .sd-scan-progress .msg{font-size:11px;color:var(--text-muted);margin-top:5px}
        .sd-summary{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:14px}
        .sd-metric{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:120px}
        .sd-metric .lbl{font-size:10px;color:var(--text-muted);letter-spacing:.04em}

        .sd-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

        .sd-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px}

    </style>

<body>
<div class="scanline"></div>

<header class="header">
    <div class="header-brand">

<!-- 全局同步进度条（所有 tab 共用） -->
<div id="syncProgress" style="display:none; margin: 12px 20px; padding: 12px 16px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:6px;">

<div class="kline-overlay" id="klinePanel" onclick="if(event.target===this)closeKline()">

        <!-- 副图指标切换按钮 -->
        <div class="indicator-bar" id="indicatorBar">
            <button class="indicator-btn active" data-indicator="vol" onclick="toggleIndicator('vol')">成交量</button>
            <button class="indicator-btn" data-indicator="macd" onclick="toggleIndicator('macd')">MACD</button>

<div class="kline-overlay" id="sdDeepPanel" onclick="if(event.target===this)closeSdDeep()">

        <div id="sdDeepBody"></div>

        <div id="sdDeepIndicators" style="display:none"></div>

<script>
const API = '/api';
let currentTab = 'home';

// ─── 主题系统（Theme System） ───
const THEMES = [
    { id: 'gold',    label: '暖金 · 同花顺' },
    { id: 'cyan',    label: '科技青 · 原主题' },
    { id: 'emerald', label: '翡翠绿 · 护眼' },
    { id: 'violet',  label: '紫罗兰 · 极光' },
    { id: 'blue',    label: '深蓝 · 专业' },
    { id: 'light',   label: '浅色 · 亮白' }
];

// 读取 CSS 变量（ECharts canvas 无法解析 var()，需在 JS 侧取值）
function cssVar(name, fallback) {
    var v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) {}
    return v || fallback;
}

function setTheme(id) {
    if (!THEMES.some(function(t) { return t.id === id; })) id = 'gold';
    document.documentElement.setAttribute('data-theme', id);
    try { localStorage.setItem('aiq_theme', id); } catch (e) {}
    var sel = document.getElementById('themeSelect');
    if (sel) sel.value = id;
    resolveKlinePalette();
    if (window._klineCache) renderKlineWithIndicators(window._klineCache);
}

function initThemeSwitcher() {
    var sel = document.getElementById('themeSelect');
    if (sel) {
        sel.innerHTML = THEMES.map(function(t) {
            return '<option value="' + t.id + '">' + t.label + '</option>';
        }).join('');
    }
    var cur = 'gold';
    try { cur = localStorage.getItem('aiq_theme') || 'gold'; } catch (e) {}
    if (!THEMES.some(function(t) { return t.id === cur; })) cur = 'gold';
    document.documentElement.setAttribute('data-theme', cur);
    if (sel) sel.value = cur;
}

// ─── Toast notification system ───
var Toast = {
    container: null,

    init: function() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
    },

    show: function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        this.init();
        var icons = { success: '&#x2713;', error: '&#x2717;', warning: '&#x26A0;', info: '&#x2139;' };
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span> <span>' + message + '</span>';
        this.container.appendChild(toast);
        var self = this;
        requestAnimationFrame(function() { toast.classList.add('show'); });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }
};

function showToast(message, type) { Toast.show(message, type); }

// ─── Skeleton loading ───
function showSkeleton(container, rowCount) {
    rowCount = rowCount || 10;
    var cols = ['w80', 'w120', 'w200', 'w80', 'w120'];
    var html = '';
    for (var i = 0; i < rowCount; i++) {
        html += '<div class="skeleton-row">';
        for (var j = 0; j < cols.length; j++) {
            html += '<div class="skeleton-cell ' + cols[j] + ' skeleton"></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

async function fetchJSON(url, opts) {
    opts = opts || {};
    const resp = await fetch(url, opts);
    if (!resp.ok) {
        // 优先透传后端 JSON 里的中文错误信息（fail() 返回 {error: "..."}），
        // 否则只能看到 statusText（如 409 -> "CONFLICT"）
        let msg = '';
        try { const j = await resp.json(); msg = (j && j.error) || ''; } catch (e) {}
        throw new Error(msg || resp.statusText || ('HTTP ' + resp.status));
    }
    return resp.json();
}

// ─── Request manager (AbortController-based cancellation) ───
var RequestManager = {
    controllers: {},

    fetch: function(key, url, opts) {
        this.cancel(key);
        var ctrl = new AbortController();
        this.controllers[key] = ctrl;
        opts = opts || {};
        opts.signal = ctrl.signal;
        var self = this;
        return fetchJSON(url, opts).then(function(data) {
            delete self.controllers[key];
            return data;
        }).catch(function(e) {
            delete self.controllers[key];
            throw e;
        });
    },

    cancel: function(key) {
        if (this.controllers[key]) {
            this.controllers[key].abort();
            delete this.controllers[key];
        }
    },

    cancelAll: function() {
        var self = this;
        Object.keys(this.controllers).forEach(function(k) {
            self.controllers[k].abort();
        });
        this.controllers = {};
    }
};

// ─── Tab state cache (5-min validity) ───
var TabState = {
    states: {},
    MAX_AGE: 5 * 60 * 1000,

    save: function(tab) {
        var content = document.getElementById('content');
        var scrollEl = document.querySelector('.content');
        this.states[tab] = {
            html: content ? content.innerHTML : '',
            scrollTop: scrollEl ? scrollEl.scrollTop : 0,
            ts: Date.now()
        };
    },

    load: function(tab) {
        var s = this.states[tab];
        if (s && Date.now() - s.ts < this.MAX_AGE) return s;
        delete this.states[tab];
        return null;
    }
};

// ─── ECharts instance manager ───
var ChartManager = {
    instances: {},

    get: function(key, dom) {
        if (this.instances[key]) {
            var inst = this.instances[key];
            if (inst.getDom && inst.getDom() === dom) return inst;
            this.dispose(key);
        }
        var inst = echarts.init(dom);
        this.instances[key] = inst;
        return inst;
    },

    dispose: function(key) {
        if (this.instances[key]) {
            this.instances[key].dispose();
            delete this.instances[key];
        }
    },

    disposeAll: function() {
        var self = this;
        Object.keys(this.instances).forEach(function(k) { self.dispose(k); });
    }
};

window.addEventListener('beforeunload', function() { ChartManager.disposeAll(); });

// ─── Timer manager for centralized cleanup ───
var timerManager = {
    timers: {},

    setInterval: function(key, fn, delay) {
        this.clear(key);
        this.timers[key] = setInterval(fn, delay);
    },

    setTimeout: function(key, fn, delay) {
        this.clear(key);
        var self = this;
        this.timers[key] = setTimeout(function() { fn(); delete self.timers[key]; }, delay);
    },

    clear: function(key) {
        if (this.timers[key] != null) {
            clearInterval(this.timers[key]);
            clearTimeout(this.timers[key]);
            delete this.timers[key];
        }
    },

    clearAll: function() {
        var self = this;
        Object.keys(this.timers).forEach(function(k) {
            clearInterval(self.timers[k]);
            clearTimeout(self.timers[k]);
        });
        this.timers = {};
    }
};

function switchTab(tab) {
    RequestManager.cancelAll();
    timerManager.clearAll();

    // 保存当前 tab 状态（包括 scores tab 的日期选择）
    if (currentTab) {
        TabState.save(currentTab);
    }

    currentTab = tab;

    // Update nav active
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) { navItems[i].classList.remove('active'); }
    var btn = document.querySelector('.nav-item[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');

    // Try cached state
    var cached = TabState.load(tab);
    if (cached) {
        document.getElementById('content').innerHTML = cached.html;
        var scrollEl = document.querySelector('.content');
        if (scrollEl) scrollEl.scrollTop = cached.scrollTop;
        if (tab === 'home') restoreStockDeep();   // cache 恢复时重绘个股深度图表
        return;
    }

    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    showSkeleton(c, 10);
    try {
        if (tab === 'home') await loadHomeTab(c);
        else if (tab === 'maintenance') await loadMaintenanceTab(c);

        c.firstElementChild?.classList.add('tab-content');
    } catch(e) {
        showToast('加载失败，请重试', 'error');
        c.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败: ' + e.message + '</div>';
    }
}

// 三周期分组定义（与后端 horizon 一致）
const HORIZON_GROUPS = [
    { key: 'short', label: '短线', desc: '1~10 交易日' },
    { key: 'mid',   label: '中线', desc: '10~60 交易日' },
    { key: 'long',  label: '长线', desc: '60+ 交易日' },
];
const HORIZON_LABEL = { short: '短线', mid: '中线', long: '长线' };

// ─── 融合分归因：5 因子标签（各 0-10）+ sparkline + 详情弹窗 ───
const FACTOR_LABELS = [
    ['vol_score', '量能'],
    ['ma_score', '均线'],
    ['diverge_score', '量价背离'],
    ['bottom_score', '超跌反弹'],
    ['whale_score', '主力筹码'],
];

// 输入数值数组，返回内联 SVG 迷你走势图（约 64x20）。A股配色：末>首红涨、末<首绿跌。
function renderSparkline(values) {
    var vals = (values || []).filter(function(v) { return v != null && !isNaN(v); });
    var W = 64, H = 20, pad = 2;
    if (vals.length < 2) {
        return '<svg class="spark-svg" width="' + W + '" height="' + H + '">' +
            '<line x1="' + pad + '" y1="' + (H/2) + '" x2="' + (W-pad) + '" y2="' + (H/2) +
            '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2,2"/></svg>';
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var n = vals.length;
    var pts = vals.map(function(v, i) {
        var x = pad + (W - 2*pad) * (i / (n - 1));
        var y = pad + (H - 2*pad) * (1 - (v - min) / span);
        return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var last = vals[n-1], first = vals[0];
    var color = last > first ? 'var(--danger)' : (last < first ? 'var(--success)' : 'var(--text-muted)');
    return '<svg class="spark-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + pts + '"/></svg>';
}

// 批量拉取多只股票的近 days 日融合分序列，填充对应 sparkline 占位。
async function fillSparklines(codes, days, idPrefix) {
    var list = (codes || []).filter(Boolean);
    if (!list.length) return;
    try {
        var resp = await RequestManager.fetch('spark-' + idPrefix, API +
            '/investor/factor_trend?codes=' + encodeURIComponent(list.join(',')) + '&days=' + (days || 7));
        var data = resp.data || {};
        list.forEach(function(code) {
            var el = document.getElementById(idPrefix + code);
            if (!el) return;
            var rows = data[code] || [];
            el.innerHTML = renderSparkline(rows.map(function(r) { return r.fusion_score; }));
        });
    } catch(e) {}
}

// 点击分数/名称 → 融合分详情弹窗：5 因子读数条 + 30 日 fusion_score 折线
async function showFactorDetail(code, name) {
    var rows = [];
    try {
        var resp = await RequestManager.fetch('factor-detail-' + code, API +
            '/investor/factor_trend?codes=' + encodeURIComponent(code) + '&days=30');
        rows = (resp.data || {})[code] || [];
    } catch(e) {}

    if (!rows.length) {
        showModal((name || code) + ' 融合分详情',
            '<div class="empty-state">暂无融合分数据</div>', 'min(620px, 92vw)');
        return;
    }

    var last = rows[rows.length - 1];
    var bars = FACTOR_LABELS.map(function(pair) {
        var key = pair[0], lbl = pair[1];
        var v = last[key] != null ? last[key] : 0;
        var pct = Math.max(0, Math.min(100, (v / 10) * 100));
        return '<div class="factor-bar-row">' +
            '<span class="factor-bar-lbl">' + lbl + '</span>' +
            '<span class="factor-bar-track"><span class="factor-bar-fill" style="width:' + pct.toFixed(0) + '%"></span></span>' +
            '<span class="factor-bar-val">' + (v != null ? v.toFixed(1) : '--') + '</span>' +
            '</div>';
    }).join('');

    var body = '<div class="factor-detail">' +
        '<div class="factor-detail-head">最新融合分 <b>' + (last.fusion_score != null ? last.fusion_score.toFixed(1) : '--') + '</b> / 50</div>' +
        '<div class="factor-bars">' + bars + '</div>' +
        '<div id="factorTrendChart" style="width:100%;height:280px;margin-top:12px;"></div>' +
        '</div>';
    showModal((name || code) + ' 融合分详情', body, 'min(620px, 92vw)');

    var dates = rows.map(function(r) { return r.trade_date; });
    var series = rows.map(function(r) { return r.fusion_score; });
    var inst = ChartManager.get('factorTrend', document.getElementById('factorTrendChart'));
    inst.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 40, right: 20, top: 20, bottom: 50 },
        xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10 } },
        yAxis: { type: 'value', name: '融合分', min: 0, max: 50 },
        series: [{ name: '融合分', type: 'line', smooth: true, data: series, areaStyle: {} }],
    });
    if (!window._factorTrendResizeBound) {
        window._factorTrendResizeBound = true;
        window.addEventListener('resize', function() {
            var i = ChartManager.instances['factorTrend'];
            if (i) i.resize();
        });
    }
}

async function loadTodayPicks(isFallback) {
    const box = document.getElementById('todayPicks');
    const dateEl = document.getElementById('pickDate');
    const dateParam = dateEl && dateEl.value ? '&date=' + dateEl.value : '';
    try {
        const resp = await RequestManager.fetch('today', API + '/investor/today?limit=4' + dateParam);
        const data = (resp && resp.data) || {};
        const serverDate = data.date;
        // 自动回填日期（首次加载时）
        if (dateEl && !dateEl.value && serverDate) {
            dateEl.value = serverDate;
        }
        // 三周期分组（兼容旧结构：无 groups 时 items 视为短线组）
        const groups = data.groups || { short: data.items || [], mid: [], long: [] };
        window._todayPicks = { date: serverDate || '', groups };  // 供「一键复制」按钮使用
        const total = HORIZON_GROUPS.reduce((sum, g) => sum + ((groups[g.key] || []).length), 0);
        if (total === 0) {
            window._todayPicks = null;
            // 选中日期无推荐但可能存在更早的可用数据 → 回退到最新数据日重试一次
            if (dateEl && dateEl.value && !isFallback) {
                const picked = dateEl.value;
                dateEl.value = '';  // 清空后再查将返回最新数据日
                showToast('所选日期 ' + picked + ' 无推荐，已切换到最新数据日', 'info', 3000);
                return loadTodayPicks(true);
            }
            box.innerHTML = '<div class="empty-state">暂无推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到「高级筛选」跑一遍打分</span></div>';
            return;
        }
        box.innerHTML = HORIZON_GROUPS.map(g => renderPickGroup(g, groups[g.key] || [])).join('');
        // 出场跟踪嵌入到对应周期小板块底下（与 pickDate 无关——出场跟踪是「7月20日起累计」，
        // 切换推荐日期不影响出场统计，故只拉一次缓存到 _exitTrackData）
        try {
            if (!window._exitTrackData) {
                const er = await RequestManager.fetch('exitTrack', API + '/investor/exit_advice');
                window._exitTrackData = (er && er.data) || {};
            }
            HORIZON_GROUPS.forEach(g => renderPickExitEmbed(g.key, window._exitTrackData));
        } catch (e) { /* 出场跟踪嵌入失败不阻断推荐展示 */ }
    } catch(e) {
        if (box) box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 出场跟踪嵌入：找到对应 hz 的 .pick-exit-mount，把迷你版渲染进去
function renderPickExitEmbed(hz, d) {
    var mount = document.querySelector('#todayPicks .pick-group[data-hz="' + hz + '"] .pick-exit-mount');
    if (!mount) return;
    d = d || {};
    var groups = d.groups || {};
    var perf = d.perf || (d.summary && d.summary.perf) || {};
    var list = groups[hz] || [];
    if (!list.length) {
        mount.innerHTML = '<div class="pick-exit-empty">该周期暂无出场跟踪记录（短线 ≤10 日 / 中线 ≤60 日 / 长线不限）</div>';
        return;
    }
    mount.innerHTML = renderPickExitMini(hz, list, perf);
}

// 紧凑版出场跟踪（嵌入到推荐小板块底部）
function renderPickExitMini(hz, list, perf) {
    var held = list.filter(function (it) { return it.status === 'hold'; }).length;
    var cleared = list.length - held;
    var expanded = !!EXIT_EXPANDED[hz];
    var meta = EXIT_HORIZON_META[hz] || { icon: '📊', label: hz };
    return '<div class="pick-exit-mini">' +
        '<div class="pick-exit-head">' +
            '<span class="pick-exit-title">📊 出场跟踪 · ' + meta.label + '（7月20日起累计）</span>' +
            '<span class="hz-spacer"></span>' +
            '<span class="pick-exit-chips">' + exitStatChip(hz, perf) +
                '<span class="exit-group-stat">持有 ' + held + '</span>' +
                '<span class="exit-group-stat">已卖出 ' + cleared + '</span>' +
            '</span>' +
            '<button class="pick-detail-btn pick-exit-toggle' + (expanded ? ' active' : '') + '"' +
                    ' onclick="togglePickExit(\'' + hz + '\')"' +
                    ' title="' + (expanded ? '收起跟踪明细' : '展开该周期的详细跟踪列表') + '">' +
                (expanded ? '收起' : '详情') + '<span class="caret">▾</span>' +
            '</button>' +
        '</div>' +
        (expanded ? '<div class="pick-exit-body">' + renderExitGroupBody(list) + '</div>' : '') +
    '</div>';
}

// 切换某 hz 出场跟踪明细折叠态
function togglePickExit(hz) {
    EXIT_EXPANDED[hz] = !EXIT_EXPANDED[hz];
    saveExitExpandState(EXIT_EXPANDED);
    renderPickExitEmbed(hz, window._exitTrackData || {});
}

// ── 今日推荐三小板块：默认简略，点右上角「详情」展开完整推荐卡 ──
// 展开状态按周期记忆到 localStorage，刷新后保持
const PICK_EXPAND_KEY = 'aiq_pick_expanded';
function loadPickExpandState() {
    try {
        const obj = JSON.parse(localStorage.getItem(PICK_EXPAND_KEY) || '{}');
        return { short: !!obj.short, mid: !!obj.mid, long: !!obj.long };
    } catch(e) { return { short: false, mid: false, long: false }; }
}
function savePickExpandState(st) {
    try { localStorage.setItem(PICK_EXPAND_KEY, JSON.stringify(st)); } catch(e) {}
}
let PICK_EXPANDED = loadPickExpandState();

// 简略行：一行一只，只保留 名称/代码 + 综合分 + 买入/止盈/止损 + 盈亏比
function renderPickMiniRow(it) {
    const ap = it.action_plan || {};
    const sg = it.signal || {};
    const num = v => (v != null ? Number(v).toFixed(2) : '--');
    const pct = it.latest_pct;
    const pctHtml = pct != null
        ? ` · <span class="${pct >= 0 ? 'idx-up' : 'idx-down'}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>` : '';
    const rr = ap.risk_reward_ratio;
    const rrCls = rr == null ? '' : (rr >= 2 ? 'rr-good' : (rr >= 1 ? 'rr-ok' : 'rr-bad'));
    const rrHtml = rr != null
        ? `<span class="rr-tag ${rrCls}">${rr.toFixed(2)}</span>`
        : '<span style="color:var(--text-muted);font-size:11px">--</span>';
    const label = (sg.label || '').replace(/"/g, '');
    return `<div class="pick-mini-row" onclick="openKline('${it.code}')" title="点击查看 K 线">
        <div class="pm-stock">
            <div class="pm-name">${sg.emoji ? `<span class="pm-sig" title="${label}">${sg.emoji}</span>` : ''}${it.name || it.code}${it.strategy ? `<span class="strategy-badge">${it.strategy}</span>` : ''}</div>
            <div class="pm-code">${it.code}${pctHtml}</div>
        </div>
        <div class="pm-score">${it.fusion_score != null ? it.fusion_score : '--'}</div>
        <div class="pm-price pm-buy" title="建议买入">${num(ap.entry_price)}</div>
        <div class="pm-price pm-tp" title="止盈目标">${num(ap.take_profit)}</div>
        <div class="pm-price pm-stop" title="止损">${num(ap.stop_loss)}</div>
        <div class="pm-rr" title="盈亏比">${rrHtml}</div>
    </div>`;
}

// 小板块内容区：简略列表 / 完整推荐卡
function renderPickGroupBody(g, list) {
    if (!list.length) {
        return '<div class="empty-state" style="padding:16px;font-size:12px">该周期暂无推荐，请先在首页点「立即重算打分」</div>';
    }
    if (PICK_EXPANDED[g.key]) {
        return '<div class="action-plan-grid">' + list.map(it => renderPickCard(it)).join('') + '</div>';
    }
    return `<div class="pick-mini-list">
        <div class="pick-mini-head"><span>股票</span><span>综合分</span><span>买入</span><span>止盈</span><span>止损</span><span>盈亏比</span></div>
        ${list.map(it => renderPickMiniRow(it)).join('')}
    </div>`;
}

// 小板块整体：头部（周期标签 + 只数 + 右上「详情」按钮）+ 内容区
function renderPickGroup(g, list) {
    const has = list.length > 0;
    const expanded = has && !!PICK_EXPANDED[g.key];
    return `<div class="pick-group" data-hz="${g.key}">
        <div class="pick-group-head">
            <span class="horizon-tag hz-${g.key}">${g.label}</span>
            <span class="hz-desc">${g.desc}</span>
            <span class="pick-group-count">${list.length} 只</span>
            <span class="hz-spacer"></span>
            <button class="pick-detail-btn" ${has ? '' : 'disabled'}
                    onclick="copyPickGroup('${g.key}', this)"
                    title="只复制本板块${g.label}推荐的股票与买卖价位">📋 复制</button>
            <button class="pick-detail-btn pick-detail-toggle${expanded ? ' active' : ''}" ${has ? '' : 'disabled'}
                    onclick="togglePickDetail('${g.key}')"
                    title="${expanded ? '收起详细推荐' : '展开该周期的完整推荐信息'}">${expanded ? '收起' : '详情'}<span class="caret">▾</span></button>
        </div>
        <div class="pick-group-body">${renderPickGroupBody(g, list)}</div>
        <div class="pick-exit-mount" data-hz="${g.key}"></div>
    </div>`;
}

// ── 单板块复制：生成一个周期的推荐文本（全量复制 copyTodayPicks 也复用）──
function buildPickGroupLines(list) {
    return list.map((it, i) => {
        const ap = it.action_plan || {};
        const entry   = ap.entry_price   != null ? ap.entry_price.toFixed(2)   : '--';
        const stop    = ap.stop_loss     != null ? ap.stop_loss.toFixed(2)     : '--';
        const tp      = ap.take_profit   != null ? ap.take_profit.toFixed(2)   : '--';
        const confirm = it.confirm_trigger != null ? it.confirm_trigger.toFixed(2) : '--';
        return (i + 1) + '. ' + (it.name || it.code) + ' ' + (it.code || '') +
            '｜建议买入 ' + entry +
            '｜止盈 ' + tp +
            '｜止损 ' + stop +
            '｜突破确认 ' + confirm;
    });
}

// 复制单个板块（只复制自己周期的股票）
function copyPickGroup(key, btn) {
    const store = window._todayPicks;
    const g = HORIZON_GROUPS.find(x => x.key === key);
    if (!store || !store.groups || !g) {
        showToast('暂无推荐数据，请先重算打分', 'error');
        return;
    }
    const list = store.groups[key] || [];
    if (!list.length) {
        showToast(g.label + '暂无推荐数据', 'error');
        return;
    }
    const dateStr = store.date ? '（' + store.date + '）' : '';
    const text = '📋 今日推荐·' + g.label + dateStr + '\n' + buildPickGroupLines(list).join('\n');
    copyTextToClipboard(text, function(ok) {
        if (ok) {
            if (btn) {
                const orig = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(function() { btn.textContent = orig; }, 2000);
            }
            showToast('已复制' + g.label + '推荐 ' + list.length + ' 只', 'success');
        } else {
            showToast('复制失败，请手动复制', 'error');
        }
    });
}

// 点击「详情」：只重绘该小板块，避免整块刷新
function togglePickDetail(key) {
    PICK_EXPANDED[key] = !PICK_EXPANDED[key];
    savePickExpandState(PICK_EXPANDED);
    const store = window._todayPicks;
    if (!store || !store.groups) return;
    const g = HORIZON_GROUPS.find(x => x.key === key);
    const groupEl = document.querySelector('#todayPicks .pick-group[data-hz="' + key + '"]');
    if (!g || !groupEl) return;
    const body = groupEl.querySelector('.pick-group-body');
    const btn = groupEl.querySelector('.pick-detail-toggle');
    const list = store.groups[key] || [];
    if (body) body.innerHTML = renderPickGroupBody(g, list);
    if (btn) {
        const on = !!PICK_EXPANDED[key];
        btn.classList.toggle('active', on);
        btn.innerHTML = (on ? '收起' : '详情') + '<span class="caret">▾</span>';
        btn.title = on ? '收起详细推荐' : '展开该周期的完整推荐信息';
    }
}

// ── 次日强势观察（强势突破信号线：博弈次日涨停/大涨，独立于今日推荐）──
async function loadSurgePicks() {
    const box = document.getElementById('surgePicks');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch('surge-picks', API + '/investor/surge_picks?limit=6');
        const data = (resp && resp.data) || {};
        const items = data.items || [];
        const hint = document.getElementById('surgePicksHint');
        if (hint && data.date) {
            hint.textContent = '信号日 ' + data.date + ' · 大阳突破 × 龙虎榜净买双重严筛 · 次日开盘买入 · 严守止损、仓位从轻 · 宁缺毋滥';
        }
        if (!items.length) {
            box.innerHTML = '<div class="empty-state">今日无强势突破信号<br><span style="color:var(--text-muted);font-size:12px">龙虎榜净买严筛无合格候选（或大盘过热被门控），宁缺毋滥</span></div>';
            return;
        }
        box.innerHTML = items.map(it => renderSurgeCard(it)).join('');
    } catch(e) {
        box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 次日强势观察卡片：轻量版 action-card（无建仓分批/信号灯，突出信号日涨幅与买卖价位）
function renderSurgeCard(it) {
    const fmt = v => v != null ? Number(v).toFixed(2) : '--';
    const pctDay = it.pct_day;
    const pctHtml = pctDay != null
        ? `<span class="idx-up" style="font-weight:700">+${pctDay.toFixed(2)}%</span>` : '';
    const rr = it.risk_reward_ratio;
    const rrCls = rr == null ? '' : (rr >= 2 ? 'rr-good' : (rr >= 1 ? 'rr-ok' : 'rr-bad'));
    const rrHtml = rr != null ? `<span class="rr-tag ${rrCls}">盈亏比 ${rr.toFixed(2)}</span>` : '';
    const triggers = (it.triggers || []).map(t => `<span class="reason-chip">${t}</span>`).join('');
    // 龙虎榜增强标记（上榜且净买>0 的票两窗验证更强，徽章突出展示）
    const hasLhb = (it.triggers || []).some(t => t.indexOf('龙虎榜') >= 0);
    // 次日已收盘且越过止盈 → 错过不追；次日已开始未错过 → 提示开盘买入
    let statusHtml = '';
    if (it.missed) {
        statusHtml = '<div class="price-sub" style="color:var(--text-muted)">⏰ 已越过止盈位，错过不追</div>';
    } else if (!it.started) {
        statusHtml = '<div class="price-sub" style="color:var(--gold, #e0b34d)">🔔 明日开盘买入（参考信号日收盘）</div>';
    }
    return `
        <div class="action-card" style="border-color:rgba(255,170,60,0.35)${it.missed ? ';opacity:.6' : ''}" onclick="openKline('${it.code}')">
            <div class="action-head">
                <div>
                    <div class="action-name">${it.name || it.code} <span class="strategy-badge" style="background:rgba(255,170,60,0.15);color:#ffaa3c">⚡ 强势突破</span>${hasLhb ? ' <span class="strategy-badge lhb-badge" title="信号日上榜龙虎榜且主力净买入，历史验证隔日更强">🐯 龙虎榜净买</span>' : ''}</div>
                    <div class="action-code">${it.code}${it.industry ? ` · ${it.industry}` : ''}</div>
                </div>
                <div class="action-score" title="强势分：量比与涨幅强度（30~50）">
                    <div class="score-num">${it.fusion_score || '--'}</div>
                    <div class="score-lbl">强势分</div>
                </div>
            </div>
            <div class="action-prices">
                <div class="price-cell buy">
                    <div class="price-lbl">信号日收盘</div>
                    <div class="price-val">${fmt(it.signal_price)}</div>
                    <div class="price-sub">当日 ${pctHtml}</div>
                    ${statusHtml}
                </div>
                <div class="action-arrow">·</div>
                <div class="price-cell sell">
                    <div class="price-lbl">止盈目标</div>
                    <div class="price-val">${fmt(it.take_profit)}</div>
                    <div class="price-sub">${it.reward_pct != null ? `+${it.reward_pct}%` : '--'}</div>
                </div>
                <div class="price-arrow">⛔</div>
                <div class="price-cell stop">
                    <div class="price-lbl">止损</div>
                    <div class="price-val">${fmt(it.stop_loss)}</div>
                    <div class="price-sub">${it.risk_pct != null ? `-${it.risk_pct}%` : '--'}</div>
                </div>
            </div>
            <div class="action-foot">
                <div class="reasons">${triggers}</div>
                <div class="reasons" style="margin-top:4px"><span class="reason-chip" style="background:rgba(255,100,100,0.08);color:var(--text-muted)">⚠ 博弈型信号：胜率≈半，博的是大涨尾部，仓位从轻、次日不涨就走</span></div>
                ${rrHtml}
            </div>
        </div>`;
}

// ─── 个股深度 · 买卖建议（切换个股 → 学习历史走势/量价关系 → 识别涨跌节奏 → 近期建议）──
var _sd = { list: [], idx: -1, data: null, code: null };

function _sdColor(name, fb) {
    name = String(name || '');
    if (name.charAt(0) === '#' || name.indexOf('rgb') === 0 || name.indexOf('hsl') === 0) return name;
    name = name.replace(/^var\(\s*/, '').replace(/\s*\)$/, '');
    return cssVar(name, fb || '#8a93b5');
}

function _sdSignalColor(level) {
    var m = { buy: '--green', add: '#ffaa3c', hold: '--accent', sell: '--danger' };
    return m[level] || '--text-secondary';
}

// ─── 个股搜索历史缓存（非内置；最近搜索在前，可删除）───
var _SD_HIST_KEY = 'aiq_sd_history';
var _SD_HIST_MAX = 14;

function _sdLoadHistory() {
    try {
        var h = JSON.parse(localStorage.getItem(_SD_HIST_KEY) || '[]');
        return (Array.isArray(h) ? h : []).filter(function(x) { return x && x.code; });
    } catch(e) { return []; }
}
function _sdSaveHistory() {
    try { localStorage.setItem(_SD_HIST_KEY, JSON.stringify(_sd.list.slice(0, _SD_HIST_MAX))); } catch(e) {}
}

// ─── 个股深度 · 详情弹窗（详情从板块主体剥出，进居中弹窗；板块主区只放极简占位）───
var _sdDeepMode = false;
function _sdGetBody()       { return document.getElementById(_sdDeepMode ? 'sdDeepBody' : 'stockDeepContent'); }
function _sdGetChart()      { return document.getElementById(_sdDeepMode ? 'sdDeepChart' : 'stockDeepChart'); }
function _sdGetIndicators() { return document.getElementById(_sdDeepMode ? 'sdDeepIndicators' : 'sdIndicators'); }

async function openSdDeep(code) {
    var panel = document.getElementById('sdDeepPanel');
    if (!panel) return;
    _sdDeepMode = true;                                 // 先切模式，refreshStockDeep 内的 _sdGetBody 才指向弹窗
    panel.classList.add('open');
    var body = _sdGetBody();
    if (body) body.innerHTML = '<div class="empty-state" style="padding:60px 14px;font-size:13px">⏳ 正在深度学习该股历史走势、量价关系与涨跌节奏…</div>';
    try {
        await refreshStockDeep(code, { reorder: true });
    } catch (e) {
        if (body) body.innerHTML = '<div class="empty-state">分析失败：' + (e.message || e) + '</div>';
    }
    var popup = panel.querySelector('.sd-deep-popup');
    if (popup) popup.scrollTop = 0;
}

function closeSdDeep() {
    var panel = document.getElementById('sdDeepPanel');
    if (panel) panel.classList.remove('open');
    _sdDeepMode = false;
    // 弹窗内的 ECharts 实例 detach（避免后台持续监听 resize 造成内存增长）
    var ch = document.getElementById('sdDeepChart');
    if (ch && window.echarts) {
        try { var inst = echarts.getInstanceByDom(ch); if (inst) inst.dispose(); } catch (e) {}
    }
    // 关弹窗后刷新板块主区占位（用最新 _sd.code）
    if (typeof renderSdPanelPlaceholder === 'function') renderSdPanelPlaceholder();
}

// ESC 关闭弹窗
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        var p = document.getElementById('sdDeepPanel');
        if (p && p.classList.contains('open')) closeSdDeep();
    }
});

function renderSdPanelPlaceholder() {
    var box = document.getElementById('stockDeepContent');
    if (!box) return;
    var cur = (_sd.idx >= 0 && _sd.list[_sd.idx]) || null;
    if (!cur) {
        box.innerHTML = '<div class="sd-panel-empty">' +
            '👇 点 chip 选中并打开弹窗 · 再点同一 chip 可取消' +
            '<div class="sd-panel-tip">也支持：在「明日候选」或「推荐跟踪」中点击股票名直接打开</div></div>';
        return;
    }
    box.innerHTML = '<div class="sd-panel-hero">' +
        '<div><span class="sd-hero-name">' + (cur.name || cur.code) +
        '</span><span class="sd-hero-code">' + cur.code + '</span></div>' +
        '<div class="sd-hero-hint">已选中 · 在弹窗中查看深度分析（量价 + 节奏 + 信号 + K 线 + 近期建议时间线）</div>' +
        '<button class="btn btn-primary" onclick="openSdDeep(\'' + cur.code + '\')">🔍 查看深度分析</button>' +
        '</div>';
}

async function loadStockDeep() {
    var box = document.getElementById('stockDeepContent');
    if (!box) return;
    _sd.list = _sdLoadHistory();
    renderSdChips();
    // 盘后自动产出的「明日候选」与「推荐跟踪」随板块一起加载，不必手动点按钮
    loadSdMarket();
    loadSdTrack();
    // 不默认选中：进板块只展示候选 + 跟踪 + 历史 chips，由用户主动点 chip / 搜索 / 选候选
    _sd.idx = -1; _sd.code = null; _sd.data = null;
    renderSdPanelPlaceholder();
}

function renderSdChips() {
    var chips = document.getElementById('sdChips');
    if (!chips) return;
    var count = document.getElementById('sdCount');
    if (!_sd.list.length) {
        chips.innerHTML = '<span class="sd-chips-empty">搜索过的股票会显示在这里（最近在前），点击 × 可删除</span>';
        if (count) count.textContent = '';
        return;
    }
    chips.innerHTML = _sd.list.map(function(it, i) {
        var active = i === _sd.idx ? ' sd-chip-active' : '';
        return `<span class="sd-chip${active}" onclick="_sdToggleChip(${i})" title="${it.code} · ${it.name}（再点取消选中）">${it.name}<button class="sd-chip-del" title="从历史删除" onclick="event.stopPropagation();_sdRemoveHistory('${it.code}')">×</button></span>`;
    }).join('');
    if (count) count.textContent = (_sd.idx >= 0 ? (_sd.idx + 1) + ' / ' + _sd.list.length : '');
}

// 切换 chip 选中态：点未选中的 → 选中并打开弹窗；点当前已选中的 → 取消并关弹窗
function _sdToggleChip(i) {
    if (i < 0 || i >= _sd.list.length) return;
    if (i === _sd.idx) {
        // 再点同一只 → 取消选中
        _sd.idx = -1; _sd.code = null; _sd.data = null;
        closeSdDeep();
        renderSdChips();
        renderSdPanelPlaceholder();
        return;
    }
    // 切到新的 chip
    _sd.idx = i;
    _sd.code = _sd.list[i].code;
    renderSdChips();
    renderSdPanelPlaceholder();
    openSdDeep(_sd.list[i].code);
}

function selectSdByIndex(i) {
    if (i < 0 || i >= _sd.list.length) return;
    _sd.idx = i;
    renderSdChips();
    openSdDeep(_sd.list[i].code);   // 详情进弹窗，不再渲染到板块主区
}

function sdCycle(dir) {
    if (!_sd.list.length) return;
    var n = _sd.list.length;
    var nxt = ((_sd.idx + dir) % n + n) % n;
    selectSdByIndex(nxt);
}

function _sdRemoveHistory(code) {
    _sd.list = _sd.list.filter(function(x) { return x.code !== code; });
    _sdSaveHistory();
    // 删的是否当前选中：原 _sd.code 是否还在列表里
    var stillIn = _sd.list.some(function(x) { return x.code === _sd.code; });
    if (!stillIn) {
        // 删的正是当前 → 关弹窗不重选（保持「不默认选」）
        _sd.idx = -1; _sd.data = null; _sd.code = null;
        closeSdDeep();
    }
    if (!_sd.list.length) {
        var box = document.getElementById('stockDeepContent');
        if (box) box.innerHTML = '<div class="empty-state">暂无历史股票<br><span style="color:var(--text-muted);font-size:12px">在上方搜索框输入代码或名称，回车查看</span></div>';
        var s = document.getElementById('sdSearch'); if (s) s.value = '';
    }
    renderSdChips();
    if (!stillIn) renderSdPanelPlaceholder();
}

function onSdSearchPick() {
    var input = document.getElementById('sdSearch');
    if (!input) return;
    var raw = input.value.trim();
    if (!raw) return;
    // ① 值里含 6 位代码（如 datalist 选出的 "600100 TCL科技"）
    var mc = raw.match(/^\s*(\d{6})/);
    if (mc) {
        var code = mc[1];
        var item = _sd.list.find(function(it) { return it.code === code; });
        if (item) { selectSdByIndex(_sd.list.indexOf(item)); return; }
        openSdDeep(code); return;
    }
    // ② 名称匹配历史缓存
    var matched = _sd.list.find(function(it) { return it.name && raw.indexOf(it.name) >= 0; });
    if (matched) { selectSdByIndex(_sd.list.indexOf(matched)); return; }
    // ③ 后端按名称搜索
    RequestManager.fetch('sd-search-' + raw, API + '/investor/stocks/search?q=' + encodeURIComponent(raw))
      .then(function(resp) {
          var items = (resp && resp.data && resp.data.items) || [];
          if (items.length) openSdDeep(items[0].code);
          else showToast('未找到该股票，请核对代码或名称', 'warning');
      });
}

var _sdSearchTimer = null;
function onSdSearchInput(v) {
    if (_sdSearchTimer) clearTimeout(_sdSearchTimer);
    _sdSearchTimer = setTimeout(function() {
        var dl = document.getElementById('sdDatalist');
        if (!dl) return;
        RequestManager.fetch('sd-dl-' + v, API + '/investor/stocks/search?q=' + encodeURIComponent(v))
          .then(function(resp) {
              var items = (resp && resp.data && resp.data.items) || [];
              dl.innerHTML = items.map(function(it) { return `<option value="${it.code} ${it.name}">`; }).join('');
          });
    }, 250);
}

async function refreshStockDeep(code, opts) {
    opts = opts || {};
    var box = _sdGetBody();
    if (!box) return;
    box.innerHTML = '<div class="empty-state">正在深度学习该股历史走势、量价关系与涨跌节奏…</div>';
    try {
        var resp = await RequestManager.fetch('sd-deep-' + code, API + '/investor/stock_deep/' + code);
        var data = (resp && resp.data) || {};
        _sd.data = data; _sd.code = code;
        var name = data.name || code;
        // 入历史：reorder=true 置顶（新搜索）；false 保持原位置（点历史）
        if (opts.reorder) {
            _sd.list = _sd.list.filter(function(x) { return x.code !== code; });
            _sd.list.unshift({ code: code, name: name });
            if (_sd.list.length > _SD_HIST_MAX) _sd.list.length = _SD_HIST_MAX;
            _sd.idx = 0;
        } else {
            var ni = -1;
            for (var i = 0; i < _sd.list.length; i++) if (_sd.list[i].code === code) { ni = i; break; }
            if (ni < 0) { _sd.list.unshift({ code: code, name: name }); if (_sd.list.length > _SD_HIST_MAX) _sd.list.length = _SD_HIST_MAX; _sd.idx = 0; }
            else _sd.idx = ni;
        }
        // 用后端更全的名称更新缓存项
        var cur = _sd.list[_sd.idx];
        if (cur && data.name) cur.name = data.name;
        _sdSaveHistory();
        renderSdChips();
        var searchEl = document.getElementById('sdSearch');
        if (searchEl && data.code) searchEl.value = data.code + ' ' + (data.name || '');
        renderStockDeep(data);
    } catch(e) {
        box.innerHTML = '<div class="empty-state">分析失败：' + (e.message || e) + '</div>';
    }
}

// 明日买入候选：在今日推荐+自选+持仓候选池上跑深析信号
async function loadSdMarket() {

        var srcNote = '<span class="sd-chip-src" style="margin-left:8px">' +

                '<div class="sd-market-grid"><div class="sd-market-empty-col">暂无明日候选<br><span style="color:var(--text-muted)">可点右上「🔄 全市场深析」运行一次，或候选池为空</span></div></div>';
            return;
        }
        var fmt = function(v) { return (v != null && !isNaN(v)) ? Number(v).toFixed(2) : '--'; };
        box.innerHTML = `<div class="sd-market-title">⭐ 明日买入候选（深析信号=买入/加仓，且不追高；点击查看详情）${srcNote}${headBtn}</div>` +
            '<div class="sd-market-grid">' +
            items.map(function(it) {
                var ap = it.action_plan || {};
                var ext = it.pct_above_ma20 != null ? it.pct_above_ma20.toFixed(1) + '%' : '--';
                var reasons = (it.reasons || []).slice(0, 2);
                return `<div class="sd-market-card" onclick="pickSdCandidate('${it.code}')" title="${it.name} (${it.code})">
                    <div class="sd-market-head">
                        <span class="sd-market-name">${it.name}</span>
                        <span class="sd-lvl-chip ${it.level==='buy'?'sd-lvl-buy':'sd-lvl-add'}">${it.label || (it.level==='buy'?'建议买入':'可加仓')}</span>
                    </div>
                    <div class="sd-market-meta">${it.code} · 偏离MA20 ${ext}</div>
                    <div class="sd-market-prices">
                        <span><b>入场</b><span class="sd-price-entry">${fmt(ap.entry_price)}</span></span>
                        <span><b>止损</b>${fmt(ap.stop_loss)}</span>
                        <span><b>止盈</b>${fmt(ap.take_profit)}</span>
                    </div>
                    <div class="sd-market-reasons">${reasons.map(function(r){return '<span class="reason-chip">'+r+'</span>';}).join('')}</div>
                </div>`;
            }).join('') +
            '</div>';
    } catch(e) {
        box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:12px">扫描失败：' + (e.message || e) + '</div>';
    }
}

function pickSdCandidate(code) {
    openSdDeep(code);
}

// ─────────────────────────────────────────────
// 个股深度 · 推荐跟踪
// 每日 19:00 盘后：全市场深析扫描出候选 → 自动建跟踪单 → 逐日按买点建仓、卖点出场，
// 这里只负责展示与手动干预（推进 / 回补 / 平仓 / 删除）。
// ─────────────────────────────────────────────
// 列表分页：回补后动辄几百笔，一次全塞进 DOM 会卡，所以首屏只取一批，
// 底部给「加载更多」逐批追加。_sdTrackTotal 由接口返回（符合当前状态过滤的总数）。
var _SD_TRACK_PAGE = 100;      // 每批条数
var _sdTrackLimit = _SD_TRACK_PAGE;
var _sdTrackTotal = 0;

function _sdPct(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return '--';
    return (v > 0 ? '+' : '') + Number(v).toFixed(digits == null ? 2 : digits) + '%';
}
function _sdPctCls(v) {
    if (v === null || v === undefined || isNaN(v) || !v) return '';
    return v > 0 ? 'pos' : 'neg';
}
function _sdPx(v) {
    return (v === null || v === undefined || isNaN(v)) ? '--' : Number(v).toFixed(2);
}

// 只展示「持仓中」与「已清仓」：待回踩（还没买）和已失效（没回踩就过期）只是候选噪音，
// 不占列表。这两类仍计入顶部统计条，方便知道还有多少在等买点。
var _SD_TRACK_STATUS = 'holding,closed';

async function loadSdTrack(opts) {
    opts = opts || {};
    var box = document.getElementById('sdTrackBox');
    if (!box) return;
    // 非「加载更多」的调用都回到首屏条数，否则推进/回补/平仓后刷新会沿用上次累加的 limit
    if (!opts.keepLoading) {
        _sdTrackLimit = _SD_TRACK_PAGE;
    }
    if (!opts.keepLoading) {
        box.innerHTML = '<div class="empty-state" style="padding:10px;font-size:12px">正在读取推荐跟踪…</div>';
    }
    try {
        var resp = await RequestManager.fetch('sd-track',
            API + '/investor/deep_track?status=' + encodeURIComponent(_SD_TRACK_STATUS) + '&limit=' + _sdTrackLimit);
        var d = (resp && resp.data) || {};
        var items = d.items || [];
        // total 是「符合当前状态过滤」的总笔数；老版本接口没有该字段时退化为本次条数
        _sdTrackTotal = (d.total != null) ? d.total : items.length;
        renderSdTrack(items, d.stats || {}, d.updated_at);
        if (opts.scrollToMore) {
            var btn = document.getElementById('sdTrackMoreBtn');
            if (btn && btn.scrollIntoView) btn.scrollIntoView({ block: 'center' });
        }
    } catch (e) {
        if (box) box.innerHTML = '<div class="empty-state" style="padding:10px;font-size:12px">跟踪读取失败：' + (e.message || e) + '</div>';
    }
}

function loadMoreSdTrack() {
    _sdTrackLimit += _SD_TRACK_PAGE;
    loadSdTrack({ keepLoading: true, scrollToMore: true });
}

function renderSdTrack(items, st, updatedAt) {
    var box = document.getElementById('sdTrackBox');
    if (!box) return;
    var p = st.params || {};
    var stat = function(lbl, val, cls) {
        return '<div class="sd-track-stat"><div class="lbl">' + lbl + '</div>' +
               '<div class="val ' + (cls || '') + '">' + val + '</div></div>';
    };
    var head =
        '<div class="sd-track-head">' +
          '<span style="font-size:13px;font-weight:600;color:var(--text-primary)">📌 推荐跟踪 · 每笔持仓与收益</span>' +
          '<button class="btn btn-sm" onclick="refreshSdTrack(0)" title="立即按最新行情推进一次：检查是否触发建仓/出场，并结算收益">🔄 推进</button>' +
          '<input id="sdBackfillDays" type="number" class="bt-mini-input" value="30" min="1" max="90" style="width:54px;text-align:center;padding:3px 6px" title="回补交易日的天数（每个交易日都要全市场扫描一次，约 45 秒）" onkeydown="if(event.key===\'Enter\')refreshSdTrackFromInput()">' +
          '<button class="btn btn-sm" onclick="refreshSdTrackFromInput()" title="先补跑这些交易日的全市场深析扫描（用当天及之前的行情，无未来函数），再建跟踪单并推进出场。后台执行，约 45 秒/天">⏪ 回补</button>' +
          '<span class="text-muted" style="font-size:11px">每日 19:00 盘后自动跑 · 买点回踩才成交 · 卖点=止损/移动止盈/到期</span>' +
          (updatedAt ? '<span class="text-muted" style="font-size:11px;margin-left:auto">更新 ' + updatedAt + '</span>' : '') +
        '</div>';

    var stats =
        '<div class="sd-track-stats">' +
          stat('已平仓', (st.total_closed || 0) + ' 笔') +
          stat('胜率', st.win_rate == null ? '--' : st.win_rate + '%',
               st.win_rate == null ? '' : (st.win_rate >= 50 ? 'pos' : 'neg')) +
          stat('平均持仓', st.avg_hold_tdays == null ? '--' : st.avg_hold_tdays + ' 日') +
          stat('平均收益', _sdPct(st.avg_return), _sdPctCls(st.avg_return)) +
          stat('盈亏比', st.profit_factor == null ? '--' : st.profit_factor) +
          stat('累计收益', _sdPct(st.cum_return), _sdPctCls(st.cum_return)) +
          stat('持仓中', (st.holding || 0) + ' 笔') +
          stat('待回踩', (st.watching || 0) + ' 笔') +
          stat('已失效', (st.expired || 0) + ' 笔') +
        '</div>';

    if (!items.length) {
        var waiting = st.watching || 0;
        box.innerHTML = head + stats +
            '<div class="empty-state" style="padding:14px;font-size:12px">暂无「持仓中 / 已清仓」的跟踪记录<br>' +
            '<span style="color:var(--text-muted)">' +
            (waiting > 0
                ? '当前 ' + waiting + ' 笔候选还在等回踩买点，成交后自动进入本列表'
                : '每日盘后同步后自动建单；也可输入天数后点「⏪ 回补」补建历史样本') +
            '</span></div>';
        return;
    }

    var ST_CLS = { holding: 'sd-st-holding', watching: 'sd-st-watching',
                   closed: 'sd-st-closed', expired: 'sd-st-expired' };
    var rows = items.map(function(it) {
        var isClosed = it.status === 'closed';
        var ret = isClosed ? it.return_pct : it.float_return;
        var retTxt = isClosed ? _sdPct(ret) : (ret == null ? '--' : _sdPct(ret) + '<span style="opacity:.6"> 浮</span>');
        var holdTxt = it.hold_tdays != null ? it.hold_tdays + ' 日' : '--';
        var entryTxt = it.entry_date ? it.entry_date.slice(5) + ' @' + _sdPx(it.entry_price) : '<span style="opacity:.6">待回踩</span>';
        var exitTxt = it.exit_date ? it.exit_date.slice(5) + ' @' + _sdPx(it.exit_price) : '--';
        var stTxt = it.status_label + (it.exit_reason_label ? ' · ' + it.exit_reason_label : '');
        var ops = (it.status === 'holding' || it.status === 'watching'
                     ? '<button class="sd-op" onclick="closeSdTrack(' + it.id + ',\'' + (it.name || it.code) + '\')">平仓</button>' : '') +
                  '<button class="sd-op danger" onclick="delSdTrack(' + it.id + ',\'' + (it.name || it.code) + '\')">删</button>';
        return '<tr>' +
            '<td class="name-td"><span style="cursor:pointer;color:var(--text-primary)" onclick="pickSdCandidate(\'' + it.code + '\')">' +
                (it.name || it.code) + '</span>' +
                '<span class="text-muted" style="margin-left:6px">' + it.code + '</span></td>' +
            '<td class="num">' + (it.scan_date || '--').slice(5) + '</td>' +
            '<td class="num">' + _sdPx(it.sig_entry) + '</td>' +
            '<td class="num">' + entryTxt + '</td>' +
            '<td class="num">' + exitTxt + '</td>' +
            '<td class="num">' + holdTxt + '</td>' +
            '<td class="num ' + _sdPctCls(ret) + '">' + retTxt + '</td>' +
            '<td><span class="sd-st ' + (ST_CLS[it.status] || '') + '">' + stTxt + '</span></td>' +
            '<td style="white-space:nowrap">' + ops + '</td>' +
        '</tr>';
    }).join('');

    var note = '<div class="sd-track-note">口径：买点=推荐日收盘，其后 ' + (p.entry_window_days || 5) +
        ' 个交易日内<b>回踩</b>才成交（涨上去不追，未回踩判失效且不计胜率）；' +
        '出场用推荐自带止损，浮盈达 ' + ((p.take_profit_pct || 0) * 100).toFixed(0) + '% 启动移动止盈（回撤 ' +
        ((p.trailing_pct || 0) * 100).toFixed(0) + '% 清仓），持满 ' + (p.max_hold_days || 10) +
        ' 个交易日按收盘了结。持仓时间按<b>交易日</b>计。</div>';

    // 回补后会有几百笔，一次全渲染既卡又难找，这里分批 + 「加载更多」
    var moreHtml = '';
    if (_sdTrackTotal > items.length) {
        var nextN = Math.min(_SD_TRACK_PAGE, _sdTrackTotal - items.length);
        moreHtml = '<div style="text-align:center;padding:10px 0">' +
            '<div class="text-muted" style="font-size:11px;margin-bottom:6px">已显示 ' +
            items.length + ' / 共 ' + _sdTrackTotal + ' 笔（按推荐日从新到旧）</div>' +
            '<button id="sdTrackMoreBtn" class="btn btn-sm" onclick="loadMoreSdTrack()">加载更多（+' + nextN + '）</button>' +
            '</div>';
    } else if (items.length > _SD_TRACK_PAGE) {
        moreHtml = '<div class="text-muted" style="text-align:center;padding:8px 0;font-size:11px">已显示全部 ' +
            items.length + ' 笔</div>';
    }

    box.innerHTML = head + stats +
        '<div style="max-height:420px;overflow:auto">' +
        '<table class="sd-trade-table sd-track-table"><thead><tr>' +
        '<th>股票</th><th>推荐日</th><th>买点</th><th>建仓</th><th>卖出</th>' +
        '<th>持仓</th><th>收益</th><th>状态</th><th></th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' + note + moreHtml;
}

function refreshSdTrackFromInput() {
    var input = document.getElementById('sdBackfillDays');
    var days = input ? parseInt(input.value, 10) : 30;
    if (isNaN(days) || days < 1) days = 1;
    if (days > 90) days = 90;
    if (input) input.value = days;
    startBackfillScan(days);
}

// ── 历史扫描日回补（后台独立进程 + 轮询进度）──────────
// 回补一天要对 4500+ 只股票跑全套指标（8 进程约 46s/天），30 天就是 20+ 分钟，
// 绝不能同步等待；这里拉起后台进程后按 2s 轮询进度文件，完成后再刷新列表。
var _bfPollTimer = null;
var _bfPollKey = 'sd-track-bf-status';

function _bfProgressHtml(pct, msg) {
    return '<div class="empty-state" style="padding:18px;font-size:12px">' +
        '<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:10px">⏳ 正在回补历史扫描日…</div>' +
        '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:4px;height:8px;overflow:hidden;max-width:420px;margin:0 auto">' +
          '<div style="width:' + (pct || 0) + '%;height:100%;background:var(--accent);transition:width .3s"></div>' +
        '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:8px">' + (msg || '') + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted);margin-top:2px">每天扫描只用当天及之前的行情，无未来函数</div>' +
        '</div>';
}

function _bfStopPoll() {
    if (_bfPollTimer) { clearInterval(_bfPollTimer); _bfPollTimer = null; }
    RequestManager.cancel(_bfPollKey);
}

async function startBackfillScan(days) {
    var box = document.getElementById('sdTrackBox');
    if (box) box.innerHTML = _bfProgressHtml(0, '正在启动…');
    try {
        await RequestManager.fetch('sd-track-bf-start',
            API + '/investor/deep_track/backfill_scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ days: days, procs: 8 })
            });
        showToast('已启动回补（' + days + ' 个交易日），后台扫描中…', 'success');
        _bfStartPoll();
    } catch (e) {
        showToast('启动回补失败：' + (e.message || e), 'error');
        loadSdTrack();
    }
}

function _bfStartPoll() {
    _bfStopPoll();
    var box = document.getElementById('sdTrackBox');
    _bfPollTimer = setInterval(async function () {
        try {
            var resp = await RequestManager.fetch(_bfPollKey,
                API + '/investor/deep_track/backfill_scan/status');
            var d = (resp && resp.data) || {};
            if (d.status === 'running' && box) {
                box.innerHTML = _bfProgressHtml(d.progress, d.message);
                return;
            }
            _bfStopPoll();
            if (d.status === 'success') {
                var r = d.result || {};
                showToast('回补完成：扫描 ' + (r.scanned || 0) + ' 天，新增 ' + (r.added || 0) +
                          ' 单，建仓 ' + (r.filled || 0) + ' 笔，出场 ' + (r.closed || 0) + ' 笔' +
                          (r.errors ? '｜⚠ ' + r.errors + ' 笔异常' : ''), 'success');
            } else if (d.status === 'error') {
                showToast('回补失败：' + (d.error || '未知错误'), 'error');
            } else {
                showToast('回补结束：' + (d.message || ''), 'info');
            }
            loadSdTrack();
        } catch (e) {
            // 单次轮询失败不中止（可能瞬时超时），下一轮继续
        }
    }, 2000);
}

async function refreshSdTrack(backfillDays) {
    var box = document.getElementById('sdTrackBox');
    var label = backfillDays ? ('回补最近 ' + backfillDays + ' 天') : '推进';
    try {
        if (box) box.innerHTML = '<div class="empty-state" style="padding:14px;font-size:12px">⏳ 正在' + label + '…</div>';
        var resp = await RequestManager.fetch('sd-track-refresh', API + '/investor/deep_track/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ backfill_days: backfillDays || 0 })
        });
        var d = (resp && resp.data) || {};
        var u = d.update || {};
        var s = d.sync || {};
        var msg;
        if (d.mode === 'backfill') {
            var avail = d.avail_days, req = d.requested_days || backfillDays, got = d.days;
            // 数据源不足是最常见的"点了没反应"原因，必须说清楚，否则用户以为接口坏了
            var srcTip = (avail != null && req && got < req)
                ? ('（数据源仅 ' + avail + ' 个扫描日，不足 ' + req + ' 天）')
                : (avail != null ? '（数据源共 ' + avail + ' 个扫描日）' : '');
            msg = '回补 ' + got + ' 个扫描日' + srcTip + '：新增 ' + (d.added || 0) +
                  ' 单，已存在跳过 ' + (d.skipped || 0) + ' 单，建仓 ' + (u.filled || 0) +
                  ' 笔，出场 ' + (u.closed || 0) + ' 笔';
            if (u.errors) {
                msg += '｜⚠ ' + u.errors + ' 笔处理异常' +
                       (u.error_samples && u.error_samples[0] ? '（' + u.error_samples[0] + '）' : '');
            }
            if (!d.added && !u.filled && !u.closed) {
                // 区分三种"看起来什么都没发生"的原因，否则用户只能猜
                msg += d.skipped
                    ? ('｜这些扫描日已建过单（跳过 ' + d.skipped + ' 单）' +
                       (got && avail && got >= avail ? '，数据源已用尽，需先跑新的全市场深析扫描' : ''))
                    : '｜无可补样本';
            }
        } else {
            msg = '推进完成：新增 ' + (s.added || 0) + ' 单，建仓 ' + (u.filled || 0) +
                  ' 笔，出场 ' + (u.closed || 0) + ' 笔';
        }
        showToast(msg, 'success');
        loadSdTrack();
    } catch (e) {
        showToast(label + '失败：' + (e.message || e), 'error');
        loadSdTrack();
    }
}

// ─── 持仓统计：把 buy/add 建议转成逐笔模拟持仓并聚合收益（回测每日候选票的收益）──
function renderSdPositionStats(data) {
    var ps = data.position_stats;
    if (!ps || !ps.summary) {
        return `<div class="sd-card">
            <h4>💼 持仓统计 · 建议回测</h4>
            <div class="empty-state" style="padding:14px;font-size:12px">近期（近 ${(data.recent_advice||[]).length} 个交易日）暂无 buy/add 建议可回测</div>
        </div>`;
    }
    var s = ps.summary || {};
    var fmt = function(v, d) { return (v != null && !isNaN(v)) ? Number(v).toFixed(d == null ? 2 : d) : '--'; };
    var pctCls = function(v) { return (v != null && v >= 0) ? 'idx-up' : 'idx-down'; };
    var pct = function(v, d) {
        if (v == null || isNaN(v)) return '--';
        return `<span class="${pctCls(v)}">${v >= 0 ? '+' : ''}${fmt(v, d == null ? 2 : d)}%</span>`;
    };
    var capNote = (s.max_hold_cap != null) ? ` · 最长持有 ${s.max_hold_cap} 个交易日` : '';
    var basisNote = s.basis_pct ? `<span style="color:var(--text-muted);font-size:11px">（口径：${s.basis_pct}）</span>` : '';

    // 指标卡
    var metricCells = [
        ['建议笔数', s.n_trades, `${s.n_closed} 了结 · ${s.n_open} 持仓中`],
        ['胜率', fmt(s.win_rate, 1) + '%', `最佳 ${pct(s.best_return_pct)} · 最差 ${pct(s.worst_return_pct)}`],
        ['平均单笔', pct(s.avg_return_pct), `中位 ${pct(s.median_return_pct)}`],
        ['盈亏比', fmt(s.profit_factor, 2), `期望 ${pct(s.expectancy_pct)}`],
        ['均持仓天数', s.avg_hold_days != null ? fmt(s.avg_hold_days, 1) : '--', `最长 ${s.max_hold_days != null ? s.max_hold_days : '--'} 天`],
        ['最大回撤', s.max_drawdown_pct != null ? fmt(s.max_drawdown_pct, 2) + '%' : '--', '组合净值口径'],
    ].map(function(c) {
        return `<div class="sd-metric"><div class="lbl">${c[0]}</div><div class="val">${c[1]}</div><div class="sub">${c[2] || ''}</div></div>`;
    }).join('');

    // 出场原因分布
    var er = ps.exit_reasons || {};
    var erKeys = Object.keys(er);
    var erHtml = erKeys.length
        ? erKeys.map(function(k) { return `<span class="reason-chip">${k} ×${er[k]}</span>`; }).join(' ')
        : '<span class="reason-chip">暂无已了结</span>';

    // 每笔明细
    var trades = (ps.trades || []);
    var trHtml = trades.map(function(t) {
        var status = t.status === 'clear' ? '已了结' : '持仓中';
        var stColor = t.status === 'clear' ? 'var(--accent)' : '#ffaa3c';
        return `<tr>
            <td>${t.signal_date || '--'}</td>
            <td>${fmt(t.entry_price)}</td>
            <td>${t.entry_date || '--'}</td>
            <td>${t.exit_date || '--'}</td>
            <td>${t.exit_price != null ? fmt(t.exit_price) : '--'}</td>
            <td>${pct(t.return_pct)}</td>
            <td>${t.hold_days != null ? t.hold_days + '天' : '--'}</td>
            <td style="color:${stColor}">${t.exit_reason || status}</td>
        </tr>`;
    }).join('');

    return `<div class="sd-card">
        <h4>💼 持仓统计 · 建议回测${capNote}${basisNote}</h4>
        <div class="sd-summary" style="grid-template-columns:repeat(3,1fr)">${metricCells}</div>
        <div class="sd-kv" style="margin-top:10px">
            <span>回测口径：信号日次日开盘买入、T+1，按收盘价判定止损/止盈/到期出场</span>
            <span>出场原因：${erHtml}</span>
        </div>
        <h4 style="margin-top:10px">🧾 每笔明细（近期 buy/add 建议 → 模拟持仓）</h4>
        <div style="max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px">
            <table class="sd-trade-table">
                <thead><tr>
                    <th>信号日</th><th>买入价</th><th>买入日</th><th>出场日</th><th>出场价</th>
                    <th>收益</th><th>持有</th><th>状态/原因</th>
                </tr></thead>
                <tbody>${trHtml || '<tr><td colspan="8" style="text-align:center;color:var(--text-muted)">无可回测明细</td></tr>'}</tbody>
            </table>
        </div>
    </div>`;
    // 弹窗模式：把模板里硬编码的 chart/indicators id 替换为弹窗内的 id（让 _sdGetChart/_sdGetIndicators 能取到）
    if (_sdDeepMode) {
        __html = __html.replace(/id="sdIndicators"/g, 'id="sdDeepIndicators"')
                       .replace(/id="stockDeepChart"/g, 'id="sdDeepChart"');
    }
    box.innerHTML = __html;
}

// ─── 个股深度 K 线：与「个股 K 线弹窗」完全一致的结构（复用 buildKlineOption）──
var _sdIndicators = { vol: true, macd: false, kdj: false };

function _sdBuildKlineInputs(data) {
    var c = data.chart || {};
    var dates = c.dates || [];
    if (!dates.length) return null;
    var code = data.code || '', ra = data.recent_advice || [];
    var kdata = [];
    for (var i = 0; i < dates.length; i++) {
        var o = c.open[i] != null ? c.open[i] : c.close[i];
        var cl = c.close[i], l = c.low[i] != null ? c.low[i] : cl, h = c.high[i] != null ? c.high[i] : cl;
        var v = c.volume[i] || 0;
        var prev = i > 0 ? c.close[i - 1] : o;
        var chg = prev > 0 ? (cl / prev - 1) * 100 : 0;
        var n = /^30/.test(code) || /^688/.test(code) ? 19.5 : (/^[48]/.test(code) ? 29.5 : 9.5);
        var lt = chg >= n ? 'limit_up' : (chg <= -n ? 'limit_down' : 'normal');
        kdata.push({ date: dates[i], open: o, close: cl, low: l, high: h, vol: v, chgPct: chg, limitType: lt });
    }
    var ohlc = kdata.map(function(d) {
        var color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    var volData = kdata.map(function(d) {
        return { value: d.vol, itemStyle: { color: d.chgPct >= 0 ? _klinePalette.up : _klinePalette.down } };
    });
    // 买卖点标记（仅在信号切换当天标注）
    // 买点锚定在当日最低价（买在支撑/回调低点），卖点锚定在当日最高价，让标记贴住蜡烛而非悬空
    var dateK = {};
    kdata.forEach(function(d) { dateK[d.date] = d; });
    var marks = [];
    for (var j = 0; j < ra.length; j++) {
        var a = ra[j], pA = j > 0 ? ra[j - 1] : null;
        var inBuy = a.level === 'buy' || a.level === 'add';
        var prevInBuy = pA && (pA.level === 'buy' || pA.level === 'add');
        var inSell = a.level === 'sell';
        var k = dateK[a.date];
        if (!k) continue;
        if (inBuy && !prevInBuy) marks.push({ date: a.date, price: k.low, type: 'buy' });
        if (inSell && (!pA || pA.level !== 'sell')) marks.push({ date: a.date, price: k.high, type: 'sell' });
    }
    return { kdata: kdata, dates: dates, ohlc: ohlc, volData: volData, marks: marks };
}

function renderStockDeepChart(data) {
    var dom = _sdGetChart();

    resolveKlinePalette();
    var inx = _sdBuildKlineInputs(data);
    if (!inx) return;
    var activeCount = Object.keys(_sdIndicators).filter(function(k) { return _sdIndicators[k]; }).length;
    var baseH = window.innerWidth < 480 ? 280 : (window.innerWidth < 768 ? 360 : 440);
    var h = Math.min(baseH + (activeCount - 1) * 90, window.innerWidth < 768 ? 520 : 800);
    dom.style.height = h + 'px';
    var chart = ChartManager.get('stockdeep', dom);
    var opt = buildKlineOption(inx.kdata, inx.dates, inx.ohlc, inx.volData, inx.marks, _sdIndicators);
    opt.title.text = (data.code ? (data.code + ' · ' + (data.name || '')) : '') + '  K线';
    // 在弹窗同构结构上叠加当前建议参考价位（体现深度，不影响结构一致）
    var ap = (data.signal && data.signal.action_plan) || {};
    var ml = [];
    if (ap.entry_price != null) ml.push({ yAxis: ap.entry_price, lineStyle: { color: '#f39c12', type: 'dashed' }, label: { formatter: '参考入场', color: '#f39c12' } });
    if (ap.stop_loss != null) ml.push({ yAxis: ap.stop_loss, lineStyle: { color: '#e74c3c', type: 'dashed' }, label: { formatter: '止损', color: '#e74c3c' } });

        opt.series[0].markLine = { silent: true, symbol: 'none', lineStyle: { type: 'dashed', width: 1 }, label: { position: 'insideEndTop', fontSize: 10 }, data: ml };
    }
    chart.clear();
    chart.setOption(opt);
    chart.resize();
}

// 各周期统计 chips（summary.perf：累计收益 = 全部段盈亏之和，累计胜率 = 盈亏>0 的段占比）
function exitStatChip(hz, perf) {
    const p = (perf && perf[hz]) || {};
    let s = '';
    if (p.cum_pnl != null) {
        const sign = p.cum_pnl >= 0 ? '+' : '';
        s += `<span class="exit-group-stat ${p.cum_pnl >= 0 ? 'positive' : 'negative'}">累计收益 ${sign}${p.cum_pnl}%</span>`;
    }
    if (p.win_rate != null) {
        s += `<span class="exit-group-stat ${p.win_rate >= 50 ? 'positive' : 'negative'}" title="${p.segments || 0} 段中盈利 ${p.win_rate >= 0 ? Math.round(p.win_rate * (p.segments || 0) / 100) : 0} 段">累计胜率 ${p.win_rate}%</span>`;
    }
    return s;
}

// 策略规则命中（常驻规则今日筛出，独立于融合分信号）
async function loadRuleSignals() {
    const box = document.getElementById('ruleSignals');
    const dateEl = document.getElementById('ruleSigDate');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch('ruleSignals', API + '/investor/rule_signals');
        const data = (resp && resp.data) || {};
        const items = data.items || [];
        const total = data.total != null ? data.total : items.length;
        const excluded = data.excluded_rules || 0;
        if (dateEl) {
            let txt = data.date ? ('数据日期 ' + data.date + (total > items.length ? ('（命中 ' + total + '，显示前 ' + items.length + '）') : '')) : '';
            if (excluded > 0) txt += ' · 已隐藏 ' + excluded + ' 条命中过泛的规则（单日命中>' + (data.max_hits || 200) + '只）';
            dateEl.textContent = txt;
        }
        if (!items.length) {
            box.innerHTML = excluded > 0
                ? '<div class="empty-state">所有启用规则命中都过泛（单条规则命中超 ' + (data.max_hits || 200) + ' 只，无筛选价值），已全部隐藏<br><span style="color:var(--text-muted);font-size:12px">建议到「回测」收紧规则条件后重新保存</span></div>'
                : '<div class="empty-state">暂无规则命中<br><span style="color:var(--text-muted);font-size:12px">先在「回测」将策略存为常驻规则，同步时自动扫描</span></div>';
            return;
        }
        box.innerHTML = '<div class="rule-sig-list">' + items.map(it => {
            const price = it.latest_close != null ? Number(it.latest_close).toFixed(2) : '--';
            const hitsTip = it.rule_hits != null ? (' · 今日命中 ' + it.rule_hits + ' 只') : '';
            // 规则回测胜率徽章：≥55% 用涨色（优），<50% 用跌色警示（沿用 A股红涨绿跌配色）
            const wr = it.rule_win_rate;
            const wrCls = wr == null ? '' : (wr >= 55 ? 'idx-up' : (wr >= 50 ? '' : 'idx-down'));
            const wrHtml = wr != null
                ? `<span class="${wrCls}" style="font-family:var(--font-mono)" title="该规则历史回测胜率（${it.rule_total_trades || 0} 笔交易）${wr < 50 ? ' · 低于50%，谨慎参考' : ''}">胜率 ${Number(wr).toFixed(1)}%</span>`
                : '<span style="color:var(--text-muted)">胜率 --</span>';
            return `<div class="rule-sig-row" onclick="openKline('${it.code}')">
                <div class="rule-sig-main">
                    <span class="rule-sig-code">${it.code}</span>
                    <span class="rule-sig-name">${it.name || '--'}</span>
                </div>
                <span class="rule-sig-rule" title="${(it.rule_name || '') + hitsTip}">${it.rule_name || ('#' + it.rule_id)}</span>
                <span class="rule-sig-price">¥${price}</span>
                <span class="rule-sig-conf">${wrHtml}</span>
            </div>`;
        }).join('') + '</div>';
    } catch(e) {
        box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 手动触发常驻规则全市场扫描（同步阻塞，全市场约数分钟）
async function scanRulesNow() {
    const btn = document.getElementById('ruleScanBtn');
    const box = document.getElementById('ruleSignals');
    const maxRules = parseInt(document.getElementById('ruleScanMaxRules').value, 10) || 50;
    const lookback = parseInt(document.getElementById('ruleScanLookback').value, 10) || 300;
    if (lookback <= 252) { showToast('回溯行数需大于 252', 'error'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '扫描中…'; }
    if (box) box.innerHTML = '<div class="empty-state">全市场扫描中，预计需数分钟…</div>';
    try {
        const resp = await fetch(API + '/sync/scan_rules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ max_rules: maxRules, lookback_rows: lookback })
        });
        const j = await resp.json();
        if (j && j.success) {
            const d = j.data || {};
            showToast('扫描完成：' + (d.rules || 0) + ' 条规则 / ' + (d.hits || 0) + ' 条命中，耗时 ' + (d.elapsed_s || 0) + 's', 'success');
            await loadRuleSignals();
        } else {
            showToast('扫描失败：' + ((j && j.error) || '未知错误'), 'error');
            await loadRuleSignals();
        }
    } catch(e) {
        showToast('扫描请求失败', 'error');
        await loadRuleSignals();
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '立即扫描'; }
    }
}

// 复制当前选中日期展示的推荐，按 short/mid/long 分组，每只一行便于粘贴到备忘录/Excel
function copyTodayPicks() {
    const store = window._todayPicks;
    const btn = document.getElementById('btnCopyTodayPicks');
    if (!store || !store.groups) {
        showToast('暂无推荐数据，请先重算打分', 'error');
        return;
    }
    const lines = [];
    const dateStr = store.date ? '（' + store.date + '）' : '';
    let count = 0;
    HORIZON_GROUPS.forEach(g => {
        const list = store.groups[g.key] || [];
        if (!list.length) return;
        count += list.length;
        lines.push('【' + g.label + '】' + g.desc);
        lines.push(...buildPickGroupLines(list));
        lines.push('');
    });
    if (!count) {
        showToast('暂无推荐数据', 'error');
        return;
    }
    const text = '📋 今日推荐' + dateStr + '\n' + lines.join('\n').replace(/\n+$/, '');
    copyTextToClipboard(text, function(ok) {
        if (ok) {
            if (btn) { btn.textContent = '✓ 已复制'; setTimeout(function() { btn.textContent = '📋 一键复制'; }, 2000); }
            showToast('已复制 ' + count + ' 只推荐（' + HORIZON_GROUPS.filter(g => (store.groups[g.key] || []).length).map(g => g.label).join('+') + '）', 'success');
        } else {
            showToast('复制失败，请手动复制', 'error');
        }
    });
}

// 通用剪贴板复制（navigator.clipboard 优先，老浏览器降级 execCommand）
function copyTextToClipboard(text, cb) {
    function fallback() {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            cb && cb(ok);
        } catch (e) {
            cb && cb(false);
        }
    }
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() { cb && cb(true); }, fallback);
    } else {
        fallback();
    }
}

// 渲染持仓出场诊断徽章（清仓/减仓/持有）
function renderPositionAdvice(advice) {
    if (!advice || !advice.status) return '';
    const map = {
        clear:  { color: 'var(--danger)',  icon: '⛔', label: '建议清仓' },
        reduce: { color: 'var(--warning)', icon: '⚠', label: '建议减仓' },
        hold:   { color: 'var(--text-muted)', icon: '✓', label: '持有' },
    };
    const m = map[advice.status] || map.hold;
    const reason = advice.reason ? ' · ' + advice.reason : '';
    return `<div style="padding:4px 10px;font-size:12px;color:${m.color};border-left:2px solid ${m.color};background:rgba(255,255,255,0.02);margin-top:2px">${m.icon} 诊断：${m.label}${reason}</div>`;
}

async function loadRecHistory() {
    const summaryEl = document.getElementById('recHistorySummary');

        const resp = await RequestManager.fetch('rec-history', API + '/investor/recommendations/history?days=30');

        const items = d.items || [];
        const summary = d.summary || {};
        if (updEl) updEl.textContent = '统计区间：近 ' + (d.days || 30) + ' 天';

            if (tableEl) tableEl.innerHTML = '<div class="empty-state">暂无历史推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到首页点「立即重算打分」生成推荐</span></div>';
            return;

        // 汇总卡片：T1/T2/T3/T5 总胜率 + 平均收益 + 原有收益统计
        if (summaryEl && summary.total) {
            const tStat = (k, label) => {
                const s = summary[k];
                if (!s || !s.n) return `<div class="metric-card"><div class="val" style="color:var(--text-muted);font-size:26px">--</div><div class="lbl">${label} 胜率</div></div>`;

                const avg = s.avg_return;
                const avgHtml = avg != null
                    ? `<div style="font-size:11px;margin-top:3px" class="${avg>=0?'idx-up':'idx-down'}">${label} 平均收益 ${avg>=0?'+':''}${avg}%</div>`
                    : '';
                return `<div class="metric-card"><div class="val" style="color:${color};font-size:26px">${s.win_rate}%</div><div class="lbl">${label} 胜率 <span style="opacity:.7">(${s.win}/${s.n})</span></div>${avgHtml}</div>`;
            };
            const avgCls = summary.avg_return >= 0 ? 'idx-up' : 'idx-down';
            const avgSign = summary.avg_return >= 0 ? '+' : '';
            const bestCls = summary.best_return >= 0 ? 'idx-up' : 'idx-down';
            const worstCls = summary.worst_return >= 0 ? 'idx-up' : 'idx-down';
            const pf = summary.profit_factor || 0;

            summaryEl.innerHTML = `
                <div class="metrics-row" style="margin-bottom:8px">
                    ${tStat('t1', 'T+1')}
                    ${tStat('t2', 'T+2')}
                    ${tStat('t3', 'T+3')}

                </div>

                    <div class="metric-card"><div class="val ${avgCls}">${avgSign}${summary.avg_return}%</div><div class="lbl">平均收益</div></div>
                    <div class="metric-card"><div class="val ${pfCls}">${pf.toFixed(2)}</div><div class="lbl">盈亏比</div></div>
                    <div class="metric-card"><div class="val ${bestCls}">+${summary.best_return}%</div><div class="lbl">最佳</div></div>
                    <div class="metric-card"><div class="val ${worstCls}">${summary.worst_return}%</div><div class="lbl">最差</div></div>

                    <div class="metric-card"><div class="val" style="color:var(--green, #10b981)">${summary.take_profit_count||0}</div><div class="lbl">触发止盈</div></div>
                </div>`;
        }

        // 明细表格（全量展示，滚动容器限高；连续推荐合并为一段，仅显示首次推荐日）
        if (tableEl) {
            let html = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">共 ${items.length} 段连续推荐（按首次推荐日降序，连续推荐仅记首次）</div>`;

            html += '<th>代码</th><th>名称</th><th>首次推荐日</th><th>连续推荐</th><th>买入价</th><th>T+1</th><th>T+2</th><th>T+3</th><th>T+5</th><th>收益</th><th>状态</th>';
            html += '</tr></thead><tbody>';
            items.forEach(r => {
                const pnlCls = r.pnl_pct >= 0 ? 'positive' : 'negative';
                const sign = r.pnl_pct >= 0 ? '+' : '';
                let status = '持有中';
                if (r.hit_stop_loss) status = '<span style="color:var(--danger)">已止损</span>';
                else if (r.exit_reason === 'trailing_stop') status = '<span style="color:var(--green, #10b981)">移止离场</span>';
                else if (r.hit_take_profit) status = '<span style="color:var(--green, #10b981)">已止盈</span>';
