<script>
const API = '/api';

// ─── Toast notification system ───
var Toast = {
    container: null,

    init: function() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
    },

    show: function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        this.init();
        var icons = { success: '&#x2713;', error: '&#x2717;', warning: '&#x26A0;', info: '&#x2139;' };
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span> <span>' + message + '</span>';
        this.container.appendChild(toast);
        var self = this;
        requestAnimationFrame(function() { toast.classList.add('show'); });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }
};

function showToast(message, type) { Toast.show(message, type); }

// ─── Skeleton loading ───
function showSkeleton(container, rowCount) {
    rowCount = rowCount || 10;
    var cols = ['w80', 'w120', 'w200', 'w80', 'w120'];
    var html = '';
    for (var i = 0; i < rowCount; i++) {
        html += '<div class="skeleton-row">';
        for (var j = 0; j < cols.length; j++) {
            html += '<div class="skeleton-cell ' + cols[j] + ' skeleton"></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

async function fetchJSON(url, opts) {
    opts = opts || {};
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error(resp.statusText);
    return resp.json();
}

// ─── Request manager (AbortController-based cancellation) ───
var RequestManager = {
    controllers: {},

    fetch: function(key, url, opts) {
        this.cancel(key);
        var ctrl = new AbortController();
        this.controllers[key] = ctrl;
        opts = opts || {};
        opts.signal = ctrl.signal;
        var self = this;
        return fetchJSON(url, opts).then(function(data) {
            delete self.controllers[key];
            return data;
        }).catch(function(e) {
            delete self.controllers[key];
            throw e;
        });
    },

    cancel: function(key) {
        if (this.controllers[key]) {
            this.controllers[key].abort();
            delete this.controllers[key];
        }
    },

    cancelAll: function() {
        var self = this;
        Object.keys(this.controllers).forEach(function(k) {
            self.controllers[k].abort();
        });
        this.controllers = {};
    }
};

// ─── Tab state cache (5-min validity) ───
var TabState = {
    states: {},
    MAX_AGE: 5 * 60 * 1000,

    save: function(tab) {
        var content = document.getElementById('content');
        var scrollEl = document.querySelector('.content');
        this.states[tab] = {
            html: content ? content.innerHTML : '',
            scrollTop: scrollEl ? scrollEl.scrollTop : 0,
            ts: Date.now()
        };
    },

    load: function(tab) {
        var s = this.states[tab];
        if (s && Date.now() - s.ts < this.MAX_AGE) return s;
        delete this.states[tab];
        return null;
    }
};

// ─── ECharts instance manager ───
var ChartManager = {
    instances: {},

    get: function(key, dom) {
        if (this.instances[key]) {
            var inst = this.instances[key];
            if (inst.getDom && inst.getDom() === dom) return inst;
            this.dispose(key);
        }
        var inst = echarts.init(dom);
        this.instances[key] = inst;
        return inst;
    },

    dispose: function(key) {
        if (this.instances[key]) {
            this.instances[key].dispose();
            delete this.instances[key];
        }
    },

    disposeAll: function() {
        var self = this;
        Object.keys(this.instances).forEach(function(k) { self.dispose(k); });
    }
};

window.addEventListener('beforeunload', function() { ChartManager.disposeAll(); });

// ─── Timer manager for centralized cleanup ───
var timerManager = {
    timers: {},

    setInterval: function(key, fn, delay) {
        this.clear(key);
        this.timers[key] = setInterval(fn, delay);
    },

    setTimeout: function(key, fn, delay) {
        this.clear(key);
        var self = this;
        this.timers[key] = setTimeout(function() { fn(); delete self.timers[key]; }, delay);
    },

    clear: function(key) {
        if (this.timers[key] != null) {
            clearInterval(this.timers[key]);
            clearTimeout(this.timers[key]);
            delete this.timers[key];
        }
    },

    clearAll: function() {
        var self = this;
        Object.keys(this.timers).forEach(function(k) {
            clearInterval(self.timers[k]);
            clearTimeout(self.timers[k]);
        });
        this.timers = {};
    }
};

function switchTab(tab) {
    RequestManager.cancelAll();
    timerManager.clearAll();

    // 保存当前 tab 状态（包括 scores tab 的日期选择）
    if (currentTab) {
        // 在缓存 scores tab 前，记住当前选择的日期
        if (currentTab === 'scores') {
            var scoreDateEl = document.getElementById('scoreDate');
            if (scoreDateEl && scoreDateEl.value) {
                pendingScoreDate = scoreDateEl.value;
            }
        }
        TabState.save(currentTab);
    }

    currentTab = tab;

    // Update nav active
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) { navItems[i].classList.remove('active'); }
    var btn = document.querySelector('.nav-item[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');

    // Try cached state
    var cached = TabState.load(tab);
    if (cached) {
        document.getElementById('content').innerHTML = cached.html;
        var scrollEl = document.querySelector('.content');
        if (scrollEl) scrollEl.scrollTop = cached.scrollTop;
        // 如果切回 scores tab，需要重新加载数据（确保日期选择和数据一致）
        if (tab === 'scores') {
            scoreClusterize = null;
            loadScoresPage(1);
        }
        return;
    }

    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    showSkeleton(c, 10);
    try {
        if (tab === 'home') await loadHomeTab(c);
        else if (tab === 'scores') await loadScoresTab(c);
        else if (tab === 'strategy') await loadStrategyTab(c);
        else if (tab === 'backtest') await loadBacktestTab(c);
        c.firstElementChild?.classList.add('tab-content');
    } catch(e) {
        showToast('加载失败，请重试', 'error');
        c.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败: ' + e.message + '</div>';
    }
}

function greetingByHour() {
    var h = new Date().getHours();
    if (h < 6)  return '夜深了 🌙';
    if (h < 11) return '早上好 ☀️';
    if (h < 14) return '中午好 🌤';
    if (h < 18) return '下午好 🌞';
    return '晚上好 🌙';
}

const REGIME_META = {
    hot:     { color: '#ff5252', emoji: '🔥', tag: '火热' },
    warm:    { color: '#ff9d45', emoji: '🌤', tag: '偏暖' },
    neutral: { color: '#00d4f0', emoji: '⚖️', tag: '震荡' },
    cool:    { color: '#7baaff', emoji: '🌧', tag: '偏冷' },
    cold:    { color: '#5b88c2', emoji: '❄️', tag: '冰点' },
    unknown: { color: '#888',    emoji: '·',  tag: '未知' },
};

async function loadMarketOverview() {
    try {
        const resp = await RequestManager.fetch('market', API + '/investor/market-overview');
        const d = resp.data || {};

        // Hero
        const greet = document.getElementById('heroGreeting');
        const sub = document.getElementById('heroSub');
        if (greet) greet.textContent = greetingByHour();
        const senti = d.sentiment || {};
        const meta = REGIME_META[senti.regime] || REGIME_META.unknown;
        if (sub) {
            sub.innerHTML = `大盘状态：<b style="color:${meta.color}">${meta.tag}</b> · ${senti.label || ''}` +
                (senti.total_amount ? ` · 今日总成交 <b>${senti.total_amount} 亿</b>` : '');
        }

        // Regime card
        const card = document.getElementById('regimeCard');
        const tip = document.getElementById('regimeTip');
        if (card) {
            card.style.borderColor = meta.color;
            card.innerHTML = `<div class="regime-emoji">${meta.emoji}</div><div class="regime-tag" style="color:${meta.color}">${meta.tag}</div>`;
        }
        if (tip) {
            const tipMap = {
                hot:     '注意追高风险，建议减仓',
                warm:    '可适度参与，重点关注个股',
                neutral: '精选个股，避免追涨杀跌',
                cool:    '控制仓位，少动多看',
                cold:    '防守为主，保留现金',
                unknown: '数据不足',
            };
            tip.textContent = tipMap[senti.regime] || '';
        }

        // Index cards
        const grid = document.getElementById('indexCards');
        const idxList = d.indices || [];
        const idxHtml = idxList.map(idx => {
            const chg = idx.pct_change || 0;
            const cls = chg >= 0 ? 'idx-up' : 'idx-down';
            const sign = chg >= 0 ? '+' : '';
            const trend5 = idx.trend_5d_pct;
            const trend5Html = trend5 == null ? '' :
                `<div class="idx-trend ${trend5>=0?'idx-up':'idx-down'}">5日 ${trend5>=0?'+':''}${trend5}%</div>`;
            return `
                <div class="idx-card">
                    <div class="idx-name">${idx.name}</div>
                    <div class="idx-price">${idx.close.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                    <div class="idx-pct ${cls}">${sign}${chg.toFixed(2)}%</div>
                    ${trend5Html}
                </div>`;
        }).join('');

        const north = d.north_bound || {};
        const northHtml = north.north_net_buy != null ? `
            <div class="idx-card north-card">
                <div class="idx-name">北向资金</div>
                <div class="idx-price ${(north.north_net_buy||0)>=0?'idx-up':'idx-down'}">${(north.north_net_buy/1e8).toFixed(1)}<span style="font-size:14px;color:var(--text-muted)"> 亿</span></div>
                <div class="idx-trend" style="color:var(--text-secondary);font-size:11px">${north.label || ''}</div>
            </div>
        ` : '';
        if (grid) grid.innerHTML = idxHtml + northHtml;

        const upd = document.getElementById('marketUpdatedAt');
        if (upd && d.updated_at) upd.textContent = '更新于 ' + d.updated_at;
    } catch(e) {
        console.error('market overview failed', e);
        const sub = document.getElementById('heroSub');
        if (sub) sub.textContent = '市场数据加载失败';
    }
}

async function loadTodayPicks() {
    const box = document.getElementById('todayPicks');
    const dateEl = document.getElementById('pickDate');
    const dateParam = dateEl && dateEl.value ? '&date=' + dateEl.value : '';
    try {
        const resp = await RequestManager.fetch('today', API + '/investor/today?limit=8' + dateParam);
        const items = (resp.data && resp.data.items) || [];
        const serverDate = resp.data && resp.data.date;
        // 自动回填日期（首次加载时）
        if (dateEl && !dateEl.value && serverDate) {
            dateEl.value = serverDate;
        }
        if (items.length === 0) {
            box.innerHTML = '<div class="empty-state">暂无推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到「高级筛选」跑一遍打分</span></div>';
            return;
        }
        box.innerHTML = items.map(it => {
            const ap = it.action_plan || {};
            const es = it.entry_strategy || {};
            const pp = it.position_plan || {};
            const sg = it.signal || {};
            const entry = ap.entry_price ? ap.entry_price.toFixed(2) : '--';
            const stop   = ap.stop_loss   ? ap.stop_loss.toFixed(2)   : '--';
            const tp     = ap.take_profit ? ap.take_profit.toFixed(2) : '--';
            const rr     = ap.risk_reward_ratio;
            const rrCls  = rr == null ? '' : (rr >= 2 ? 'rr-good' : (rr >= 1 ? 'rr-ok' : 'rr-bad'));
            const rrHtml = rr != null ? `<span class="rr-tag ${rrCls}">盈亏比 ${rr.toFixed(2)}</span>` : '';
            const reasons = (it.reasons || []).map(r => `<span class="reason-chip">${r}</span>`).join('');
            const pctChg = it.latest_pct;
            const pctHtml = pctChg != null ?
                `<span class="${pctChg>=0?'idx-up':'idx-down'}" style="font-weight:600">${pctChg>=0?'+':''}${pctChg.toFixed(2)}%</span>` : '';

            // ── 信号灯徽章 ──
            const sigClass = 'sig-' + (sg.level || 'wait');
            const sigHtml = sg.label ? `
                <div class="signal-badge ${sigClass}" title="${(sg.reasons||[]).concat(sg.warnings||[]).join(' · ')}">
                    <span class="sig-emoji">${sg.emoji||'⚪'}</span>
                    <span class="sig-label">${sg.label}</span>
                </div>
                <div class="signal-reasons">
                    ${(sg.reasons||[]).map(r => `<span class="reason-chip sig-reason-good">${r}</span>`).join('')}
                    ${(sg.warnings||[]).map(w => `<span class="reason-chip sig-reason-warn">⚠ ${w}</span>`).join('')}
                </div>
            ` : '';

            // ── 3 个挂单位置 ──
            let entryHtml = '';
            if (es.aggressive && es.stable && es.conservative) {
                const clsA = es.recommend === 'aggressive' ? 'entry-pick' : '';
                const clsS = es.recommend === 'stable' ? 'entry-pick' : '';
                const clsC = es.recommend === 'conservative' ? 'entry-pick' : '';
                entryHtml = `
                <div class="entry-strategy">
                    <div class="entry-strategy-head">
                        <span>📍 挂单位置</span>
                        <span class="entry-recommend">${es.recommend_hint||''}</span>
                    </div>
                    <div class="entry-prices">
                        <div class="entry-price ${clsA}">
                            <div class="entry-tag">激进</div>
                            <div class="entry-val">${es.aggressive.toFixed(2)}</div>
                            <div class="entry-sub">现价 -1%</div>
                        </div>
                        <div class="entry-price ${clsS}">
                            <div class="entry-tag">稳健</div>
                            <div class="entry-val">${es.stable.toFixed(2)}</div>
                            <div class="entry-sub">现价 -3%</div>
                        </div>
                        <div class="entry-price ${clsC}">
                            <div class="entry-tag">保守</div>
                            <div class="entry-val">${es.conservative.toFixed(2)}</div>
                            <div class="entry-sub">回踩 -6%</div>
                        </div>
                    </div>
                </div>`;
            }

            // ── 建仓分批 ──
            let ppHtml = '';
            if (pp.batches && pp.batches.length) {

async function loadRecHistory() {
    const summaryEl = document.getElementById('recHistorySummary');
    const tableEl = document.getElementById('recHistoryTable');
    const updEl = document.getElementById('recHistoryUpdatedAt');
    try {
        const resp = await RequestManager.fetch('rec-history', API + '/investor/recommendations/history?days=30');
        const d = resp.data || {};
        const items = d.items || [];
        const summary = d.summary || {};
        if (updEl) updEl.textContent = '统计区间：近 ' + (d.days || 30) + ' 天';

        if (!items || items.length === 0) {
            if (tableEl) tableEl.innerHTML = '<div class="empty-state">暂无历史推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到「每日打分」生成推荐</span></div>';
            return;
        }

        // 汇总卡片
        if (summaryEl && summary.total) {
            const avgCls = summary.avg_return >= 0 ? 'idx-up' : 'idx-down';
            const avgSign = summary.avg_return >= 0 ? '+' : '';
            const bestCls = summary.best_return >= 0 ? 'idx-up' : 'idx-down';
            const worstCls = summary.worst_return >= 0 ? 'idx-up' : 'idx-down';
            summaryEl.innerHTML = `
                <div class="metrics-row" style="margin-bottom:12px">
                    <div class="metric-card"><div class="val">${summary.total}</div><div class="lbl">推荐总数</div></div>
                    <div class="metric-card"><div class="val" style="color:${summary.win_rate>=50?'var(--green, #10b981)':'var(--danger)'}">${summary.win_rate}%</div><div class="lbl">胜率</div></div>
                    <div class="metric-card"><div class="val ${avgCls}">${avgSign}${summary.avg_return}%</div><div class="lbl">平均收益</div></div>
                    <div class="metric-card"><div class="val ${bestCls}">+${summary.best_return}%</div><div class="lbl">最佳</div></div>
                    <div class="metric-card"><div class="val ${worstCls}">${summary.worst_return}%</div><div class="lbl">最差</div></div>
                    <div class="metric-card"><div class="val" style="color:var(--danger)">${summary.stop_loss_count||0}</div><div class="lbl">触发止损</div></div>
                    <div class="metric-card"><div class="val" style="color:var(--green, #10b981)">${summary.take_profit_count||0}</div><div class="lbl">触发止盈</div></div>
                </div>`;
        }

        // 明细表格（只显示前 15 条）
        if (tableEl) {
            const show = items.slice(0, 15);
            let html = '<div class="table-wrapper"><table><thead><tr>';
            html += '<th>代码</th><th>名称</th><th>推荐日</th><th>买入价</th><th>当前价</th><th>收益</th><th>状态</th>';
            html += '</tr></thead><tbody>';
            show.forEach(r => {
                const pnlCls = r.pnl_pct >= 0 ? 'positive' : 'negative';
                const sign = r.pnl_pct >= 0 ? '+' : '';
                let status = '持有中';
                if (r.hit_stop_loss) status = '<span style="color:var(--danger)">已止损</span>';
                else if (r.hit_take_profit) status = '<span style="color:var(--green, #10b981)">已止盈</span>';
                html += `<tr>
                    <td><span class="code-link" onclick="openKline('${r.code}')">${r.code}</span></td>
                    <td>${r.name||''}</td>
                    <td>${r.scan_date||''}</td>
                    <td>${r.entry_price}</td>
                    <td>${r.current_price}</td>
                    <td class="${pnlCls}">${sign}${r.pnl_pct}%</td>
                    <td>${status}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            tableEl.innerHTML = html;
        }
    } catch(e) {
        if (tableEl) tableEl.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

async function submitAddPosition() {
    const body = {
        code: document.getElementById('addPosCode').value.trim(),
        shares: parseInt(document.getElementById('addPosShares').value) || 0,
        cost_price: parseFloat(document.getElementById('addPosCost').value) || 0,
        stop_loss: parseFloat(document.getElementById('addPosStop').value) || null,
        take_profit: parseFloat(document.getElementById('addPosTP').value) || null,
        note: document.getElementById('addPosNote').value.trim(),
    };
    if (!body.code || !body.shares || !body.cost_price) {
        showToast('请填写代码/股数/成本价', 'warning');
        return;
    }
    try {
        const resp = await RequestManager.fetch('add-pos', API + '/api/investor/positions', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body),
        });
        if (resp.success) {
            showToast('已添加', 'success');
            closeModal();
            loadMyPositions();
            loadAlertsBanner();
        } else {
            showToast(resp.error || '添加失败', 'error');
        }
    } catch(e) {
        showToast('网络错误', 'error');
    }
}

async function loadScoresPage(page) {
    page = page || 1;
    var container = document.getElementById('scoreTableContainer');
    if (container) showSkeleton(container, 10);

    try {
        var scoreDateEl = document.getElementById('scoreDate');
        var selectedDate = scoreDateEl && scoreDateEl.value ? scoreDateEl.value : '';
        var dateParam = selectedDate ? '&date=' + encodeURIComponent(selectedDate) : '';
        
        // 调用新的API获取每日打分记录（一次性加载全部数据，前端筛选）
        var resp = await RequestManager.fetch('scores',
            API + '/scoring/daily?page=1&per_page=5000' + dateParam);
        
        _scoreData = resp.data || [];
        currentScorePage = 1;
        scoreTotalPages = 1;

        // 获取返回的日期（如果没有选择日期，使用API返回的日期）
        var returnedDate = resp.date || '';
        
        // 如果用户没有选择日期，用返回的日期更新输入框
        if (scoreDateEl && returnedDate && !selectedDate) {
            scoreDateEl.value = returnedDate;
        }
        
        // 使用实际查看的日期显示在头部
        var displayDate = selectedDate || returnedDate;
        document.getElementById('last-update').textContent = displayDate ? '最新打分 · ' + displayDate : '暂无数据';
        document.getElementById('scoreCount').textContent = resp.pagination.total + ' 只股票';

        // Update metrics
        var metricsEl = document.getElementById('scoresMetrics');
        if (metricsEl && resp.pagination.total > 0) {
            // 统计板块分布
            var kcbCount = 0, cybCount = 0, smallCapCount = 0;
            for (var i = 0; i < _scoreData.length; i++) {
                var code = (_scoreData[i].code || '').substring(0, 3);
                if (code === '688') kcbCount++;
                if (code === '300' || code === '301') cybCount++;
                if ((_scoreData[i].market_cap || 0) > 0 && (_scoreData[i].market_cap || 0) <= 100) smallCapCount++;
            }
            metricsEl.innerHTML = '<div class="metrics-row">' +
                '<div class="metric-card"><div class="val">' + _scoreData[0].score + '</div><div class="lbl">最高分 · ' + _scoreData[0].code + '</div></div>' +
                '<div class="metric-card"><div class="val">' + resp.pagination.total + '</div><div class="lbl">总计股票数</div></div>' +
                '<div class="metric-card"><div class="val">' + kcbCount + '</div><div class="lbl">科创板</div></div>' +
                '<div class="metric-card"><div class="val">' + cybCount + '</div><div class="lbl">创业板</div></div>' +
                '<div class="metric-card"><div class="val">' + smallCapCount + '</div><div class="lbl">≤100亿小票</div></div>' +
                '</div>';
        } else if (metricsEl) {
            // 如果没有记录，显示提示信息
            var message = resp.message || '暂无打分数据';
            var showSyncBtn = resp.has_records === false;
            var html = '<div class="empty-state">' + message;

}

    var ruleName = (row.rule_name || '').replace(/"/g, '&quot;');

        '<td style="color:var(--text-muted);width:40px">' + (idx != null ? idx : '') + '</td>' +

function debounceFilter() {
    timerManager.clear('filter');
    timerManager.setTimeout('filter', filterScores, 300);
}

function filterScores() {
    var keyword = (document.getElementById('stockSearch') ? document.getElementById('stockSearch').value : '').toLowerCase();
    var minScore = parseFloat(document.getElementById('minScore') ? document.getElementById('minScore').value : '0') || 0;

    // 板块筛选：获取复选框状态（勾选=排除该板块）
    var filterKCB = document.getElementById('filterKCB') ? document.getElementById('filterKCB').checked : false;
    var filterCYB = document.getElementById('filterCYB') ? document.getElementById('filterCYB').checked : false;

    // 市值筛选（单位：亿元，0 表示不筛选）
    var minMarketCap = parseFloat(document.getElementById('minMarketCap') ? document.getElementById('minMarketCap').value : '0') || 0;

    var filtered = _scoreData;
    if (keyword) {
        filtered = _scoreData.filter(function(r) {
            return (r.code || '').toLowerCase().indexOf(keyword) !== -1 ||
                   (r.name || '').toLowerCase().indexOf(keyword) !== -1;
        });
    }
    if (minScore > 0) {
        filtered = filtered.filter(function(r) { return (r.score || 0) >= minScore; });
    }

    // 板块筛选：勾选复选框则排除对应板块（688=科创板，300/301=创业板）
    if (filterKCB || filterCYB) {
        filtered = filtered.filter(function(r) {
            var code = r.code || '';
            var prefix = code.substring(0, 3);
            // 科创板：688 开头
            if (filterKCB && prefix === '688') return false;
            // 创业板：300 或 301 开头
            if (filterCYB && (prefix === '300' || prefix === '301')) return false;
            return true;
        });
    }

    // 市值筛选（≤ 选中的市值）
    if (minMarketCap > 0) {
        filtered = filtered.filter(function(r) { return (r.market_cap || 0) <= minMarketCap; });
    }

    var countEl = document.getElementById('scoreCount');
    if (countEl) {
        countEl.textContent = filtered.length === 0 ? '无匹配结果' : '显示 ' + filtered.length + ' / ' + _scoreData.length + ' 条';
    }

    if (scoreClusterize) {
        scoreClusterize.update(filtered.map(function(row, i) { return rowToScoreHTML(row, i + 1); }));
    } else {
        renderScoreTable(filtered);
    }
}

async function maybeAutoSync() {

function onAutoSyncDone(msg) {
    if (msg) showToast(msg, 'success');

    if (typeof currentTab !== 'undefined' && currentTab === 'home') {

    } else {

// 检查今日推荐是否最新（基于 today 接口返回的 date），不是今天就触发重算
async function ensureTodayRecs(silent) {
    try {
        const resp = await RequestManager.fetch('today-reco', API + '/investor/today?limit=1');
        const today = new Date().toISOString().slice(0, 10);
        const lastDate = resp && resp.data && resp.data.date;
        if (lastDate === today) return;  // 推荐已是今天
        if (silent) showToast('同步行情完成，开始重算今日打分…', 'info', 3500);
        // 触发重算（异步任务），拿到 task_id 后轮询
        const r = await RequestManager.fetch('recalc-start-auto', API + '/sync/recalc', { method: 'POST' });
        if (!r || !r.task_id) {
            showToast('自动重算启动失败，请手动点击"立即重算打分"', 'warning', 4000);
            return;
        }
        pollRecalcTask(r.task_id, function(ok, msg) {
            showToast(ok ? ('今日推荐已更新 · ' + (msg || '')) : ('重算失败: ' + (msg || '')), ok ? 'success' : 'error');
            // 重算完后，如果用户在首页就刷新一下数据
            if (typeof currentTab !== 'undefined' && currentTab === 'home') {
                const c = document.getElementById('content');
                if (c) loadHomeTab(c);
            }
        });
    } catch (e) {
        console.warn('[ensureTodayRecs] 失败:', e);
    }
}

function showSyncProgress() {

function hideSyncProgress() {
    timerManager.clear('syncPoll');
    timerManager.setTimeout('syncHide', function() {
        document.getElementById('syncProgress').style.display = 'none';
    }, 5000);
}

function pollSyncProgress(onDone) {
    timerManager.setInterval('syncPoll', function() {
        RequestManager.fetch('sync-progress', API + '/sync/progress').then(function(resp) {
            var p = resp.data;
            var pct = p.total > 0 ? Math.round(p.current / p.total * 100) : 0;
            document.getElementById('syncProgressFill').style.width = pct + '%';
            document.getElementById('syncProgressPct').textContent = pct + '%';
            document.getElementById('syncProgressText').textContent =
                '同步中: ' + p.current + '/' + p.total + '  成功:' + p.success + '  失败:' + p.failed;
            if (!p.running) {
                hideSyncProgress();
                showToast(p.message || '同步完成', p.last_error ? 'warning' : 'success');
                if (onDone) onDone(p.message || '同步完成');
            }
        }).catch(function(e) { hideSyncProgress(); if (onDone) onDone(''); });
    }, 1000);
}

// ─── 首页"数据状态"面板 ─────────────────────────────────
async function loadSyncStatusPanel() {
    const syncState = document.getElementById('syncDataState');
    const syncTime  = document.getElementById('syncDataTime');
    const calcState = document.getElementById('recalcState');
    const calcTime  = document.getElementById('recalcTime');
    const hint      = document.getElementById('dataStatusHint');
    if (!syncState || !calcState) return;

    const today = new Date().toISOString().slice(0, 10);

    // ① 行情数据状态：/api/sync/auto-status
    try {
        const r = await RequestManager.fetch('sync-auto-status', API + '/sync/auto-status');
        const d = r.data || {};
        if (d.running) {
            syncState.className = 'state run';
            syncState.innerHTML = '<span class="badge badge-running">同步中</span>';
        } else if (!d.last_time) {
            syncState.className = 'state warn';
            syncState.innerHTML = '⚠ 今日尚未同步';
        } else {
            const lastDate = String(d.last_time).split(' ')[0];
            if (lastDate === today) {
                syncState.className = 'state ok';
                syncState.innerHTML = '✓ 今日已同步';
            } else {
                syncState.className = 'state warn';
                syncState.innerHTML = '⚠ 上次同步是 ' + lastDate;
            }
        }
        syncTime.textContent = d.last_time ? '上次同步: ' + d.last_time : '从未同步';
        if (hint && d.running) hint.textContent = '后台正在同步…';
    } catch (e) {
        syncState.className = 'state bad';
        syncState.innerHTML = '✗ 状态读取失败';
        syncTime.textContent = e.message || '';
    }

    // ② 推荐打分状态：/api/investor/today 返回的 date 字段就是 stock_signal 的最新 scan_date
    try {
        const r = await RequestManager.fetch('today-reco-status', API + '/investor/today?limit=1');
        const d = r.data || {};
        const lastDate = d.date;
        if (!lastDate) {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 暂无打分记录';
            calcTime.textContent = '请到"高级筛选"跑一次打分';
        } else if (lastDate === today) {
            calcState.className = 'state ok';
            calcState.innerHTML = '✓ 今日推荐已更新';
        } else {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 推荐基于 ' + lastDate + ' 数据';
        }
        calcTime.textContent = '最新打分日期: ' + (lastDate || '—');
    } catch (e) {
        calcState.className = 'state bad';
        calcState.innerHTML = '✗ 状态读取失败';
        calcTime.textContent = e.message || '';
    }

    // ③ 顺手提示：是否有正在跑的同步/重算任务
    const ip = document.getElementById('homeInlineProgress');
    if (ip && !ip.textContent) ip.textContent = '';
}

// 底部内联进度条（左文 + 中条 + 右百分比）
function setInlineProgress(stage, current, total, message) {
    const ip = document.getElementById('homeInlineProgress');
    if (!ip) return;
    if (!stage) {
        ip.innerHTML = '';
        return;
    }
    let pct = 0;
    if (typeof current === 'number' && typeof total === 'number' && total > 0) {
        pct = Math.min(100, Math.round(current / total * 100));
    } else if (stage === 'sync-finish' || stage === 'recalc-finish') {
        pct = 100;
    }
    const label = ({
        'sync':         '同步行情',
        'recalc':       '重算打分',
        'sync-finish':  '✓ 行情同步完成',
        'recalc-finish':'✓ 打分重算完成',
    })[stage] || stage;
    ip.innerHTML =
        '<span>' + label + '</span>' +
        '<span class="bar"><div style="width:' + pct + '%"></div></span>' +
        '<span style="font-family:var(--font-mono);min-width:42px;text-align:right;">' + pct + '%</span>' +
        (message ? ' <span style="color:var(--text-muted)">· ' + message + '</span>' : '');
}

// 轮询重算任务（task_queue 提交的任务）
function pollRecalcTask(taskId, onDone) {
    if (!taskId) { onDone && onDone(false, 'task_id 缺失'); return; }
    timerManager.setInterval('recalcPoll', function() {
        RequestManager.fetch('recalc-status-' + taskId, API + '/sync/status/' + taskId)
            .then(function(resp) {
                const t = resp.data || {};
                setInlineProgress('recalc', t.progress || 0, 100, t.message || '');
                if (t.status === 'success') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(true, t.message || t.result || '');
                } else if (t.status === 'error') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(false, t.message || '重算失败');
                }
                // pending / running 继续轮询
            })
            .catch(function(e) {
                timerManager.clear('recalcPoll');
                onDone && onDone(false, e.message || '轮询失败');
            });
    }, 1500);
}

let strategySort = { key: 'fitness', dir: -1 };

const STRATEGY_COLS = [
    { key: 'id', label: '编号', sortable: true },
    { key: 'is_active', label: '状态', sortable: true },
    { key: 'rule_name', label: '策略名称', sortable: true },
    { key: 'rule_type', label: '类型', sortable: true },
    { key: 'fitness', label: '评分', sortable: true },
    { key: 'annual_return', label: '年化收益', sortable: true },
    { key: 'win_rate', label: '胜率', sortable: true },
    { key: 'sharpe_ratio', label: '夏普', sortable: true },
    { key: 'max_drawdown', label: '最大回撤', sortable: true },
    { key: 'total_trades', label: '交易数', sortable: true },
    { key: null, label: '操作', sortable: false }
];

function sortRules(rules) {
    const { key, dir } = strategySort;
    return [...rules].sort((a, b) => {
        let va = a[key] ?? 0, vb = b[key] ?? 0;
        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();
        if (va < vb) return -dir;
        if (va > vb) return dir;
        return 0;
    });
}

function renderStrategyTable(rules) {
    let html = '';
    if (rules.length > 0) {
        const activeCount = rules.filter(r => r.is_active).length;
        const topFitness = rules.reduce((best, r) => (r.fitness||0) > (best.fitness||0) ? r : best, rules[0]);
        const avgReturn = (rules.reduce((s,r) => s + (r.annual_return||0), 0) / rules.length).toFixed(1);

        html += `<div class="metrics-row">
            <div class="metric-card">
                <div class="val">${(topFitness.fitness||0).toFixed(4)}</div>
                <div class="lbl">最高评分 · #${topFitness.id}</div>
            </div>
            <div class="metric-card">
                <div class="val ${parseFloat(avgReturn) >= 0 ? 'positive' : 'negative'}">${avgReturn}%</div>
                <div class="lbl">平均年化收益</div>
            </div>
            <div class="metric-card">
                <div class="val">${activeCount}</div>
                <div class="lbl">已启用策略</div>
            </div>
            <div class="metric-card">
                <div class="val" style="color:var(--text-muted)">${rules.length}</div>
                <div class="lbl">策略总数</div>
            </div>
        </div>`;

        html += `<div class="table-wrapper"><table><thead><tr>`;
        STRATEGY_COLS.forEach(col => {
            if (col.sortable) {
                const active = strategySort.key === col.key;
                const arrow = active ? (strategySort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
                html += `<th style="cursor:pointer;user-select:none" onclick="strategySortBy('${col.key}')">${col.label}${arrow}</th>`;
            } else {
                html += `<th>${col.label}</th>`;
            }
        });
        html += `</tr></thead><tbody>`;

        const sorted = sortRules(rules);
        sorted.forEach(r => {
            const retCls = (r.annual_return||0) >= 0 ? 'positive' : 'negative';
            html += `<tr>
                <td style="color:var(--accent);font-weight:600">#${r.id}</td>
                <td><span class="toggle ${r.is_active?'on':''}" onclick="toggleRule(${r.id},this)"></span></td>
                <td><span class="code-link" onclick="viewRuleTrades(${r.id},'${(r.rule_name||'').replace(/'/g,"\'")}')">${r.rule_name}</span></td>
                <td><span class="badge badge-info">${r.rule_type}</span></td>
                <td style="font-weight:600">${(r.fitness||0).toFixed(4)}</td>
                <td class="${retCls}">${(r.annual_return||0).toFixed(1)}%</td>
                <td>${(r.win_rate||0).toFixed(1)}%</td>
                <td>${(r.sharpe_ratio||0).toFixed(2)}</td>
                <td class="negative">${(r.max_drawdown||0).toFixed(1)}%</td>
                <td>${r.total_trades||0}</td>
                <td><button class="btn btn-sm" onclick="showVersions(${r.id})">版本</button> <button class="btn btn-danger btn-sm" onclick="deleteRule(${r.id})">删除</button></td></tr>`;
        });
        html += `</tbody></table></div>`;
    }
    return html;
}

function strategySortBy(key) {
    if (strategySort.key === key) {
        strategySort.dir *= -1;
    } else {
        strategySort.key = key;
        strategySort.dir = -1;
    }
    // 使用 innerHTML 替换内容，保留外层 div（避免 id="strategyRules" 被销毁导致后续排序失效）
    const rulesEl = document.getElementById('strategyRules');
    if (rulesEl && window._strategyRules) {
        rulesEl.innerHTML = renderStrategyTable(window._strategyRules);
    }
}

function saveBTSetting(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

async function startBacktest() {
    const ruleId = document.getElementById('btRule').value;
    const start = document.getElementById('btStart').value, end = document.getElementById('btEnd').value;
    const stopLoss = parseFloat(document.getElementById('btStopLoss').value) || -5;

    const st = document.getElementById('btStatus');

    const resp = await RequestManager.fetch('bt-run', API + '/backtest/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        rule_id:parseInt(ruleId),start_date:start,end_date:end,
        stop_loss:stopLoss/100, take_profit:takeProfit/100, holding_max:holdingMax
    })});
    if (resp.success) { pollBt(0); }
    else { st.innerHTML = '<span class="badge badge-error">'+(resp.error||'')+'</span>'; }
}

const BT_MAX_POLLS = 400;

async function pollBt(n) {
    const st = document.getElementById('btStatus');
    if (n >= BT_MAX_POLLS) {
        st.innerHTML = '<span class="badge badge-error">超时</span>';
        return;
    }
    const resp = await RequestManager.fetch('bt-status', API + '/backtest/status');
    if (resp.data.running) {
        const p = resp.data.progress || 0, t = resp.data.total || 0;
        st.innerHTML = '<span class="badge badge-running">回测中 ' + (t > 0 ? `(${p}/${t})` : '') + '</span>';
        timerManager.setTimeout('btPoll', function() { pollBt(n + 1); }, 3000);
    }
    else if (resp.data.error) { st.innerHTML = '<span class="badge badge-error">'+resp.data.error+'</span>'; }
    else if (resp.data.result_id) { st.innerHTML = '<span class="badge badge-done">完成</span>'; viewResult(resp.data.result_id); }
    else { st.innerHTML = '<span class="badge badge-done">完成</span>'; loadTab('backtest'); }
}

    const metrics = ['annual_return', 'win_rate', 'sharpe_ratio', 'max_drawdown', 'total_trades'];
    const metricLabels = ['年化收益(%)', '胜率(%)', '夏普比率', '最大回撤(%)', '总交易数'];
    const bestAnnual = Math.max(...results.map(r => r.annual_return || -Infinity));
    const bestDrawdown = Math.max(...results.map(r => r.max_drawdown || -Infinity));

    let html = '<div style="overflow-x:auto;"><table><thead><tr><th>指标</th>';
    results.forEach(r => html += `<th>${r.rule_name || '#' + r.result_id}</th>`);
    html += '</tr></thead><tbody>';

    metrics.forEach((m, i) => {
        html += `<tr><td>${metricLabels[i]}</td>`;
        results.forEach(r => {
            const val = r[m];
            const display = val != null ? (typeof val === 'number' ? val.toFixed(2) : val) : '--';
            let style = '';
            if ((m === 'annual_return' && val === bestAnnual) || (m === 'max_drawdown' && val === bestDrawdown)) {
                style = 'color:var(--green, #10b981);font-weight:bold;';
            }
            html += `<td style="${style}">${display}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    showModal('回测结果对比', html);
}

async function showScoreHistory(code) {
    const days = document.getElementById('historyDays')?.value || '30';
    const resp = await RequestManager.fetch('score-history-' + code, API + `/scoring/stock/${code}/history?days=${days}`);

    const modalHtml = `
        <div>
            <select id="historyDays" onchange="showScoreHistory('${code}')" style="margin-bottom:12px;">
                <option value="7" ${days==='7'?'selected':''}>近7天</option>
                <option value="30" ${days==='30'?'selected':''}>近30天</option>
                <option value="60" ${days==='60'?'selected':''}>近60天</option>
                <option value="90" ${days==='90'?'selected':''}>近90天</option>
            </select>
            <div id="historyChart" style="width:100%;height:350px;"></div>
        </div>`;

    showModal(code + ' 打分趋势', modalHtml);

        document.getElementById('historyChart').innerHTML =
            '<div style="text-align:center;padding:60px;color:var(--text-secondary);">数据不足</div>';
        return;
    }

    const byRule = {};
    const allDates = new Set();
    resp.data.forEach(d => {
        if (!byRule[d.rule_name]) byRule[d.rule_name] = {};
        byRule[d.rule_name][d.trade_date] = d.score;
        allDates.add(d.trade_date);
    });

    const dates = Array.from(allDates).sort();
    const colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'];

    const series = Object.entries(byRule).map(([rule, dateMap], idx) => ({
        name: rule,
        type: 'line',
        smooth: true,
        data: dates.map(d => dateMap[d] ?? null),
        lineStyle: { color: colors[idx % colors.length] },
    }));

    const xLabels = dates.map(d => parseInt(days) <= 7 ? d.slice(5) : d);

    var scoreChartInst = ChartManager.get('scoreHistory', document.getElementById('historyChart'));
    scoreChartInst.setOption({
        tooltip: { trigger: 'axis' },
        toolbox: { feature: { saveAsImage: { title: '下载' } } },
        xAxis: { type: 'category', data: xLabels, axisLabel: { rotate: 45, fontSize: 10 } },
        yAxis: { type: 'value', name: '分' },
        series: series,
        grid: { left: 50, right: 20, top: 30, bottom: 60 },
    });
    if (!window._scoreHistoryResizeBound) {
        window._scoreHistoryResizeBound = true;
        window.addEventListener('resize', function() {
            var inst = ChartManager.instances['scoreHistory'];
            if (inst) inst.resize();
        });
    }
}

// ─── K-line overlay ───
function klineColor(d) {
    if (!d) return '#ef5350';
    if (d.limitType === 'limit_up') return '#ab47bc';
    if (d.limitType === 'limit_down') return '#42a5f5';
    return d.close >= d.open ? '#ef5350' : '#26a69a';
}

// ─── 技术指标计算工具函数 ───

/**
 * 计算 EMA（指数移动平均线）
 * @param {number[]} data - 收盘价序列
 * @param {number} period - 周期
 * @returns {number[]} EMA 序列
 */
function calcEMA(data, period) {
    var k = 2 / (period + 1);
    var ema = [data[0]];
    for (var i = 1; i < data.length; i++) {
        ema.push(data[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

/**
 * 计算 MACD 指标
 * 返回 { dif, dea, macd } 三个数组，长度与 kdata 一致
 */
function calcMACD(kdata, shortPeriod, longPeriod, signalPeriod) {
    shortPeriod = shortPeriod || 12;
    longPeriod = longPeriod || 26;
    signalPeriod = signalPeriod || 9;
    var closes = kdata.map(function(d) { return d.close; });
    var emaShort = calcEMA(closes, shortPeriod);
    var emaLong = calcEMA(closes, longPeriod);
    var dif = emaShort.map(function(v, i) { return v - emaLong[i]; });
    var dea = calcEMA(dif, signalPeriod);
    // MACD柱 = (DIF - DEA) * 2，用于柱状图显示
    var macd = dif.map(function(v, i) { return (v - dea[i]) * 2; });
    return { dif: dif, dea: dea, macd: macd };
}

/**
 * 计算 KDJ 指标
 * 返回 { k, d, j } 三个数组
 */
function calcKDJ(kdata, n, m1, m2) {
    n = n || 9;
    m1 = m1 || 3;
    m2 = m2 || 3;
    var kArr = [], dArr = [], jArr = [];
    var prevK = 50, prevD = 50; // 初始值

    for (var i = 0; i < kdata.length; i++) {
        // 取最近 n 天的最高价和最低价
        var start = Math.max(0, i - n + 1);
        var highMax = -Infinity, lowMin = Infinity;
        for (var j = start; j <= i; j++) {
            if (kdata[j].high > highMax) highMax = kdata[j].high;
            if (kdata[j].low < lowMin) lowMin = kdata[j].low;
        }
        var rsv = highMax === lowMin ? 50 : ((kdata[i].close - lowMin) / (highMax - lowMin)) * 100;
        // K = 前K * (m1-1)/m1 + RSV/m1
        var curK = prevK * (m1 - 1) / m1 + rsv / m1;
        // D = 前D * (m2-1)/m2 + K/m2
        var curD = prevD * (m2 - 1) / m2 + curK / m2;
        // J = 3K - 2D
        var curJ = 3 * curK - 2 * curD;
        kArr.push(curK);
        dArr.push(curD);
        jArr.push(curJ);
        prevK = curK;
        prevD = curD;
    }
    return { k: kArr, d: dArr, j: jArr };
}

// 当前激活的副图指标（可多选）
var klineIndicators = { vol: true, macd: false, kdj: false };

/**
 * 根据当前激活的指标，动态构建 ECharts 配置
 */
function buildKlineOption(kdata, dates, ohlc, volData, marks) {
    var ind = klineIndicators;
    // 决定需要哪些副图 grid
    var subCharts = [];
    if (ind.vol) subCharts.push('vol');
    if (ind.macd) subCharts.push('macd');
    if (ind.kdj) subCharts.push('kdj');
    // 至少保留成交量
    if (subCharts.length === 0) { subCharts.push('vol'); ind.vol = true; }

    var subCount = subCharts.length;
    // 主图占固定 55% 高度，剩余空间平分给副图
    var mainHeight = '55%';
    // 每个副图高度 = (100 - 55 - 顶部留白 - 底部留白) / subCount
    // 留出约 8% 的顶部标题+间距空间，底部 dataZoom 约 30px
    var availableSubPct = 38; // 副图可用百分比空间
    var eachSubHeight = Math.floor(availableSubPct / subCount);
    var gap = 2; // 副图之间间距百分比

    // 构建 grid 数组
    var grids = [{ left: '10%', right: '10%', top: 50, height: mainHeight }];
    var xAxisArr = [{ type: 'category', data: dates, gridIndex: 0, axisLabel: { color: '#6b7a9a', rotate: 30 }, axisLine: { lineStyle: { color: '#182240' } } }];
    var yAxisArr = [{ scale: true, gridIndex: 0, axisLabel: { color: '#6b7a9a' }, splitLine: { lineStyle: { color: '#111832' } } }];
    var seriesArr = [
        { type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 20 }
    ];

    // 动态计算每个副图的 top 位置
    // 主图底部约在 55% + 50px，从约 60% 开始放置副图
    var subStartTop = 60;
    for (var i = 0; i < subCharts.length; i++) {
        var topVal = (subStartTop + i * (eachSubHeight + gap)) + '%';
        var gridIdx = i + 1;
        grids.push({ left: '10%', right: '10%', top: topVal, height: eachSubHeight + '%' });
        xAxisArr.push({ type: 'category', data: dates, gridIndex: gridIdx, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#182240' } } });
        yAxisArr.push({ scale: true, gridIndex: gridIdx, axisLabel: { color: '#6b7a9a', fontSize: 10 }, splitLine: { show: false }, splitNumber: 2 });

        var chartType = subCharts[i];
        if (chartType === 'vol') {
            seriesArr.push({ type: 'bar', name: '成交量', data: volData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '60%' });
        } else if (chartType === 'macd') {
            var macdData = calcMACD(kdata);
            // MACD 柱状图（正值红色，负值绿色）
            var macdBarData = macdData.macd.map(function(v) {
                return { value: v, itemStyle: { color: v >= 0 ? '#ef5350' : '#26a69a' } };
            });
            seriesArr.push(
                { type: 'bar', name: 'MACD', data: macdBarData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '60%' },
                { type: 'line', name: 'DIF', data: macdData.dif, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#00d4f0' } },
                { type: 'line', name: 'DEA', data: macdData.dea, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#f5a623' } }
            );
        } else if (chartType === 'kdj') {
            var kdjData = calcKDJ(kdata);
            seriesArr.push(
                { type: 'line', name: 'K', data: kdjData.k, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#00d4f0' } },
                { type: 'line', name: 'D', data: kdjData.d, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#f5a623' } },
                { type: 'line', name: 'J', data: kdjData.j, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#ab47bc' } }
            );
        }
    }

    // dataZoom 联动所有 xAxis
    var allXAxisIndexes = [];
    for (var x = 0; x <= subCount; x++) allXAxisIndexes.push(x);

    var opt = {
        title: { text: '', left: 'center', textStyle: { color: '#dde4f0', fontSize: 14, fontFamily: "'JetBrains Mono', monospace" } },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            formatter: function(params) {
                var idx = params[0]?.dataIndex;
                if (idx == null) return '';
                var d = kdata[idx];
                var chgColor = d.chgPct >= 0 ? '#ef5350' : '#26a69a';
                var limitLabel = d.limitType === 'limit_up' ? ' [涨停]' : d.limitType === 'limit_down' ? ' [跌停]' : '';
                var html = '<b>' + d.date + '</b>' + limitLabel + '<br/>' +
                    '开: ' + d.open.toFixed(2) + ' &nbsp; 高: ' + d.high.toFixed(2) + '<br/>' +
                    '收: ' + d.close.toFixed(2) + ' &nbsp; 低: ' + d.low.toFixed(2) + '<br/>' +
                    '涨跌幅: <span style="color:' + chgColor + ';font-weight:bold">' + (d.chgPct >= 0 ? '+' : '') + d.chgPct.toFixed(2) + '%</span><br/>' +
                    '成交量: ' + (d.vol / 10000).toFixed(0) + '万';
                // 追加指标数据到 tooltip
                params.forEach(function(p) {
                    if (p.seriesName === 'DIF') html += '<br/>DIF: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (p.seriesName === 'DEA') html += '<br/>DEA: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (p.seriesName === 'MACD') html += '<br/>MACD: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (p.seriesName === 'K') html += '<br/>K: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (p.seriesName === 'D') html += '<br/>D: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (p.seriesName === 'J') html += '<br/>J: ' + (p.value != null ? p.value.toFixed(2) : '-');
                });
                return html;
            }
        },
        grid: grids,
        xAxis: xAxisArr,
        yAxis: yAxisArr,
        dataZoom: [
            { type: 'slider', xAxisIndex: allXAxisIndexes, start: 50, end: 100, height: 25, bottom: 0,
              borderColor: '#182240', backgroundColor: '#0c1124',
              dataBackground: { lineStyle: { color: '#00d4f0' }, areaStyle: { color: 'rgba(0,212,240,0.08)' } },
              textStyle: { color: '#6b7a9a' }, handleStyle: { color: '#00d4f0' } },
            { type: 'inside', xAxisIndex: allXAxisIndexes, zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
        ],
        series: seriesArr
    };

    // 买卖点标记
    if (marks && marks.length > 0) {
        opt.series.push({
            type: 'scatter', name: '买卖点', data: marks.map(function(m) { return [m.date, m.price]; }), xAxisIndex: 0, yAxisIndex: 0,
            symbolSize: 14, symbol: 'pin',
            itemStyle: { color: function(p) { return marks[p.dataIndex]?.type === 'buy' ? '#ef5350' : '#26a69a'; } },
            label: { show: true, formatter: function(p) { return marks[p.dataIndex]?.type === 'buy' ? 'B' : 'S'; }, color: '#fff', fontSize: 10, fontWeight: 'bold', position: 'top' }
        });
    }

    return opt;
}

/**
 * 切换副图指标并重新渲染
 */
function toggleIndicator(name) {
    klineIndicators[name] = !klineIndicators[name];
    // 更新按钮样式
    updateIndicatorButtons();
    // 重新渲染（使用缓存的 kdata）
    if (window._klineCache) {
        renderKlineWithIndicators(window._klineCache);
    }
}

/**
 * 更新指标按钮的激活状态样式
 */
function updateIndicatorButtons() {
    var btns = document.querySelectorAll('.indicator-btn');
    btns.forEach(function(btn) {
        var key = btn.dataset.indicator;
        if (klineIndicators[key]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

/**
 * 使用当前指标配置渲染K线图
 */
function renderKlineWithIndicators(cache) {
    var dates = cache.kdata.map(function(d) { return d.date; });
    var ohlc = cache.kdata.map(function(d) {
        var color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    var volData = cache.kdata.map(function(d) {
        return {
            value: d.vol,
            itemStyle: { color: d.chgPct >= 0 ? '#ef5350' : '#26a69a' }
        };
    });

    var klineChartInst = ChartManager.get('kline', document.getElementById('klineChart'));
    klineChartInst.clear();

    // 根据激活的副图数量动态调整图表高度
    var activeCount = Object.values(klineIndicators).filter(Boolean).length;
    var baseChartH = window.innerWidth < 480 ? 280 : window.innerWidth < 768 ? 380 : 560;
    var chartHeight = baseChartH + (activeCount - 1) * (window.innerWidth < 768 ? 70 : 100); // 每多一个副图增加100px
    chartHeight = Math.min(chartHeight, window.innerWidth < 768 ? 500 : 800); // 最大800px
    document.getElementById('klineChart').style.height = chartHeight + 'px';

    var opt = buildKlineOption(cache.kdata, dates, ohlc, volData, cache.marks);
    opt.title.text = cache.code + ' K线图';
    klineChartInst.setOption(opt);
    klineChartInst.resize();
}

async function openKline(code, entryDate, entryPrice, exitDate, exitPrice, resultId) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    let start = '2024-01-01', end = new Date().toISOString().split('T')[0];
    if (entryDate) { const d = new Date(entryDate); d.setMonth(d.getMonth()-2); start = d.toISOString().split('T')[0]; }
    if (exitDate) { const d = new Date(exitDate); d.setMonth(d.getMonth()+2); end = d.toISOString().split('T')[0]; }

    let url = API + '/scoring/kline/' + code + '?start=' + start + '&end=' + end;
    if (resultId) url += '&result_id=' + resultId;

    let kdata = [], marks = [];
    try {
        const resp = await RequestManager.fetch('kline-' + code, url);
        kdata = (resp.data?.kline || []).map(d => ({ date: d[0], open: d[1], close: d[2], low: d[3], high: d[4], vol: d[5] || 0 }));
        marks = resp.data?.marks || [];
    } catch(e) {
        console.error('kline fetch error:', e);
        showToast('K线数据获取失败', 'error');
    }

    if (kdata.length === 0) {
        document.getElementById('klineTradeInfo').innerHTML = '<p class="text-muted">无K线数据</p>';
        return;
    }

    // 计算涨跌幅和涨跌停标记
    for (let i = 0; i < kdata.length; i++) {
        kdata[i].prevClose = i > 0 ? kdata[i-1].close : kdata[i].open;
        kdata[i].chgPct = kdata[i].prevClose > 0 ? ((kdata[i].close / kdata[i].prevClose - 1) * 100) : 0;
        kdata[i].limitType = (function() {
            if (!kdata[i].prevClose || kdata[i].prevClose <= 0) return 'normal';
            const chgPct = (kdata[i].close / kdata[i].prevClose - 1) * 100;
            const n = /^30/.test(code) || /^688/.test(code) ? 19.5 : /^[84]/.test(code) ? 29.5 : 9.5;
            if (chgPct >= n) return 'limit_up';
            if (chgPct <= -n) return 'limit_down';
            return 'normal';
        })();
    }

    // 缓存数据，供切换指标时复用（无需重新请求后端）
    window._klineCache = { code: code, kdata: kdata, marks: marks };

    // 更新指标按钮状态
    updateIndicatorButtons();

    // 使用动态指标渲染
    renderKlineWithIndicators(window._klineCache);

    let infoHtml = `<h4 style="font-family:var(--font-mono);margin-bottom:8px;color:var(--text-primary)">${code}</h4>`;
    if (entryDate && entryPrice) {
        infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">买入: ${entryDate} 价格: ${entryPrice}</p>`;
        if (exitDate && exitPrice && entryPrice > 0) {
            const pnl = ((exitPrice/entryPrice - 1)*100).toFixed(2);
            const cls = parseFloat(pnl) >= 0 ? 'positive' : 'negative';
            infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">卖出: ${exitDate} 价格: ${exitPrice} 收益: <span class="${cls}">${pnl}%</span></p>`;
        }
    }
    document.getElementById('klineTradeInfo').innerHTML = infoHtml;
}

function closeKline() {
    document.getElementById('klinePanel').classList.remove('open');
    window._klineCache = null; // 关闭弹窗时清理缓存
}
