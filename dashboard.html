<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIQuant · 量化终端</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=20261017j">
    <style id="stockDeepCss">
        .sd-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .sd-search{flex:1;min-width:220px;max-width:420px;padding:8px 12px;background:var(--bg-root);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;font-size:var(--fs-3)}
        .sd-search:focus{outline:none;border-color:var(--accent)}
        .sd-nav{display:flex;align-items:center;gap:8px}
        .sd-count{font-size:var(--fs-2);color:var(--text-secondary);font-family:var(--font-mono)}
        .sd-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .sd-chip{cursor:pointer;padding:4px 10px;font-size:var(--fs-2);background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;color:var(--text-secondary)}
        .sd-chip:hover{border-color:var(--accent);color:var(--text-primary)}
        .sd-chip.sd-chip-active{background:rgba(var(--accent-rgb),.14);border-color:var(--accent);color:var(--text-primary);font-weight:600}
        .sd-chip-src{opacity:.6;margin-left:4px;font-size:var(--fs-1)}
        .sd-chip-del{margin-left:6px;background:transparent;border:none;color:var(--text-muted);font-size:var(--fs-3);line-height:1;cursor:pointer;padding:0 2px}
        .sd-chip-del:hover{color:var(--danger)}
        .sd-chips-empty{font-size:var(--fs-2);color:var(--text-muted)}
        .sd-market-title{font-size:var(--fs-3);font-weight:600;color:var(--text-primary);margin:10px 0 8px;display:flex;align-items:center;gap:6px}
        .sd-market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
        @media(max-width:1280px){.sd-market-grid{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:900px){.sd-market-grid{grid-template-columns:repeat(2,1fr)}}
        @media(max-width:560px){.sd-market-grid{grid-template-columns:1fr}}
        .sd-market-card{cursor:pointer;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:9px 11px;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column;gap:5px;min-height:108px}
        .sd-market-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.18)}
        .sd-market-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px}
        .sd-market-name{font-size:var(--fs-3);font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
        .sd-market-meta{font-size:var(--fs-1);color:var(--text-muted);font-family:var(--font-mono)}
        .sd-market-prices{display:flex;gap:3px 8px;flex-wrap:wrap;font-size:var(--fs-1);color:var(--text-secondary);font-family:var(--font-mono);line-height:1.6}
        .sd-market-prices b{color:var(--text-muted);font-weight:500;margin-right:2px;font-family:inherit}
        .sd-market-prices .sd-price-entry{color:var(--accent);font-weight:600}
        .sd-market-reasons{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
        .sd-market-reasons .reason-chip{font-size:var(--fs-1);padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .sd-market-empty-col{grid-column:1/-1;text-align:center;padding:30px 14px;color:var(--text-muted);font-size:var(--fs-2)}
        /* 双层候选：主推（实际建仓，资金有限只做这批） / 信息储备（展开看，可不建仓） */
        .sd-market-card.is-main{border-color:rgba(var(--accent-rgb),.42);background:linear-gradient(180deg,rgba(var(--accent-rgb),.055),transparent 62%)}
        .sd-market-card.is-main:hover{box-shadow:0 0 0 1px rgba(var(--accent-rgb),.32)}
        .sd-badge-main{font-size:var(--fs-1);padding:1px 6px;border-radius:3px;background:var(--tint-accent);color:var(--accent);font-weight:700;letter-spacing:.4px;flex:none}
        .sd-market-card.is-reserve{opacity:.8}
        .sd-market-card.is-reserve:hover{opacity:1}
        .sd-sec-label{font-size:var(--fs-1);color:var(--text-muted);margin:2px 0 6px;display:flex;align-items:center;gap:5px}
        .sd-sec-label b{color:var(--text-secondary);font-weight:600}
        .sd-more-wrap{margin-top:9px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
        .sd-more-toggle{font-size:var(--fs-1);color:var(--text-muted);background:transparent;border:1px dashed var(--border);border-radius:6px;padding:4px 11px;cursor:pointer;transition:color .15s,border-color .15s;font-family:inherit}
        .sd-more-toggle:hover{color:var(--accent);border-color:var(--accent)}
        .sd-scan-progress{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
        .sd-scan-progress .row{display:flex;justify-content:space-between;font-size:var(--fs-2);color:var(--text-secondary);margin-bottom:5px}
        .sd-scan-progress .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
        .sd-scan-progress .fill{height:100%;width:0%;background:var(--accent);border-radius:4px;transition:width 0.3s}
        .sd-scan-progress .msg{font-size:var(--fs-1);color:var(--text-muted);margin-top:5px}
        .sd-summary{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:14px}
        .sd-metric{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:120px}
        .sd-metric .lbl{font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.04em}
        .sd-metric .val{font-size:var(--fs-4);font-weight:600;color:var(--text-primary);margin-top:2px}
        .sd-metric .sub{font-size:var(--fs-1);color:var(--text-secondary);margin-top:2px}
        .sd-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
        @media(max-width:900px){.sd-grid-2col{grid-template-columns:1fr}}
        .sd-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
        .sd-card h4{margin:0 0 6px;font-size:var(--fs-3);color:var(--text-primary)}
        .sd-card .sd-card-desc{font-size:var(--fs-2);color:var(--text-secondary);line-height:1.6}
        .sd-kv{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-2);color:var(--text-secondary)}
        .sd-kv b{color:var(--text-primary)}
        .sd-signal{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:stretch;margin-bottom:14px}
        @media(max-width:700px){.sd-signal{grid-template-columns:1fr}}
        .sd-signal-side{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
        .sd-signal-dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);flex:none}
        .sd-signal-dot.lv-buy{background:var(--status-good)}
        .sd-signal-dot.lv-add{background:var(--status-warn)}
        .sd-signal-dot.lv-hold{background:var(--accent)}
        .sd-signal-dot.lv-sell{background:var(--status-bad)}
        .sd-signal-level{font-size:var(--fs-4);font-weight:700}
        .sd-signal-note{font-size:var(--fs-1);color:var(--text-secondary)}
        .sd-plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
        @media(max-width:600px){.sd-plan{grid-template-columns:1fr}}
        .sd-plan-cell{background:var(--bg-root);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
        .sd-plan-cell .lbl{font-size:var(--fs-1);color:var(--text-muted)}
        .sd-plan-cell .val{font-size:var(--fs-4);font-weight:700;margin-top:4px}
        .sd-plan-cell .sub{font-size:var(--fs-1);color:var(--text-secondary);margin-top:2px}
        .sd-reason-list{list-style:none;margin:0;padding:0}
        .sd-reason-list li{font-size:var(--fs-2);line-height:1.7;color:var(--text-secondary);padding-left:14px;position:relative}
        .sd-reason-list li::before{content:'·';position:absolute;left:0;color:var(--accent)}
        .sd-reason-list li.sd-risk::before{color:var(--danger)}
        .sd-chart{width:100%;height:420px;margin-top:4px}
        .sd-chart-hint{font-size:var(--fs-1);color:var(--text-muted);margin:4px 0 2px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .sd-chart-hint b{font-weight:600}
        .sd-timeline{max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px}
        .sd-tl-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;font-size:var(--fs-2)}
        .sd-tl-item:nth-child(even){background:rgba(var(--accent-rgb),.05)}
        .sd-tl-item .date{font-family:var(--font-mono);color:var(--text-secondary);width:84px;flex:none}
        .sd-tl-item .close{width:64px;text-align:right;font-family:var(--font-mono);color:var(--text-primary);flex:none}
        .sd-tl-item .pct{width:56px;text-align:right;font-family:var(--font-mono);flex:none}
        .sd-tl-item .lvl{min-width:88px;flex:none}
        .sd-tl-item .brief{flex:1;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .sd-tl-item.tl-recompute{opacity:.55}
        .sd-tl-item.tl-recompute:hover{opacity:.9}
        .sd-est-tag{display:inline-block;margin-left:5px;padding:0 5px;border:1px solid var(--border);border-radius:8px;font-size:var(--fs-1);color:var(--text-muted);vertical-align:1px;font-family:inherit}
        .sd-lvl-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:var(--fs-1);font-weight:600}
        .sd-lvl-buy{background:var(--tint-good);color:var(--status-good)}
        .sd-lvl-add{background:rgba(255,170,60,.16);color:#ffaa3c}
        .sd-lvl-hold{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
        .sd-lvl-sell{background:rgba(var(--danger-rgb),.14);color:var(--danger)}
        .sd-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:var(--fs-1);margin-right:6px;vertical-align:middle}
        .sd-trade-table{width:100%;border-collapse:collapse;font-size:var(--fs-1);color:var(--text-secondary)}
        .sd-trade-table th{position:sticky;top:0;background:var(--bg-elevated);color:var(--text-muted);font-weight:600;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
        .sd-trade-table td{padding:6px 8px;border-bottom:1px solid var(--border);font-family:var(--font-mono);white-space:nowrap}
        .sd-trade-table tr:last-child td{border-bottom:none}
        .sd-trade-table tbody tr:hover{background:rgba(var(--accent-rgb),.06)}
        /* 个股深度 · 推荐跟踪（买点建仓 → 卖点出场 → 每笔持仓与收益） */
        .sd-track-head{display:flex;align-items:center;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
        .sd-track-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
        .sd-track-stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:84px;transition:border-color .15s,background .15s}
        .sd-track-stat.clickable{cursor:pointer}
        .sd-track-stat.clickable:hover{border-color:var(--accent)}
        .sd-track-stat.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.10)}
        .sd-track-stat.active .lbl{color:var(--accent)}
        .sd-track-stat .lbl{font-size:var(--fs-1);color:var(--text-muted);letter-spacing:.03em}
        .sd-track-stat .val{font-size:var(--fs-3);font-weight:600;color:var(--text-primary);font-family:var(--font-mono);margin-top:1px}
        .sd-track-stat.primary{min-width:112px}
        .sd-track-stat.primary .val{font-size:var(--fs-5)}
        .sd-track-stat .val.pos{color:var(--positive)}
        .sd-track-stat .val.neg{color:var(--negative)}
        .sd-track-table .num{font-family:var(--font-mono)}
        .sd-track-table .pos{color:var(--positive)}
        .sd-track-table .neg{color:var(--negative)}
        .sd-track-table td.name-td{font-family:inherit;white-space:normal}
        .sd-st{display:inline-block;padding:1px 7px;border-radius:9px;font-size:var(--fs-1);white-space:nowrap}
        .sd-st-holding{background:var(--tint-accent);color:var(--accent)}
        .sd-st-watching{background:var(--tint-warn);color:#8a5a00}
        .sd-st-closed{background:var(--tint-good);color:var(--status-good)}
        .sd-st-expired{background:rgba(16,24,40,.06);color:var(--text-secondary)}
        .sd-op{background:transparent;border:1px solid var(--border);color:var(--text-secondary);border-radius:4px;font-size:var(--fs-1);padding:3px 9px;cursor:pointer;margin-right:4px}
        .sd-op:hover{border-color:var(--accent);color:var(--text-primary)}
        .sd-op.danger:hover{border-color:var(--danger);color:var(--danger)}
    </style>
</head>

        <div class="indicator-bar" id="indicatorBar">

        <div id="sdDeepBody"></div>
        <div id="sdDeepChart" style="width:100%;height:0;display:none"></div>

        <button class="close-btn" onclick="closeRpPanel()" aria-label="关闭抽屉">&#x2715;</button>
        <div id="rpBody"></div>
    </div>

<script>
const API = '/api';
let currentTab = 'home';

// ─── 主题定版（任务12 P1）：浅色唯一主题，THEMES/setTheme/localStorage/切换器链路已退役 ───
// TX-1（深析弹窗随主题重建图表）随主题切换器一并退役记档：token 静态化后图表配色不再变化。

// 读取 CSS 变量（ECharts canvas 无法解析 var()，需在 JS 侧取值）
function cssVar(name, fallback) {
    var v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) {}
    return v || fallback;
}

// ─── Toast notification system ───
var Toast = {
    container: null,

    init: function() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
    },

    show: function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        this.init();
        var icons = { success: '&#x2713;', error: '&#x2717;', warning: '&#x26A0;', info: '&#x2139;' };
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span> <span>' + message + '</span>';
        this.container.appendChild(toast);
        var self = this;
        requestAnimationFrame(function() { toast.classList.add('show'); });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }
};

function showToast(message, type) { Toast.show(message, type); }

// ─── 面板失败重试态（spec §6）：重试=重调本面板 load 函数，不触发全站同步 ───
function panelError(fnName) {
    return '<div class="panel-error">加载失败 <button class="btn btn-sm" onclick="' + fnName + '()">重试</button></div>';
}

// ─── Skeleton loading ───
function showSkeleton(container, rowCount) {
    rowCount = rowCount || 10;
    var cols = ['w80', 'w120', 'w200', 'w80', 'w120'];
    var html = '';
    for (var i = 0; i < rowCount; i++) {
        html += '<div class="skeleton-row">';
        for (var j = 0; j < cols.length; j++) {
            html += '<div class="skeleton-cell ' + cols[j] + ' skeleton"></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

async function fetchJSON(url, opts) {
    opts = opts || {};
    const resp = await fetch(url, opts);
    if (!resp.ok) {
        // 优先透传后端 JSON 里的中文错误信息（fail() 返回 {error: "..."}），
        // 否则只能看到 statusText（如 409 -> "CONFLICT"）
        let msg = '';
        try { const j = await resp.json(); msg = (j && j.error) || ''; } catch (e) {}
        throw new Error(msg || resp.statusText || ('HTTP ' + resp.status));
    }
    return resp.json();
}

// ─── Request manager (AbortController 取消 + 只读短 TTL 缓存) ───
var RequestManager = {
    controllers: {},
    _cache: {},            // url -> {ts, data}：高频只读接口的短时去重缓存
    CACHE_TTL: 5000,       // 默认短缓存 5s：只挡快速切页/重复挂载，不牺牲数据新鲜度

    fetch: function(key, url, opts) {
        this.cancel(key);
        opts = opts || {};
        var method = (opts.method || 'GET').toUpperCase();
        // 仅「无 body 的 GET + 显式 cacheTtl」才读缓存；轮询/写操作永远直连
        var ttl = opts.cacheTtl || 0;
        var canCache = method === 'GET' && !opts.body && ttl > 0;
        if (canCache) {
            var hit = this._cache[url];
            if (hit && Date.now() - hit.ts < ttl) {
                return Promise.resolve(hit.data);
            }
        }

        var ctrl = new AbortController();
        this.controllers[key] = ctrl;
        opts.signal = ctrl.signal;
        var self = this;
        return fetchJSON(url, opts).then(function(data) {
            delete self.controllers[key];
            if (canCache) {
                self._cache[url] = {ts: Date.now(), data: data};
            } else if (method !== 'GET') {
                // 任何写操作成功后清空只读缓存，保证改完数据立刻读到新值
                self._cache = {};
            }
            return data;
        }).catch(function(e) {
            delete self.controllers[key];
            throw e;
        });
    },

    cancel: function(key) {
        if (this.controllers[key]) {
            this.controllers[key].abort();
            delete this.controllers[key];
        }
    },

    cancelAll: function() {
        var self = this;
        Object.keys(this.controllers).forEach(function(k) {
            self.controllers[k].abort();
        });
        this.controllers = {};
    }
};

// ─── Tab state cache (5-min validity) ───
var TabState = {
    states: {},
    MAX_AGE: 5 * 60 * 1000,

    save: function(tab) {
        var content = document.getElementById('content');
        // innerHTML 只序列化属性：把 input/select 当前值写回属性，
        // 否则缓存恢复后日期/下拉回退默认值（任务12 遗留②：pickDate 跳 tab 回空）
        if (content) {
            try {
                content.querySelectorAll('input').forEach(function (i) {
                    if (i.type === 'checkbox' || i.type === 'radio') i.setAttribute('checked', i.checked ? 'checked' : '');
                    else i.setAttribute('value', i.value);
                });
                content.querySelectorAll('select').forEach(function (sel) {
                    Array.prototype.forEach.call(sel.options, function (o) {
                        if (o.selected) o.setAttribute('selected', 'selected');
                        else o.removeAttribute('selected');
                    });
                });
            } catch (e) {}
        }
        var scrollEl = document.querySelector('.content');
        this.states[tab] = {
            html: content ? content.innerHTML : '',
            scrollTop: scrollEl ? scrollEl.scrollTop : 0,
            ts: Date.now()
        };
    },

    load: function(tab) {
        var s = this.states[tab];
        if (s && Date.now() - s.ts < this.MAX_AGE) return s;
        delete this.states[tab];
        return null;
    }
};

// ─── ECharts instance manager ───
var ChartManager = {
    instances: {},

    get: function(key, dom) {
        if (this.instances[key]) {
            var inst = this.instances[key];
            if (inst.getDom && inst.getDom() === dom) return inst;
            this.dispose(key);
        }
        var inst = echarts.init(dom);
        this.instances[key] = inst;
        return inst;
    },

    dispose: function(key) {
        if (this.instances[key]) {
            this.instances[key].dispose();
            delete this.instances[key];
        }
    },

    disposeAll: function() {
        var self = this;
        Object.keys(this.instances).forEach(function(k) { self.dispose(k); });
    }
};

window.addEventListener('beforeunload', function() { ChartManager.disposeAll(); });

// ─── Timer manager for centralized cleanup ───
var timerManager = {
    timers: {},

    setInterval: function(key, fn, delay) {
        this.clear(key);
        this.timers[key] = setInterval(fn, delay);
    },

    setTimeout: function(key, fn, delay) {
        this.clear(key);
        var self = this;
        this.timers[key] = setTimeout(function() { fn(); delete self.timers[key]; }, delay);
    },

    // 统一任务轮询原语：收敛散落在各功能里的 setInterval+fetch+自停手写逻辑。
    //  - runImmediately=true 先执行一次（进度面板立即拿到当前状态）
    //  - 上一轮未返回则跳过本轮，避免慢请求堆积成并发队列
    //  - fn 内需要停止时调 timerManager.clear(key)（成功/失败终止策略由调用方决定，
    //    与旧实现一致：默认吞掉单轮异常继续轮询）
    poll: function(key, fn, delay, runImmediately) {
        this.clear(key);
        var busy = false;
        function tick() {
            if (busy) return;
            busy = true;
            Promise.resolve().then(fn).catch(function() {}).then(function() { busy = false; });
        }
        if (runImmediately) tick();
        this.timers[key] = setInterval(tick, delay);
    },

    clear: function(key) {
        if (this.timers[key] != null) {
            clearInterval(this.timers[key]);
            clearTimeout(this.timers[key]);
            delete this.timers[key];
        }
    },

    clearAll: function() {
        var self = this;
        Object.keys(this.timers).forEach(function(k) {
            clearInterval(self.timers[k]);
            clearTimeout(self.timers[k]);
        });
        this.timers = {};
    }
};

// ── 锚点导航条（spec §4，缓解 P1）：sticky 激活态由 IntersectionObserver 驱动 ──
var _anchorObserver = null;
var _anchorScrollBound = false;
function initAnchorNav() {
    var bar = document.getElementById('anchorBar');
    if (!bar || !('IntersectionObserver' in window)) return;
    var links = bar.querySelectorAll('a[href^="#"]');
    var current = null;
    function setActive(id) {
        if (current === id) return;
        current = id;
        for (var i = 0; i < links.length; i++) {
            links[i].classList.toggle('active', links[i].getAttribute('href') === '#' + id);
        }
    }
    if (_anchorObserver) { try { _anchorObserver.disconnect(); } catch (e) {} }
    // 每次 IO 触发时全量计算：取「已越过顶线（top<=72）的最靠下面板」；
    // 页首尚未越过任何面板时，点亮第一个即将到来的面板，避免激活态残留。
    function _anchorRefresh() {
        var passed = null, passedTop = -Infinity;
        var upcoming = null, upcomingTop = Infinity;
        for (var j = 0; j < links.length; j++) {
            var el = document.getElementById(links[j].getAttribute('href').slice(1));
            if (!el) continue;
            var t = el.getBoundingClientRect().top;
            if (t <= 72) { if (t > passedTop) { passed = el.id; passedTop = t; } }
            else if (t < upcomingTop) { upcoming = el.id; upcomingTop = t; }
        }
        var pick = passed || upcoming;
        if (pick) setActive(pick);
    }
    _anchorObserver = new IntersectionObserver(_anchorRefresh, { rootMargin: '-64px 0px -70% 0px', threshold: 0 });
    // IO 只在面板「进出检测带」时触发；带内滚动不产生事件，需 scroll(rAF 节流) 持续重算激活态
    if (!_anchorScrollBound) {
        _anchorScrollBound = true;
        var tick = false;
        window.addEventListener('scroll', function () {
            if (tick) return;
            tick = true;
            requestAnimationFrame(function () { tick = false; _anchorRefresh(); });
        }, { passive: true });
    }
    _anchorRefresh();
    for (var i = 0; i < links.length; i++) {
        (function (a) {
            var el = document.getElementById(a.getAttribute('href').slice(1));
            if (el) _anchorObserver.observe(el);
            a.addEventListener('click', function () { setActive(a.getAttribute('href').slice(1)); });
        })(links[i]);
    }
}

// ── P3#6：回顶按钮——滚动超 1.5 屏浮出（rAF 节流）──
(function () {
    var btn = null, ticking = false;
    function upd() {
        if (!btn) btn = document.getElementById('backTop');
        if (btn) btn.classList.toggle('show', window.scrollY > window.innerHeight * 1.5);
        ticking = false;
    }
    window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(upd); }
    }, { passive: true });
})();

// ── P3#10：「详情/收起」就地手风琴——togglePickDetail 同步换 innerHTML 后，
//    对 .pick-group-body 的高度变化补 160ms ease-out 过渡（capture 先于按钮 onclick 记录旧高）──
document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('.pick-detail-toggle') : null;
    if (!btn || btn.disabled) return;
    var group = btn.closest('.pick-group');
    var body = group && group.querySelector('.pick-group-body');
    if (!body || !body.animate) return;
    var from = body.getBoundingClientRect().height;
    requestAnimationFrame(function () {
        requestAnimationFrame(function () {
            var to = body.getBoundingClientRect().height;
            if (Math.abs(to - from) > 4) {
                body.animate(
                    [{ height: from + 'px', overflow: 'hidden' }, { height: to + 'px', overflow: 'hidden' }],
                    { duration: 160, easing: 'ease-out' });
            }
        });
    });
}, true);

// ── P4 #7：行情数字刷新 300ms tint 闪（涨红底/跌绿底淡出，仅 .idx-price 行情单元格；
//    判断/收益类数字不染，R1 口径不变）。纯 DOM 观察比对，render 函数与接口零触碰。──
(function () {
    var mem = {};
    function flash(el, up) {
        var cls = up ? 'flash-up' : 'flash-down';
        el.classList.remove('flash-up', 'flash-down');
        void el.offsetWidth;                       // 强制 reflow 重启动画
        el.classList.add(cls);
        setTimeout(function () { el.classList.remove(cls); }, 340);
    }
    function scan() {
        var cards = document.querySelectorAll('#indexCards .idx-card');
        for (var i = 0; i < cards.length; i++) {
            var nameEl = cards[i].querySelector('.idx-name');
            var priceEl = cards[i].querySelector('.idx-price');
            if (!nameEl || !priceEl) continue;
            var v = parseFloat((priceEl.textContent || '').replace(/[^\d.\-]/g, ''));
            if (isNaN(v)) continue;
            var key = nameEl.textContent.trim();
            if (mem[key] != null && v !== mem[key]) flash(priceEl, v > mem[key]);
            mem[key] = v;
        }
    }
    if ('MutationObserver' in window) {
        var content = document.getElementById('content');
        if (content) {
            var pending = false;
            new MutationObserver(function () {
                if (pending) return;
                pending = true;
                requestAnimationFrame(function () { pending = false; scan(); });
            }).observe(content, { childList: true, subtree: true });
        }
    }
})();

// ── P4 #9：顶栏常驻搜索（Spotlight 范式）：Ctrl/⌘+K 聚焦，回车→研判 tab 深析抽屉直达 ──
function topSearchGo() {
    var el = document.getElementById('topSearchInput');
    var v = ((el && el.value) || '').trim();
    if (!v) return;
    var codeMatch = v.match(/\d{6}/);
    // B-1 修复①：已在研判且模板就绪时不再走 switchTab（其防抖 cancelAll 会掐死在途 stock_deep）；
    // 需要切页时等模板就绪（模板只在 cancelAll 落地后才渲染）后再过 250ms 防抖余量才发请求。
    var alreadyThere = (currentTab === 'research') && document.getElementById('sdSearch');
    if (!alreadyThere) switchTab('research');
    var tries = 0;
    function fire() {
        var sd = document.getElementById('sdSearch');
        if (!sd) { if (tries++ < 40) setTimeout(fire, 150); return; }   // 等研判 tab 模板就绪
        if (alreadyThere) { doSearch(sd); return; }

}

// 切页防抖：120ms 内连续点击导航只执行最后一次内容加载。
// 旧实现每次点击都立刻 cancelAll+骨架屏+loadTab，快速点两页时第一页的加载全部白做。
// 导航高亮点击即更新（即时视觉反馈，且不依赖延迟后的内容加载）。
var _tabScroll = {};   // P3#6：每 tab 记忆窗口滚动位置
function switchTab(tab) {
    if (typeof currentTab !== 'undefined' && currentTab) _tabScroll[currentTab] = window.scrollY;
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) { navItems[i].classList.remove('active'); }
    var btn = document.querySelector('.nav-item[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');
    var ab = document.getElementById('anchorBar');
    if (ab) ab.style.display = (tab === 'home' || tab === 'track') ? 'flex' : 'none';

    timerManager.clear('switchTabDebounce');
    timerManager.setTimeout('switchTabDebounce', function() { _doSwitchTab(tab); }, 120);
}

function _doSwitchTab(tab) {
    RequestManager.cancelAll();
    timerManager.clearAll();

    // 保存当前 tab 状态（包括 scores tab 的日期选择）
    if (currentTab) {
        TabState.save(currentTab);
    }

    currentTab = tab;

    // Try cached state
    var cached = TabState.load(tab);
    if (cached) {
        document.getElementById('content').innerHTML = cached.html;
        var scrollEl = document.querySelector('.content');
        if (scrollEl) scrollEl.scrollTop = cached.scrollTop;
        window.scrollTo(0, _tabScroll[tab] || 0);     // P3#6：恢复该 tab 的滚动位置
        if (tab === 'research') restoreStockDeep();   // cache 恢复时重绘个股深度图表
        if (tab === 'l06') resumeL06Timers();          // cache 恢复时重启分诊/深跑计时（显示层）
        if (tab === 'disc') resumeDiscTimers();        // 偏离单倒计时同理
        renderAnchorBar(tab); initAnchorNav();        // tab 内迷你锚点随内容重建
        return;
    }

    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    showSkeleton(c, 10);
    try {
        if (tab === 'home') await loadHomeTab(c);
        else if (tab === 'track') await loadTrackTab(c);
        else if (tab === 'research') await loadResearchTab(c);
        else if (tab === 'l06') await loadL06Tab(c);
        else if (tab === 'disc') await loadDiscTab(c);
        else if (tab === 'settings') await loadSettingsTab(c);

        c.firstElementChild?.classList.add('tab-content');
        renderAnchorBar(tab); initAnchorNav();
        window.scrollTo(0, _tabScroll[tab] || 0);     // P3#6：新加载完成后恢复滚动位置
    } catch(e) {
        showToast('加载失败，请重试', 'error');
        c.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败: ' + e.message + '</div>';
    }
}

async function loadMarketOverview() {
    try {
        const resp = await RequestManager.fetch('market', API + '/investor/market-overview',
            {cacheTtl: RequestManager.CACHE_TTL});
        const d = resp.data || {};

        // Hero
        const greet = document.getElementById('heroGreeting');
        const sub = document.getElementById('heroSub');
        if (greet) greet.textContent = greetingByHour();
        const senti = d.sentiment || {};
        const meta = REGIME_META[senti.regime] || REGIME_META.unknown;
        if (sub) {
            sub.innerHTML = `大盘状态：<b style="color:${meta.color}">${meta.tag}</b> · ${senti.label || ''}` +
                (senti.total_amount ? ` · 今日总成交 <b>${senti.total_amount} 亿</b>` : '');
        }

        // Regime card
        const card = document.getElementById('regimeCard');
        const tip = document.getElementById('regimeTip');
        if (card) {
            card.style.borderColor = meta.color;
            card.innerHTML = `<div class="regime-emoji">${meta.emoji}</div><div class="regime-tag" style="color:${meta.color}">${meta.tag}</div>`;
        }
        if (tip) {
            const tipMap = {
                hot:     '注意追高风险，建议减仓',
                warm:    '可适度参与，重点关注个股',
                neutral: '精选个股，避免追涨杀跌',
                cool:    '控制仓位，少动多看',
                cold:    '防守为主，保留现金',
                unknown: '数据不足',
            };
            tip.textContent = tipMap[senti.regime] || '';
        }

        // Index cards
        const grid = document.getElementById('indexCards');
        const idxList = d.indices || [];
        const idxHtml = idxList.map(idx => {
            const chg = idx.pct_change || 0;
            const cls = chg >= 0 ? 'idx-up' : 'idx-down';
            const sign = chg >= 0 ? '+' : '';
            const trend5 = idx.trend_5d_pct;
            const trend5Html = trend5 == null ? '' :
                `<div class="idx-trend ${trend5>=0?'idx-up':'idx-down'}">5日 ${trend5>=0?'+':''}${trend5}%</div>`;
            return `
                <div class="idx-card idx-clickable" onclick="openIndexKline('${idx.code}','${idx.name.replace(/'/g, "\\'")}')" title="点击查看 ${idx.name} 的K线">
                    <div class="idx-name">${idx.name}</div>
                    <div class="idx-price">${idx.close.toLocaleString(undefined, {maximumFractionDigits: 2})}</div>
                    <div class="idx-pct ${cls}">${sign}${chg.toFixed(2)}%</div>
                    ${trend5Html}
                </div>`;
        }).join('');

        // 市场宽度：涨跌家数 + 两市成交额
        const br = d.breadth || {};
        const breadthHtml = (br.up_count || br.down_count) ? `
            <div class="idx-card">
                <div class="idx-name">涨跌家数</div>
                <div class="idx-price"><span class="idx-up">${br.up_count||0}</span><span style="font-size:var(--fs-3);color:var(--text-muted)"> / </span><span class="idx-down">${br.down_count||0}</span></div>
                <div class="idx-trend" style="color:var(--text-secondary);font-size:var(--fs-1)">${br.label || ''}</div>
            </div>
            <div class="idx-card">
                <div class="idx-name">两市成交额</div>
                <div class="idx-price">${br.total_amount != null ? Number(br.total_amount).toLocaleString() : '--'}<span style="font-size:var(--fs-3);color:var(--text-muted)"> 亿</span></div>
                <div class="idx-trend" style="color:var(--text-secondary);font-size:var(--fs-1)">${br.trade_date || ''}</div>
            </div>
        ` : '';
        if (grid) grid.innerHTML = idxHtml + breadthHtml;

        // P3: 短线打分口径（权重已固定纯抄底，自适应只剩阈值，见 config/strategy_params.py）
        const aw = d.adaptive_weights || {};
        if (aw.regime && aw.regime !== 'unknown') {
            const regimeEmoji = aw.regime === 'bull' ? '📈' : (aw.regime === 'bear' ? '📉' : '📊');
            const w = aw.weights || null;
            const engineHint = aw.short_engine === 'oversold_rebound' ? '超跌反弹v3' :
                (w ? `纯抄底 ${(w[3]*100).toFixed(0)}%` : '融合分');
            const thrHint = aw.sig_threshold != null ?
                ` · 阈值${Number(aw.sig_threshold).toFixed(0)}${aw.adaptive_enabled ? '(自适应)' : ''}` : '';
            const weightEl = document.createElement('div');
            weightEl.style.cssText = 'margin-top:8px;padding:6px 12px;background:rgba(var(--accent-rgb),0.06);border-radius:6px;font-size:var(--fs-1);color:var(--text-secondary)';
            weightEl.innerHTML = `短线打分: ${engineHint}${thrHint} · ${regimeEmoji} ${aw.regime_label}`;
            if (grid) grid.parentElement.appendChild(weightEl);
        }

        const upd = document.getElementById('marketUpdatedAt');
        if (upd && d.updated_at) upd.textContent = '更新于 ' + d.updated_at;
    } catch(e) {
        console.error('market overview failed', e);
        const sub = document.getElementById('heroSub');
        if (sub) sub.textContent = '市场数据加载失败';
        const gridEl = document.getElementById('indexCards');
        if (gridEl) gridEl.innerHTML = panelError('loadMarketOverview');
    }
}

// 输入数值数组，返回内联 SVG 迷你走势图（约 64x20）。A股配色：末>首红涨、末<首绿跌。
function renderSparkline(values) {
    var vals = (values || []).filter(function(v) { return v != null && !isNaN(v); });
    var W = 64, H = 20, pad = 2;
    if (vals.length < 2) {
        return '<svg class="spark-svg" width="' + W + '" height="' + H + '">' +
            '<line x1="' + pad + '" y1="' + (H/2) + '" x2="' + (W-pad) + '" y2="' + (H/2) +
            '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2,2"/></svg>';
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var n = vals.length;
    var pts = vals.map(function(v, i) {
        var x = pad + (W - 2*pad) * (i / (n - 1));
        var y = pad + (H - 2*pad) * (1 - (v - min) / span);
        return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var last = vals[n-1], first = vals[0];
    var color = last > first ? 'var(--danger)' : (last < first ? 'var(--success)' : 'var(--text-muted)');
    return '<svg class="spark-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + pts + '"/></svg>';
}

// 批量拉取多只股票的近 days 日融合分序列，填充对应 sparkline 占位。
async function fillSparklines(codes, days, idPrefix) {
    var list = (codes || []).filter(Boolean);
    if (!list.length) return;
    try {
        var resp = await RequestManager.fetch('spark-' + idPrefix, API +
            '/investor/factor_trend?codes=' + encodeURIComponent(list.join(',')) + '&days=' + (days || 7),
            {cacheTtl: RequestManager.CACHE_TTL});
        var data = resp.data || {};
        list.forEach(function(code) {
            var el = document.getElementById(idPrefix + code);
            if (!el) return;
            var rows = data[code] || [];
            el.innerHTML = renderSparkline(rows.map(function(r) { return r.fusion_score; }));
        });
    } catch(e) {}
}

// 点击分数/名称 → 融合分详情弹窗：5 因子读数条 + 30 日 fusion_score 折线
async function showFactorDetail(code, name) {
    var rows = [];
    try {
        var resp = await RequestManager.fetch('factor-detail-' + code, API +
            '/investor/factor_trend?codes=' + encodeURIComponent(code) + '&days=30',
            {cacheTtl: RequestManager.CACHE_TTL});
        rows = (resp.data || {})[code] || [];
    } catch(e) {}

    if (!rows.length) {
        showModal((name || code) + ' 融合分详情',
            '<div class="empty-state">暂无融合分数据</div>', 'min(620px, 92vw)');
        return;
    }

    var last = rows[rows.length - 1];
    var bars = FACTOR_LABELS.map(function(pair) {
        var key = pair[0], lbl = pair[1];
        var v = last[key] != null ? last[key] : 0;
        var pct = Math.max(0, Math.min(100, (v / 10) * 100));
        return '<div class="factor-bar-row">' +
            '<span class="factor-bar-lbl">' + lbl + '</span>' +
            '<span class="factor-bar-track"><span class="factor-bar-fill" style="width:' + pct.toFixed(0) + '%"></span></span>' +
            '<span class="factor-bar-val">' + (v != null ? v.toFixed(1) : '--') + '</span>' +
            '</div>';
    }).join('');

    var body = '<div class="factor-detail">' +
        '<div class="factor-detail-head">最新融合分 <b>' + (last.fusion_score != null ? last.fusion_score.toFixed(1) : '--') + '</b> / 50</div>' +
        '<div class="factor-bars">' + bars + '</div>' +
        '<div id="factorTrendChart" style="width:100%;height:280px;margin-top:12px;"></div>' +
        '</div>';
    showModal((name || code) + ' 融合分详情', body, 'min(620px, 92vw)');

    var dates = rows.map(function(r) { return r.trade_date; });
    var series = rows.map(function(r) { return r.fusion_score; });
    var inst = ChartManager.get('factorTrend', document.getElementById('factorTrendChart'));
    inst.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 40, right: 20, top: 20, bottom: 50 },
        xAxis: { type: 'category', data: dates, axisLabel: { rotate: 45, fontSize: 10 } },
        yAxis: { type: 'value', name: '融合分', min: 0, max: 50 },
        series: [{ name: '融合分', type: 'line', smooth: true, data: series, areaStyle: {} }],
    });
    if (!window._factorTrendResizeBound) {
        window._factorTrendResizeBound = true;
        window.addEventListener('resize', function() {
            var i = ChartManager.instances['factorTrend'];
            if (i) i.resize();
        });
    }
}

async function loadTodayPicks(isFallback) {
    const box = document.getElementById('todayPicks');
    const dateEl = document.getElementById('pickDate');
    const dateParam = dateEl && dateEl.value ? '&date=' + dateEl.value : '';
    try {
        const resp = await RequestManager.fetch('today', API + '/investor/today?limit=4' + dateParam,
            {cacheTtl: RequestManager.CACHE_TTL});
        const data = (resp && resp.data) || {};
        const serverDate = data.date;
        // 自动回填日期（首次加载时）
        if (dateEl && !dateEl.value && serverDate) {
            dateEl.value = serverDate;
        }
        // 三周期分组（兼容旧结构：无 groups 时 items 视为短线组）
        const groups = data.groups || { short: data.items || [], mid: [], long: [] };
        window._todayPicks = { date: serverDate || '', groups };  // 供「一键复制」按钮使用
        const total = HORIZON_GROUPS.reduce((sum, g) => sum + ((groups[g.key] || []).length), 0);
        if (total === 0) {
            window._todayPicks = null;
            // 选中日期无推荐但可能存在更早的可用数据 → 回退到最新数据日重试一次
            if (dateEl && dateEl.value && !isFallback) {
                const picked = dateEl.value;
                dateEl.value = '';  // 清空后再查将返回最新数据日
                showToast('所选日期 ' + picked + ' 无推荐，已切换到最新数据日', 'info', 3000);
                return loadTodayPicks(true);
            }
            box.innerHTML = '<div class="empty-state">暂无推荐数据<br><span style="color:var(--text-muted);font-size:var(--fs-2)">先到「高级筛选」跑一遍打分</span></div>';
            return;
        }
        box.innerHTML = HORIZON_GROUPS.map(g => renderPickGroup(g, groups[g.key] || [])).join('');
        // 出场跟踪嵌入到对应周期小板块底下（与 pickDate 无关——出场跟踪是「7月20日起累计」，
        // 切换推荐日期不影响出场统计，故只拉一次缓存到 _exitTrackData）
        // 2026-10-26：该接口冷启动实测 62s、热态 6s，此前返回前这块是空白，
        // 看起来像「跟踪历史不见了」。先铺占位，失败给可点重试，不再静默吞异常。
        HORIZON_GROUPS.forEach(g => setPickExitPlaceholder(g.key, 'loading'));
        try {
            if (!window._exitTrackData) {
                const er = await RequestManager.fetch('exitTrack', API + '/investor/exit_advice',
                    {cacheTtl: RequestManager.CACHE_TTL});
                window._exitTrackData = (er && er.data) || {};
            }
            HORIZON_GROUPS.forEach(g => renderPickExitEmbed(g.key, window._exitTrackData));
        } catch (e) {
            HORIZON_GROUPS.forEach(g => setPickExitPlaceholder(g.key, 'error'));
        }
    } catch(e) {
        if (box) box.innerHTML = panelError('loadTodayPicks');
    }
}

// 出场跟踪嵌入：找到对应 hz 的 .pick-exit-mount，把迷你版渲染进去
// 占位态（loading/error）：接口重计算 6~62s，不能让这一段空白无提示
function setPickExitPlaceholder(hz, state) {
    var mount = document.querySelector('#todayPicks .pick-group[data-hz="' + hz + '"] .pick-exit-mount');
    if (!mount) return;
    var meta = EXIT_HORIZON_META[hz] || { label: hz };
    if (state === 'error') {
        mount.innerHTML = '<div class="pick-exit-empty">' + meta.label + '出场跟踪加载失败（接口超时或服务忙）'
            + ' · <a href="javascript:void(0)" onclick="retryPickExit()" style="color:var(--accent)">点此重试</a></div>';
        return;
    }
    mount.innerHTML = '<div class="pick-exit-empty">' + meta.label
        + '出场跟踪加载中…（需重算出场状态，首次可能数十秒）</div>';
}

// 失败重试：清掉缓存后重新拉一次出场跟踪（不动推荐数据）
async function retryPickExit() {
    window._exitTrackData = null;
    HORIZON_GROUPS.forEach(function (g) { setPickExitPlaceholder(g.key, 'loading'); });
    try {
        var er = await RequestManager.fetch('exitTrack', API + '/investor/exit_advice', {cacheTtl: 0});
        window._exitTrackData = (er && er.data) || {};
        HORIZON_GROUPS.forEach(function (g) { renderPickExitEmbed(g.key, window._exitTrackData); });
    } catch (e) {
        HORIZON_GROUPS.forEach(function (g) { setPickExitPlaceholder(g.key, 'error'); });
    }
}

function renderPickExitEmbed(hz, d) {
    var mount = document.querySelector('#todayPicks .pick-group[data-hz="' + hz + '"] .pick-exit-mount');
    if (!mount) return;
    d = d || {};
    var groups = d.groups || {};
    var perf = d.perf || (d.summary && d.summary.perf) || {};
    var list = groups[hz] || [];
    if (!list.length) {
        mount.innerHTML = '<div class="pick-exit-empty">该周期暂无出场跟踪记录（短线 ≤10 日 / 中线 ≤60 日 / 长线不限）</div>';
        return;
    }
    mount.innerHTML = renderPickExitMini(hz, list, perf, d.start_date);
}

// 紧凑版出场跟踪（嵌入到推荐小板块底部）
// 统计行（2026-10-13 精简）：主指标 = 平均每笔 / 按仓位累计 / 胜率，
// 外加动量·抄底分组均笔与状态计数；累计起点用后端 start_date，不再硬编码日期。
function renderPickExitMini(hz, list, perf, startDate) {
    var held = list.filter(function (it) { return it.status === 'hold'; }).length;
    var cleared = list.filter(function (it) { return it.status === 'clear'; }).length;
    var watching = list.filter(function (it) { return it.status === 'watching'; }).length;
    var expired = list.filter(function (it) { return it.status === 'expired'; }).length;
    var expanded = !!EXIT_EXPANDED[hz];
    var meta = EXIT_HORIZON_META[hz] || { label: hz };
    var fromTxt = startDate ? ('自 ' + startDate + ' 累计') : '累计';
    var tip = meta.label + '出场跟踪：' + fromTxt
        + '；口径含持仓中的浮动盈亏，待回踩/未成交不建仓、不计入收益与胜率'
        + '；' + (meta.hint || '');
    return '<div class="pick-exit-mini">' +
        '<div class="pick-exit-head">' +
            '<span class="pick-exit-title" title="' + tip + '">出场跟踪 · ' + meta.label
                + '（' + fromTxt + '）</span>' +
            '<span class="hz-spacer"></span>' +
            '<span class="pick-exit-chips">' + exitStatChip(hz, perf) +
                exitSplitChips(hz, list) +
                exitCapChip(hz, perf) +
                '<span class="exit-group-stat">持有 ' + held + '</span>' +
                '<span class="exit-group-stat">已卖出 ' + cleared + '</span>' +
                (watching > 0 ? '<span class="exit-group-stat">待回踩 ' + watching + '</span>' : '') +
                (expired > 0 ? '<span class="exit-group-stat" style="color:var(--text-muted)">未成交 ' + expired + '</span>' : '') +
            '</span>' +
            '<button class="pick-detail-btn pick-exit-toggle' + (expanded ? ' active' : '') + '"' +
                    ' onclick="togglePickExit(\'' + hz + '\')"' +
                    ' title="' + (expanded ? '收起跟踪明细' : '展开该周期的详细跟踪列表') + '">' +
                (expanded ? '收起' : '详情') + '<span class="caret">▾</span>' +
            '</button>' +
        '</div>' +
        (expanded ? '<div class="pick-exit-body">' + renderExitGroupBody(list, perf) + '</div>' : '') +
    '</div>';
}

// 切换某 hz 出场跟踪明细折叠态
function togglePickExit(hz) {
    EXIT_EXPANDED[hz] = !EXIT_EXPANDED[hz];
    saveExitExpandState(EXIT_EXPANDED);
    renderPickExitEmbed(hz, window._exitTrackData || {});
}

// ── 今日推荐三小板块：默认简略，点右上角「详情」展开完整推荐卡 ──
// 展开状态按周期记忆到 localStorage，刷新后保持
const PICK_EXPAND_KEY = 'aiq_pick_expanded';
function loadPickExpandState() {
    try {
        const obj = JSON.parse(localStorage.getItem(PICK_EXPAND_KEY) || '{}');
        return { short: !!obj.short, mid: !!obj.mid, long: !!obj.long };
    } catch(e) { return { short: false, mid: false, long: false }; }
}
function savePickExpandState(st) {
    try { localStorage.setItem(PICK_EXPAND_KEY, JSON.stringify(st)); } catch(e) {}
}
let PICK_EXPANDED = loadPickExpandState();

// 简略行：一行一只，只保留 名称/代码 + 综合分 + 买入/止盈/止损 + 盈亏比
function renderPickMiniRow(it, hz) {
    const ap = it.action_plan || {};
    const sg = it.signal || {};
    const num = v => (v != null ? Number(v).toFixed(2) : '--');
    const pct = it.latest_pct;
    const pctCls = pct == null ? '' : (pct >= 0 ? 'idx-up' : 'idx-down');
    const pctTxt = pct != null ? `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%` : '';
    // 最新价 = 该股最近一个有行情交易日的收盘价（非盘中实时价）。
    // 显式成列，方便一眼对比「现价 vs 回踩买点/止盈/止损」的相对位置。
    const lastPx = it.latest_close != null ? Number(it.latest_close) : null;
    const lastTip = lastPx == null
        ? '暂无最新行情数据'
        : `最新收盘价 ${lastPx.toFixed(2)}${pct != null ? `（${pctTxt}）` : ''}`
          + `，取自该股最近一个有行情的交易日${it.latest_date ? `（${it.latest_date}）` : ''}`;
    const lastHtml = `<div class="pm-price pm-last" title="${lastTip}">
            <div class="${pctCls}">${lastPx != null ? lastPx.toFixed(2) : '--'}</div>
            ${pct != null ? `<div class="pm-last-pct ${pctCls}">${pctTxt}</div>` : ''}
        </div>`;
    const rr = ap.risk_reward_ratio;
    const rrCls = rr == null ? '' : (rr >= 2 ? 'rr-good' : (rr >= 1 ? 'rr-ok' : 'rr-bad'));
    const rrHtml = rr != null
        ? `<span class="rr-tag ${rrCls}">${rr.toFixed(2)}</span>`
        : '<span style="color:var(--text-muted);font-size:var(--fs-1)">--</span>';
    const label = (sg.label || '').replace(/"/g, '');
    // 抄底类短线 = 回踩确认入场：买入价语义是「回踩买点」，非次日直接买
    const pullback = hz === 'short' && it.strategy && it.strategy !== '隔日动量';
    // 回踩买点 = 本行「买入」列的数值。把它显式写进徽章文案与悬浮提示，
    // 消除「回踩买到底是回踩到哪个价位」的歧义（2026-09-11 用户反馈）。
    const pbPx = ap.entry_price != null ? num(ap.entry_price) : null;
    const pbTip = pbPx
        ? `回踩确认入场：回踩买点 = ${pbPx}（即本行「买入」列）。推荐日后 5 个交易日内，
价格回踩触及 ${pbPx} 才按该价建仓；一直不触及则视为未成交、放弃，
涨上去不追高。止盈 ${num(ap.take_profit)} / 止损 ${num(ap.stop_loss)} 同样以该买点为基准。`.replace(/\n/g, '')
        : '回踩确认入场：5 个交易日内价格回踩至买点才建仓，未回踩则放弃（涨上去不追高）';
    const pullbackHtml = pullback
        ? `<span class="strategy-badge" style="background:rgba(255,170,60,.15);color:#ffaa3c" title="${pbTip}">回踩买${pbPx ? ' ' + pbPx : ''}</span>` : '';
    return `<div class="pick-mini-row" onclick="openKline('${it.code}')" title="点击查看 K 线">
        <div class="pm-stock">
            <div class="pm-name">${sg.emoji ? `<span class="pm-sig" title="${label}">${sg.emoji}</span>` : ''}${it.name || it.code}${it.strategy ? `<span class="strategy-badge">${it.strategy}</span>` : ''}${pullbackHtml}</div>
            <div class="pm-code">${it.code}</div>
        </div>
        <div class="pm-score">${it.fusion_score != null ? it.fusion_score : '--'}</div>
        ${lastHtml}
        <div class="pm-price pm-buy" title="${pullback ? (pbPx ? `回踩买点 ${pbPx}：推荐日后 5 个交易日内价格触及即按 ${pbPx} 建仓，未触及则放弃（不追高）` : '回踩买点（5 个交易日内触及才建仓）') : '建议买入'}">${num(ap.entry_price)}</div>
        <div class="pm-price pm-tp" title="止盈目标">${num(ap.take_profit)}</div>
        <div class="pm-price pm-stop" title="止损">${num(ap.stop_loss)}</div>
        <div class="pm-rr" title="盈亏比">${rrHtml}</div>
    </div>`;
}

// 小板块内容区：简略列表 / 完整推荐卡
function renderPickGroupBody(g, list) {
    if (!list.length) {
        return '<div class="empty-state" style="padding:16px;font-size:var(--fs-2)">该周期暂无推荐，请先在首页点「立即重算打分」</div>';
    }
    if (PICK_EXPANDED[g.key]) {
        return '<div class="action-plan-grid">' + list.map(it => renderPickCard(it)).join('') + '</div>';
    }
    return `<div class="pick-mini-list">
        <div class="pick-mini-head"><span>股票</span><span>综合分</span><span title="最新收盘价（该股最近一个有行情的交易日）">最新</span><span>买入</span><span>止盈</span><span>止损</span><span>盈亏比</span></div>
        ${list.map(it => renderPickMiniRow(it, g.key)).join('')}
    </div>`;
}

// 小板块整体：头部（周期标签 + 只数 + 右上「详情」按钮）+ 内容区
function renderPickGroup(g, list) {
    const has = list.length > 0;
    const expanded = has && !!PICK_EXPANDED[g.key];
    return `<div class="pick-group" data-hz="${g.key}">
        <div class="pick-group-head">
            <span class="horizon-tag hz-${g.key}">${g.label}</span>
            <span class="hz-desc">${g.desc}</span>
            <span class="pick-group-count">${list.length} 只</span>
            <span class="hz-spacer"></span>
            <button class="pick-detail-btn" ${has ? '' : 'disabled'}
                    onclick="copyPickGroup('${g.key}', this)"
                    title="只复制本板块${g.label}推荐的股票与买卖价位">复制</button>
            <button class="pick-detail-btn pick-detail-toggle${expanded ? ' active' : ''}" ${has ? '' : 'disabled'}
                    onclick="togglePickDetail('${g.key}')"
                    title="${expanded ? '收起详细推荐' : '展开该周期的完整推荐信息'}">${expanded ? '收起' : '详情'}<span class="caret">▾</span></button>
        </div>
        <div class="pick-group-body">${renderPickGroupBody(g, list)}</div>
        <div class="pick-exit-mount" data-hz="${g.key}"></div>
    </div>`;
}

// ── 单板块复制：生成一个周期的推荐文本（全量复制 copyTodayPicks 也复用）──
function buildPickGroupLines(list) {
    return list.map((it, i) => {
        const ap = it.action_plan || {};
        const entry   = ap.entry_price   != null ? ap.entry_price.toFixed(2)   : '--';
        const stop    = ap.stop_loss     != null ? ap.stop_loss.toFixed(2)     : '--';
        const tp      = ap.take_profit   != null ? ap.take_profit.toFixed(2)   : '--';
        const confirm = it.confirm_trigger != null ? it.confirm_trigger.toFixed(2) : '--';
        return (i + 1) + '. ' + (it.name || it.code) + ' ' + (it.code || '') +
            '｜建议买入 ' + entry +
            '｜止盈 ' + tp +
            '｜止损 ' + stop +
            '｜突破确认 ' + confirm;
    });
}

// 复制单个板块（只复制自己周期的股票）
function copyPickGroup(key, btn) {
    const store = window._todayPicks;
    const g = HORIZON_GROUPS.find(x => x.key === key);
    if (!store || !store.groups || !g) {
        showToast('暂无推荐数据，请先重算打分', 'error');
        return;
    }
    const list = store.groups[key] || [];
    if (!list.length) {
        showToast(g.label + '暂无推荐数据', 'error');
        return;
    }
    const dateStr = store.date ? '（' + store.date + '）' : '';
    const text = '📋 今日推荐·' + g.label + dateStr + '\n' + buildPickGroupLines(list).join('\n');
    copyTextToClipboard(text, function(ok) {
        if (ok) {
            if (btn) {
                const orig = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(function() { btn.textContent = orig; }, 2000);
            }
            showToast('已复制' + g.label + '推荐 ' + list.length + ' 只', 'success');
        } else {
            showToast('复制失败，请手动复制', 'error');
        }
    });
}

// 点击「详情」：只重绘该小板块，避免整块刷新
function togglePickDetail(key) {
    PICK_EXPANDED[key] = !PICK_EXPANDED[key];
    savePickExpandState(PICK_EXPANDED);
    const store = window._todayPicks;
    if (!store || !store.groups) return;
    const g = HORIZON_GROUPS.find(x => x.key === key);
    const groupEl = document.querySelector('#todayPicks .pick-group[data-hz="' + key + '"]');
    if (!g || !groupEl) return;
    const body = groupEl.querySelector('.pick-group-body');
    const btn = groupEl.querySelector('.pick-detail-toggle');
    const list = store.groups[key] || [];
    if (body) body.innerHTML = renderPickGroupBody(g, list);
    if (btn) {
        const on = !!PICK_EXPANDED[key];
        btn.classList.toggle('active', on);
        btn.innerHTML = (on ? '收起' : '详情') + '<span class="caret">▾</span>';
        btn.title = on ? '收起详细推荐' : '展开该周期的完整推荐信息';
    }
}

// 已保留：后端 /api/investor/surge_picks、core/services/signal_picks.py、
