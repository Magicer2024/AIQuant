<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIQuant · 量化终端</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/clusterize.js@0.18.1/clusterize.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div class="scanline"></div>

<header class="header">
    <div class="header-brand">
        <div class="header-logo"></div>
        <h1>AI<span>Quant</span> · 量化终端</h1>
    </div>
    <div class="header-status">
        <div class="status-dot" id="sysStatus"></div>
        <span id="last-update">就绪</span>
    </div>
</header>

<nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('scores')">每日打分</button>
    <button class="nav-item" onclick="switchTab('strategy')">策略管理</button>
    <button class="nav-item" onclick="switchTab('backtest')">回测中心</button>
</nav>

<main class="content" id="content"></main>

<div class="kline-overlay" id="klinePanel" onclick="if(event.target===this)closeKline()">
    <div class="kline-popup">
        <button class="close-btn" onclick="closeKline()">&#x2715;</button>
        <div class="chart" id="klineChart"></div>
        <div class="trade-info" id="klineTradeInfo"></div>
    </div>
</div>

<script>
const API = '/api';
let currentTab = 'scores';
var pendingBacktestRuleId = null;

// ─── Toast notification system ───
var Toast = {
    container: null,

    init: function() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
    },

    show: function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        this.init();
        var icons = { success: '&#x2713;', error: '&#x2717;', warning: '&#x26A0;', info: '&#x2139;' };
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span> <span>' + message + '</span>';
        this.container.appendChild(toast);
        var self = this;
        requestAnimationFrame(function() { toast.classList.add('show'); });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }
};

function showToast(message, type) { Toast.show(message, type); }

// ─── Skeleton loading ───
function showSkeleton(container, rowCount) {
    rowCount = rowCount || 10;
    var cols = ['w80', 'w120', 'w200', 'w80', 'w120'];
    var html = '';
    for (var i = 0; i < rowCount; i++) {
        html += '<div class="skeleton-row">';
        for (var j = 0; j < cols.length; j++) {
            html += '<div class="skeleton-cell ' + cols[j] + ' skeleton"></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

async function fetchJSON(url, opts) {
    opts = opts || {};
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error(resp.statusText);
    return resp.json();
}

// ─── Request manager (AbortController-based cancellation) ───
var RequestManager = {
    controllers: {},

    fetch: function(key, url, opts) {
        this.cancel(key);
        var ctrl = new AbortController();
        this.controllers[key] = ctrl;
        opts = opts || {};
        opts.signal = ctrl.signal;
        var self = this;
        return fetchJSON(url, opts).then(function(data) {
            delete self.controllers[key];
            return data;
        }).catch(function(e) {
            delete self.controllers[key];
            throw e;
        });
    },

    cancel: function(key) {
        if (this.controllers[key]) {
            this.controllers[key].abort();
            delete this.controllers[key];
        }
    },

    cancelAll: function() {
        var self = this;
        Object.keys(this.controllers).forEach(function(k) {
            self.controllers[k].abort();
        });
        this.controllers = {};
    }
};

// ─── Tab state cache (5-min validity) ───
var TabState = {
    states: {},
    MAX_AGE: 5 * 60 * 1000,

    save: function(tab) {
        var content = document.getElementById('content');
        var scrollEl = document.querySelector('.content');
        this.states[tab] = {
            html: content ? content.innerHTML : '',
            scrollTop: scrollEl ? scrollEl.scrollTop : 0,
            ts: Date.now()
        };
    },

    load: function(tab) {
        var s = this.states[tab];
        if (s && Date.now() - s.ts < this.MAX_AGE) return s;
        delete this.states[tab];
        return null;
    }
};

// ─── ECharts instance manager ───
var ChartManager = {
    instances: {},

    get: function(key, dom) {
        if (this.instances[key]) {
            var inst = this.instances[key];
            if (inst.getDom && inst.getDom() === dom) return inst;
            this.dispose(key);
        }
        var inst = echarts.init(dom);
        this.instances[key] = inst;
        return inst;
    },

    dispose: function(key) {
        if (this.instances[key]) {
            this.instances[key].dispose();
            delete this.instances[key];
        }
    },

    disposeAll: function() {
        var self = this;
        Object.keys(this.instances).forEach(function(k) { self.dispose(k); });
    }
};

window.addEventListener('beforeunload', function() { ChartManager.disposeAll(); });

// ─── Timer manager for centralized cleanup ───
var timerManager = {
    timers: {},

    setInterval: function(key, fn, delay) {
        this.clear(key);
        this.timers[key] = setInterval(fn, delay);
    },

    setTimeout: function(key, fn, delay) {
        this.clear(key);
        var self = this;
        this.timers[key] = setTimeout(function() { fn(); delete self.timers[key]; }, delay);
    },

    clear: function(key) {
        if (this.timers[key] != null) {
            clearInterval(this.timers[key]);
            clearTimeout(this.timers[key]);
            delete this.timers[key];
        }
    },

    clearAll: function() {
        var self = this;
        Object.keys(this.timers).forEach(function(k) {
            clearInterval(self.timers[k]);
            clearTimeout(self.timers[k]);
        });
        this.timers = {};
    }
};

function switchTab(tab) {
    RequestManager.cancelAll();
    timerManager.clearAll();

    // Save current tab state
    if (currentTab) TabState.save(currentTab);

    currentTab = tab;

    // Update nav active
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) { navItems[i].classList.remove('active'); }
    var btn = document.querySelector('.nav-item[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');

    // Try cached state
    var cached = TabState.load(tab);
    if (cached) {
        document.getElementById('content').innerHTML = cached.html;
        var scrollEl = document.querySelector('.content');
        if (scrollEl) scrollEl.scrollTop = cached.scrollTop;
        return;
    }

    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    showSkeleton(c, 10);
    try {
        if (tab === 'scores') await loadScoresTab(c);
        else if (tab === 'strategy') await loadStrategyTab(c);
        else if (tab === 'backtest') await loadBacktestTab(c);
        c.firstElementChild?.classList.add('tab-content');
    } catch(e) {
        showToast('加载失败，请重试', 'error');
        c.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败: ' + e.message + '</div>';
    }
}

// ─── Tab 1: Scoring ───
async function loadScoresTab(container) {
    var html = `<div class="panel">
        <div class="input-row">
            <span>日期</span>
            <input type="date" id="scoreDate" value="" onchange="refreshScores()">
            <span>搜索</span>
            <input type="text" id="stockSearch" placeholder="代码或名称" oninput="debounceFilter()" style="width:120px">
            <span>最低分</span>
            <input type="number" id="minScore" value="0" step="1" min="0" onchange="filterScores()" style="width:70px">
            <button class="btn btn-primary" onclick="syncAndScore()">同步并刷新</button>
            <button class="btn" onclick="runSyncOnly()" id="btnSyncOnly">仅同步数据</button>
            <span id="syncStatus"></span>
            <span class="text-muted" style="margin-left:auto" id="scoreCount">-- 只股票</span>
        </div>
        <div id="syncProgress" style="display:none; margin-top: 12px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <div id="syncProgressBar" style="flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden;">
                    <div id="syncProgressFill" style="height:100%; width:0%; background:var(--accent); border-radius:4px; transition:width 0.3s;"></div>
                </div>
                <span id="syncProgressPct" style="font-size:12px; color:var(--text-secondary); white-space:nowrap;">0%</span>
            </div>
            <div id="syncProgressText" style="font-size:12px; color:var(--text-secondary);"></div>
        </div>
        <div id="scoresMetrics"></div>
        <div id="scoreTableContainer"><div class="empty-state">加载中...</div></div>
        <div id="scorePagination" style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;">
            <button class="btn btn-sm" id="scorePrevPage" onclick="goScorePage(currentScorePage-1)" disabled>上一页</button>
            <span id="scorePageInfo" style="font-size:13px;color:var(--text-secondary);">第 1 / 1 页</span>
            <button class="btn btn-sm" id="scoreNextPage" onclick="goScorePage(currentScorePage+1)" disabled>下一页</button>
        </div>
    </div>`;
    container.innerHTML = html;
    checkSyncStatus();
    loadScoresPage(1);
}

function refreshScores() {
    currentScorePage = 1;
    loadScoresPage(1);
}

async function loadScoresPage(page) {
    page = page || 1;
    var container = document.getElementById('scoreTableContainer');
    if (container) showSkeleton(container, 10);

    try {
        var resp = await RequestManager.fetch('scores',
            API + '/scoring/daily?page=' + page + '&per_page=' + scorePerPage);
        _scoreData = resp.data || [];
        currentScorePage = resp.pagination.page;
        scoreTotalPages = resp.pagination.pages;

        var latestDate = _scoreData.length > 0 ? _scoreData[0].trade_date : (resp.date || '');
        var scoreDateEl = document.getElementById('scoreDate');
        if (scoreDateEl && latestDate) scoreDateEl.value = latestDate;
        document.getElementById('last-update').textContent = latestDate ? '最新打分 · ' + latestDate : '暂无数据';
        document.getElementById('scoreCount').textContent = resp.pagination.total + ' 只股票';

        // Update metrics
        var metricsEl = document.getElementById('scoresMetrics');
        if (metricsEl && resp.pagination.total > 0) {
            metricsEl.innerHTML = '<div class="metrics-row">' +
                '<div class="metric-card"><div class="val">' + _scoreData[0].score + '</div><div class="lbl">本页最高 · ' + _scoreData[0].code + '</div></div>' +
                '<div class="metric-card"><div class="val">' + resp.pagination.total + '</div><div class="lbl">总计股票数</div></div>' +
                '<div class="metric-card"><div class="val">' + resp.pagination.pages + '</div><div class="lbl">总页数</div></div>' +
                '<div class="metric-card"><div class="val" style="color:var(--text-muted)">' + resp.pagination.page + '</div><div class="lbl">当前页</div></div>' +
                '</div>';
        } else if (metricsEl) {
            metricsEl.innerHTML = '<div class="empty-state">暂无打分数据<br><span style="color:var(--text-muted)">点击「同步并刷新」获取最新数据</span></div>';
        }

        renderScoreTable(_scoreData);
        updatePaginationUI();
    } catch(e) {
        if (e.name !== 'AbortError') {
            showToast('加载失败: ' + (e.message || '未知错误'), 'error');
        }
    }
}

function goScorePage(page) {
    if (page < 1 || page > scoreTotalPages) return;
    loadScoresPage(page);
}

function updatePaginationUI() {
    var prevBtn = document.getElementById('scorePrevPage');
    var nextBtn = document.getElementById('scoreNextPage');
    var infoEl = document.getElementById('scorePageInfo');
    if (prevBtn) prevBtn.disabled = currentScorePage <= 1;
    if (nextBtn) nextBtn.disabled = currentScorePage >= scoreTotalPages;
    if (infoEl) infoEl.textContent = '第 ' + currentScorePage + ' / ' + scoreTotalPages + ' 页';
}

var scoreClusterize = null;

function renderScoreTable(scores) {
    var container = document.getElementById('scoreTableContainer');
    if (!container) return;

    if (scoreClusterize) {
        scoreClusterize.update(scores.map(function(row, i) { return rowToScoreHTML(row, i + 1); }));
        return;
    }

    container.innerHTML =
        '<div id="scoreScrollArea" class="clusterize-scroll" style="max-height:62vh;overflow-y:auto;">' +
        '  <table id="scoreTable">' +
        '    <thead><tr>' +
        '      <th>#</th><th>代码</th><th>名称</th><th>得分</th><th>命中策略</th>' +
        '    </tr></thead>' +
        '    <tbody id="scoreContentArea" class="clusterize-content"></tbody>' +
        '  </table>' +
        '</div>';

    scoreClusterize = new Clusterize({
        rows: scores.map(function(row, i) { return rowToScoreHTML(row, i + 1); }),
        scrollElem: document.getElementById('scoreScrollArea'),
        contentElem: document.getElementById('scoreContentArea'),
        rows_in_block: 50,
        blocks_in_cluster: 4,
    });
}

function rowToScoreHTML(row, idx) {
    var scoreClass = row.score >= 80 ? 'score-high' : row.score >= 50 ? 'score-mid' : 'score-low';
    var ruleName = (row.rule_name || '').replace(/"/g, '&quot;');
    return '<tr>' +
        '<td style="color:var(--text-muted);width:40px">' + (idx != null ? idx : '') + '</td>' +
        '<td><span class="code-link" onclick="openKline(\'' + (row.code || '') + '\')">' + (row.code || '') + '</span>' +
        ' <span style="cursor:pointer;margin-left:4px;font-size:12px" onclick="showScoreHistory(\'' + (row.code || '') + '\')" title="查看趋势">📈</span></td>' +
        '<td>' + (row.name || '-') + '</td>' +
        '<td class="' + scoreClass + '">' + (row.score != null ? row.score : '--') + '</td>' +
        '<td style="color:var(--text-muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + ruleName + '">' + (row.rule_name || '-') + '</td>' +
        '</tr>';
}

let _scoreData = [];
var currentScorePage = 1;
var scorePerPage = 50;
var scoreTotalPages = 1;

function debounceFilter() {
    timerManager.clear('filter');
    timerManager.setTimeout('filter', filterScores, 300);
}

function filterScores() {
    var keyword = (document.getElementById('stockSearch') ? document.getElementById('stockSearch').value : '').toLowerCase();
    var minScore = parseFloat(document.getElementById('minScore') ? document.getElementById('minScore').value : '0') || 0;

    var filtered = _scoreData;
    if (keyword) {
        filtered = _scoreData.filter(function(r) {
            return (r.code || '').toLowerCase().indexOf(keyword) !== -1 ||
                   (r.name || '').toLowerCase().indexOf(keyword) !== -1;
        });
    }
    if (minScore > 0) {
        filtered = filtered.filter(function(r) { return (r.score || 0) >= minScore; });
    }

    var countEl = document.getElementById('scoreCount');
    if (countEl) {
        countEl.textContent = filtered.length === 0 ? '无匹配结果' : '显示 ' + filtered.length + ' / ' + _scoreData.length + ' 条';
    }

    if (scoreClusterize) {
        scoreClusterize.update(filtered.map(function(row, i) { return rowToScoreHTML(row, i + 1); }));
    } else {
        renderScoreTable(filtered);
    }
}

async function checkSyncStatus() {
    try {
        const resp = await RequestManager.fetch('sync-status', API + '/system/status');
        const el = document.getElementById('syncStatus');
        if (!el) return;
        if (resp.sync && resp.sync.running) {
            el.innerHTML = '<span class="badge badge-running">同步中</span>';
            timerManager.setTimeout('syncStatus', checkSyncStatus, 2000);
        } else if (resp.sync && resp.sync.last_result) {
            el.textContent = resp.sync.last_result;
            document.getElementById('last-update').textContent = resp.sync.last_time
                ? '最新同步 · ' + resp.sync.last_time
                : (document.getElementById('last-update').textContent || '');
        }
    } catch(e) {}
}

function showSyncProgress() {
    document.getElementById('syncProgress').style.display = 'block';
}

function hideSyncProgress() {
    timerManager.clear('syncPoll');
    timerManager.setTimeout('syncHide', function() {
        document.getElementById('syncProgress').style.display = 'none';
    }, 5000);
}

function pollSyncProgress(onDone) {
    timerManager.setInterval('syncPoll', function() {
        RequestManager.fetch('sync-progress', API + '/sync/progress').then(function(resp) {
            var p = resp.data;
            var pct = p.total > 0 ? Math.round(p.current / p.total * 100) : 0;
            document.getElementById('syncProgressFill').style.width = pct + '%';
            document.getElementById('syncProgressPct').textContent = pct + '%';
            document.getElementById('syncProgressText').textContent =
                '同步中: ' + p.current + '/' + p.total + '  成功:' + p.success + '  失败:' + p.failed;
            if (!p.running) {
                hideSyncProgress();
                showToast(p.message || '同步完成', p.last_error ? 'warning' : 'success');
                if (onDone) onDone(p.message || '同步完成');
            }
        }).catch(function(e) { hideSyncProgress(); if (onDone) onDone(''); });
    }, 1000);
}

async function runSyncOnly() {
    const btn = document.getElementById('btnSyncOnly');
    const statusEl = document.getElementById('syncStatus');
    btn.disabled = true; btn.textContent = '启动中...';
    try {
        const resp = await RequestManager.fetch('sync-trigger', API + '/sync', { method: 'POST' });
        if (resp.error) { statusEl.textContent = resp.error; btn.disabled = false; btn.textContent = '仅同步数据'; return; }
        statusEl.innerHTML = '<span class="badge badge-running">同步中</span>';
        btn.textContent = '同步中...';
        showSyncProgress();
        pollSyncProgress(function(msg) {
            btn.disabled = false; btn.textContent = '仅同步数据';
            if (msg) statusEl.textContent = msg;
            loadTab('scores');
        });
    } catch(e) {
        statusEl.textContent = '启动失败: ' + e.message;
        showToast('同步启动失败: ' + e.message, 'error');
        btn.disabled = false; btn.textContent = '仅同步数据';
    }
}

async function syncAndScore() {
    const btn = event.target;
    const statusEl = document.getElementById('syncStatus');
    btn.disabled = true; btn.textContent = '同步中...';
    try {
        const syncResp = await RequestManager.fetch('sync-trigger', API + '/sync', { method: 'POST' });
        if (syncResp.error) { statusEl.textContent = syncResp.error; btn.disabled = false; btn.textContent = '同步并刷新'; return; }
        statusEl.innerHTML = '<span class="badge badge-running">同步中</span>';
        showSyncProgress();
        pollSyncProgress(function(msg) {
            if (msg) statusEl.textContent = msg;
            btn.textContent = '计算中...';
            RequestManager.fetch('scoring-run', API + '/scoring/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }).then(function() {
                btn.disabled = false; btn.textContent = '同步并刷新';
                loadTab('scores');
            }).catch(function() {
                btn.disabled = false; btn.textContent = '同步并刷新';
                loadTab('scores');
            });
        });
    } catch(e) {
        statusEl.textContent = '同步启动失败，直接打分...';
        btn.textContent = '计算中...';
        try {
            await RequestManager.fetch('scoring-run', API + '/scoring/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
        } catch(e2) {}
        btn.disabled = false; btn.textContent = '同步并刷新';
        loadTab('scores');
    }
}

// ─── Tab 2: Strategy ───
let strategySort = { key: 'fitness', dir: -1 };

const STRATEGY_COLS = [
    { key: 'id', label: '编号', sortable: true },
    { key: 'is_active', label: '状态', sortable: true },
    { key: 'rule_name', label: '策略名称', sortable: true },
    { key: 'rule_type', label: '类型', sortable: true },
    { key: 'fitness', label: '评分', sortable: true },
    { key: 'annual_return', label: '年化收益', sortable: true },
    { key: 'win_rate', label: '胜率', sortable: true },
    { key: 'sharpe_ratio', label: '夏普', sortable: true },
    { key: 'max_drawdown', label: '最大回撤', sortable: true },
    { key: 'total_trades', label: '交易数', sortable: true },
    { key: null, label: '操作', sortable: false }
];

function sortRules(rules) {
    const { key, dir } = strategySort;
    return [...rules].sort((a, b) => {
        let va = a[key] ?? 0, vb = b[key] ?? 0;
        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();
        if (va < vb) return -dir;
        if (va > vb) return dir;
        return 0;
    });
}

function renderStrategyTable(rules) {
    let html = '';
    if (rules.length > 0) {
        const activeCount = rules.filter(r => r.is_active).length;
        const topFitness = rules.reduce((best, r) => (r.fitness||0) > (best.fitness||0) ? r : best, rules[0]);
        const avgReturn = (rules.reduce((s,r) => s + (r.annual_return||0), 0) / rules.length).toFixed(1);

        html += `<div class="metrics-row">
            <div class="metric-card">
                <div class="val">${(topFitness.fitness||0).toFixed(4)}</div>
                <div class="lbl">最高评分 · #${topFitness.id}</div>
            </div>
            <div class="metric-card">
                <div class="val ${parseFloat(avgReturn) >= 0 ? 'positive' : 'negative'}">${avgReturn}%</div>
                <div class="lbl">平均年化收益</div>
            </div>
            <div class="metric-card">
                <div class="val">${activeCount}</div>
                <div class="lbl">已启用策略</div>
            </div>
            <div class="metric-card">
                <div class="val" style="color:var(--text-muted)">${rules.length}</div>
                <div class="lbl">策略总数</div>
            </div>
        </div>`;

        html += `<div class="table-wrapper"><table><thead><tr>`;
        STRATEGY_COLS.forEach(col => {
            if (col.sortable) {
                const active = strategySort.key === col.key;
                const arrow = active ? (strategySort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
                html += `<th style="cursor:pointer;user-select:none" onclick="strategySortBy('${col.key}')">${col.label}${arrow}</th>`;
            } else {
                html += `<th>${col.label}</th>`;
            }
        });
        html += `</tr></thead><tbody>`;

        const sorted = sortRules(rules);
        sorted.forEach(r => {
            const retCls = (r.annual_return||0) >= 0 ? 'positive' : 'negative';
            html += `<tr>
                <td style="color:var(--accent);font-weight:600">#${r.id}</td>

function strategySortBy(key) {
    if (strategySort.key === key) {
        strategySort.dir *= -1;

        strategySort.key = key;
        strategySort.dir = -1;
    }
    const rulesEl = document.getElementById('strategyRules');
    if (rulesEl && window._strategyRules) {
        rulesEl.outerHTML = renderStrategyTable(window._strategyRules);

}

let miningActive = false;

async function toggleMining() {
    if (miningActive) {
        await RequestManager.fetch('mine-stop', API + '/strategy/mine/stop', { method: 'POST' });
        document.getElementById('miningStatus').innerHTML = '<span class="badge badge-warning">已请求停止</span>';
        return;
    }
    const st = document.getElementById('miningStatus');
    st.innerHTML = '<span class="badge badge-running">挖掘中</span>';
    const resp = await RequestManager.fetch('mine-start', API + '/strategy/mine', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if (resp.success) {
        miningActive = true;
        updateMiningButton();
        pollMining();
    } else {
        st.innerHTML = '<span class="badge badge-error">启动失败: '+(resp.error||'')+'</span>';
    }
}

async function pollMining() {
    const st = document.getElementById('miningStatus');
    const resp = await RequestManager.fetch('mine-status', API + '/strategy/mine/status');
    if (resp.data.running) {
        st.innerHTML = '<span class="badge badge-running">挖掘中</span>';
        timerManager.setTimeout('minePoll', pollMining, 3000);
    } else if (resp.data.progress === 'error') {
        st.innerHTML = '<span class="badge badge-error">错误: '+(resp.data.result||'')+'</span>';
        miningActive = false; updateMiningButton();
    } else {
        const count = resp.data.result ? resp.data.result.length : 0;
        st.innerHTML = '<span class="badge badge-done">完成 '+count+' 条</span>';
        miningActive = false; updateMiningButton();
        loadTab('strategy');
    }
}

async function resetMining() {
    await RequestManager.fetch('mine-reset', API + '/strategy/mine/reset', { method: 'POST' });
    miningActive = false;
    updateMiningButton();
    document.getElementById('miningStatus').textContent = '';
}

function updateMiningButton() {
    const btn = document.getElementById('mineBtn');
    btn.textContent = miningActive ? '停止挖掘' : '挖掘新策略';

function loadBTSetting(key, defaultVal) {
    try { const v = localStorage.getItem(key); return v !== null ? v : defaultVal; }
    catch(e) { return defaultVal; }
}
function saveBTSetting(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

async function startBacktest() {
    const ruleId = document.getElementById('btRule').value;
    const start = document.getElementById('btStart').value, end = document.getElementById('btEnd').value;
    const stopLoss = parseFloat(document.getElementById('btStopLoss').value) || -8;
    const takeProfit = parseFloat(document.getElementById('btTakeProfit').value) || 20;
    const holdingMax = parseInt(document.getElementById('btHolding').value) || 20;
    saveBTSetting('btStopLoss', stopLoss); saveBTSetting('btTakeProfit', takeProfit); saveBTSetting('btHolding', holdingMax);
    const st = document.getElementById('btStatus');
    st.innerHTML = '<span class="badge badge-running">回测中</span>';
    const resp = await RequestManager.fetch('bt-run', API + '/backtest/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        rule_id:parseInt(ruleId),start_date:start,end_date:end,
        stop_loss:stopLoss/100, take_profit:takeProfit/100, holding_max:holdingMax
    })});
    if (resp.success) { pollBt(0); }
    else { st.innerHTML = '<span class="badge badge-error">'+(resp.error||'')+'</span>'; }
}

const BT_MAX_POLLS = 400;

async function pollBt(n) {
    const st = document.getElementById('btStatus');
    if (n >= BT_MAX_POLLS) {
        st.innerHTML = '<span class="badge badge-error">超时</span>';
        return;
    }
    const resp = await RequestManager.fetch('bt-status', API + '/backtest/status');
    if (resp.data.running) {
        const p = resp.data.progress || 0, t = resp.data.total || 0;
        st.innerHTML = '<span class="badge badge-running">回测中 ' + (t > 0 ? `(${p}/${t})` : '') + '</span>';
        timerManager.setTimeout('btPoll', function() { pollBt(n + 1); }, 3000);
    }
    else if (resp.data.error) { st.innerHTML = '<span class="badge badge-error">'+resp.data.error+'</span>'; }
    else if (resp.data.result_id) { st.innerHTML = '<span class="badge badge-done">完成</span>'; viewResult(resp.data.result_id); }
    else { st.innerHTML = '<span class="badge badge-done">完成</span>'; loadTab('backtest'); }
}

// ─── Compare ───
function toggleAllCompare(el) {
    document.querySelectorAll('.compare-check').forEach(cb => cb.checked = el.checked);
    updateCompareButton();
}

function updateCompareButton() {
    const cbs = document.querySelectorAll('.compare-check:checked');
    const btn = document.getElementById('compareBtn');
    if (btn) { btn.disabled = cbs.length < 2; btn.textContent = `对比选中 (${cbs.length})`; }
}

async function compareSelected() {
    const ids = Array.from(document.querySelectorAll('.compare-check:checked')).map(cb => cb.value).join(',');
    const resp = await RequestManager.fetch('bt-compare', API + '/backtest/compare?ids=' + ids);
    if (!resp.data || !resp.data.length) return;
    showCompareModal(resp.data);
}

function showCompareModal(results) {
    const metrics = ['annual_return', 'win_rate', 'sharpe_ratio', 'max_drawdown', 'total_trades'];
    const metricLabels = ['年化收益(%)', '胜率(%)', '夏普比率', '最大回撤(%)', '总交易数'];
    const bestAnnual = Math.max(...results.map(r => r.annual_return || -Infinity));
    const bestDrawdown = Math.max(...results.map(r => r.max_drawdown || -Infinity));

    let html = '<div style="overflow-x:auto;"><table><thead><tr><th>指标</th>';
    results.forEach(r => html += `<th>${r.rule_name || '#' + r.result_id}</th>`);
    html += '</tr></thead><tbody>';

    metrics.forEach((m, i) => {
        html += `<tr><td>${metricLabels[i]}</td>`;
        results.forEach(r => {
            const val = r[m];
            const display = val != null ? (typeof val === 'number' ? val.toFixed(2) : val) : '--';
            let style = '';
            if ((m === 'annual_return' && val === bestAnnual) || (m === 'max_drawdown' && val === bestDrawdown)) {
                style = 'color:var(--green, #10b981);font-weight:bold;';
            }
            html += `<td style="${style}">${display}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    showModal('回测结果对比', html);
}

document.addEventListener('change', e => {
    if (e.target.classList.contains('compare-check')) updateCompareButton();
});

async function showScoreHistory(code) {
    const days = document.getElementById('historyDays')?.value || '30';
    const resp = await RequestManager.fetch('score-history-' + code, API + `/scoring/stock/${code}/history?days=${days}`);

    const modalHtml = `
        <div>
            <select id="historyDays" onchange="showScoreHistory('${code}')" style="margin-bottom:12px;">
                <option value="7" ${days==='7'?'selected':''}>近7天</option>
                <option value="30" ${days==='30'?'selected':''}>近30天</option>
                <option value="60" ${days==='60'?'selected':''}>近60天</option>
                <option value="90" ${days==='90'?'selected':''}>近90天</option>
            </select>
            <div id="historyChart" style="width:100%;height:350px;"></div>
        </div>`;

    showModal(code + ' 打分趋势', modalHtml);

    if (!resp.data || resp.data.length < 2) {
        document.getElementById('historyChart').innerHTML =
            '<div style="text-align:center;padding:60px;color:var(--text-secondary);">数据不足</div>';
        return;
    }

    const byRule = {};
    const allDates = new Set();
    resp.data.forEach(d => {
        if (!byRule[d.rule_name]) byRule[d.rule_name] = {};
        byRule[d.rule_name][d.trade_date] = d.score;
        allDates.add(d.trade_date);
    });

    const dates = Array.from(allDates).sort();
    const colors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4'];

    const series = Object.entries(byRule).map(([rule, dateMap], idx) => ({
        name: rule,
        type: 'line',
        smooth: true,
        data: dates.map(d => dateMap[d] ?? null),
        lineStyle: { color: colors[idx % colors.length] },
    }));

    const xLabels = dates.map(d => parseInt(days) <= 7 ? d.slice(5) : d);

    var scoreChartInst = ChartManager.get('scoreHistory', document.getElementById('historyChart'));
    scoreChartInst.setOption({
        tooltip: { trigger: 'axis' },
        toolbox: { feature: { saveAsImage: { title: '下载' } } },
        xAxis: { type: 'category', data: xLabels, axisLabel: { rotate: 45, fontSize: 10 } },
        yAxis: { type: 'value', name: '分' },
        series: series,
        grid: { left: 50, right: 20, top: 30, bottom: 60 },
    });
    if (!window._scoreHistoryResizeBound) {
        window._scoreHistoryResizeBound = true;
        window.addEventListener('resize', function() {
            var inst = ChartManager.instances['scoreHistory'];
            if (inst) inst.resize();
        });
    }
}

function closeModal() {
    var modal = document.getElementById('compareModal');
    if (modal) {
        ChartManager.dispose('scoreHistory');
        modal.style.display = 'none';
    }
}

function showModal(title, bodyHtml) {
    let modal = document.getElementById('compareModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'compareModal';
        modal.style.cssText = 'display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center;';
        modal.onclick = function(e) { if (e.target === modal) closeModal(); };
        document.body.appendChild(modal);
    }
    modal.innerHTML = `<div style="background:var(--surface);border-radius:8px;padding:24px;max-width:90vw;max-height:80vh;overflow:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;color:var(--text);">${title}</h3>
            <button class="btn btn-danger btn-sm" onclick="closeModal()">关闭</button>
        </div>${bodyHtml}</div>`;
    modal.style.display = 'flex';
}

// ─── K-line overlay ───
function klineColor(d) {
    if (!d) return '#ef5350';
    if (d.limitType === 'limit_up') return '#ab47bc';
    if (d.limitType === 'limit_down') return '#42a5f5';
    return d.close >= d.open ? '#ef5350' : '#26a69a';
}

async function openKline(code, entryDate, entryPrice, exitDate, exitPrice, resultId) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    let start = '2024-01-01', end = new Date().toISOString().split('T')[0];
    if (entryDate) { const d = new Date(entryDate); d.setMonth(d.getMonth()-2); start = d.toISOString().split('T')[0]; }
    if (exitDate) { const d = new Date(exitDate); d.setMonth(d.getMonth()+2); end = d.toISOString().split('T')[0]; }

    let url = API + '/scoring/kline/' + code + '?start=' + start + '&end=' + end;
    if (resultId) url += '&result_id=' + resultId;

    let kdata = [], marks = [];
    try {
        const resp = await RequestManager.fetch('kline-' + code, url);
        kdata = (resp.data?.kline || []).map(d => ({ date: d[0], open: d[1], close: d[2], low: d[3], high: d[4], vol: d[5] || 0 }));
        marks = resp.data?.marks || [];
    } catch(e) {
        console.error('kline fetch error:', e);
        showToast('K线数据获取失败', 'error');
    }

    if (kdata.length === 0) {
        document.getElementById('klineTradeInfo').innerHTML = '<p class="text-muted">无K线数据</p>';
        return;
    }

    for (let i = 0; i < kdata.length; i++) {
        kdata[i].prevClose = i > 0 ? kdata[i-1].close : kdata[i].open;
        kdata[i].chgPct = kdata[i].prevClose > 0 ? ((kdata[i].close / kdata[i].prevClose - 1) * 100) : 0;
        kdata[i].limitType = (function() {
            if (!kdata[i].prevClose || kdata[i].prevClose <= 0) return 'normal';
            const chgPct = (kdata[i].close / kdata[i].prevClose - 1) * 100;
            const n = /^30/.test(code) || /^688/.test(code) ? 19.5 : /^[84]/.test(code) ? 29.5 : 9.5;
            if (chgPct >= n) return 'limit_up';
            if (chgPct <= -n) return 'limit_down';
            return 'normal';
        })();
    }

    const dates = kdata.map(d => d.date);
    const ohlc = kdata.map(d => {
        const color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    const volData = kdata.map(d => ({
        value: d.vol,
        itemStyle: { color: d.chgPct >= 0 ? '#ef5350' : '#26a69a' }
    }));

    var klineChartInst = ChartManager.get('kline', document.getElementById('klineChart'));
    klineChartInst.clear();

    var opt = {
        title: { text: code + ' K线图', left: 'center', textStyle: { color: '#dde4f0', fontSize: 14, fontFamily: "'JetBrains Mono', monospace" } },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            formatter: function(params) {
                var idx = params[0]?.dataIndex;
                if (idx == null) return '';
                var d = kdata[idx];
                var chgColor = d.chgPct >= 0 ? '#ef5350' : '#26a69a';
                var limitLabel = d.limitType === 'limit_up' ? ' [涨停]' : d.limitType === 'limit_down' ? ' [跌停]' : '';
                return '<b>' + d.date + '</b>' + limitLabel + '<br/>' +
                    '开: ' + d.open.toFixed(2) + ' &nbsp; 高: ' + d.high.toFixed(2) + '<br/>' +
                    '收: ' + d.close.toFixed(2) + ' &nbsp; 低: ' + d.low.toFixed(2) + '<br/>' +
                    '涨跌幅: <span style="color:' + chgColor + ';font-weight:bold">' + (d.chgPct >= 0 ? '+' : '') + d.chgPct.toFixed(2) + '%</span><br/>' +
                    '成交量: ' + (d.vol/10000).toFixed(0) + '万';
            }
        },
        grid: [
            { left: '10%', right: '10%', top: 50, height: '60%' },
            { left: '10%', right: '10%', top: '78%', height: '12%' }
        ],
        xAxis: [
            { type: 'category', data: dates, gridIndex: 0, axisLabel: { color: '#6b7a9a', rotate: 30 }, axisLine: { lineStyle: { color: '#182240' } } },
            { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#182240' } } }
        ],
        yAxis: [
            { scale: true, gridIndex: 0, axisLabel: { color: '#6b7a9a' }, splitLine: { lineStyle: { color: '#111832' } } },
            { scale: true, gridIndex: 1, axisLabel: { color: '#6b7a9a', fontSize: 10 }, splitLine: { show: false }, splitNumber: 2 }
        ],
        dataZoom: [
            { type: 'slider', xAxisIndex: [0, 1], start: 50, end: 100, height: 25, bottom: 0,
              borderColor: '#182240', backgroundColor: '#0c1124',
              dataBackground: { lineStyle: { color: '#00d4f0' }, areaStyle: { color: 'rgba(0,212,240,0.08)' } },
              textStyle: { color: '#6b7a9a' }, handleStyle: { color: '#00d4f0' } },
            { type: 'inside', xAxisIndex: [0, 1], zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
        ],
        series: [
            { type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 20 },
            { type: 'bar', name: '成交量', data: volData, xAxisIndex: 1, yAxisIndex: 1, barWidth: '60%' }
        ]
    };

    if (marks.length > 0) {
        opt.series.push({
            type: 'scatter', name: '买卖点', data: marks.map(function(m) { return [m.date, m.price]; }), xAxisIndex: 0, yAxisIndex: 0,
            symbolSize: 14, symbol: 'pin',
            itemStyle: { color: function(p) { return marks[p.dataIndex]?.type === 'buy' ? '#ef5350' : '#26a69a'; } },
            label: { show: true, formatter: function(p) { return marks[p.dataIndex]?.type === 'buy' ? 'B' : 'S'; }, color: '#fff', fontSize: 10, fontWeight: 'bold', position: 'top' }
        });
    }

    klineChartInst.setOption(opt);
    klineChartInst.resize();

    let infoHtml = `<h4 style="font-family:var(--font-mono);margin-bottom:8px;color:var(--text-primary)">${code}</h4>`;
    if (entryDate && entryPrice) {
        infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">买入: ${entryDate} 价格: ${entryPrice}</p>`;
        if (exitDate && exitPrice && entryPrice > 0) {
            const pnl = ((exitPrice/entryPrice - 1)*100).toFixed(2);
            const cls = parseFloat(pnl) >= 0 ? 'positive' : 'negative';
            infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">卖出: ${exitDate} 价格: ${exitPrice} 收益: <span class="${cls}">${pnl}%</span></p>`;
        }
    }
    document.getElementById('klineTradeInfo').innerHTML = infoHtml;
}

function closeKline() { document.getElementById('klinePanel').classList.remove('open'); }

// ─── Init ───
loadTab('scores');
</script>
