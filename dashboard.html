<script>
const API = '/api';

// ─── Toast notification system ───
var Toast = {
    container: null,

    init: function() {
        if (!this.container) {
            this.container = document.createElement('div');
            this.container.className = 'toast-container';
            document.body.appendChild(this.container);
        }
    },

    show: function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        this.init();
        var icons = { success: '&#x2713;', error: '&#x2717;', warning: '&#x26A0;', info: '&#x2139;' };
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.innerHTML = '<span class="toast-icon">' + (icons[type] || icons.info) + '</span> <span>' + message + '</span>';
        this.container.appendChild(toast);
        var self = this;
        requestAnimationFrame(function() { toast.classList.add('show'); });
        setTimeout(function() {
            toast.classList.remove('show');
            setTimeout(function() { toast.remove(); }, 300);
        }, duration);
    }
};

function showToast(message, type) { Toast.show(message, type); }

// ─── Skeleton loading ───
function showSkeleton(container, rowCount) {
    rowCount = rowCount || 10;
    var cols = ['w80', 'w120', 'w200', 'w80', 'w120'];
    var html = '';
    for (var i = 0; i < rowCount; i++) {
        html += '<div class="skeleton-row">';
        for (var j = 0; j < cols.length; j++) {
            html += '<div class="skeleton-cell ' + cols[j] + ' skeleton"></div>';
        }
        html += '</div>';
    }
    container.innerHTML = html;
}

async function fetchJSON(url, opts) {
    opts = opts || {};
    const resp = await fetch(url, opts);
    if (!resp.ok) {
        // 优先透传后端 JSON 里的中文错误信息（fail() 返回 {error: "..."}），
        // 否则只能看到 statusText（如 409 -> "CONFLICT"）
        let msg = '';
        try { const j = await resp.json(); msg = (j && j.error) || ''; } catch (e) {}
        throw new Error(msg || resp.statusText || ('HTTP ' + resp.status));
    }
    return resp.json();
}

// ─── Request manager (AbortController-based cancellation) ───
var RequestManager = {
    controllers: {},

    fetch: function(key, url, opts) {
        this.cancel(key);
        var ctrl = new AbortController();
        this.controllers[key] = ctrl;
        opts = opts || {};
        opts.signal = ctrl.signal;
        var self = this;
        return fetchJSON(url, opts).then(function(data) {
            delete self.controllers[key];
            return data;
        }).catch(function(e) {
            delete self.controllers[key];
            throw e;
        });
    },

    cancel: function(key) {
        if (this.controllers[key]) {
            this.controllers[key].abort();
            delete this.controllers[key];
        }
    },

    cancelAll: function() {
        var self = this;
        Object.keys(this.controllers).forEach(function(k) {
            self.controllers[k].abort();
        });
        this.controllers = {};
    }
};

// ─── Tab state cache (5-min validity) ───
var TabState = {
    states: {},
    MAX_AGE: 5 * 60 * 1000,

    save: function(tab) {
        var content = document.getElementById('content');
        var scrollEl = document.querySelector('.content');
        this.states[tab] = {
            html: content ? content.innerHTML : '',
            scrollTop: scrollEl ? scrollEl.scrollTop : 0,
            ts: Date.now()
        };
    },

    load: function(tab) {
        var s = this.states[tab];
        if (s && Date.now() - s.ts < this.MAX_AGE) return s;
        delete this.states[tab];
        return null;
    }
};

// ─── ECharts instance manager ───
var ChartManager = {
    instances: {},

    get: function(key, dom) {
        if (this.instances[key]) {
            var inst = this.instances[key];
            if (inst.getDom && inst.getDom() === dom) return inst;
            this.dispose(key);
        }
        var inst = echarts.init(dom);
        this.instances[key] = inst;
        return inst;
    },

    dispose: function(key) {
        if (this.instances[key]) {
            this.instances[key].dispose();
            delete this.instances[key];
        }
    },

    disposeAll: function() {
        var self = this;
        Object.keys(this.instances).forEach(function(k) { self.dispose(k); });
    }
};

window.addEventListener('beforeunload', function() { ChartManager.disposeAll(); });

// ─── Timer manager for centralized cleanup ───
var timerManager = {
    timers: {},

    setInterval: function(key, fn, delay) {
        this.clear(key);
        this.timers[key] = setInterval(fn, delay);
    },

    setTimeout: function(key, fn, delay) {
        this.clear(key);
        var self = this;
        this.timers[key] = setTimeout(function() { fn(); delete self.timers[key]; }, delay);
    },

    clear: function(key) {
        if (this.timers[key] != null) {
            clearInterval(this.timers[key]);
            clearTimeout(this.timers[key]);
            delete this.timers[key];
        }
    },

    clearAll: function() {
        var self = this;
        Object.keys(this.timers).forEach(function(k) {
            clearInterval(self.timers[k]);
            clearTimeout(self.timers[k]);
        });
        this.timers = {};
    }
};

function switchTab(tab) {
    RequestManager.cancelAll();
    timerManager.clearAll();

    // 保存当前 tab 状态（包括 scores tab 的日期选择）
    if (currentTab) {
        TabState.save(currentTab);
    }

    currentTab = tab;

    // Update nav active
    var navItems = document.querySelectorAll('.nav-item');
    for (var i = 0; i < navItems.length; i++) { navItems[i].classList.remove('active'); }
    var btn = document.querySelector('.nav-item[onclick*="' + tab + '"]');
    if (btn) btn.classList.add('active');

    // Try cached state
    var cached = TabState.load(tab);
    if (cached) {
        document.getElementById('content').innerHTML = cached.html;
        var scrollEl = document.querySelector('.content');
        if (scrollEl) scrollEl.scrollTop = cached.scrollTop;
        return;
    }

    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    showSkeleton(c, 10);
    try {
        if (tab === 'home') await loadHomeTab(c);
        else if (tab === 'screen') await loadScreenTab(c);
        else if (tab === 'backtest') await loadBacktestTab(c);

        c.firstElementChild?.classList.add('tab-content');
    } catch(e) {
        showToast('加载失败，请重试', 'error');
        c.innerHTML = '<div class="empty-state" style="color:var(--danger)">加载失败: ' + e.message + '</div>';
    }
}

function clearScreenFilters() {
    document.querySelectorAll('#content input[type="checkbox"]').forEach(function(cb) { cb.checked = false; });
    document.getElementById('scr_marketCap').value = '0';
    document.getElementById('scr_macd_fast').value = '12';
    document.getElementById('scr_macd_slow').value = '26';
    document.getElementById('scr_macd_signal').value = '9';
    document.getElementById('scr_macd_dif_op').value = '';
    document.getElementById('scr_macd_dif_val').value = '0';
    // 同时清空 DEA / 柱体 数值范围
    document.getElementById('scr_macd_dea_op').value = '';
    document.getElementById('scr_macd_dea_val').value = '0';
    document.getElementById('scr_macd_hist_op').value = '';
    document.getElementById('scr_macd_hist_val').value = '0';
    document.getElementById('scr_turnover_min').value = '';
    document.getElementById('scr_turnover_max').value = '';
    document.getElementById('screenTableContainer').innerHTML = '<div class="empty-state">请勾选筛选条件后点击"开始筛选"</div>';
    document.getElementById('screenMetrics').innerHTML = '';
    document.getElementById('screenStatus').textContent = '';
    screenClusterize = null;
}

// 一键策略模板：预设条件组合，勾选后自动触发筛选
function applyScreenTemplate(name) {
    clearScreenFilters();
    if (name === 'oversold_rebound') {
        // 超跌反弹：RSI超卖 + KDJ金叉
        document.getElementById('scr_rsi_oversold').checked = true;
        document.getElementById('scr_kdj_golden').checked = true;
        showToast('已应用模板：超跌反弹（RSI超卖 + KDJ金叉）', 'info');
    } else if (name === 'strong_breakout') {
        // 强势突破：MACD金叉 + 均线多头 + 放量
        document.getElementById('scr_macd_golden').checked = true;
        document.getElementById('scr_ma_bull').checked = true;
        document.getElementById('scr_vol_surge').checked = true;
        showToast('已应用模板：强势突破（MACD金叉 + 均线多头 + 放量）', 'info');
    } else if (name === 'active_smallcap') {
        // 活跃小盘：市值≤100亿 + 换手3~15% + 站上20日线
        document.getElementById('scr_marketCap').value = '100';
        document.getElementById('scr_turnover_min').value = '3';
        document.getElementById('scr_turnover_max').value = '15';
        document.getElementById('scr_ma_above20').checked = true;
        showToast('已应用模板：活跃小盘（市值≤100亿 + 换手3~15% + 站上20日线）', 'info');
    }
    runScreen();
}

async function runScreen() {
    var container = document.getElementById('screenTableContainer');
    var statusEl = document.getElementById('screenStatus');
    var metricsEl = document.getElementById('screenMetrics');
    
    // 收集筛选条件
    var filters = {};
    
    // 基础筛选
    filters.exclude_kcb = document.getElementById('scr_filterKCB').checked;
    filters.exclude_cyb = document.getElementById('scr_filterCYB').checked;
    filters.max_market_cap = parseFloat(document.getElementById('scr_marketCap').value) || 0;
    
    // MACD 条件
    filters.macd_fast = parseInt(document.getElementById('scr_macd_fast').value) || 12;
    filters.macd_slow = parseInt(document.getElementById('scr_macd_slow').value) || 26;
    filters.macd_signal = parseInt(document.getElementById('scr_macd_signal').value) || 9;
    filters.macd = [];
    if (document.getElementById('scr_macd_golden').checked) filters.macd.push('golden');
    if (document.getElementById('scr_macd_death').checked) filters.macd.push('death');
    // 柱状图正负复选框已由"柱体数值范围"替代，不再使用 hist_positive/hist_negative
    // DIF 值筛选
    var difOp = document.getElementById('scr_macd_dif_op').value;
    var difVal = parseFloat(document.getElementById('scr_macd_dif_val').value);
    if (difOp && !isNaN(difVal)) {
        filters.macd_dif = {op: difOp, value: difVal};
    }
    // DEA 值筛选
    var deaOp = document.getElementById('scr_macd_dea_op').value;
    var deaVal = parseFloat(document.getElementById('scr_macd_dea_val').value);
    if (deaOp && !isNaN(deaVal)) {
        filters.macd_dea = {op: deaOp, value: deaVal};
    }
    // 柱状图数值筛选
    var histOp = document.getElementById('scr_macd_hist_op').value;
    var histVal = parseFloat(document.getElementById('scr_macd_hist_val').value);
    if (histOp && !isNaN(histVal)) {
        filters.macd_hist = {op: histOp, value: histVal};
    }
    
    // RSI 条件
    filters.rsi = [];
    if (document.getElementById('scr_rsi_oversold').checked) filters.rsi.push('oversold');
    if (document.getElementById('scr_rsi_overbought').checked) filters.rsi.push('overbought');
    if (document.getElementById('scr_rsi_mid').checked) filters.rsi.push('mid');
    
    // KDJ 条件
    filters.kdj = [];
    if (document.getElementById('scr_kdj_golden').checked) filters.kdj.push('golden');
    if (document.getElementById('scr_kdj_death').checked) filters.kdj.push('death');
    if (document.getElementById('scr_kdj_oversold').checked) filters.kdj.push('oversold');
    if (document.getElementById('scr_kdj_overbought').checked) filters.kdj.push('overbought');
    
    // 均线条件
    filters.ma = [];
    if (document.getElementById('scr_ma_bull').checked) filters.ma.push('bull');
    if (document.getElementById('scr_ma_bear').checked) filters.ma.push('bear');
    if (document.getElementById('scr_ma_above20').checked) filters.ma.push('above20');
    if (document.getElementById('scr_ma_below20').checked) filters.ma.push('below20');
    
    // 量能条件
    filters.vol = [];
    if (document.getElementById('scr_vol_surge').checked) filters.vol.push('surge');
    if (document.getElementById('scr_vol_shrink').checked) filters.vol.push('shrink');
    
    // 换手率区间
    var toMin = parseFloat(document.getElementById('scr_turnover_min').value);
    var toMax = parseFloat(document.getElementById('scr_turnover_max').value);
    if (!isNaN(toMin) || !isNaN(toMax)) {
        filters.turnover = {};
        if (!isNaN(toMin)) filters.turnover.min = toMin;
        if (!isNaN(toMax)) filters.turnover.max = toMax;
    }
    
    // 涨跌幅条件
    filters.change = [];
    if (document.getElementById('scr_chg_up').checked) filters.change.push('up');
    if (document.getElementById('scr_chg_down').checked) filters.change.push('down');
    if (document.getElementById('scr_chg_limit_up').checked) filters.change.push('limit_up');
    if (document.getElementById('scr_chg_limit_down').checked) filters.change.push('limit_down');
    
    // 检查是否有筛选条件
    var hasFilter = filters.exclude_kcb || filters.exclude_cyb || filters.max_market_cap > 0 ||
        filters.macd.length > 0 || filters.rsi.length > 0 || filters.kdj.length > 0 ||
        filters.ma.length > 0 || filters.vol.length > 0 || filters.change.length > 0 ||
        filters.turnover || filters.macd_dif || filters.macd_dea || filters.macd_hist;
    
    if (!hasFilter) {
        showToast('请至少勾选一个筛选条件', 'warning');
        return;
    }
    
    statusEl.textContent = '筛选中...';
    showSkeleton(container, 10);
    
    try {
        var resp = await RequestManager.fetch('screen', API + '/screen', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(filters)
        });
        
        if (!resp.success) {
            throw new Error(resp.error || '筛选失败');
        }
        
        _screenData = resp.data || [];
        statusEl.textContent = '共 ' + _screenData.length + ' 只股票符合条件';
        
        // 更新日期显示
        var dateEl = document.getElementById('screenDataDate');
        if (dateEl && resp.date) dateEl.textContent = resp.date;
        
        // 显示指标统计
        if (metricsEl && _screenData.length > 0) {
            var macdGolden = 0, rsiOversold = 0, kdjGolden = 0;
            _screenData.forEach(function(s) {
                if (s.macd_state === 'golden') macdGolden++;
                if (s.rsi_state === 'oversold') rsiOversold++;
                if (s.kdj_state === 'golden') kdjGolden++;
            });
            metricsEl.innerHTML = '<div class="metrics-row">' +
                '<div class="metric-card"><div class="val">' + _screenData.length + '</div><div class="lbl">符合条件</div></div>' +
                '<div class="metric-card"><div class="val" style="color:var(--green, #10b981)">' + macdGolden + '</div><div class="lbl">MACD金叉</div></div>' +
                '<div class="metric-card"><div class="val" style="color:var(--green, #10b981)">' + rsiOversold + '</div><div class="lbl">RSI超卖</div></div>' +
                '<div class="metric-card"><div class="val" style="color:var(--green, #10b981)">' + kdjGolden + '</div><div class="lbl">KDJ金叉</div></div>' +
                '</div>';
        }
        
        renderScreenTable(_screenData);
    } catch(e) {
        statusEl.textContent = '筛选失败: ' + e.message;
        container.innerHTML = '<div class="empty-state">筛选失败: ' + e.message + '</div>';
    }
}

function renderScreenTable(stocks) {
    var container = document.getElementById('screenTableContainer');
    if (!container) return;
    
    if (stocks.length === 0) {
        container.innerHTML = '<div class="empty-state">没有符合条件的股票</div>';
        screenClusterize = null;
        return;
    }
    
    container.innerHTML = '<div id="screenScrollArea" class="clusterize-scroll" style="max-height:60vh;overflow-y:auto;">' +
        '<table><thead><tr>' +
        '<th>#</th><th>代码</th><th>名称</th><th>MACD</th><th>RSI14</th><th>KDJ</th><th>均线</th><th>量比</th><th>市值(亿)</th>' +
        '</tr></thead>' +
        '<tbody id="screenContentArea" class="clusterize-content"></tbody>' +
        '</table></div>';
    
    // 等待 DOM 更新后再初始化 Clusterize
    var scrollElem = document.getElementById('screenScrollArea');
    var contentElem = document.getElementById('screenContentArea');
    
    if (scrollElem && contentElem) {
        screenClusterize = new Clusterize({
            rows: stocks.map(function(s, i) { return screenRowToHTML(s, i + 1); }),
            scrollElem: scrollElem,
            contentElem: contentElem,
            rows_in_block: 50,
            blocks_in_cluster: 4,
        });
    }
}

function screenRowToHTML(stock, idx) {
    // MACD 状态
    var macdHtml = '<span style="color:var(--text-muted)">--</span>';
    if (stock.macd_state) {
        var macdColor = stock.macd_state === 'golden' ? 'var(--green, #10b981)' : 'var(--danger)';
        var macdLabel = stock.macd_state === 'golden' ? '▲多' : '▼空';
        macdHtml = '<span style="color:' + macdColor + ';font-weight:600">' + macdLabel + '</span>';
    }
    
    // RSI 值
    var rsiHtml = '--';
    if (stock.rsi14 != null) {
        var rsiColor = stock.rsi14 < 30 ? 'var(--green, #10b981)' : stock.rsi14 > 70 ? 'var(--danger)' : 'var(--text-primary)';
        rsiHtml = '<span style="color:' + rsiColor + '">' + stock.rsi14.toFixed(1) + '</span>';
    }
    
    // KDJ 状态
    var kdjHtml = '--';
    if (stock.kdj_state) {
        var kdjColor = stock.kdj_state === 'golden' ? 'var(--green, #10b981)' : 'var(--danger)';
        var kdjLabel = stock.kdj_state === 'golden' ? 'K>D' : 'K<D';
        kdjHtml = '<span style="color:' + kdjColor + '">' + kdjLabel + '</span>';
    }
    
    // 均线状态
    var maHtml = '--';
    if (stock.ma_state) {
        var maColor = stock.ma_state === 'bull' ? 'var(--green, #10b981)' : stock.ma_state === 'bear' ? 'var(--danger)' : 'var(--accent)';
        var maLabel = stock.ma_state === 'bull' ? '多头' : stock.ma_state === 'bear' ? '空头' : stock.ma_state;
        maHtml = '<span style="color:' + maColor + '">' + maLabel + '</span>';
    }
    
    // 量比
    var volHtml = '--';
    if (stock.vol_ratio != null) {
        var volColor = stock.vol_ratio > 2 ? 'var(--warning)' : stock.vol_ratio < 0.5 ? 'var(--accent)' : 'var(--text-primary)';
        volHtml = '<span style="color:' + volColor + '">' + stock.vol_ratio.toFixed(2) + '</span>';
    }
    
    var marketCap = stock.market_cap ? stock.market_cap.toFixed(1) : '--';
    
    return '<tr>' +
        '<td style="color:var(--text-muted);width:40px">' + idx + '</td>' +
        '<td><span class="code-link" onclick="openKline(\'' + stock.code + '\')">' + stock.code + '</span></td>' +
        '<td>' + (stock.name || '--') + '</td>' +
        '<td>' + macdHtml + '</td>' +
        '<td>' + rsiHtml + '</td>' +
        '<td>' + kdjHtml + '</td>' +
        '<td>' + maHtml + '</td>' +
        '<td>' + volHtml + '</td>' +
        '<td style="color:var(--text-secondary)">' + marketCap + '</td>' +
        '</tr>';
}

function greetingByHour() {
    var h = new Date().getHours();
    if (h < 6)  return '夜深了 🌙';
    if (h < 11) return '早上好 ☀️';
    if (h < 14) return '中午好 🌤';
    if (h < 18) return '下午好 🌞';
    return '晚上好 🌙';
}

// 三周期分组定义（与后端 horizon 一致）
const HORIZON_GROUPS = [
    { key: 'short', label: '短线', desc: '1~10 交易日' },
    { key: 'mid',   label: '中线', desc: '10~60 交易日' },
    { key: 'long',  label: '长线', desc: '60+ 交易日' },
];
const HORIZON_LABEL = { short: '短线', mid: '中线', long: '长线' };

// ─── 融合分归因：5 因子标签（各 0-10）+ sparkline + 详情弹窗 ───
const FACTOR_LABELS = [
    ['vol_score', '量能'],
    ['ma_score', '均线'],
    ['diverge_score', '量价背离'],
    ['bottom_score', '超跌反弹'],
    ['whale_score', '主力筹码'],
];

// 输入数值数组，返回内联 SVG 迷你走势图（约 64x20）。A股配色：末>首红涨、末<首绿跌。
function renderSparkline(values) {
    var vals = (values || []).filter(function(v) { return v != null && !isNaN(v); });
    var W = 64, H = 20, pad = 2;
    if (vals.length < 2) {
        return '<svg class="spark-svg" width="' + W + '" height="' + H + '">' +
            '<line x1="' + pad + '" y1="' + (H/2) + '" x2="' + (W-pad) + '" y2="' + (H/2) +
            '" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2,2"/></svg>';
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = (max - min) || 1;
    var n = vals.length;
    var pts = vals.map(function(v, i) {
        var x = pad + (W - 2*pad) * (i / (n - 1));
        var y = pad + (H - 2*pad) * (1 - (v - min) / span);
        return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var last = vals[n-1], first = vals[0];
    var color = last > first ? 'var(--danger)' : (last < first ? 'var(--success)' : 'var(--text-muted)');
    return '<svg class="spark-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + pts + '"/></svg>';
}

// 批量拉取多只股票的近 days 日融合分序列，填充对应 sparkline 占位。
async function fillSparklines(codes, days, idPrefix) {
    var list = (codes || []).filter(Boolean);
    if (!list.length) return;
    try {
        var resp = await RequestManager.fetch('spark-' + idPrefix, API +
            '/investor/factor_trend?codes=' + encodeURIComponent(list.join(',')) + '&days=' + (days || 7));
        var data = resp.data || {};
        list.forEach(function(code) {
            var el = document.getElementById(idPrefix + code);
            if (!el) return;
            var rows = data[code] || [];
            el.innerHTML = renderSparkline(rows.map(function(r) { return r.fusion_score; }));
        });
    } catch(e) {}
}

async function loadTodayPicks(isFallback) {
    const box = document.getElementById('todayPicks');
    const dateEl = document.getElementById('pickDate');
    const dateParam = dateEl && dateEl.value ? '&date=' + dateEl.value : '';
    try {
        const resp = await RequestManager.fetch('today', API + '/investor/today?limit=4' + dateParam);
        const data = (resp && resp.data) || {};
        const serverDate = data.date;
        // 自动回填日期（首次加载时）
        if (dateEl && !dateEl.value && serverDate) {
            dateEl.value = serverDate;
        }
        // 三周期分组（兼容旧结构：无 groups 时 items 视为短线组）
        const groups = data.groups || { short: data.items || [], mid: [], long: [] };
        window._todayPicks = { date: serverDate || '', groups };  // 供「一键复制」按钮使用
        const total = HORIZON_GROUPS.reduce((sum, g) => sum + ((groups[g.key] || []).length), 0);
        if (total === 0) {
            window._todayPicks = null;
            // 选中日期无推荐但可能存在更早的可用数据 → 回退到最新数据日重试一次
            if (dateEl && dateEl.value && !isFallback) {
                const picked = dateEl.value;
                dateEl.value = '';  // 清空后再查将返回最新数据日
                showToast('所选日期 ' + picked + ' 无推荐，已切换到最新数据日', 'info', 3000);
                return loadTodayPicks(true);
            }
            box.innerHTML = '<div class="empty-state">暂无推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到「高级筛选」跑一遍打分</span></div>';
            return;
        }
        box.innerHTML = HORIZON_GROUPS.map(g => {
            const list = groups[g.key] || [];
            const cards = list.length
                ? list.map(it => renderPickCard(it)).join('')
                : '<div class="empty-state" style="padding:20px;font-size:12px">该周期暂无推荐，请先在首页点「立即重算打分」</div>';
            return `<div class="pick-group">
                <div class="pick-group-head">
                    <span class="horizon-tag hz-${g.key}">${g.label} · ${g.desc}</span>
                    <span class="pick-group-count">${list.length} 只</span>
                </div>
                <div class="action-plan-grid">${cards}</div>
            </div>`;
        }).join('');
    } catch(e) {
        if (box) box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

async function loadExitTrack() {
    const box = document.getElementById('exitTrackPanel');

        const resp = await RequestManager.fetch('exitTrack', API + '/investor/exit_advice');
        const d = (resp && resp.data) || {};
        const items = d.items || [];
        const groups = d.groups || { short: [], mid: [], long: [] };

            box.innerHTML = '<div class="empty-state">暂无需要跟踪的推荐<br><span style="color:var(--text-muted);font-size:12px">7月20日起暂无推荐或推荐后尚无行情</span></div>';

        }
        const horizonMeta = {
            short: { label: '短线', icon: '⚡', hint: '持仓上限 10 个交易日' },
            mid:   { label: '中线', icon: '📈', hint: '持仓上限 60 个交易日' },
            long:  { label: '长线', icon: '🏔️', hint: '不限持仓期 · 趋势跟踪' },
        };
        // 汇总徽章（持有 / 已卖出）
        let totalHold = 0, totalClear = 0;
        ['short', 'mid', 'long'].forEach(hz => (groups[hz] || []).forEach(it => {
            if (it.status === 'clear') totalClear++; else totalHold++;
        }));
        let html = `<div class="exit-summary" style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap">
            <span class="exit-sum-chip" style="background:rgba(16,185,129,0.1);color:#10b981;padding:4px 12px;border-radius:12px;font-size:12px">🟢 持有 ${totalHold}</span>
            <span class="exit-sum-chip" style="background:rgba(255,77,79,0.1);color:#ff4d4f;padding:4px 12px;border-radius:12px;font-size:12px">🔴 已卖出 ${totalClear}</span>
        </div>`;
        // 短线 / 中线 / 长线 三组
        ['short', 'mid', 'long'].forEach(hz => {
            const list = groups[hz] || [];
            if (!list.length) return;
            const meta = horizonMeta[hz];
            const held = list.filter(it => it.status === 'hold').length;
            const cleared = list.length - held;
            html += `<div class="exit-group">
                <div class="exit-group-head">
                    <span class="exit-group-title">${meta.icon} ${meta.label}</span>
                    <span class="exit-group-hint">${meta.hint}</span>
                    <span class="exit-group-count">持有 ${held} · 已卖出 ${cleared}</span>
                </div>
                <div class="table-wrapper"><table><thead><tr>
                    <th>代码</th><th>名称</th><th>推荐日</th><th>买入日</th><th>买入价</th><th>持仓天数</th><th>盈亏</th><th>状态</th><th>说明</th>
                </tr></thead><tbody>`;
            list.forEach(it => {
                const detail = it.detail || {};
                const pnl = detail.current_pnl_pct;
                const pnlCls = pnl != null ? (pnl >= 0 ? 'positive' : 'negative') : '';
                const pnlStr = pnl != null ? `${pnl>=0?'+':''}${pnl}%` : '--';
                const sold = it.status === 'clear';
                const statusHtml = sold
                    ? '<span style="color:var(--danger);font-weight:600">🔴 已卖出</span>'
                    : '<span style="color:var(--green, #10b981);font-weight:600">🟢 持有</span>';
                const holdDays = detail.hold_days != null ? detail.hold_days + '天' : '--';
                // 连续推荐：推荐日显示最新一次，附最早推荐日提示
                const firstDate = detail.first_scan_date;
                const scanHtml = (it.scan_date || '--')
                    + (firstDate && firstDate !== it.scan_date
                        ? `<div style="font-size:10px;color:var(--text-muted)">自 ${firstDate} 连续推荐</div>` : '');
                html += `<tr>
                    <td><span class="code-link" onclick="openKline('${it.code}')">${it.code}</span></td>
                    <td>${it.name||''}</td>
                    <td>${scanHtml}</td>
                    <td>${detail.entry_date||'--'}</td>
                    <td>${it.entry_price||'--'}</td>
                    <td>${holdDays}</td>
                    <td class="${pnlCls}">${pnlStr}</td>
                    <td>${statusHtml}</td>
                    <td style="font-size:11px;color:var(--text-secondary);max-width:220px">${it.reason||''}</td>
                </tr>`;
            });
            html += '</tbody></table></div></div>';
        });
        box.innerHTML = html;
    } catch(e) {
        box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 策略规则命中（常驻规则今日筛出，独立于融合分信号）
async function loadRuleSignals() {
    const box = document.getElementById('ruleSignals');
    const dateEl = document.getElementById('ruleSigDate');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch('ruleSignals', API + '/investor/rule_signals');
        const data = (resp && resp.data) || {};
        const items = data.items || [];
        const total = data.total != null ? data.total : items.length;
        const excluded = data.excluded_rules || 0;
        if (dateEl) {
            let txt = data.date ? ('数据日期 ' + data.date + (total > items.length ? ('（命中 ' + total + '，显示前 ' + items.length + '）') : '')) : '';
            if (excluded > 0) txt += ' · 已隐藏 ' + excluded + ' 条命中过泛的规则（单日命中>' + (data.max_hits || 200) + '只）';
            dateEl.textContent = txt;
        }
        if (!items.length) {
            box.innerHTML = excluded > 0
                ? '<div class="empty-state">所有启用规则命中都过泛（单条规则命中超 ' + (data.max_hits || 200) + ' 只，无筛选价值），已全部隐藏<br><span style="color:var(--text-muted);font-size:12px">建议到「回测」收紧规则条件后重新保存</span></div>'
                : '<div class="empty-state">暂无规则命中<br><span style="color:var(--text-muted);font-size:12px">先在「回测」将策略存为常驻规则，同步时自动扫描</span></div>';
            return;
        }
        box.innerHTML = '<div class="rule-sig-list">' + items.map(it => {
            const price = it.latest_close != null ? Number(it.latest_close).toFixed(2) : '--';
            const hitsTip = it.rule_hits != null ? (' · 今日命中 ' + it.rule_hits + ' 只') : '';
            // 规则回测胜率徽章：≥55% 用涨色（优），<50% 用跌色警示（沿用 A股红涨绿跌配色）
            const wr = it.rule_win_rate;
            const wrCls = wr == null ? '' : (wr >= 55 ? 'idx-up' : (wr >= 50 ? '' : 'idx-down'));
            const wrHtml = wr != null
                ? `<span class="${wrCls}" style="font-family:var(--font-mono)" title="该规则历史回测胜率（${it.rule_total_trades || 0} 笔交易）${wr < 50 ? ' · 低于50%，谨慎参考' : ''}">胜率 ${Number(wr).toFixed(1)}%</span>`
                : '<span style="color:var(--text-muted)">胜率 --</span>';
            return `<div class="rule-sig-row" onclick="openKline('${it.code}')">
                <div class="rule-sig-main">
                    <span class="rule-sig-code">${it.code}</span>
                    <span class="rule-sig-name">${it.name || '--'}</span>
                </div>
                <span class="rule-sig-rule" title="${(it.rule_name || '') + hitsTip}">${it.rule_name || ('#' + it.rule_id)}</span>
                <span class="rule-sig-price">¥${price}</span>
                <span class="rule-sig-conf">${wrHtml}</span>
            </div>`;
        }).join('') + '</div>';
    } catch(e) {
        box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 手动触发常驻规则全市场扫描（同步阻塞，全市场约数分钟）
async function scanRulesNow() {
    const btn = document.getElementById('ruleScanBtn');
    const box = document.getElementById('ruleSignals');
    const maxRules = parseInt(document.getElementById('ruleScanMaxRules').value, 10) || 50;
    const lookback = parseInt(document.getElementById('ruleScanLookback').value, 10) || 300;
    if (lookback <= 252) { showToast('回溯行数需大于 252', 'error'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '扫描中…'; }
    if (box) box.innerHTML = '<div class="empty-state">全市场扫描中，预计需数分钟…</div>';
    try {
        const resp = await fetch(API + '/sync/scan_rules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ max_rules: maxRules, lookback_rows: lookback })
        });
        const j = await resp.json();
        if (j && j.success) {
            const d = j.data || {};
            showToast('扫描完成：' + (d.rules || 0) + ' 条规则 / ' + (d.hits || 0) + ' 条命中，耗时 ' + (d.elapsed_s || 0) + 's', 'success');
            await loadRuleSignals();
        } else {
            showToast('扫描失败：' + ((j && j.error) || '未知错误'), 'error');
            await loadRuleSignals();
        }
    } catch(e) {
        showToast('扫描请求失败', 'error');
        await loadRuleSignals();
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '立即扫描'; }
    }
}

// 单只推荐卡片渲染（短/中/长三周期共用）
function renderPickCard(it) {
            const ap = it.action_plan || {};
            const es = it.entry_strategy || {};
            const pp = it.position_plan || {};
            const sg = it.signal || {};
            const entry = ap.entry_price ? ap.entry_price.toFixed(2) : '--';
            const stop   = ap.stop_loss   ? ap.stop_loss.toFixed(2)   : '--';
            const tp     = ap.take_profit ? ap.take_profit.toFixed(2) : '--';
            // 建议买入价 → 突破确认价 的价差（回放统计：价差≤1% 多为当日冲高/涨停的追高票，
            // 次日开盘买入胜率仅约 12%，详见 tools/analyze_confirm_gap.py）
            let gapHtml = '';
            if (ap.entry_price) {
                if (it.confirm_trigger) {
                    const gapPct = (it.confirm_trigger - ap.entry_price) / ap.entry_price * 100;
                    if (gapPct < 0) {
                        // 理论不发生：确认线低于买入价，不显示
                    } else if (gapPct <= 1) {
                        gapHtml = `<div class="price-sub confirm-danger" title="近两年6.6万条短线信号回放：价差≤1%时次日开盘买入胜率仅约12%，买入价接近推荐日以来最高点，追高风险大">⚠ 买入价已在阶段高位 · 价差 ${gapPct.toFixed(1)}%</div>`;
                    } else if (gapPct <= 5) {
                        gapHtml = `<div class="price-sub confirm-gap" title="突破确认价相对建议买入价的上浮幅度：价差越小说明买入价越接近阶段高点，追高风险越大">价差 ${gapPct.toFixed(1)}%</div>`;
                    } else {
                        gapHtml = `<div class="price-sub confirm-safe" title="回放统计：价差>5%的买入价远离推荐日以来高点（多为低吸票），次日开盘买入胜率约49%，追高风险小；但若为连续大涨后的高位票请结合K线判断">✅ 距阶段高点较远 · 价差 ${gapPct.toFixed(1)}%</div>`;
                    }
                } else {
                    gapHtml = `<div class="price-sub confirm-safe" title="该信号不适用突破确认（如隔日动量次日开盘入场），按建议买入价直接执行">✅ 无需突破确认 · 按建议价入场</div>`;
                }
            }
            const rr     = ap.risk_reward_ratio;
            const rrCls  = rr == null ? '' : (rr >= 2 ? 'rr-good' : (rr >= 1 ? 'rr-ok' : 'rr-bad'));
            const rrHtml = rr != null ? `<span class="rr-tag ${rrCls}">盈亏比 ${rr.toFixed(2)}</span>` : '';
            const reasons = (it.reasons || []).map(r => `<span class="reason-chip">${r}</span>`).join('');
            const pctChg = it.latest_pct;
            const pctHtml = pctChg != null ?
                `<span class="${pctChg>=0?'idx-up':'idx-down'}" style="font-weight:600">${pctChg>=0?'+':''}${pctChg.toFixed(2)}%</span>` : '';

            // ── 信号灯徽章 ──
            const sigClass = 'sig-' + (sg.level || 'wait');
            const sigHtml = sg.label ? `
                <div class="signal-badge ${sigClass}" title="${(sg.reasons||[]).concat(sg.warnings||[]).join(' · ')}">
                    <span class="sig-emoji">${sg.emoji||'⚪'}</span>
                    <span class="sig-label">${sg.label}</span>
                </div>
                <div class="signal-reasons">
                    ${(sg.reasons||[]).map(r => `<span class="reason-chip sig-reason-good">${r}</span>`).join('')}
                    ${(sg.warnings||[]).map(w => `<span class="reason-chip sig-reason-warn">⚠ ${w}</span>`).join('')}
                </div>
            ` : '';

            // ── P0: 出场建议徽章 ──
            const ea = it.exit_advice;
            let exitHtml = '';
            if (ea && ea.status) {
                const eaCls = ea.status === 'clear' ? 'exit-clear' : (ea.status === 'reduce' ? 'exit-reduce' : 'exit-hold');
                const eaIcon = ea.status === 'clear' ? '🔴' : (ea.status === 'reduce' ? '🟠' : '🟢');
                const eaLabel = ea.status === 'clear' ? '清仓' : (ea.status === 'reduce' ? '减仓' : '持有');
                exitHtml = `
                    <div class="exit-advice-badge ${eaCls}" title="${ea.reason||''}">
                        <span>${eaIcon} ${eaLabel}</span>
                        <span class="exit-reason">${ea.reason||''}</span>
                    </div>`;
            }

            // ── 3 个挂单位置 ──
            let entryHtml = '';
            if (es.aggressive && es.stable && es.conservative) {
                const clsA = es.recommend === 'aggressive' ? 'entry-pick' : '';
                const clsS = es.recommend === 'stable' ? 'entry-pick' : '';
                const clsC = es.recommend === 'conservative' ? 'entry-pick' : '';
                entryHtml = `
                <div class="entry-strategy">
                    <div class="entry-strategy-head">
                        <span>📍 挂单位置</span>
                        <span class="entry-recommend">${es.recommend_hint||''}</span>
                    </div>
                    <div class="entry-prices">
                        <div class="entry-price ${clsA}">
                            <div class="entry-tag">激进</div>
                            <div class="entry-val">${es.aggressive.toFixed(2)}</div>
                            <div class="entry-sub">现价 -1%</div>
                        </div>
                        <div class="entry-price ${clsS}">
                            <div class="entry-tag">稳健</div>
                            <div class="entry-val">${es.stable.toFixed(2)}</div>
                            <div class="entry-sub">现价 -3%</div>
                        </div>
                        <div class="entry-price ${clsC}">
                            <div class="entry-tag">保守</div>
                            <div class="entry-val">${es.conservative.toFixed(2)}</div>
                            <div class="entry-sub">回踩 -6%</div>
                        </div>
                    </div>
                </div>`;
            }

            // ── 建仓分批 ──
            let ppHtml = '';
            if (pp.batches && pp.batches.length) {
                const totalStr = pp.total_shares ? `${pp.total_shares} 股 · 约 ¥${pp.total_cost_est}` : '资金不足 1 手';
                ppHtml = `
                <div class="position-plan">
                    <div class="position-plan-head">
                        <span>💰 建仓分批 · 1.5万账户</span>
                        <span class="position-plan-total">${totalStr}</span>
                    </div>
                    <div class="position-batches">
                        ${pp.batches.map(b => `
                            <div class="batch-row">
                                <span class="batch-ratio">${(b.ratio*100).toFixed(0)}%</span>
                                <span class="batch-note">${b.note}</span>
                                <span class="batch-shares">${b.shares}股</span>
                                <span class="batch-price">@${b.price.toFixed(2)}</span>
                                <span class="batch-trigger">${b.trigger}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            const hzKey = it.horizon || 'short';
            const isLhb = it.strategy === '隔日动量';  // 龙虎榜资金异动专属 UI
// 现价已站上突破确认线 → 时机确认信号触发，整卡高亮提示
            const brokeOut = !!(it.confirm_trigger && it.latest_close && it.latest_close >= it.confirm_trigger);
            return `
                <div class="action-card${isLhb ? ' lhb-card' : ''}${brokeOut ? ' breakout-card' : ''}" onclick="openKline('${it.code}')">
                    <div class="action-head">
                        <div>
                            <div class="action-name">${it.name || it.code} <span class="horizon-tag hz-${hzKey}">${HORIZON_LABEL[hzKey] || '短线'}</span>${it.strategy ? ` <span class="strategy-badge${isLhb ? ' lhb-badge' : ''}">${isLhb ? '🐯 龙虎榜·隔日动量' : it.strategy}</span>` : ''}</div>
                            <div class="action-code">${it.code}${it.industry?` · ${it.industry}`:''}</div>
                        </div>
                        <div class="action-score" style="cursor:pointer" onclick="event.stopPropagation(); showFactorDetail('${it.code}','${(it.name||it.code).replace(/'/g, "\\'")}')" title="查看融合分详情">
                            <div class="score-num">${it.fusion_score||'--'}</div>
                            <div class="score-lbl">综合分</div>
                        </div>
                    </div>
                    ${sigHtml}
                    ${exitHtml}
                    <div class="action-prices">
                        <div class="price-cell buy">
                            <div class="price-lbl">建议买入</div>
                            <div class="price-val">${entry}</div>
                            ${pctHtml?`<div class="price-sub">最新 ${it.latest_close?.toFixed(2) || '--'} ${pctHtml}</div>`:''}
                            ${it.confirm_trigger?(brokeOut
                                ?`<div class="price-sub confirm-broken" title="现价已站上突破确认线（推荐后高点），回放验证突破后隔日胜率更高">🚀 已突破确认 ${it.confirm_trigger.toFixed(2)}</div>`
                                :`<div class="price-sub confirm-waiting" title="回放验证：等收盘突破推荐后高点再入场，隔日胜率更高">突破确认 ${it.confirm_trigger.toFixed(2)}</div>`):''}
                            ${gapHtml}
                        </div>
                        <div class="action-arrow">·</div>
                        <div class="price-cell sell">
                            <div class="price-lbl">止盈目标</div>
                            <div class="price-val">${tp}</div>
                            <div class="price-sub">${ap.reward_pct!=null?`+${ap.reward_pct}%`:'--'}</div>
                        </div>
                        <div class="price-arrow">⛔</div>
                        <div class="price-cell stop">
                            <div class="price-lbl">止损</div>
                            <div class="price-val">${stop}</div>
                            <div class="price-sub">${ap.risk_pct!=null?`-${ap.risk_pct}%`:'--'}</div>
                        </div>
                    </div>
                    ${entryHtml}
                    ${ppHtml}
                    <div class="action-foot">
                        <div class="reasons">${reasons || '<span class="text-muted" style="font-size:11px">暂无明显信号</span>'}</div>
                        <div class="reasons" style="margin-top:4px">${(it.weaknesses||[]).map(w => '<span class="reason-chip" style="background:rgba(255,100,100,0.08);color:var(--text-muted)">⚠ ' + w + '</span>').join('')}</div>
                        ${rrHtml}
                    </div>
                </div>`;
}

// ── 今日推荐：一键复制（股票+代码+突破确认+建议买入+止盈止损）──
// 复制当前选中日期展示的推荐，按 short/mid/long 分组，每只一行便于粘贴到备忘录/Excel
function copyTodayPicks() {
    const store = window._todayPicks;
    const btn = document.getElementById('btnCopyTodayPicks');
    if (!store || !store.groups) {
        showToast('暂无推荐数据，请先重算打分', 'error');
        return;
    }
    const lines = [];
    const dateStr = store.date ? '（' + store.date + '）' : '';
    let count = 0;
    HORIZON_GROUPS.forEach(g => {
        const list = store.groups[g.key] || [];
        if (!list.length) return;
        count += list.length;
        lines.push('【' + g.label + '】' + g.desc);
        list.forEach((it, i) => {
            const ap = it.action_plan || {};
            const entry   = ap.entry_price   != null ? ap.entry_price.toFixed(2)   : '--';
            const stop    = ap.stop_loss     != null ? ap.stop_loss.toFixed(2)     : '--';
            const tp      = ap.take_profit   != null ? ap.take_profit.toFixed(2)   : '--';
            const confirm = it.confirm_trigger != null ? it.confirm_trigger.toFixed(2) : '--';
            lines.push((i + 1) + '. ' + (it.name || it.code) + ' ' + (it.code || '') +
                '｜建议买入 ' + entry +
                '｜止盈 ' + tp +
                '｜止损 ' + stop +
                '｜突破确认 ' + confirm);
        });
        lines.push('');
    });
    if (!count) {
        showToast('暂无推荐数据', 'error');
        return;
    }
    const text = '📋 今日推荐' + dateStr + '\n' + lines.join('\n').replace(/\n+$/, '');
    copyTextToClipboard(text, function(ok) {
        if (ok) {
            if (btn) { btn.textContent = '✓ 已复制'; setTimeout(function() { btn.textContent = '📋 一键复制'; }, 2000); }
            showToast('已复制 ' + count + ' 只推荐（' + HORIZON_GROUPS.filter(g => (store.groups[g.key] || []).length).map(g => g.label).join('+') + '）', 'success');
        } else {
            showToast('复制失败，请手动复制', 'error');
        }
    });
}

// 通用剪贴板复制（navigator.clipboard 优先，老浏览器降级 execCommand）
function copyTextToClipboard(text, cb) {
    function fallback() {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            cb && cb(ok);
        } catch (e) {
            cb && cb(false);
        }
    }
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() { cb && cb(true); }, fallback);
    } else {
        fallback();
    }
}

// 渲染持仓出场诊断徽章（清仓/减仓/持有）
function renderPositionAdvice(advice) {
    if (!advice || !advice.status) return '';
    const map = {
        clear:  { color: 'var(--danger)',  icon: '⛔', label: '建议清仓' },
        reduce: { color: 'var(--warning)', icon: '⚠', label: '建议减仓' },
        hold:   { color: 'var(--text-muted)', icon: '✓', label: '持有' },
    };
    const m = map[advice.status] || map.hold;
    const reason = advice.reason ? ' · ' + advice.reason : '';
    return `<div style="padding:4px 10px;font-size:12px;color:${m.color};border-left:2px solid ${m.color};background:rgba(255,255,255,0.02);margin-top:2px">${m.icon} 诊断：${m.label}${reason}</div>`;
}

async function loadMyPositions() {
    const box = document.getElementById('myPositions');
    try {
        // 同步后持仓建议横幅（每日 18:00 定时 / 手动同步后由后端对持仓跑移动止盈诊断生成）
        let adviceBanner = '';
        try {
            const sr = await RequestManager.fetch('sys-status', API + '/system/status');
            const ha = (sr.data || {}).holdings_advice;
            if (ha && ha.count > 0 && ha.items && ha.items.length) {
                const rows = ha.items.map(i =>
                    `<div style="font-size:11px;color:var(--text-secondary);line-height:1.7">
                        ${i.status==='clear'?'🔴':(i.status==='reduce'?'🟠':'🟢')}
                        <b>${i.code}</b> ${i.name||''} — ${i.reason||''}
                     </div>`).join('');

            }
        } catch(e) { /* 横幅获取失败不影响持仓列表 */ }

        const resp = await RequestManager.fetch('positions', API + '/investor/positions');
        const d = resp.data || {};
        const positions = d.positions || [];
        const summary = d.summary || {};

        if (positions.length === 0) {
            box.innerHTML = '<div class="empty-state">还没有添加持仓<br><span style="color:var(--text-muted);font-size:12px">点 + 添加你已经买/想买的股票；添加后这里会自动给出盈亏和出场诊断</span><br><button class="btn btn-sm" style="margin-top:10px" onclick="showAddPositionDialog()">+ 添加第一笔持仓</button></div>';
            return;
        }

        const pnlCls = summary.total_pnl >= 0 ? 'idx-up' : 'idx-down';
        const sign = summary.total_pnl >= 0 ? '+' : '';

        let html = adviceBanner + `<div class="position-summary">
            <div class="ps-cell"><div class="ps-lbl">总市值</div><div class="ps-val">¥${summary.total_value.toLocaleString()}</div></div>
            <div class="ps-cell"><div class="ps-lbl">总成本</div><div class="ps-val">¥${summary.total_cost.toLocaleString()}</div></div>
            <div class="ps-cell"><div class="ps-lbl">浮动盈亏</div><div class="ps-val ${pnlCls}">${sign}¥${summary.total_pnl.toLocaleString()} (${sign}${summary.total_pnl_pct}%)</div></div>
        </div>`;

        html += positions.map(p => {
            const pnlCls2 = p.pnl >= 0 ? 'idx-up' : 'idx-down';
            const sign2 = p.pnl >= 0 ? '+' : '';
            const warnHtml = p.warning ? `<div class="position-warn">⚠ ${p.warning}</div>` : '';
            const adviceHtml = renderPositionAdvice(p.advice);
            const pname = (p.name||p.code).replace(/'/g, "\\'");
            return `
            <div class="position-row">
                <div class="pr-left" onclick="openKline('${p.code}')">
                    <div class="pr-name">${p.name||p.code}</div>
                    <div class="pr-code">${p.code} · ${p.shares}股 · 成本${p.cost_price.toFixed(2)}</div>
                </div>
                <div class="pr-mid">
                    <div class="pr-price">${p.latest_close?p.latest_close.toFixed(2):'--'}</div>
                    <div class="pr-pct ${pnlCls2}">${p.latest_pct!=null?(p.latest_pct>=0?'+':'')+p.latest_pct.toFixed(2)+'%':''}</div>
                </div>
                <div class="pr-score" style="cursor:pointer" onclick="showFactorDetail('${p.code}','${pname}')" title="查看融合分详情">
                    <span class="spark" id="spark-p-${p.code}"></span>
                </div>
                <div class="pr-right">
                    <div class="pr-pnl ${pnlCls2}">${sign2}¥${p.pnl.toLocaleString()}</div>
                    <div class="pr-pct-sm ${pnlCls2}">${sign2}${p.pnl_pct}%</div>
                </div>
                <button class="btn btn-danger btn-sm" onclick="closeMyPosition(${p.id})" title="平仓">×</button>
            </div>${warnHtml}${adviceHtml}`;
        }).join('');

        box.innerHTML = html;
        fillSparklines(positions.map(p => p.code), 7, 'spark-p-');
    } catch(e) {
        if (box) box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// 空态引导：把今日短线推荐前 3 名加入自选（目标价取推荐止盈价）
async function addTopPicksToWatchlist() {
    try {
        const resp = await RequestManager.fetch('today-for-watch', API + '/investor/today');
        const groups = ((resp && resp.data) || {}).groups || {};
        const picks = (groups.short || []).slice(0, 3);
        if (!picks.length) { showToast('今日暂无推荐，先点「立即重算打分」', 'warning'); return; }
        let added = 0;
        for (const it of picks) {
            const ap = it.action_plan || {};
            try {
                await RequestManager.fetch('add-watch-' + it.code, API + '/investor/watchlist', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        code: it.code,
                        note: '来自今日推荐',
                        target_price: ap.take_profit || null,
                        alert_dir: 'above',
                    }),
                });
                added++;
            } catch(e) { /* 单只失败不阻断其余 */ }
        }
        showToast(added ? ('已加入 ' + added + ' 只自选，目标价默认为推荐止盈价') : '添加失败，请重试', added ? 'success' : 'error');
        if (added) await loadMyWatchlist();
    } catch(e) {
        showToast('获取今日推荐失败', 'error');
    }
}

async function loadMyWatchlist() {
    const box = document.getElementById('myWatchlist');
    try {
        const resp = await RequestManager.fetch('watchlist', API + '/investor/watchlist');
        const items = resp.data || [];
        if (items.length === 0) {
            box.innerHTML = '<div class="empty-state">还没有自选股<br><span style="color:var(--text-muted);font-size:12px">点 + 添加你想跟踪的股票，或直接从今日推荐开始</span><br><button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="addTopPicksToWatchlist()">⭐ 一键加入今日短线推荐前 3 名</button></div>';
            return;
        }
        box.innerHTML = items.map(w => {
            const pctCls = (w.latest_pct||0) >= 0 ? 'idx-up' : 'idx-down';
            const sign = (w.latest_pct||0) >= 0 ? '+' : '';
            const noData = w.latest_close == null;
            // 无数据时显示"立即拉取"小按钮
            const syncBtn = noData
                ? `<button class="btn btn-sm" style="margin-left:6px" onclick="resyncOneStock('${w.code}')" title="无行情数据，点击立即补拉">拉取</button>`
                : '';
            const wname = (w.name||w.code).replace(/'/g, "\\'");
            // 目标价小字：有目标价时显示 "目标 12.50 · 距 +3.2%"，触达时高亮
            let targetHtml = '';
            if (w.target_price != null) {
                const dirTxt = w.alert_dir === 'below' ? '↓' : '↑';
                let distTxt = '';
                if (w.target_distance_pct != null) {
                    const ds = w.target_distance_pct >= 0 ? '+' : '';
                    distTxt = ` · 距 ${ds}${w.target_distance_pct}%`;
                }
                const hit = w.latest_close != null && (
                    (w.alert_dir === 'below' && w.latest_close <= w.target_price) ||
                    (w.alert_dir !== 'below' && w.latest_close >= w.target_price));
                const tColor = hit ? 'var(--warning)' : 'var(--text-muted)';
                targetHtml = `<div style="font-size:11px;color:${tColor}">${dirTxt} 目标 ${w.target_price}${distTxt}${hit?' · 已触达':''}</div>`;
            }
            return `
            <div class="watch-row">
                <div class="wr-left" onclick="openKline('${w.code}')">
                    <div class="wr-name">${w.name||w.code}</div>
                    <div class="wr-code">${w.code}${w.industry?` · ${w.industry}`:''}</div>
                    ${targetHtml}
                </div>

async function loadRecHistory() {
    const summaryEl = document.getElementById('recHistorySummary');
    const tableEl = document.getElementById('recHistoryTable');
    const updEl = document.getElementById('recHistoryUpdatedAt');
    try {
        const resp = await RequestManager.fetch('rec-history', API + '/investor/recommendations/history?days=30');
        const d = resp.data || {};
        const items = d.items || [];
        const summary = d.summary || {};
        if (updEl) updEl.textContent = '统计区间：近 ' + (d.days || 30) + ' 天';

        if (!items || items.length === 0) {
            if (tableEl) tableEl.innerHTML = '<div class="empty-state">暂无历史推荐数据<br><span style="color:var(--text-muted);font-size:12px">先到首页点「立即重算打分」生成推荐</span></div>';
            return;
        }

        // 汇总卡片：T1/T2/T3/T5 总胜率 + 平均收益 + 原有收益统计
        if (summaryEl && summary.total) {
            const tStat = (k, label) => {
                const s = summary[k];
                if (!s || !s.n) return `<div class="metric-card"><div class="val" style="color:var(--text-muted);font-size:26px">--</div><div class="lbl">${label} 胜率</div></div>`;
                const color = s.win_rate >= 50 ? 'var(--green, #10b981)' : 'var(--danger)';
                const avg = s.avg_return;
                const avgHtml = avg != null
                    ? `<div style="font-size:11px;margin-top:3px" class="${avg>=0?'idx-up':'idx-down'}">${label} 平均收益 ${avg>=0?'+':''}${avg}%</div>`
                    : '';
                return `<div class="metric-card"><div class="val" style="color:${color};font-size:26px">${s.win_rate}%</div><div class="lbl">${label} 胜率 <span style="opacity:.7">(${s.win}/${s.n})</span></div>${avgHtml}</div>`;
            };
            const avgCls = summary.avg_return >= 0 ? 'idx-up' : 'idx-down';
            const avgSign = summary.avg_return >= 0 ? '+' : '';
            const bestCls = summary.best_return >= 0 ? 'idx-up' : 'idx-down';
            const worstCls = summary.worst_return >= 0 ? 'idx-up' : 'idx-down';
            const pf = summary.profit_factor || 0;
            const pfCls = pf >= 1.5 ? 'idx-up' : (pf >= 1 ? '' : 'idx-down');
            summaryEl.innerHTML = `
                <div class="metrics-row" style="margin-bottom:8px">
                    ${tStat('t1', 'T+1')}
                    ${tStat('t2', 'T+2')}
                    ${tStat('t3', 'T+3')}
                    ${tStat('t5', 'T+5')}
                </div>
                <div class="metrics-row" style="margin-bottom:12px">
                    <div class="metric-card"><div class="val">${summary.total}</div><div class="lbl">连续推荐段数</div></div>
                    <div class="metric-card"><div class="val" style="color:${summary.win_rate>=50?'var(--green, #10b981)':'var(--danger)'}">${summary.win_rate}%</div><div class="lbl">最终胜率</div></div>
                    <div class="metric-card"><div class="val ${avgCls}">${avgSign}${summary.avg_return}%</div><div class="lbl">平均收益</div></div>
                    <div class="metric-card"><div class="val ${pfCls}">${pf.toFixed(2)}</div><div class="lbl">盈亏比</div></div>
                    <div class="metric-card"><div class="val ${bestCls}">+${summary.best_return}%</div><div class="lbl">最佳</div></div>
                    <div class="metric-card"><div class="val ${worstCls}">${summary.worst_return}%</div><div class="lbl">最差</div></div>
                    <div class="metric-card"><div class="val" style="color:var(--danger)">${summary.stop_loss_count||0}</div><div class="lbl">触发止损</div></div>
                    <div class="metric-card"><div class="val" style="color:var(--green, #10b981)">${summary.take_profit_count||0}</div><div class="lbl">触发止盈</div></div>
                </div>`;
        }

        // 明细表格（全量展示，滚动容器限高；连续推荐合并为一段，仅显示首次推荐日）
        if (tableEl) {
            let html = `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">共 ${items.length} 段连续推荐（按首次推荐日降序，连续推荐仅记首次）</div>`;
            html += '<div class="table-wrapper" style="max-height:520px;overflow-y:auto;"><table><thead style="position:sticky;top:0;z-index:1;background:var(--bg-card,#141b2d)"><tr>';
            html += '<th>代码</th><th>名称</th><th>首次推荐日</th><th>连续推荐</th><th>买入价</th><th>T+1</th><th>T+2</th><th>T+3</th><th>T+5</th><th>收益</th><th>状态</th>';
            html += '</tr></thead><tbody>';
            items.forEach(r => {
                const pnlCls = r.pnl_pct >= 0 ? 'positive' : 'negative';
                const sign = r.pnl_pct >= 0 ? '+' : '';
                let status = '持有中';
                if (r.hit_stop_loss) status = '<span style="color:var(--danger)">已止损</span>';
                else if (r.hit_take_profit) status = '<span style="color:var(--green, #10b981)">已止盈</span>';
                else if (r.exit_reason === 'max_hold_days') status = '<span style="color:var(--text-muted)">到期出场</span>';
                const fmtRet = (v) => v != null ? `<span class="${v>=0?'positive':'negative'}">${v>=0?'+':''}${v}%</span>` : '--';
                const firstDate = r.first_scan_date || r.scan_date || '';
                const streak = r.streak_days ? `连续 ${r.streak_days} 天` : '--';
                const streakTip = r.last_scan_date ? `推荐至 ${r.last_scan_date}` : '';
                html += `<tr>
                    <td><span class="code-link" onclick="openKline('${r.code}')">${r.code}</span></td>
                    <td>${r.name||''}</td>
                    <td>${firstDate}</td>
                    <td title="${streakTip}">${streak}</td>
                    <td>${r.entry_price||'--'}</td>
                    <td>${fmtRet(r.t1_return)}</td>
                    <td>${fmtRet(r.t2_return)}</td>
                    <td>${fmtRet(r.t3_return)}</td>
                    <td>${fmtRet(r.t5_return)}</td>
                    <td class="${pnlCls}">${sign}${r.pnl_pct}%</td>
                    <td>${status}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            tableEl.innerHTML = html;
        }
    } catch(e) {
        if (tableEl) tableEl.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

// ─── 策略优化器（每日诊断 + 参数建议，suggest 模式：人工采纳才生效）───
const OPTIMIZER_PARAM_LABELS = {
    sig_threshold: '融合分阈值',
    high_vol_sig_threshold: '高波动融合分阈值',
    trend_gate_ma: '趋势闸门均线周期',
    trend_gate_slope_lookback: '趋势闸门斜率回看天数',
    short_stop_loss: '短线止损比例',
    short_take_profit: '短线止盈比例',
};
function optimizerParamLabel(key) { return OPTIMIZER_PARAM_LABELS[key] || key; }

async function loadOptimizerPanel() {
    const box = document.getElementById('optimizerPanel');
    const updEl = document.getElementById('optimizerUpdatedAt');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch('optimizer', API + '/optimizer/latest');
        const d = resp.data || {};
        const diag = d.diagnosis;
        const suggestions = d.suggestions || [];
        const history = d.history || [];
        const params = d.params || {};

        if (!diag && suggestions.length === 0) {
            box.innerHTML = '<div class="empty-state">暂无优化数据<br><span style="color:var(--text-muted);font-size:12px">数据同步完成后自动生成每日诊断，每周五盘后寻优</span></div>';
            return;
        }
        if (updEl && diag) updEl.textContent = '诊断日期：' + (diag.report_date || '');

        let html = '';
        // ① 诊断摘要（近30天短线）
        const s = diag && diag.summary && diag.summary.short;
        if (s) {
            const wrColor = s.win_rate >= 50 ? 'var(--green, #10b981)' : 'var(--danger)';
            html += `<div class="metrics-row" style="margin-bottom:12px">
                <div class="metric-card"><div class="val">${s.total}</div><div class="lbl">近30天短线推荐</div></div>
                <div class="metric-card"><div class="val" style="color:${wrColor}">${s.win_rate}%</div><div class="lbl">胜率</div></div>
                <div class="metric-card"><div class="val ${s.avg_return>=0?'idx-up':'idx-down'}">${s.avg_return>=0?'+':''}${s.avg_return}%</div><div class="lbl">平均收益</div></div>
                <div class="metric-card"><div class="val">${s.profit_factor}</div><div class="lbl">盈亏比</div></div>
                <div class="metric-card"><div class="val" style="color:var(--danger)">${s.stop_hit}</div><div class="lbl">触发止损</div></div>
            </div>`;
        }
        // ② 诊断结论
        const findings = (diag && diag.findings) || [];
        if (findings.length) {
            html += '<div style="margin-bottom:12px">' + findings.map(f =>
                `<div style="padding:8px 12px;margin-bottom:6px;background:rgba(255,171,64,0.06);border-left:3px solid var(--warning);border-radius:4px;font-size:13px">${f}</div>`
            ).join('') + '</div>';
        }
        // ③ 待采纳建议（含回放前后对比）
        if (suggestions.length) {
            html += '<div style="margin-bottom:8px;font-weight:600;color:var(--accent)">待采纳参数建议</div>';
            suggestions.forEach(sg => {
                const m = sg.metrics || {};
                const b = (m.baseline || {}).all || {};
                const c = (m.candidate || {}).all || {};
                const cmp = (b.oc_win != null && c.oc_win != null)
                    ? `<span class="text-muted" style="font-size:12px;margin-left:8px">OC胜率 ${b.oc_win}%→${c.oc_win}% · CC胜率 ${b.cc_win}%→${c.cc_win}%</span>` : '';
                html += `<div style="padding:12px;margin-bottom:8px;background:rgba(0,212,240,0.05);border:1px solid var(--border);border-radius:6px">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                        <div><b>${optimizerParamLabel(sg.param_key)}</b>：
                            <span style="font-family:var(--font-mono)">${sg.current_value} → <span style="color:var(--accent)">${sg.suggest_value}</span></span>${cmp}
                        </div>
                        <div>
                            <button class="btn btn-primary btn-sm" onclick="applyOptSuggestion(${sg.id})">采纳</button>
                            <button class="btn btn-sm" onclick="dismissOptSuggestion(${sg.id})">忽略</button>
                        </div>
                    </div>
                    <div class="text-muted" style="font-size:12px;margin-top:6px">${sg.reason || ''}</div>
                </div>`;
            });
        } else {
            html += '<div class="text-muted" style="font-size:12px;margin-bottom:8px">暂无待采纳建议（每周五盘后自动寻优，或点右上「立即寻优」）</div>';
        }
        // ④ 当前生效的参数覆盖 + 一键回滚
        const overridden = Object.keys(params).filter(k => params[k].overridden);
        if (overridden.length) {
            html += '<div style="margin:8px 0;font-weight:600">当前生效的参数覆盖</div>';
            overridden.forEach(k => {
                const p = params[k];
                html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;margin-bottom:4px;border:1px solid var(--border);border-radius:4px;font-size:13px">
                    <span>${p.label}：<span style="font-family:var(--font-mono);color:var(--accent)">${p.current}</span> <span class="text-muted">(默认 ${p.default})</span></span>
                    <button class="btn btn-sm" onclick="rollbackOptParam('${k}')">回滚</button>
                </div>`;
            });
        }
        // ⑤ 调参历史（折叠，最近5条）
        if (history.length) {
            html += '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--text-muted)">调参历史（最近 ' + Math.min(history.length, 5) + ' 条）</summary>';
            history.slice(0, 5).forEach(h => {
                const act = h.action === 'apply' ? '采纳' : '回滚';
                html += `<div class="text-muted" style="font-size:12px;padding:4px 12px">${h.created_at} · ${optimizerParamLabel(h.param_key)} ${h.old_value != null ? h.old_value : '默认'} → ${h.new_value}（${act}）</div>`;
            });
            html += '</details>';
        }
        box.innerHTML = html || '<div class="empty-state">暂无优化数据</div>';
    } catch(e) {
        box.innerHTML = '<div class="empty-state">加载失败</div>';
    }
}

async function runOptimizerNow() {
    try {
        const r = await fetchJSON(API + '/optimizer/run', {method: 'POST'});
        showToast('优化任务已启动，约需十几秒…', 'info');
        const tid = (r.data || {}).task_id;
        if (!tid) return;
        const timer = setInterval(async () => {
            try {
                const st = await fetchJSON(API + '/optimizer/task/' + tid);
                const t = st.data || {};
                if (t.status === 'success') {
                    clearInterval(timer);
                    showToast('寻优完成：' + (t.result || ''), 'success', 6000);
                    loadOptimizerPanel();
                } else if (t.status === 'error') {
                    clearInterval(timer);
                    showToast('寻优失败：' + (t.message || ''), 'error');
                }
            } catch(e) { clearInterval(timer); }
        }, 3000);
    } catch(e) { showToast(e.message, 'error'); }
}

    try {
        const resp = await RequestManager.fetch('sync-auto-status', API + '/sync/auto-status');
        if (resp && resp.running) {
            // 同步已经在跑（可能是调度器 18:00 跑的，或其他 tab 触发的），只挂上进度展示
            showSyncProgress();

// 检查今日推荐是否最新（基于 today 接口返回的 date），不是最近交易日就触发增量重算
async function ensureTodayRecs(silent) {
    try {
        const resp = await RequestManager.fetch('today-reco', API + '/investor/today?limit=1');
        const lastDate = resp && resp.data && resp.data.date;
        const latestTrade = resp && resp.data && resp.data.latest_trade_date;
        // 推荐已是最近交易日则无需重算（盘前/非交易日打开页面不误触发全量重算）
        if (lastDate && latestTrade && lastDate === latestTrade) return;
        if (silent) showToast('同步行情完成，开始增量重算今日打分…', 'info', 3500);
        // 触发增量重算（异步，只重写最新交易日信号，秒级~分钟级）
        const r = await RequestManager.fetch('recalc-inc-start-auto', API + '/sync/recalc_incremental', { method: 'POST' });
        const tid = r && r.data && r.data.task_id;
        if (!tid) {
            // 409（策略分未重算/任务互斥等）：给出可读提示，避免无限重试
            const msg = (r && r.message) || '自动重算启动失败，请手动点击"立即重算打分"';
            showToast(msg, 'warning', 4000);
            return;
        }
        pollRecalcTask(tid, function(ok, msg) {
            showToast(ok ? ('今日推荐已更新 · ' + (msg || '')) : ('重算失败: ' + (msg || '')), ok ? 'success' : 'error');
            // 重算完后，如果用户在首页就刷新一下数据
            if (typeof currentTab !== 'undefined' && currentTab === 'home') {
                const c = document.getElementById('content');
                if (c) loadHomeTab(c);
            }
        });
    } catch (e) {
        console.warn('[ensureTodayRecs] 失败:', e);
    }
}

function showSyncProgress() {
    document.getElementById('syncProgress').style.display = 'block';
}

function hideSyncProgress() {
    timerManager.clear('syncPoll');
    timerManager.setTimeout('syncHide', function() {
        document.getElementById('syncProgress').style.display = 'none';
    }, 5000);
}

function pollSyncProgress(onDone) {
    timerManager.setInterval('syncPoll', function() {
        RequestManager.fetch('sync-progress', API + '/sync/progress').then(function(resp) {
            var p = resp.data;
            var pct = p.total > 0 ? Math.round(p.current / p.total * 100) : 0;
            document.getElementById('syncProgressFill').style.width = pct + '%';
            document.getElementById('syncProgressPct').textContent = pct + '%';
            document.getElementById('syncProgressText').textContent =
                '同步中: ' + p.current + '/' + p.total + '  成功:' + p.success + '  失败:' + p.failed;
            // 首页内联进度条同步更新（不在首页时 setInlineProgress 内部自动跳过）
            if (p.running) {
                setInlineProgress('sync', p.current, p.total,
                    p.total > 0 ? (p.current + '/' + p.total + ' 成功:' + p.success + ' 失败:' + p.failed) : '启动中...');
            }
            if (!p.running) {
                hideSyncProgress();
                showToast(p.message || '同步完成', p.last_error ? 'warning' : 'success');
                if (onDone) onDone(p.message || '同步完成');
            }
        }).catch(function(e) { hideSyncProgress(); if (onDone) onDone(''); });
    }, 1000);
}

// ─── 首页"数据状态"面板 ─────────────────────────────────
async function loadSyncStatusPanel() {
    const syncState = document.getElementById('syncDataState');
    const syncTime  = document.getElementById('syncDataTime');
    const calcState = document.getElementById('recalcState');
    const calcTime  = document.getElementById('recalcTime');
    const hint      = document.getElementById('dataStatusHint');
    if (!syncState || !calcState) return;

    const today = new Date().toISOString().slice(0, 10);

    // ① 行情数据状态：/api/sync/auto-status
    try {
        const r = await RequestManager.fetch('sync-auto-status', API + '/sync/auto-status');
        const d = r.data || {};
        if (d.running) {
            syncState.className = 'state run';
            syncState.innerHTML = '<span class="badge badge-running">同步中</span>';
        } else if (!d.last_time) {
            syncState.className = 'state warn';
            syncState.innerHTML = '⚠ 今日尚未同步';
        } else {
            const lastDate = String(d.last_time).split(' ')[0];
            if (lastDate === today) {
                syncState.className = 'state ok';
                syncState.innerHTML = '✓ 今日已同步';
            } else {
                syncState.className = 'state warn';
                syncState.innerHTML = '⚠ 上次同步是 ' + lastDate;
            }
        }
        syncTime.textContent = d.last_time ? '上次同步: ' + d.last_time : '从未同步';
        if (hint && d.running) hint.textContent = '后台正在同步…';
    } catch (e) {
        syncState.className = 'state bad';
        syncState.innerHTML = '✗ 状态读取失败';
        syncTime.textContent = e.message || '';
    }

    // ② 推荐打分状态：/api/investor/today 返回的 date 字段就是 stock_signal 的最新 scan_date
    try {
        const r = await RequestManager.fetch('today-reco-status', API + '/investor/today?limit=1');
        const d = r.data || {};
        const lastDate = d.date;
        if (!lastDate) {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 暂无打分记录';
            calcTime.textContent = '请到"高级筛选"跑一次打分';
        } else if (lastDate === today) {
            calcState.className = 'state ok';
            calcState.innerHTML = '✓ 今日推荐已更新';
        } else {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 推荐基于 ' + lastDate + ' 数据';
        }
        calcTime.textContent = '最新打分日期: ' + (lastDate || '—');
    } catch (e) {
        calcState.className = 'state bad';
        calcState.innerHTML = '✗ 状态读取失败';
        calcTime.textContent = e.message || '';
    }

    // ③ 顺手提示：是否有正在跑的同步/重算任务
    const ip = document.getElementById('homeInlineProgress');
    if (ip && !ip.textContent) ip.textContent = '';
}

// 底部内联进度条（左文 + 中条 + 右百分比）
function setInlineProgress(stage, current, total, message) {
    const ip = document.getElementById('homeInlineProgress');
    if (!ip) return;
    if (!stage) {
        ip.innerHTML = '';
        return;
    }
    let pct = 0;
    if (typeof current === 'number' && typeof total === 'number' && total > 0) {
        pct = Math.min(100, Math.round(current / total * 100));
    } else if (stage === 'sync-finish' || stage === 'recalc-finish') {
        pct = 100;
    }
    const label = ({
        'sync':         '同步行情',
        'recalc':       '重算打分',
        'sync-finish':  '✓ 行情同步完成',
        'recalc-finish':'✓ 打分重算完成',
    })[stage] || stage;
    ip.innerHTML =
        '<span>' + label + '</span>' +
        '<span class="bar"><div style="width:' + pct + '%"></div></span>' +
        '<span style="font-family:var(--font-mono);min-width:42px;text-align:right;">' + pct + '%</span>' +
        (message ? ' <span style="color:var(--text-muted)">· ' + message + '</span>' : '');
}

// 轮询重算任务（task_queue 提交的任务）
function pollRecalcTask(taskId, onDone) {
    if (!taskId) { onDone && onDone(false, 'task_id 缺失'); return; }
    timerManager.setInterval('recalcPoll', function() {
        RequestManager.fetch('recalc-status-' + taskId, API + '/sync/status/' + taskId)
            .then(function(resp) {
                const t = resp.data || {};
                setInlineProgress('recalc', t.progress || 0, 100, t.message || '');
                if (t.status === 'success') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(true, t.message || t.result || '');
                } else if (t.status === 'error') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(false, t.message || '重算失败');
                }
                // pending / running 继续轮询
            })
            .catch(function(e) {
                timerManager.clear('recalcPoll');
                onDone && onDone(false, e.message || '轮询失败');
            });
    }, 1500);
}
