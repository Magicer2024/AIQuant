// ─── K-line overlay ───
function klineColor(d) {
    if (!d) return '#ef5350';
    if (d.limitType === 'limit_up') return '#ab47bc';
    if (d.limitType === 'limit_down') return '#42a5f5';
    return d.close >= d.open ? '#ef5350' : '#26a69a';
}

// ─── 技术指标计算工具函数 ───

/**
 * 计算 EMA（指数移动平均线）
 * @param {number[]} data - 收盘价序列
 * @param {number} period - 周期
 * @returns {number[]} EMA 序列
 */
function calcEMA(data, period) {
    var k = 2 / (period + 1);
    var ema = [data[0]];
    for (var i = 1; i < data.length; i++) {
        ema.push(data[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

/**
 * 计算 MACD 指标
 * 返回 { dif, dea, macd } 三个数组，长度与 kdata 一致
 */
function calcMACD(kdata, shortPeriod, longPeriod, signalPeriod) {
    shortPeriod = shortPeriod || 12;
    longPeriod = longPeriod || 26;
    signalPeriod = signalPeriod || 9;
    var closes = kdata.map(function(d) { return d.close; });
    var emaShort = calcEMA(closes, shortPeriod);
    var emaLong = calcEMA(closes, longPeriod);
    var dif = emaShort.map(function(v, i) { return v - emaLong[i]; });
    var dea = calcEMA(dif, signalPeriod);
    // MACD柱 = (DIF - DEA) * 2，用于柱状图显示
    var macd = dif.map(function(v, i) { return (v - dea[i]) * 2; });
    return { dif: dif, dea: dea, macd: macd };
}

/**
 * 计算 KDJ 指标
 * 返回 { k, d, j } 三个数组
 */
function calcKDJ(kdata, n, m1, m2) {
    n = n || 9;
    m1 = m1 || 3;
    m2 = m2 || 3;
    var kArr = [], dArr = [], jArr = [];
    var prevK = 50, prevD = 50; // 初始值

    for (var i = 0; i < kdata.length; i++) {
        // 取最近 n 天的最高价和最低价
        var start = Math.max(0, i - n + 1);
        var highMax = -Infinity, lowMin = Infinity;
        for (var j = start; j <= i; j++) {
            if (kdata[j].high > highMax) highMax = kdata[j].high;
            if (kdata[j].low < lowMin) lowMin = kdata[j].low;
        }
        var rsv = highMax === lowMin ? 50 : ((kdata[i].close - lowMin) / (highMax - lowMin)) * 100;
        // K = 前K * (m1-1)/m1 + RSV/m1
        var curK = prevK * (m1 - 1) / m1 + rsv / m1;
        // D = 前D * (m2-1)/m2 + K/m2
        var curD = prevD * (m2 - 1) / m2 + curK / m2;
        // J = 3K - 2D
        var curJ = 3 * curK - 2 * curD;
        kArr.push(curK);
        dArr.push(curD);
        jArr.push(curJ);
        prevK = curK;
        prevD = curD;
    }
    return { k: kArr, d: dArr, j: jArr };
}

// 当前激活的副图指标（可多选）
var klineIndicators = { vol: true, macd: false, kdj: false };

/**
 * 根据当前激活的指标，动态构建 ECharts 配置
 */
function buildKlineOption(kdata, dates, ohlc, volData, marks) {
    var ind = klineIndicators;
    // 决定需要哪些副图 grid
    var subCharts = [];
    if (ind.vol) subCharts.push('vol');
    if (ind.macd) subCharts.push('macd');
    if (ind.kdj) subCharts.push('kdj');
    // 至少保留成交量
    if (subCharts.length === 0) { subCharts.push('vol'); ind.vol = true; }

    var subCount = subCharts.length;
    // 主图占固定 55% 高度，剩余空间平分给副图
    var mainHeight = '55%';
    // 副图从 60% 开始，底部预留 6% 给 dataZoom 滑块，避免最后一个副图被挡住
    var gap = 2; // 副图之间间距百分比
    var availableSubPct = 34; // 副图可用百分比空间（60%~94%）
    var eachSubHeight = Math.floor((availableSubPct - gap * (subCount - 1)) / subCount);

    // 构建 grid 数组
    var grids = [{ left: '10%', right: '10%', top: 50, height: mainHeight }];
    // 日期标签只显示 MM-DD、不旋转，压缩主图与副图之间的空白带
    var xAxisArr = [{ type: 'category', data: dates, gridIndex: 0, axisLabel: { color: '#6b7a9a', fontSize: 10, formatter: function(v) { return String(v).slice(5); } }, axisLine: { lineStyle: { color: '#182240' } } }];
    var yAxisArr = [{ scale: true, gridIndex: 0, axisLabel: { color: '#6b7a9a' }, splitLine: { lineStyle: { color: '#111832' } } }];
    var seriesArr = [
        { type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0, barWidth: '75%', barMaxWidth: 26 }
    ];

    // 动态计算每个副图的 top 位置
    // 主图底部约在 55% + 50px，从约 60% 开始放置副图
    var subStartTop = 60;
    for (var i = 0; i < subCharts.length; i++) {
        var topVal = (subStartTop + i * (eachSubHeight + gap)) + '%';
        var gridIdx = i + 1;
        grids.push({ left: '10%', right: '10%', top: topVal, height: eachSubHeight + '%' });
        xAxisArr.push({ type: 'category', data: dates, gridIndex: gridIdx, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#182240' } } });
        yAxisArr.push({ scale: true, gridIndex: gridIdx, axisLabel: { color: '#6b7a9a', fontSize: 10 }, splitLine: { show: false }, splitNumber: 2 });

        var chartType = subCharts[i];
        if (chartType === 'vol') {
            seriesArr.push({ type: 'bar', name: '成交量', data: volData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '75%' });
        } else if (chartType === 'macd') {
            // 读取 K 线弹窗自身的 MACD 参数输入框
            var mp = getKlineMacdParams();
            var macdData = calcMACD(kdata, mp.fast, mp.slow, mp.signal);
            // 参数标签，显示在系列名上，让用户知道当前用的是哪个参数
            var paramLabel = '(' + mp.fast + ',' + mp.slow + ',' + mp.signal + ')';
            // MACD 柱状图（正值红色，负值绿色）
            var macdBarData = macdData.macd.map(function(v) {
                return { value: v, itemStyle: { color: v >= 0 ? '#ef5350' : '#26a69a' } };
            });
            seriesArr.push(
                { type: 'bar', name: 'MACD' + paramLabel, data: macdBarData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '75%' },
                { type: 'line', name: 'DIF' + paramLabel, data: macdData.dif, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#00d4f0' } },
                { type: 'line', name: 'DEA' + paramLabel, data: macdData.dea, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#f5a623' } }
            );
        } else if (chartType === 'kdj') {
            var kdjData = calcKDJ(kdata);
            seriesArr.push(
                { type: 'line', name: 'K', data: kdjData.k, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#00d4f0' } },
                { type: 'line', name: 'D', data: kdjData.d, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#f5a623' } },
                { type: 'line', name: 'J', data: kdjData.j, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#ab47bc' } }
            );
        }
    }

    // dataZoom 联动所有 xAxis
    var allXAxisIndexes = [];
    for (var x = 0; x <= subCount; x++) allXAxisIndexes.push(x);

    var opt = {
        title: { text: '', left: 'center', textStyle: { color: '#dde4f0', fontSize: 14, fontFamily: "'JetBrains Mono', monospace" } },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            formatter: function(params) {
                var idx = params[0]?.dataIndex;
                if (idx == null) return '';
                var d = kdata[idx];
                var chgColor = d.chgPct >= 0 ? '#ef5350' : '#26a69a';
                var limitLabel = d.limitType === 'limit_up' ? ' [涨停]' : d.limitType === 'limit_down' ? ' [跌停]' : '';
                var html = '<b>' + d.date + '</b>' + limitLabel + '<br/>' +
                    '开: ' + d.open.toFixed(2) + ' &nbsp; 高: ' + d.high.toFixed(2) + '<br/>' +
                    '收: ' + d.close.toFixed(2) + ' &nbsp; 低: ' + d.low.toFixed(2) + '<br/>' +
                    '涨跌幅: <span style="color:' + chgColor + ';font-weight:bold">' + (d.chgPct >= 0 ? '+' : '') + d.chgPct.toFixed(2) + '%</span><br/>' +
                    '成交量: ' + (d.vol / 10000).toFixed(0) + '万';
                // 追加指标数据到 tooltip（seriesName 可能带参数后缀，用 indexOf 匹配）
                params.forEach(function(p) {
                    var sn = p.seriesName || '';
                    if (sn.indexOf('DIF') === 0) html += '<br/><span style="color:#00d4f0">DIF</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn.indexOf('DEA') === 0) html += '<br/><span style="color:#f5a623">DEA</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn.indexOf('MACD') === 0 && sn.indexOf('MACD(') !== 0) {
                        // 纯 MACD 柱（不带参数后缀的不算，避免与 MACD(3,20,3) 重复）
                    }
                    if (sn.indexOf('MACD') === 0) html += '<br/><span style="color:#9ca3c4">柱</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn === 'K') html += '<br/>K: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (sn === 'D') html += '<br/>D: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (sn === 'J') html += '<br/>J: ' + (p.value != null ? p.value.toFixed(2) : '-');
                });
                return html;
            }
        },
        grid: grids,
        xAxis: xAxisArr,
        yAxis: yAxisArr,
        dataZoom: [
            { type: 'slider', xAxisIndex: allXAxisIndexes, start: 50, end: 100, height: 25, bottom: 0,
              borderColor: '#182240', backgroundColor: '#0c1124',
              dataBackground: { lineStyle: { color: '#00d4f0' }, areaStyle: { color: 'rgba(0,212,240,0.08)' } },
              textStyle: { color: '#6b7a9a' }, handleStyle: { color: '#00d4f0' } },
            { type: 'inside', xAxisIndex: allXAxisIndexes, zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
        ],
        series: seriesArr
    };

    // 买卖点标记
    if (marks && marks.length > 0) {
        opt.series.push({
            type: 'scatter', name: '买卖点', data: marks.map(function(m) { return [m.date, m.price]; }), xAxisIndex: 0, yAxisIndex: 0,
            symbolSize: 14, symbol: 'pin',
            itemStyle: { color: function(p) { return marks[p.dataIndex]?.type === 'buy' ? '#ef5350' : '#26a69a'; } },
            label: { show: true, formatter: function(p) { return marks[p.dataIndex]?.type === 'buy' ? 'B' : 'S'; }, color: '#fff', fontSize: 10, fontWeight: 'bold', position: 'top' }
        });
    }

    // MACD 数值面板：在 MACD 副图左上角显示参数 + 最新 DIF/DEA/柱体值
    if (ind.macd) {
        var mp2 = getKlineMacdParams();
        // 重新计算（确保拿到最新值）
        var macdPanelData = calcMACD(kdata, mp2.fast, mp2.slow, mp2.signal);
        var lastDif = macdPanelData.dif[macdPanelData.dif.length - 1];
        var lastDea = macdPanelData.dea[macdPanelData.dea.length - 1];
        var lastMacd = macdPanelData.macd[macdPanelData.macd.length - 1];
        var macdColor = lastMacd >= 0 ? '#ef5350' : '#26a69a';
        // 找 MACD 副图的 grid 索引（成交量在第1个，MACD 在第2个；若无成交量则 MACD 在第1个）
        var macdGridIdx = ind.vol ? 2 : 1;
        var macdGridTop = grids[macdGridIdx] ? parseFloat(grids[macdGridIdx].top) : 70;

        opt.graphic = [{
            type: 'group',
            left: '12%',
            top: macdGridTop + 2 + '%',
            children: [
                // 参数标签
                { type: 'text', left: 0, top: 0, style: {
                    text: 'MACD(' + mp2.fast + ',' + mp2.slow + ',' + mp2.signal + ')',
                    fill: '#9ca3c4', fontSize: 11, fontWeight: 'bold'
                }},
                // DIF 值
                { type: 'text', left: 110, top: 0, style: {
                    text: 'DIF:' + (lastDif != null ? lastDif.toFixed(3) : '-'),
                    fill: '#00d4f0', fontSize: 11, fontWeight: 'bold'
                }},
                // DEA 值
                { type: 'text', left: 185, top: 0, style: {
                    text: 'DEA:' + (lastDea != null ? lastDea.toFixed(3) : '-'),
                    fill: '#f5a623', fontSize: 11, fontWeight: 'bold'
                }},
                // 柱体值
                { type: 'text', left: 260, top: 0, style: {
                    text: '柱:' + (lastMacd != null ? lastMacd.toFixed(3) : '-'),
                    fill: macdColor, fontSize: 11, fontWeight: 'bold'
                }}
            ]
        }];
    }

    return opt;
}

/**
 * 读取 K 线弹窗 MACD 参数输入框的值（快线/慢线/信号），非法值回退默认
 */
function getKlineMacdParams() {
    var f = parseInt((document.getElementById('kl_macd_fast') || {}).value) || 12;
    var s = parseInt((document.getElementById('kl_macd_slow') || {}).value) || 26;
    var g = parseInt((document.getElementById('kl_macd_signal') || {}).value) || 9;
    return { fast: Math.max(2, f), slow: Math.max(2, s), signal: Math.max(2, g) };
}

/**
 * MACD 参数变更 → 用缓存数据即时重绘（防抖 300ms，避免连续输入时频繁渲染）
 */
var _macdParamTimer = null;
function onKlineMacdParamChange() {
    clearTimeout(_macdParamTimer);
    _macdParamTimer = setTimeout(function() {
        if (window._klineCache) renderKlineWithIndicators(window._klineCache);
    }, 300);
}

/**
 * 切换副图指标并重新渲染
 */
function toggleIndicator(name) {
    klineIndicators[name] = !klineIndicators[name];
    // 更新按钮样式（含 MACD 参数组显隐）
    updateIndicatorButtons();
    // 重新渲染（使用缓存的 kdata）
    if (window._klineCache) {
        renderKlineWithIndicators(window._klineCache);
    }
}

/**
 * 更新指标按钮的激活状态样式（含 MACD 参数组显隐）
 */
function updateIndicatorButtons() {
    var btns = document.querySelectorAll('.indicator-btn');
    btns.forEach(function(btn) {
        var key = btn.dataset.indicator;
        if (klineIndicators[key]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    // MACD 参数输入组跟随 MACD 激活状态显隐
    var paramsEl = document.getElementById('klMacdParams');
    if (paramsEl) paramsEl.style.display = klineIndicators.macd ? 'inline-flex' : 'none';
}

/**
 * 使用当前指标配置渲染K线图
 */
function renderKlineWithIndicators(cache) {
    var dates = cache.kdata.map(function(d) { return d.date; });
    var ohlc = cache.kdata.map(function(d) {
        var color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    var volData = cache.kdata.map(function(d) {
        return {
            value: d.vol,
            itemStyle: { color: d.chgPct >= 0 ? '#ef5350' : '#26a69a' }
        };
    });

    var klineChartInst = ChartManager.get('kline', document.getElementById('klineChart'));
    klineChartInst.clear();

    // 根据激活的副图数量动态调整图表高度
    var activeCount = Object.values(klineIndicators).filter(Boolean).length;
    var baseChartH = window.innerWidth < 480 ? 280 : window.innerWidth < 768 ? 380 : 560;
    var chartHeight = baseChartH + (activeCount - 1) * (window.innerWidth < 768 ? 70 : 100); // 每多一个副图增加100px
    chartHeight = Math.min(chartHeight, window.innerWidth < 768 ? 500 : 800); // 最大800px
    document.getElementById('klineChart').style.height = chartHeight + 'px';

    var opt = buildKlineOption(cache.kdata, dates, ohlc, volData, cache.marks);
    opt.title.text = cache.code + ' K线图';
    klineChartInst.setOption(opt);
    klineChartInst.resize();
}

async function openKline(code, entryDate, entryPrice, exitDate, exitPrice, resultId) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    window._klineCode = code;  // 供「实时行情」跳转按钮使用（即使K线拉取失败也能跳）
    let start = '2024-01-01', end = new Date().toISOString().split('T')[0];
    if (entryDate) { const d = new Date(entryDate); d.setMonth(d.getMonth()-2); start = d.toISOString().split('T')[0]; }
    if (exitDate) { const d = new Date(exitDate); d.setMonth(d.getMonth()+2); end = d.toISOString().split('T')[0]; }

    let url = API + '/scoring/kline/' + code + '?start=' + start + '&end=' + end;
    if (resultId) url += '&result_id=' + resultId;

    let kdata = [], marks = [];
    try {
        const resp = await RequestManager.fetch('kline-' + code, url);
        kdata = (resp.data?.kline || []).map(d => ({ date: d[0], open: d[1], close: d[2], low: d[3], high: d[4], vol: d[5] || 0 }));
        marks = resp.data?.marks || [];
    } catch(e) {
        console.error('kline fetch error:', e);
        showToast('K线数据获取失败', 'error');
    }

    if (kdata.length === 0) {
        document.getElementById('klineTradeInfo').innerHTML = '<p class="text-muted">无K线数据</p>';
        return;
    }

    // 计算涨跌幅和涨跌停标记
    for (let i = 0; i < kdata.length; i++) {
        kdata[i].prevClose = i > 0 ? kdata[i-1].close : kdata[i].open;
        kdata[i].chgPct = kdata[i].prevClose > 0 ? ((kdata[i].close / kdata[i].prevClose - 1) * 100) : 0;
        kdata[i].limitType = (function() {
            if (!kdata[i].prevClose || kdata[i].prevClose <= 0) return 'normal';
            const chgPct = (kdata[i].close / kdata[i].prevClose - 1) * 100;
            const n = /^30/.test(code) || /^688/.test(code) ? 19.5 : /^[84]/.test(code) ? 29.5 : 9.5;
            if (chgPct >= n) return 'limit_up';
            if (chgPct <= -n) return 'limit_down';
            return 'normal';
        })();
    }

    // 缓存数据，供切换指标时复用（无需重新请求后端）
    window._klineCache = { code: code, kdata: kdata, marks: marks };

    // 更新指标按钮状态
    updateIndicatorButtons();

    // 使用动态指标渲染
    renderKlineWithIndicators(window._klineCache);

    let infoHtml = `<h4 style="font-family:var(--font-mono);margin-bottom:8px;color:var(--text-primary)">${code}</h4>`;
    if (entryDate && entryPrice) {
        infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">买入: ${entryDate} 价格: ${entryPrice}</p>`;
        if (exitDate && exitPrice && entryPrice > 0) {
            const pnl = ((exitPrice/entryPrice - 1)*100).toFixed(2);
            const cls = parseFloat(pnl) >= 0 ? 'positive' : 'negative';
            infoHtml += `<p style="font-size:12px;color:var(--text-secondary)">卖出: ${exitDate} 价格: ${exitPrice} 收益: <span class="${cls}">${pnl}%</span></p>`;
        }
    }
    document.getElementById('klineTradeInfo').innerHTML = infoHtml;
}

function closeKline() {
    document.getElementById('klinePanel').classList.remove('open');
    window._klineCache = null; // 关闭弹窗时清理缓存
    window._klineCode = null;
}

// 跳转到东方财富实时行情页（新标签页打开）
function quoteUrlFor(code) {
    code = String(code || '');
    if (/^6/.test(code)) return 'https://quote.eastmoney.com/sh' + code + '.html';
    if (/^[489]/.test(code)) return 'https://quote.eastmoney.com/bj/' + code + '.html';
    return 'https://quote.eastmoney.com/sz' + code + '.html';
}
function openQuotePage() {
    const code = window._klineCode || (window._klineCache && window._klineCache.code);
    if (!code) { showToast('未获取到股票代码', 'warning'); return; }
    window.open(quoteUrlFor(code), '_blank', 'noopener');
}

// ─── Init ───
loadTab('home');
</script>

let btSelectedRuleId = null;
let btRulesCache = [];

async function btLoadRules() {
    try {
        const resp = await fetch(BT_API + '/rules');
        const data = await resp.json();
        if (!data.success) return;
        btRulesCache = (data.data && data.data.items) || [];
        const sel = document.getElementById('btRuleImport');
        if (!sel) return;
        sel.innerHTML = '<option value="">手动配置（不使用规则）</option>' + btRulesCache.map(r => {
            const hz = HORIZON_LABEL[r.horizon] || '短线';
            const fit = r.fitness != null ? r.fitness : '-';
            return `<option value="${r.id}">#${r.id} ${r.rule_name}（${hz} · fitness ${fit}）</option>`;
        }).join('');
    } catch (e) { console.error('加载策略规则失败', e); }
}

function btImportRule(id) {
    const hint = document.getElementById('btRuleHint');
    btSelectedRuleId = id ? parseInt(id, 10) : null;
    if (!btSelectedRuleId) { if (hint) hint.textContent = ''; return; }
    const rule = btRulesCache.find(r => r.id === btSelectedRuleId);
    if (!rule) return;
    // 自动填充：max_hold_days = 规则 holding_max；回测窗口按周期给默认（短 180 天 / 中 1 年 / 长 2 年）
    if (rule.holding_max) document.getElementById('btParamMaxDays').value = rule.holding_max;
    const days = rule.horizon === 'long' ? 730 : (rule.horizon === 'mid' ? 365 : 180);
    const end = new Date();
    const start = new Date(end.getTime() - days * 86400000);
    document.getElementById('btParamStart').value = start.toISOString().slice(0, 10);
    document.getElementById('btParamEnd').value = end.toISOString().slice(0, 10);
    if (hint) hint.textContent = `已选规则 #${rule.id}「${rule.rule_name}」（${HORIZON_LABEL[rule.horizon] || '短线'} · 持仓≤${rule.holding_max || '-'}天），提交后按规则条件回测并回写 fitness`;
}

async function btParseIntent() {
    const input = document.getElementById('btNlInput');
    const note = document.getElementById('btNlNote');
    const text = (input.value || '').trim();
    if (!text) { showToast('请先输入策略描述', 'warning'); return; }
    const btn = document.getElementById('btBtnParse');
    btn.disabled = true; btn.textContent = '解析中...';
    try {
        const resp = await fetch(BT_API + '/parse_intent', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const data = await resp.json();
        if (!data.success) { showToast('解析失败：' + (data.error || '未知错误'), 'error'); return; }
        const r = data.data || {};
        // 填充选股条件（后端已按 catalog 校验/补默认）
        if (r.conditions && r.conditions.length) {
            btConditions = r.conditions;
            btRenderConditions();
        }
        // 填充回测参数（止盈/止损后端为小数，前端输入为百分数）
        const p = r.params || {};
        const setV = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
        setV('btParamStart', p.start_date);
        setV('btParamEnd', p.end_date);
        setV('btParamCash', p.initial_cash);
        setV('btParamMaxHold', p.max_holdings);
        setV('btParamMaxBuy', p.max_buy_per_day);
        if (p.take_profit_pct != null) setV('btParamTp', Math.round(p.take_profit_pct * 10000) / 100);
        if (p.stop_loss_pct != null) setV('btParamSl', Math.round(Math.abs(p.stop_loss_pct) * 10000) / 100);
        setV('btParamMaxDays', p.max_hold_days);
        if (p.exclude_kcb != null) document.getElementById('btExcludeKcb').checked = !!p.exclude_kcb;
        if (p.exclude_cyb != null) document.getElementById('btExcludeCyb').checked = !!p.exclude_cyb;
        const warnText = (r.warnings || []).length ? '；' + r.warnings.join('，') : '';
        note.textContent = (r.source === 'llm' ? '🤖 ' : '⚠️ ') +
            (r.explanation || (r.conditions || []).length ? (r.explanation || `已解析出 ${r.conditions.length} 条选股条件`) : '') +
            (r.note ? r.note : '') + warnText;
        showToast('解析完成，请确认后点击开始回测', 'success');
    } catch (e) {
        showToast('解析请求失败：' + e.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = 'AI 解析';
    }
}

function btAddCondition() {
    if (!btIndicators.length) { showToast('指标数据尚未加载', 'warning'); return; }
    const cat = btIndicators[0];
    const item = cat.items[0];
    const c = { category: cat.category, indicator: item.id, operator: item.operators[0].id, params: {} };
    (item.params || []).forEach(p => { c.params[p.key] = p.default; });
    btConditions.push(c);
    btRenderConditions();
}

function btRemoveCondition(i) {
    btConditions.splice(i, 1);
    btRenderConditions();
}

function btRenderConditions() {
    const list = document.getElementById('btConditionList');
    const empty = document.getElementById('btConditionEmpty');
    if (!list || !empty) return;
    if (!btConditions.length) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';
    list.innerHTML = btConditions.map((c, i) => {
        const meta = btFindIndicator(c.indicator);
        if (!meta) return '';
        const opOpts = (meta.operators || []).map(o =>
            `<option value="${o.id}" ${o.id === c.operator ? 'selected' : ''}>${o.name}</option>`
        ).join('');
        const paramInputs = (meta.params || []).map(p => `
            <span class="text-muted bt-mini-label">${p.name}</span>
            <input type="number" value="${c.params[p.key] != null ? c.params[p.key] : p.default}"
                   step="${p.type === 'float' ? '0.01' : '1'}"
                   min="${p.min != null ? p.min : ''}" max="${p.max != null ? p.max : ''}"
                   onchange="btOnParamChange(${i}, '${p.key}', this.value)"
                   class="bt-mini-input">
        `).join('');
        return `
        <div class="bt-condition-item">
            <div class="bt-condition-row">
                <span class="text-muted bt-mini-label">类目</span>
                <select onchange="btOnCategoryChange(${i}, this.value)" class="bt-mini-select">
                    ${btIndicators.map(cat => `<option value="${cat.category}" ${cat.category === c.category ? 'selected' : ''}>${cat.label}</option>`).join('')}
                </select>
                <span class="text-muted bt-mini-label">指标</span>
                <select onchange="btOnIndicatorChange(${i}, this.value)" class="bt-mini-select">
                    ${btRenderIndicatorOpts(c.category, c.indicator)}
                </select>
                <span class="text-muted bt-mini-label">条件</span>
                <select onchange="btOnOperatorChange(${i}, this.value)" class="bt-mini-select">${opOpts}</select>
                <button class="btn btn-sm bt-del" onclick="btRemoveCondition(${i})">删除</button>
            </div>
            ${paramInputs ? `<div class="bt-condition-row">${paramInputs}</div>` : ''}
        </div>`;
    }).join('');
}

function btRenderIndicatorOpts(category, current) {
    const cat = btIndicators.find(c => c.category === category) || btIndicators[0];
    return cat.items.map(it => `<option value="${it.id}" ${it.id === current ? 'selected' : ''}>${it.name}</option>`).join('');
}

function btFindIndicator(id) {
    for (const cat of btIndicators) {
        for (const it of cat.items) {
            if (it.id === id) return it;
        }
    }
    return null;
}

function btOnCategoryChange(i, category) {
    const cat = btIndicators.find(c => c.category === category);
    if (!cat) return;
    const item = cat.items[0];
    btConditions[i].category = category;
    btConditions[i].indicator = item.id;
    btConditions[i].operator = item.operators[0].id;
    btConditions[i].params = {};
    (item.params || []).forEach(p => { btConditions[i].params[p.key] = p.default; });
    btRenderConditions();
}

function btOnIndicatorChange(i, id) {
    const meta = btFindIndicator(id);
    if (!meta) return;
    btConditions[i].indicator = id;
    btConditions[i].operator = meta.operators[0].id;
    btConditions[i].params = {};
    (meta.params || []).forEach(p => { btConditions[i].params[p.key] = p.default; });
    btRenderConditions();
}

function btOnOperatorChange(i, op) { btConditions[i].operator = op; }

function btOnParamChange(i, key, value) {
    const meta = btFindIndicator(btConditions[i].indicator);
    if (!meta) return;
    const p = (meta.params || []).find(x => x.key === key);
    if (!p) return;
    const n = p.type === 'float' ? parseFloat(value) : parseInt(value, 10);
    btConditions[i].params[key] = isNaN(n) ? value : n;
}

function btCollectParams() {
    return {
        start_date: document.getElementById('btParamStart').value,
        end_date: document.getElementById('btParamEnd').value,
        initial_cash: parseFloat(document.getElementById('btParamCash').value) || 1_000_000,
        max_holdings: parseInt(document.getElementById('btParamMaxHold').value) || 5,
        max_buy_per_day: parseInt(document.getElementById('btParamMaxBuy').value) || 3,
        buy_timing: document.getElementById('btParamTiming').value,
        take_profit_pct: btParsePct(document.getElementById('btParamTp').value),
        stop_loss_pct: btParsePct(document.getElementById('btParamSl').value, true),
        max_hold_days: btParseInt(document.getElementById('btParamMaxDays').value),
        commission_rate: (parseFloat(document.getElementById('btParamComm').value) || 0.03) / 100,
        stamp_tax_rate: (parseFloat(document.getElementById('btParamStamp').value) || 0.1) / 100,
        slippage_rate: (parseFloat(document.getElementById('btParamSlip').value) || 0.1) / 100,
        exclude_kcb: document.getElementById('btExcludeKcb').checked,
        exclude_cyb: document.getElementById('btExcludeCyb').checked,
    };
}

function btParsePct(v, isLoss) {
    if (v === '' || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return null;
    return isLoss ? -Math.abs(n) / 100 : n / 100;
}
function btParseInt(v) {
    if (v === '' || v == null) return null;
    const n = parseInt(v, 10);
    return isNaN(n) ? null : n;
}

async function btStart() {
    if (!btSelectedRuleId && !btConditions.length) { showToast('请至少添加一条选股条件或选择策略规则', 'warning'); return; }
    const p = btCollectParams();
    if (!p.start_date || !p.end_date) { showToast('请填写回测起止日期', 'warning'); return; }
    if (new Date(p.start_date) >= new Date(p.end_date)) { showToast('起始日期必须早于结束日期', 'warning'); return; }

    document.getElementById('btBtnStart').disabled = true;
    try {
        const payload = { conditions: btConditions, params: p, rule_name: '可视化回测_' + new Date().toISOString().slice(0,10) };
        if (btSelectedRuleId) {
            payload.rule_id = btSelectedRuleId;
            payload.rule_name = '规则回测_' + btSelectedRuleId + '_' + new Date().toISOString().slice(0,10);
        }
        const resp = await fetch(API + '/backtest/run', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!data.success) { showToast('提交失败：' + (data.error || '未知错误'), 'error'); document.getElementById('btBtnStart').disabled = false; return; }
        btCurrentTaskId = data.data.task_id;
        showToast('回测任务已创建', 'success');
        btGotoStep(2);
        document.getElementById('btProgressFill').style.width = '0%';
        document.getElementById('btProgressText').textContent = '0%';
        document.getElementById('btProgressStage').textContent = '任务已创建，等待执行...';
        document.getElementById('btProgressLog').innerHTML = '';
        btStartPolling();
    } catch (e) {
        showToast('提交失败：' + e.message, 'error');
        document.getElementById('btBtnStart').disabled = false;
    }
}

function btStartPolling() {
    if (btPollTimer) clearInterval(btPollTimer);
    btPollTimer = setInterval(btPoll, 1500);
}

async function btPoll() {
    if (!btCurrentTaskId) return;
    try {
        const resp = await fetch(API + '/backtest/' + btCurrentTaskId + '/status');
        const data = await resp.json();
        if (!data.success) return;
        const t = data.data;
        const pct = t.progress || 0;
        document.getElementById('btProgressFill').style.width = pct + '%';
        document.getElementById('btProgressText').textContent = pct + '%';
        document.getElementById('btProgressStage').textContent = '[' + (t.stage || '') + '] ' + (t.message || '');

        const log = document.getElementById('btProgressLog');
        const newLine = '[' + (t.stage || '') + '] ' + (t.message || '');
        if (log.lastElementChild && log.lastElementChild.textContent === newLine) {
            // 重复
        } else {
            const div = document.createElement('div');
            div.textContent = newLine;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        if (t.status === 'done' || t.status === 'failed' || t.status === 'cancelled') {
            clearInterval(btPollTimer); btPollTimer = null;
            document.getElementById('btBtnStart').disabled = false;
            if (t.status === 'done') {
                await btLoadResult();
            } else if (t.status === 'failed') {
                showToast('回测失败：' + (t.error || '未知错误'), 'error');
                btGotoStep(1);
            } else {
                showToast('回测已取消', 'warning');
                btGotoStep(1);
            }
        }
    } catch (e) { console.error('poll error', e); }
}

    const el = document.getElementById('btBenchmarkRow');
    if (!el) return;
    const bm = r.benchmark;
    if (!bm || bm.total_return == null) { el.innerHTML = ''; return; }
    const strat = r.total_return || 0;
    const excess = strat - bm.total_return;
    el.innerHTML = `
        <div class="bt-benchmark">
            <span class="bt-bm-title">📈 基准对比 · ${bm.name || '沪深300'}</span>
            <span class="bt-bm-item">策略累计 <b class="${btClsBySign(strat)}">${btFmtPct(strat)}</b></span>
            <span class="bt-bm-item">${bm.name || '沪深300'}同期 <b class="${btClsBySign(bm.total_return)}">${btFmtPct(bm.total_return)}</b></span>
            <span class="bt-bm-item">超额收益 <b class="${btClsBySign(excess)}">${btFmtPct(excess)}</b></span>
        </div>`;
}

function btFmtPct(v) {
    if (v == null || isNaN(v)) return '-';
    const n = v * 100;
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}
function btClsBySign(v) {
    if (v == null || isNaN(v)) return 'neutral';
    if (v > 0) return 'positive';
    if (v < 0) return 'negative';
    return 'neutral';
}

function btRenderEquityChart(eq) {
    if (btEquityChart) { btEquityChart.dispose(); btEquityChart = null; }
    const el = document.getElementById('btEquityChart');
    if (!eq || !eq.length) { el.innerHTML = '<div class="empty-state">暂无收益曲线</div>'; return; }
    btEquityChart = echarts.init(el, 'dark');
    const dates = eq.map(p => p.date);
    const totals = eq.map(p => p.total);
    const init = totals[0];
    const base = dates.map(() => init);
    btEquityChart.setOption({
        backgroundColor: 'transparent',
        animation: false,
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
        grid: { left: '6%', right: '3%', top: '8%', bottom: '10%' },
        xAxis: { type: 'category', data: dates, axisLabel: { color: '#8b9cc0', fontSize: 10, formatter: v => v.slice(5) } },
        yAxis: { type: 'value', scale: true, axisLabel: { color: '#8b9cc0' }, splitLine: { lineStyle: { color: '#182240' } } },
        series: [
            { name: '策略净值', type: 'line', data: totals, smooth: true, symbol: 'none',
              lineStyle: { width: 2, color: '#00d4f0' }, areaStyle: { color: 'rgba(0,212,240,0.15)' } },
            { name: '初始资金', type: 'line', data: base, symbol: 'none',
              lineStyle: { width: 1, color: '#4d5e82', type: 'dashed' } },
        ],
    });
    window.addEventListener('resize', () => btEquityChart && btEquityChart.resize());
}

function btRenderMonthlyChart(monthly) {
    if (btMonthlyChart) { btMonthlyChart.dispose(); btMonthlyChart = null; }
    const el = document.getElementById('btMonthlyChart');
    if (!monthly || !monthly.length) { el.innerHTML = '<div class="empty-state">暂无月度收益</div>'; return; }
    btMonthlyChart = echarts.init(el, 'dark');
    const months = monthly.map(m => m.month);
    const rets = monthly.map(m => +(m.return * 100).toFixed(2));
    btMonthlyChart.setOption({
        backgroundColor: 'transparent',
        animation: false,
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: '4%', right: '4%', top: '8%', bottom: '10%' },
        xAxis: { type: 'category', data: months, axisLabel: { color: '#8b9cc0', fontSize: 10 } },
        yAxis: { type: 'value', axisLabel: { color: '#8b9cc0', formatter: '{value}%' }, splitLine: { lineStyle: { color: '#182240' } } },
        series: [{
            name: '月度收益', type: 'bar', data: rets,
            itemStyle: { color: function(p) { return p.value >= 0 ? '#ff5252' : '#00e676'; } },
            label: { show: true, position: 'top', color: '#8b9cc0', fontSize: 10, formatter: '{c}%' },
        }],
    });
    window.addEventListener('resize', () => btMonthlyChart && btMonthlyChart.resize());
}

function btRenderTradesTable(trades) {
    if (!trades.length) { document.getElementById('btTradesTable').innerHTML = '<div class="empty-state">暂无交易</div>'; return; }
    const rows = trades.map(t => {
        const pnl = t.pnl || 0;
        const pnlPct = t.pnl_pct || 0;
        const cls = pnl >= 0 ? 'positive' : 'negative';
        return `<tr>
            <td><b style="font-family:var(--font-mono)">${t.code}</b><br><span class="text-muted" style="font-size:11px">${t.name || ''}</span></td>
            <td>${t.buy_date || ''}</td>
            <td style="font-family:var(--font-mono)">${(t.buy_price ?? 0).toFixed(3)}</td>
            <td>${t.sell_date || ''}</td>
            <td style="font-family:var(--font-mono)">${(t.sell_price ?? 0).toFixed(3)}</td>
            <td style="font-family:var(--font-mono)">${t.shares || 0}</td>
            <td class="${cls}" style="font-weight:700">${pnl.toFixed(2)}</td>
            <td class="${cls}" style="font-weight:700">${(pnlPct * 100).toFixed(2)}%</td>
            <td>${t.hold_days || 0}</td>
            <td><span class="badge badge-info">${btExitLabel(t.exit_reason)}</span></td>
        </tr>`;
    }).join('');
    document.getElementById('btTradesTable').innerHTML = `
        <table class="rec-table">
            <thead><tr>
                <th>股票</th><th>买入日期</th><th>买入价</th><th>卖出日期</th>
                <th>卖出价</th><th>数量</th><th>盈亏</th><th>收益率</th>
                <th>持仓天数</th><th>卖出原因</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function btRenderPositionsTable(positions) {
    if (!positions.length) { document.getElementById('btPositionsTable').innerHTML = '<div class="empty-state">无持仓</div>'; return; }
    const rows = positions.map(p => {
        const cls = (p.pnl || 0) >= 0 ? 'positive' : 'negative';
        return `<tr>
            <td><b style="font-family:var(--font-mono)">${p.code}</b><br><span class="text-muted" style="font-size:11px">${p.name || ''}</span></td>
            <td style="font-family:var(--font-mono)">${p.shares || 0}</td>
            <td style="font-family:var(--font-mono)">${(p.buy_price ?? 0).toFixed(3)}</td>
            <td style="font-family:var(--font-mono)">${(p.current_price ?? 0).toFixed(3)}</td>
            <td class="${cls}" style="font-weight:700">${(p.pnl || 0).toFixed(2)}</td>
            <td class="${cls}" style="font-weight:700">${((p.pnl_pct || 0) * 100).toFixed(2)}%</td>
        </tr>`;
    }).join('');
    document.getElementById('btPositionsTable').innerHTML = `
        <table class="rec-table">
            <thead><tr>
                <th>股票</th><th>数量</th><th>买入价</th><th>当前价</th>
                <th>浮动盈亏</th><th>盈亏比例</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

function btExitLabel(r) {
    const map = { stop_loss: '止损', take_profit: '止盈', max_hold_days: '到期', force_close: '期末强平' };
    return map[r] || r || '-';
}

function btSwitchReportTab(name) {
    document.getElementById('btTabTrades').classList.toggle('active', name === 'trades');
    document.getElementById('btTabPositions').classList.toggle('active', name === 'positions');
    document.getElementById('btReportTrades').classList.toggle('active', name === 'trades');
    document.getElementById('btReportPositions').classList.toggle('active', name === 'positions');
}

function btExport(fmt) {
    if (!btCurrentTaskId) return;
    window.open(API + '/backtest/' + btCurrentTaskId + '/export?format=' + fmt, '_blank');
}

async function btLoadHistory() {
    try {
        const resp = await fetch(API + '/backtest/history?limit=20');
        const data = await resp.json();
        if (!data.success) { showToast('加载历史失败', 'error'); return; }
        const items = (data.data && data.data.items) || [];
        if (!items.length) {
            document.getElementById('btHistoryList').innerHTML = '<div class="empty-state">暂无历史回测</div>';
        } else {
            document.getElementById('btHistoryList').innerHTML = items.map(h => {
                const m = h.metrics || {};
                const cls = btClsBySign(m.total_return);
                return `<div class="bt-history-item" onclick="btLoadFromHistory('${h.id}')">
                    <div class="bt-history-meta">
                        <span style="font-family:var(--font-mono)">${h.id}</span>
                        <span>${h.created_at || ''}</span>
                    </div>
                    <div class="bt-history-name">${h.name || ''} · ${h.start_date} ~ ${h.end_date}</div>
                    <div class="bt-history-foot">
                        <span class="text-muted" style="font-size:11px">交易 ${m.total_trades || 0} · 胜率 ${((m.win_rate || 0) * 100).toFixed(1)}%</span>
                        <span class="${cls}" style="font-weight:700">${btFmtPct(m.total_return)}</span>
                    </div>
                </div>`;
            }).join('');
        }
        document.getElementById('btHistoryDrawer').classList.add('active');
    } catch (e) { showToast('加载历史失败：' + e.message, 'error'); }
}

function btCloseHistory() {
    document.getElementById('btHistoryDrawer').classList.remove('active');
}

function btLoadFromHistory(taskId) {
    btCloseHistory();
    showToast('历史回测已持久化到 backtest_results 表，详情请查询数据库', 'info');
}
</script>
</body>
</html>
