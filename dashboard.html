<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIQuant · 个人股票评分系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0f1117; color: #e1e1e1; }
        .header { background: #1a1d2e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a2d3e; }
        .header h1 { font-size: 18px; font-weight: 600; color: #4fc3f7; }
        .tabs { display: flex; gap: 4px; padding: 8px 24px; background: #1a1d2e; border-bottom: 1px solid #2a2d3e; }
        .tab { padding: 8px 20px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 6px; font-size: 14px; transition: all .2s; }
        .tab:hover { color: #e1e1e1; background: #2a2d3e; }
        .tab.active { color: #4fc3f7; background: #1e2940; }
        .content { padding: 16px 24px; max-width: 1400px; margin: 0 auto; }
        .panel { background: #1a1d2e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a2d3e; font-size: 13px; }
        th { color: #888; font-weight: 500; background: #141720; position: sticky; top: 0; }
        tr:hover { background: #1e2940; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; }
        .btn-primary { background: #4fc3f7; color: #0f1117; }
        .btn-primary:hover { background: #3ab0e0; }
        .btn-danger { background: #f44336; color: #fff; }
        .toggle { width: 40px; height: 22px; background: #555; border-radius: 11px; cursor: pointer; position: relative; display: inline-block; }
        .toggle.on { background: #4caf50; }
        .toggle::after { content: ''; width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: .2s; }
        .toggle.on::after { left: 20px; }
        .score-high { color: #ff5252; font-weight: 600; }
        .score-mid { color: #ffab40; }
        .score-low { color: #69f0ae; }
        .positive { color: #ff5252; }
        .negative { color: #69f0ae; }
        .metrics { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px; }
        .metric { text-align: center; }
        .metric .val { font-size: 24px; font-weight: 700; color: #4fc3f7; }
        .metric .lbl { font-size: 11px; color: #888; margin-top: 2px; }
        .input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        input, select { padding: 6px 10px; border: 1px solid #2a2d3e; border-radius: 4px; background: #0f1117; color: #e1e1e1; font-size: 13px; }
        .kline-overlay { position: fixed; top: 0; right: 0; width: 620px; height: 100vh; background: #1a1d2e; border-left: 1px solid #2a2d3e; z-index: 1000; transform: translateX(100%); transition: transform .3s; overflow-y: auto; }
        .kline-overlay.open { transform: translateX(0); }
        .kline-overlay .close-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #888; font-size: 20px; cursor: pointer; z-index: 10; }
        .kline-overlay .chart { width: 100%; height: 420px; }
        .kline-overlay .trade-info { padding: 16px; }
        .hidden { display: none; }
        .code-link { color: #4fc3f7; cursor: pointer; text-decoration: underline; }
        .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .status-running { background: #ff9800; color: #000; }
        .status-done { background: #4caf50; color: #000; }
        .status-error { background: #f44336; color: #fff; }
        .table-wrapper { max-height: 65vh; overflow-y: auto; }
    </style>
</head>
<body>
<div class="header">
    <h1>AIQuant · 个人股票评分系统</h1>
    <span style="color:#888;font-size:12px" id="last-update"></span>
</div>
<div class="tabs">
    <button class="tab active" onclick="switchTab('scores')">每日打分</button>
    <button class="tab" onclick="switchTab('strategy')">策略管理</button>
    <button class="tab" onclick="switchTab('backtest')">回测中心</button>
</div>
<div class="content" id="content"></div>
<div class="kline-overlay" id="klinePanel">
    <button class="close-btn" onclick="closeKline()">✕</button>
    <div class="chart" id="klineChart"></div>
    <div class="trade-info" id="klineTradeInfo"></div>
</div>

<script>
const API = '/api';
let currentTab = 'scores';
let klineChart = null;

async function fetchJSON(url, opts) {
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error(resp.statusText);
    return resp.json();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    loadTab(tab);
}

async function loadTab(tab) {
    const c = document.getElementById('content');
    c.innerHTML = '<div style="text-align:center;padding:40px;color:#888">加载中...</div>';
    try {
        if (tab === 'scores') await loadScoresTab(c);
        else if (tab === 'strategy') await loadStrategyTab(c);
        else if (tab === 'backtest') await loadBacktestTab(c);
    } catch(e) {
        c.innerHTML = '<div style="text-align:center;padding:40px;color:#f44336">加载失败: ' + e.message + '</div>';
    }
}

// ─── Tab 1: 每日打分 ───
async function loadScoresTab(container) {
    const resp = await fetchJSON(API + '/scoring/daily');
    const data = resp.data || [];
    const latestDate = data.length > 0 ? data[0].trade_date : '';

    let html = `<div class="panel">
        <div class="input-row">
            <span>日期:</span>
            <input type="date" id="scoreDate" value="${latestDate}" onchange="refreshScores()">
            <button class="btn btn-primary" onclick="runScoring()">刷新打分</button>
            <span style="color:#888;font-size:12px" id="scoreCount">${data.length} 只股票</span>
        </div>
        <div class="table-wrapper"><table>
            <thead><tr><th>排名</th><th>代码</th><th>名称</th><th>得分</th><th>命中策略</th></tr></thead>
            <tbody>`;
    data.forEach((r, i) => {
        const cls = r.score >= 80 ? 'score-high' : r.score >= 50 ? 'score-mid' : 'score-low';
        html += `<tr>
            <td>${i + 1}</td>
            <td><span class="code-link" onclick="openKline('${r.code}')">${r.code}</span></td>
            <td>${r.name || ''}</td>
            <td class="${cls}">${r.score}</td>
            <td>${r.rule_name || ''}</td></tr>`;
    });
    html += `</tbody></table></div></div>`;
    container.innerHTML = html;
    document.getElementById('last-update').textContent = latestDate ? '最新打分: ' + latestDate : '';
}

function refreshScores() { loadTab('scores'); }

async function runScoring() {
    const btn = event.target;
    btn.disabled = true; btn.textContent = '计算中...';
    try {
        await fetchJSON(API + '/scoring/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    } catch(e) {}
    btn.disabled = false; btn.textContent = '刷新打分';
    loadTab('scores');
}

// ─── Tab 2: 策略管理 ───
async function loadStrategyTab(container) {
    const resp = await fetchJSON(API + '/strategy/rules');
    const rules = resp.data || [];
    let html = `<div class="panel">
        <div class="input-row">
            <button class="btn btn-primary" onclick="startMining()">挖掘新策略</button>
            <span style="color:#888;font-size:12px" id="miningStatus"></span>
            <span style="color:#888;font-size:12px;margin-left:auto">共 ${rules.length} 条策略</span>
        </div>
        <div class="table-wrapper"><table>
            <thead><tr><th>启用</th><th>策略名称</th><th>类型</th><th>年化收益</th><th>胜率</th><th>夏普</th><th>最大回撤</th><th>交易数</th><th>操作</th></tr></thead>
            <tbody>`;
    rules.forEach(r => {
        const retCls = (r.annual_return||0) >= 0 ? 'positive' : 'negative';
        html += `<tr>
            <td><span class="toggle ${r.is_active?'on':''}" onclick="toggleRule(${r.id},this)"></span></td>
            <td><span class="code-link" onclick="viewRuleTrades(${r.id},'${(r.rule_name||'').replace(/'/g,"\\'")}')">${r.rule_name}</span></td>
            <td>${r.rule_type}</td>
            <td class="${retCls}">${(r.annual_return||0).toFixed(1)}%</td>
            <td>${(r.win_rate||0).toFixed(1)}%</td>
            <td>${(r.sharpe_ratio||0).toFixed(2)}</td>
            <td class="negative">${(r.max_drawdown||0).toFixed(1)}%</td>
            <td>${r.total_trades||0}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteRule(${r.id})">删除</button></td></tr>`;
    });
    html += `</tbody></table></div><div id="ruleTradesPanel" class="hidden panel" style="margin-top:12px"></div></div>`;
    container.innerHTML = html;
}

async function toggleRule(id, el) {
    const resp = await fetchJSON(API + '/strategy/rules/' + id + '/toggle', {method:'PUT'});
    if (resp.success) el.classList.toggle('on', resp.data.is_active);
}

async function deleteRule(id) {
    if (!confirm('确定删除此策略?')) return;
    await fetchJSON(API + '/strategy/rules/' + id, {method:'DELETE'});
    loadTab('strategy');
}

async function startMining() {
    const st = document.getElementById('miningStatus');
    st.innerHTML = '<span class="status-badge status-running">挖掘中...</span>';
    const resp = await fetchJSON(API + '/strategy/mine', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if (resp.success) { pollMining(); }
    else { st.innerHTML = '<span class="status-badge status-error">启动失败</span>'; }
}

async function pollMining() {
    const st = document.getElementById('miningStatus');
    const resp = await fetchJSON(API + '/strategy/mine/status');
    if (resp.data.running) { st.innerHTML = '<span class="status-badge status-running">挖掘中...</span>'; setTimeout(pollMining, 3000); }
    else if (resp.data.progress === 'error') { st.innerHTML = '<span class="status-badge status-error">错误: '+(resp.data.result||'')+'</span>'; }
    else { st.innerHTML = '<span class="status-badge status-done">完成! '+(resp.data.result?resp.data.result.length:0)+' 条策略</span>'; loadTab('strategy'); }
}

async function viewRuleTrades(ruleId, ruleName) {
    const panel = document.getElementById('ruleTradesPanel');
    const resp = await fetchJSON(API + '/strategy/rules/' + ruleId + '/trades');
    const trades = resp.data || [];
    let html = '<h3 style="margin-bottom:8px">' + ruleName + ' · 交易明细 (' + trades.length + '笔)</h3>';
    if (trades.length === 0) { html += '<p style="color:#888">暂无交易记录</p>'; }
    else {
        html += '<div class="table-wrapper"><table><thead><tr><th>代码</th><th>名称</th><th>买入日</th><th>买入价</th><th>卖出日</th><th>卖出价</th><th>持仓天</th><th>收益率</th></tr></thead><tbody>';
        trades.forEach(t => {
            const pnlCls = (t.pnl_pct||0) >= 0 ? 'positive' : 'negative';
            html += `<tr><td><span class="code-link" onclick="openKline('${t.code}','${t.entry_date||''}',${t.entry_price||0},'${t.exit_date||''}',${t.exit_price||0})">${t.code}</span></td>
                <td>${t.name||''}</td><td>${t.entry_date||''}</td><td>${t.entry_price||''}</td>
                <td>${t.exit_date||''}</td><td>${t.exit_price||''}</td>
                <td>${t.holding_days||''}</td><td class="${pnlCls}">${(t.pnl_pct||0).toFixed(2)}%</td></tr>`;
        });
        html += '</tbody></table></div>';
    }
    panel.innerHTML = html; panel.classList.remove('hidden');
}

// ─── Tab 3: 回测中心 ───
async function loadBacktestTab(container) {
    const [rulesResp, resultsResp] = await Promise.all([
        fetchJSON(API + '/strategy/rules?active_only=0'),
        fetchJSON(API + '/backtest/results')
    ]);
    const rules = rulesResp.data || [], results = resultsResp.data || [];
    const opts = rules.map(r => `<option value="${r.id}">${r.rule_name}</option>`).join('');

    let html = `<div class="panel">
        <div class="input-row">
            <span>策略:</span><select id="btRule">${opts}</select>
            <span>起始:</span><input type="date" id="btStart" value="2024-01-01">
            <span>结束:</span><input type="date" id="btEnd" value="2025-12-31">
            <button class="btn btn-primary" onclick="startBacktest()">开始回测</button>
            <span id="btStatus" style="font-size:12px;color:#888"></span>
        </div>
        <div id="btResult" class="hidden"></div>
        <h3 style="margin:16px 0 8px">历史回测记录 (${results.length})</h3>
        <div class="table-wrapper"><table><thead><tr><th>ID</th><th>策略</th><th>区间</th><th>年化收益</th><th>胜率</th><th>夏普</th><th>回撤</th><th>交易数</th></tr></thead><tbody>`;
    results.forEach(r => {
        const retCls = (r.annual_return||0) >= 0 ? 'positive' : 'negative';
        html += `<tr><td><span class="code-link" onclick="viewResult(${r.id})">#${r.id}</span></td>
            <td>${r.rule_name||''}</td><td>${r.start_date||''}~${r.end_date||''}</td>
            <td class="${retCls}">${(r.annual_return||0).toFixed(1)}%</td>
            <td>${(r.win_rate||0).toFixed(1)}%</td><td>${(r.sharpe_ratio||0).toFixed(2)}</td>
            <td class="negative">${(r.max_drawdown||0).toFixed(1)}%</td><td>${r.total_trades||0}</td></tr>`;
    });
    html += `</tbody></table></div><div id="btTradesPanel" class="hidden panel" style="margin-top:12px"></div></div>`;
    container.innerHTML = html;
}

async function startBacktest() {
    const ruleId = document.getElementById('btRule').value;
    const start = document.getElementById('btStart').value, end = document.getElementById('btEnd').value;
    const st = document.getElementById('btStatus');
    st.innerHTML = '<span class="status-badge status-running">回测中...</span>';
    const resp = await fetchJSON(API + '/backtest/run', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rule_id:parseInt(ruleId),start_date:start,end_date:end})});
    if (resp.success) { pollBt(); }
    else { st.innerHTML = '<span class="status-badge status-error">'+(resp.error||'')+'</span>'; }
}

async function pollBt() {
    const st = document.getElementById('btStatus');
    const resp = await fetchJSON(API + '/backtest/status');
    if (resp.data.running) { st.innerHTML = '<span class="status-badge status-running">回测中...</span>'; setTimeout(pollBt, 3000); }
    else if (resp.data.error) { st.innerHTML = '<span class="status-badge status-error">'+resp.data.error+'</span>'; }
    else if (resp.data.result_id) { st.innerHTML = '<span class="status-badge status-done">完成!</span>'; viewResult(resp.data.result_id); }
    else { st.innerHTML = '<span class="status-badge status-done">完成</span>'; loadTab('backtest'); }
}

async function viewResult(resultId) {
    const [detailResp, tradesResp] = await Promise.all([
        fetchJSON(API + '/backtest/results/' + resultId),
        fetchJSON(API + '/backtest/results/' + resultId + '/trades')
    ]);
    const s = detailResp.data || {}, trades = tradesResp.data || [];
    const panel = document.getElementById('btTradesPanel');
    const retCls = (s.annual_return||0) >= 0 ? '' : ' negative';
    let html = `<h3>回测结果 #${resultId}</h3>
        <div class="metrics">
            <div class="metric"><div class="val${retCls}">${(s.annual_return||0).toFixed(1)}%</div><div class="lbl">年化收益</div></div>
            <div class="metric"><div class="val">${(s.win_rate||0).toFixed(1)}%</div><div class="lbl">胜率</div></div>
            <div class="metric"><div class="val">${(s.sharpe_ratio||0).toFixed(2)}</div><div class="lbl">夏普</div></div>
            <div class="metric"><div class="val negative">${(s.max_drawdown||0).toFixed(1)}%</div><div class="lbl">最大回撤</div></div>
            <div class="metric"><div class="val">${s.total_trades||0}</div><div class="lbl">交易次数</div></div>
        </div>`;
    if (trades.length > 0) {
        html += '<div class="table-wrapper"><table><thead><tr><th>代码</th><th>名称</th><th>买入日</th><th>买入价</th><th>卖出日</th><th>卖出价</th><th>持仓天</th><th>收益率</th></tr></thead><tbody>';
        trades.forEach(t => {
            const pnlCls = (t.pnl_pct||0) >= 0 ? 'positive' : 'negative';
            html += `<tr><td><span class="code-link" onclick="openKline('${t.code}','${t.entry_date||''}',${t.entry_price||0},'${t.exit_date||''}',${t.exit_price||0},${resultId})">${t.code}</span></td>
                <td>${t.name||''}</td><td>${t.entry_date||''}</td><td>${t.entry_price||''}</td>
                <td>${t.exit_date||''}</td><td>${t.exit_price||''}</td>
                <td>${t.holding_days||''}</td><td class="${pnlCls}">${(t.pnl_pct||0).toFixed(2)}%</td></tr>`;
        });
        html += '</tbody></table></div>';
    }
    panel.innerHTML = html; panel.classList.remove('hidden');
}

// ─── K线图侧面板 ───
async function openKline(code, entryDate, entryPrice, exitDate, exitPrice, resultId) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    let start = '2024-01-01', end = '2025-12-31';
    if (entryDate) { const d = new Date(entryDate); d.setMonth(d.getMonth()-2); start = d.toISOString().split('T')[0]; }
    if (exitDate) { const d = new Date(exitDate); d.setMonth(d.getMonth()+2); end = d.toISOString().split('T')[0]; }

    let url = API + '/scoring/kline/' + code + '?start=' + start + '&end=' + end;
    if (resultId) url += '&result_id=' + resultId;

    let kdata = [], marks = [];
    try {
        const resp = await fetchJSON(url);
        kdata = (resp.data?.kline || []).map(d => [d[0], d[1], d[2], d[3], d[4]]);
        marks = resp.data?.marks || [];
    } catch(e) { console.error(e); }

    if (!klineChart) klineChart = echarts.init(document.getElementById('klineChart'));
    const dates = kdata.map(d => d[0]);
    const ohlc = kdata.map(d => [d[1], d[2], d[3], d[4]]);

    klineChart.setOption({
        title: { text: code + ' K线图', left: 'center', textStyle: { color: '#e1e1e1', fontSize: 14 } },
        tooltip: { trigger: 'axis' },
        grid: { left: '10%', right: '10%', top: 50, bottom: 30 },
        xAxis: { type: 'category', data: dates, axisLabel: { color: '#888', rotate: 30 } },
        yAxis: { scale: true, axisLabel: { color: '#888' } },
        series: [{
            type: 'candlestick', data: ohlc,
            itemStyle: { color: '#ff5252', color0: '#69f0ae', borderColor: '#ff5252', borderColor0: '#69f0ae' },
            markPoint: marks.length > 0 ? {
                data: marks.map(m => ({
                    name: m.type === 'buy' ? '买入' : '卖出',
                    coord: [m.date, m.price],
                    value: m.type === 'buy' ? 'B' : 'S',
                    symbol: 'pin', symbolSize: 45,
                    itemStyle: { color: m.type === 'buy' ? '#ff5252' : '#69f0ae' }
                }))
            } : undefined
        }]
    });

    let infoHtml = `<h4 style="margin-bottom:8px">${code}</h4>`;
    if (entryDate && entryPrice) {
        infoHtml += `<p>买入: ${entryDate} 价格: ${entryPrice}</p>`;
        if (exitDate && exitPrice && entryPrice > 0) {
            const pnl = ((exitPrice/entryPrice - 1)*100).toFixed(2);
            const cls = parseFloat(pnl) >= 0 ? 'positive' : 'negative';
            infoHtml += `<p>卖出: ${exitDate} 价格: ${exitPrice} 收益: <span class="${cls}">${pnl}%</span></p>`;
        }
    }
    document.getElementById('klineTradeInfo').innerHTML = infoHtml;
}

function closeKline() { document.getElementById('klinePanel').classList.remove('open'); }

// ─── Init ───
loadTab('scores');
</script>
</body>
</html>
