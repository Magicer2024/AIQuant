    // 只有在弹窗已关闭 / 板块首次回到时需要刷新主区占位
    if (!_sdDeepMode) renderSdPanelPlaceholder();
}

// P0: 出场跟踪（7月20日起推荐的出场状态，按短线/中线/长线三组）
// 每组为折叠小板块：默认只显示统计（累计收益/累计胜率/持有/已卖出），点「显示详情」展开跟踪列表
const EXIT_EXPAND_KEY = 'aiq_exit_expanded';
function loadExitExpandState() {
    try {
        const obj = JSON.parse(localStorage.getItem(EXIT_EXPAND_KEY) || '{}');
        return { short: !!obj.short, mid: !!obj.mid, long: !!obj.long };
    } catch(e) { return { short: false, mid: false, long: false }; }
}
function saveExitExpandState(st) {
    try { localStorage.setItem(EXIT_EXPAND_KEY, JSON.stringify(st)); } catch(e) {}
}
let EXIT_EXPANDED = loadExitExpandState();
const EXIT_HORIZON_META = {
    short: { label: '短线', hint: '持仓上限 10 个交易日' },
    mid:   { label: '中线', hint: '持仓上限 60 个交易日' },
    long:  { label: '长线', hint: '不限持仓期 · 趋势跟踪' },
};

// 各周期统计 chips
// ⚠ 口径（2026-09-11 修正）：原「累计收益 = 各段盈亏之和」是单笔收益率**简单相加**，
// 无资金含义 —— 37 笔会累出 -111.7%，读起来像"本金亏光还倒欠"，实际只是算术和。
// ⚠ 口径（2026-09-19 再修正）：第二版「等权累计」（逐笔满仓**顺序**复利）同样误导 ——
// 短线 40+ 笔并行分布在 40 个交易日（每日最多 3 只同时持有），按顺序复利等于假设
// "一份钱做完一笔再做下一笔"，把 -2% 的单笔均摊放大成 -65%。改为「按仓位累计」：
// Σ(单笔收益 × POSITION_PLAN_MAX_PCT)，对总资金的影响可线性累加，有明确资金含义。
// ⚠ 展示（2026-10-13 精简）：界面只保留 平均每笔 / 按仓位累计 / 胜率 三个主指标，
// 弃用口径（算术和 cum_pnl、顺序复利 comp_pct）不再出现在界面上，只在悬浮说明里
// 留一句对照；样本笔数并入「平均每笔」，状态计数由外层 chips 承担。
function exitStatChip(hz, perf) {
    const p = (perf && perf[hz]) || {};
    let s = '';
    const n = (p.clear || 0) + (p.hold || 0);
    if (p.avg_pct != null) {
        const sign = p.avg_pct >= 0 ? '+' : '';
        const raw = p.cum_pnl != null ? `${p.cum_pnl >= 0 ? '+' : ''}${p.cum_pnl}%` : '--';
        s += `<span class="exit-group-stat ${p.avg_pct >= 0 ? 'positive' : 'negative'}" title="平均每笔收益：${n} 笔已建仓（已卖出 ${p.clear || 0} + 持仓中 ${p.hold || 0}）的等权算术平均，含持仓中浮盈，不依赖仓位假设，是唯一可直接比较的口径。原「累计收益 ${raw}」为单笔收益率直接相加，无资金含义，已弃用">平均每笔 ${sign}${p.avg_pct}% · ${n}笔</span>`;
    }
    if (p.pnl_at_pos != null) {
        const sign = p.pnl_at_pos >= 0 ? '+' : '';
        const posPct = p.pos_pct != null ? p.pos_pct : 20;
        s += `<span class="exit-group-stat ${p.pnl_at_pos >= 0 ? 'positive' : 'negative'}" title="按仓位累计：每笔按 ${posPct}% 仓位下单，对总资金的影响 = Σ(单笔收益 × ${posPct}%)，可线性累加、有资金含义（共 ${n} 笔）。注：原「等权累计」（逐笔满仓顺序复利）把并行持仓当成串联，会把 -2% 的单笔均摊放大成 -65%，已弃用">按仓位累计 ${sign}${p.pnl_at_pos}%</span>`;
    }
    if (p.win_rate != null) {
        const wins = Math.round(p.win_rate * n / 100);
        s += `<span class="exit-group-stat" style="font-weight:400" title="${n} 笔已建仓中 ${wins} 笔盈利；口径与「平均每笔」一致（含持仓浮盈，待回踩/未成交不计入）">胜率 ${p.win_rate}%</span>`;
    }
    return s;
}

// 分组均笔（2026-10-13 新增，仅短线）：「隔日动量」与「抄底类」是两套独立期望的
// 信号线，混在一个平均值里看不出谁在拖。3 年生产口径实测：动量名额均笔 +4.45%
// vs 抄底 +1.90%（tools/_eval_short_exposure_grid.py 的 rn 名次归因）。
// 数值全部来自已建仓段（clear/hold）的 detail.current_pnl_pct，与主口径一致；
// 某类当期没有已建仓段 → 该类 chips 整个不显示，不给策略没产出的数字。
function exitSplitChips(hz, list) {
    if (hz !== 'short') return '';
    var defs = [{ label: '动量', isMom: true }, { label: '抄底', isMom: false }];
    var s = '';
    defs.forEach(function (def) {
        var vals = list.filter(function (it) {
            return ((it.strategy || '') === '隔日动量') === def.isMom;
        }).map(function (it) {
            return (it.detail || {}).current_pnl_pct;
        }).filter(function (v) { return typeof v === 'number'; });
        if (!vals.length) return;
        var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
        var win = vals.filter(function (v) { return v > 0; }).length / vals.length * 100;
        s += `<span class="exit-group-stat exit-split ${mean >= 0 ? 'positive' : 'negative'}" title="隔日动量与抄底类（回踩确认入场）分开统计，避免被平均值掩盖。口径同「平均每笔」：仅已建仓、含持仓浮盈。共 ${vals.length} 笔，盈利 ${Math.round(win * vals.length / 100)} 笔">${def.label} ${vals.length}笔 ${mean >= 0 ? '+' : ''}${mean.toFixed(2)}%</span>`;
    });
    return s;
}

// 展示层名额差异（2026-10-14 新增）：「今日推荐」按 RECO_REGIME_CAP 在 cold 日把
// 短线归零、cool 日砍到 2 只，而出场跟踪评的是完整策略池 ⇒ 面板里会混进
// 「当天根本没推给你」的笔（面板窗短线 63 笔中 9 笔，全是 cold 日隔日动量）。
// 不改统计口径：3 年样本验证过把 cap 对齐进跟踪只减少笔数、不改善单笔
// （均笔 +1.801% vs base +1.792%，t=-0.68 不显著，合计 -3.7%）。
// 数值全部取后端 perf，前端不做推算。
function exitCapChip(hz, perf) {
    const p = (perf && perf[hz]) || {};
    const n = p.hidden_n || 0;
    if (!n) return '';
    const f = v => v == null ? '--' : `${v >= 0 ? '+' : ''}${v}%`;
    return `<span class="exit-group-stat exit-cap" title="这 ${n} 笔在「今日推荐」当天不会展示给你（大盘 cold 日短线名额归零 / cool 日只留 2 只），但计入了上面的「平均每笔」。它们均笔 ${f(p.hidden_mean_pct)}，剔除后你可执行口径均笔 ${f(p.shown_mean_pct)}。跟踪仍按完整策略池统计，是为了和回测/复盘保持同一口径。">${n}笔未展示 · 可执行 ${f(p.shown_mean_pct)}</span>`;
}

// 跟踪列表行（展开态表格 tbody）
// ── 列集合（2026-10-13 重排，表头见 renderExitGroupBody，两者必须一一对应）──
// 修掉此前「表头 10 列 / 单元格 11 个」的整列错位（加「现价」列时没回头补表头，
// 导致 现价 显示在 卖出价 表头下、卖出价 显示在 持仓天数 表头下……）。
// 只保留「这笔接下来该怎么处理」真正要看的数值：
//   1 股票      名称+代码+信号线（原「代码」「名称」两列合一）
//   2 综合分    融合分，判断这笔离短线门控线多远
//   3 推荐日    连续推荐时附最早一次
//   4 建仓      价 + 日（回踩类的买价语义 = 回踩买点）
//   5 市价      已卖出=卖出价 / 其余=最新收盘价。原「现价」「卖出价」两列对已卖出
//              行是**同一个数字**（evaluate_exit_by_prices 清仓时 current_price 就取
//              exit_price），属纯冗余，已合并为一列
//   6 持仓      交易日 / 该周期上限（上限取后端 perf.max_hold，不硬编码）
//   7 止损      相对建仓价的距离%（ATR 自适应后 5%~15% 不等，>8% 标黄）+ 绝对价
//   8 最高浮盈  MFE%，与盈亏之差即回吐 —— 用来区分「信号看错」还是「出场没拿住」
//   9 盈亏
//  10 状态      徽章 + 出场原因标签；完整文案收进悬浮，替代原来最长的一列「说明」
// 不再显示：固定止盈价（移动止盈口径下它只是启动线兜底，读它没有决策价值）、
// 盘中最高价绝对值（已换算成 MFE%）、ma5/减半标记（短线三档出场用不到）。
const EXIT_STOP_WIDE_PCT = 8;   // 止损宽度超过此值标黄：ATR 自适应止损常 10%+

function exitNum(v, dg) {
    if (v == null || v === '' || isNaN(Number(v))) return null;
    return Number(v).toFixed(dg == null ? 2 : dg);
}

// 出场原因短标签：界面只留一眼能读完的词，完整文案进 title。
// 三周期的 reason 文案不同（短线 evaluate_exit_by_prices 的 short 分支写「收盘跌破
// 止损价 / 移动止盈 / 持仓满 N 日到期」，中长线写「触发硬止损 / 自高点回撤…移动止盈
// 清仓 / 超过最长持仓期 / 已减半后跌破MA5」），这里统一归成同一组标签。
// 归不出来的就返回空（宁可空白，也不显示与状态徽章重复的「已卖出」）。
function exitReasonTag(it) {
    const d = it.detail || {};
    const r = String(d.exit_reason || it.reason || '');
    if (it.status === 'reduce') return '建议减半';
    if (it.status === 'watching') return '等待回踩';
    if (it.status === 'expired') return '窗口内未回踩';
    if (it.status !== 'clear') return '';
    if (r.indexOf('移动止盈') >= 0) return '移动止盈';
    if (r.indexOf('止损') >= 0) return '止损';
    if (r.indexOf('止盈') >= 0) return '止盈';
    if (r.indexOf('到期') >= 0 || r.indexOf('超过最长持仓期') >= 0) return '到期';
    if (r.indexOf('MA5') >= 0) return '减半后破MA5';
    return '';
}

function renderExitRows(list, maxHold) {
    return list.map(it => {
        const detail = it.detail || {};
        const pnl = detail.current_pnl_pct;
        const pnlCls = pnl != null ? (pnl >= 0 ? 'positive' : 'negative') : '';
        const pnlStr = pnl != null ? `${pnl>=0?'+':''}${pnl}%` : '--';
        const sold = it.status === 'clear';
        const filled = sold || it.status === 'hold';      // 已建仓（含持仓中）
        const muted = '<span style="color:var(--text-muted)">--</span>';
        const entry = detail.entry_price != null ? detail.entry_price : it.entry_price;
        // 衍生口径只用 payload 已有数值换算（建仓价 / 止损价 / 最高价），不新造数字
        const pctOf = px => (Number(entry) > 0 && px != null)
            ? (Number(px) / Number(entry) - 1) * 100 : null;
        const mfe = pctOf(detail.highest_since_entry);
        // 止损价字段名两套口径：短线分支给 stop_loss，中长线分支给 stop_price
        const stopPx = detail.stop_loss != null ? detail.stop_loss : detail.stop_price;
        const risk = pctOf(stopPx);
        const ST_MAP = {
            clear:  ['已卖出', 'badge badge-info'],
            hold:   ['持有', 'badge badge-good'],
            watching: ['待回踩', 'badge badge-warn'],
            expired:  ['未成交', ''],
        };
        const _st = ST_MAP[it.status] || ST_MAP.hold;
        const tag = exitReasonTag(it);
        const statusHtml = (_st[1]
            ? `<span class="${_st[1]}">${_st[0]}</span>`
            : `<span style="color:var(--text-muted);font-weight:400">${_st[0]}</span>`)
            + (tag ? `<div class="exit-sub">${tag}</div>` : '');
        // 持仓天数：待回踩/未成交未建仓，无天数可读
        const holdHtml = (filled && detail.hold_days != null)
            ? `${detail.hold_days}${maxHold ? ' / ' + maxHold : ''}` : muted;
        // 市价列：已卖出=卖出价，持仓/未成交=最新收盘价
        const pxVal = sold && detail.exit_price != null ? detail.exit_price : detail.current_price;
        const pxWhen = sold ? (detail.exit_date || '') : (detail.current_date || '');
        const pxHtml = pxVal != null
            ? `${exitNum(pxVal)}<div class="exit-sub">${sold ? '卖出' : '现价'}${pxWhen ? ' ' + pxWhen : ''}</div>`
            : muted;
        // 止损距离：正常为负（还能跌多少）。若 >= 0 说明建仓价已低于止损价
        // （隔日跳空直接穿线，stop_fill_at_stop 只在止损<=成本时按止损价成交），
        // 这类单的风险敞口不是「还能跌多少」而是「开盘即已穿线」，必须标出来。
        const stopBrokenAtEntry = risk != null && risk >= 0;
        const stopHtml = risk != null
            ? `<span class="exit-risk ${(stopBrokenAtEntry || Math.abs(risk) > EXIT_STOP_WIDE_PCT) ? 'wide' : ''}"`
              + (stopBrokenAtEntry
                 ? ' title="止损价不低于建仓价：建仓当日已跳空穿止损，这笔的止损位实际在成本之上"' : '')
              + `>${risk >= 0 ? '+' : ''}${risk.toFixed(1)}%</span>`
              + `<div class="exit-sub">${exitNum(stopPx)}</div>` : muted;
        const mfeHtml = mfe != null
            ? `${mfe >= 0 ? '+' : ''}${mfe.toFixed(1)}%`
              + (pnl != null && mfe - pnl > 3
                 ? `<div class="exit-sub">回吐 ${(mfe - pnl).toFixed(1)}</div>` : '')
              : muted;
        // 连续推荐：推荐日显示最新一次，附最早推荐日提示
        const firstDate = detail.first_scan_date;
        // 展示层名额闸门：该推荐日「今日推荐」不会推给用户（cold 日短线归零 /
        // cool 日只留 2 只），但完整策略池的出场跟踪仍计入 —— 标出来避免
        // 「这票我昨天没见过」的误读（2026-10-14）
        const capTag = it.reco_shown === false
            ? `<div class="exit-sub exit-cap-tag" title="该推荐日大盘状态 ${it.market_regime || '未知'}，「今日推荐」按 RECO_REGIME_CAP 名额闸门不会推给你（cold→0 / cool→2）。这笔只计入策略池跟踪统计，不代表你当天有可执行标的。">未展示 · ${it.market_regime || '闸门'}</div>`
            : '';
        const scanHtml = (it.scan_date || '--')
            + (firstDate && firstDate !== it.scan_date
                ? `<div class="exit-sub">自 ${firstDate} 连续推荐</div>` : '')
            + capTag;
        const isPullback = (it.strategy || '') !== '隔日动量';
        const entryTip = isPullback
            ? `回踩买点 ${exitNum(entry) || '--'}：推荐日后若干交易日内价格触及才建仓，`
              + '一直不触及则视为未成交放弃（涨上去不追高）。止盈/止损同样以该买点为基准。'
            : `建仓价 ${exitNum(entry) || '--'}：推荐日后首个交易日开盘价。`;
        return `<tr>
            <td><span class="code-link" onclick="openKline('${it.code}')" title="点击查看 K 线">${it.name || it.code}</span>
                <div class="exit-sub">${it.code}${it.strategy ? ' · ' + it.strategy : ''}</div></td>
            <td class="exit-num" title="融合分（多因子加权）。短线名额要求不低于门控阈值，越接近阈值越是勉强入选">${it.fusion_score != null ? it.fusion_score : '--'}</td>
            <td>${scanHtml}</td>
            <td class="exit-num" title="${entryTip}">${filled || entry != null ? (exitNum(entry) || '--') : '--'}
                <div class="exit-sub">${detail.entry_date || (filled ? '' : '未建仓')}</div></td>
            <td class="exit-num">${pxHtml}</td>
            <td class="exit-num" title="已持仓交易日 / 该周期持仓上限">${holdHtml}</td>
            <td class="exit-num" title="止损价相对建仓价的距离。止损宽度按个股 ATR 自适应，波动大的票止损更宽、单笔潜在亏损也更大">${stopHtml}</td>
            <td class="exit-num" title="持仓期间最高浮盈（相对建仓价）。它与盈亏的差 = 回吐，用于区分「信号看错」与「出场没拿住」">${mfeHtml}</td>
            <td class="${pnlCls} exit-num">${pnlStr}</td>
            <td title="${(it.reason || '').replace(/"/g, '')}">${statusHtml}</td>
        </tr>`;
    }).join('');
}

// 策略规则命中（常驻规则今日筛出，独立于融合分信号）
async function loadRuleSignals() {
    const box = document.getElementById('ruleSignals');
    const dateEl = document.getElementById('ruleSigDate');
    if (!box) return;
    try {
        const resp = await RequestManager.fetch('ruleSignals', API + '/investor/rule_signals',
            {cacheTtl: RequestManager.CACHE_TTL});
        const data = (resp && resp.data) || {};
        const items = data.items || [];
        const total = data.total != null ? data.total : items.length;
        const excluded = data.excluded_rules || 0;
        if (dateEl) {
            let txt = data.date ? ('数据日期 ' + data.date + (total > items.length ? ('（命中 ' + total + '，显示前 ' + items.length + '）') : '')) : '';
            if (excluded > 0) txt += ' · 已隐藏 ' + excluded + ' 条命中过泛的规则（单日命中>' + (data.max_hits || 200) + '只）';
            dateEl.textContent = txt;
        }
        if (!items.length) {
            box.innerHTML = excluded > 0
                ? '<div class="empty-state">所有启用规则命中都过泛（单条规则命中超 ' + (data.max_hits || 200) + ' 只，无筛选价值），已全部隐藏<br><span style="color:var(--text-muted);font-size:var(--fs-2)">建议到「回测」收紧规则条件后重新保存</span></div>'
                : '<div class="empty-state">暂无规则命中<br><span style="color:var(--text-muted);font-size:var(--fs-2)">先在「回测」将策略存为常驻规则，同步时自动扫描</span></div>';
            return;
        }
        box.innerHTML = '<div class="rule-sig-list">' + items.map(it => {
            const price = it.latest_close != null ? Number(it.latest_close).toFixed(2) : '--';
            const hitsTip = it.rule_hits != null ? (' · 今日命中 ' + it.rule_hits + ' 只') : '';
            // 规则回测胜率是质量判断（R2）：数字中性，高低只进悬浮说明
            const wr = it.rule_win_rate;
            const wrHtml = wr != null
                ? `<span style="font-family:var(--font-mono)" title="该规则历史回测胜率（${it.rule_total_trades || 0} 笔交易）${wr < 50 ? ' · 低于50%，谨慎参考' : ''}">胜率 ${Number(wr).toFixed(1)}%</span>`
                : '<span style="color:var(--text-muted)">胜率 --</span>';
            return `<div class="rule-sig-row" onclick="openKline('${it.code}')">
                <div class="rule-sig-main">
                    <span class="rule-sig-code">${it.code}</span>
                    <span class="rule-sig-name">${it.name || '--'}</span>
                </div>
                <span class="rule-sig-rule" title="${(it.rule_name || '') + hitsTip}">${it.rule_name || ('#' + it.rule_id)}</span>
                <span class="rule-sig-price">¥${price}</span>
                <span class="rule-sig-conf">${wrHtml}</span>
            </div>`;
        }).join('') + '</div>';
    } catch(e) {
        box.innerHTML = panelError('loadRuleSignals');
    }
}

// 手动触发常驻规则全市场扫描（同步阻塞，全市场约数分钟）
async function scanRulesNow() {
    const btn = document.getElementById('ruleScanBtn');
    const box = document.getElementById('ruleSignals');
    const maxRules = parseInt(document.getElementById('ruleScanMaxRules').value, 10) || 50;
    const lookback = parseInt(document.getElementById('ruleScanLookback').value, 10) || 300;
    if (lookback <= 252) { showToast('回溯行数需大于 252', 'error'); return; }
    if (btn) { btn.disabled = true; btn.textContent = '扫描中…'; }
    if (box) box.innerHTML = '<div class="empty-state">全市场扫描中，预计需数分钟…</div>';
    try {
        const j = await RequestManager.fetch('scan-rules', API + '/sync/scan_rules', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ max_rules: maxRules, lookback_rows: lookback })
        });
        if (j && j.success) {
            const d = j.data || {};
            showToast('扫描完成：' + (d.rules || 0) + ' 条规则 / ' + (d.hits || 0) + ' 条命中，耗时 ' + (d.elapsed_s || 0) + 's', 'success');
            await loadRuleSignals();
        } else {
            showToast('扫描失败：' + ((j && j.error) || '未知错误'), 'error');
            await loadRuleSignals();
        }
    } catch(e) {
        showToast('扫描请求失败', 'error');
        await loadRuleSignals();
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '立即扫描'; }
    }
}

// 单只推荐卡片渲染（短/中/长三周期共用）
function renderPickCard(it) {
            const ap = it.action_plan || {};
            const es = it.entry_strategy || {};
            const pp = it.position_plan || {};
            const sg = it.signal || {};
            const entry = ap.entry_price ? ap.entry_price.toFixed(2) : '--';
            const stop   = ap.stop_loss   ? ap.stop_loss.toFixed(2)   : '--';
            const tp     = ap.take_profit ? ap.take_profit.toFixed(2) : '--';
            // 建议买入价 → 突破确认价 的价差（回放统计：价差≤1% 多为当日冲高/涨停的追高票，
            // 次日开盘买入胜率仅约 12%，详见 tools/analyze_confirm_gap.py）
            let gapHtml = '';
            if (ap.entry_price) {
                if (it.confirm_trigger) {
                    const gapPct = (it.confirm_trigger - ap.entry_price) / ap.entry_price * 100;
                    if (gapPct < 0) {
                        // 理论不发生：确认线低于买入价，不显示
                    } else if (gapPct <= 1) {
                        gapHtml = `<div class="price-sub confirm-danger" title="近两年6.6万条短线信号回放：价差≤1%时次日开盘买入胜率仅约12%，买入价接近推荐日以来最高点，追高风险大">⚠ 买入价已在阶段高位 · 价差 ${gapPct.toFixed(1)}%</div>`;
                    } else if (gapPct <= 5) {
                        gapHtml = `<div class="price-sub confirm-gap" title="突破确认价相对建议买入价的上浮幅度：价差越小说明买入价越接近阶段高点，追高风险越大">价差 ${gapPct.toFixed(1)}%</div>`;
                    } else {
                        gapHtml = `<div class="price-sub confirm-safe" title="回放统计：价差>5%的买入价远离推荐日以来高点（多为低吸票），次日开盘买入胜率约49%，追高风险小；但若为连续大涨后的高位票请结合K线判断">✅ 距阶段高点较远 · 价差 ${gapPct.toFixed(1)}%</div>`;
                    }
                } else {
                    gapHtml = `<div class="price-sub confirm-safe" title="该信号不适用突破确认（如隔日动量次日开盘入场），按建议买入价直接执行">✅ 无需突破确认 · 按建议价入场</div>`;

            const rr     = ap.risk_reward_ratio;

            const rrHtml = rr != null ? `<span class="rr-tag ${rrCls}">盈亏比 ${rr.toFixed(2)}</span>` : '';

// 复制当前选中日期展示的推荐，按 short/mid/long 分组，每只一行便于粘贴到备忘录/Excel
function copyTodayPicks() {
    const store = window._todayPicks;
    const btn = document.getElementById('btnCopyTodayPicks');
    if (!store || !store.groups) {
        showToast('暂无推荐数据，请先重算打分', 'error');
        return;
    }
    const lines = [];
    const dateStr = store.date ? '（' + store.date + '）' : '';
    let count = 0;
    HORIZON_GROUPS.forEach(g => {
        const list = store.groups[g.key] || [];
        if (!list.length) return;
        count += list.length;
        lines.push('【' + g.label + '】' + g.desc);
        lines.push(...buildPickGroupLines(list));
        lines.push('');
    });
    if (!count) {
        showToast('暂无推荐数据', 'error');
        return;
    }
    const text = '📋 今日推荐' + dateStr + '\n' + lines.join('\n').replace(/\n+$/, '');
    copyTextToClipboard(text, function(ok) {
        if (ok) {
            if (btn) { btn.textContent = '✓ 已复制'; setTimeout(function() { btn.textContent = '复制'; }, 2000); }
            showToast('已复制 ' + count + ' 只推荐（' + HORIZON_GROUPS.filter(g => (store.groups[g.key] || []).length).map(g => g.label).join('+') + '）', 'success');
        } else {
            showToast('复制失败，请手动复制', 'error');
        }
    });
}

// 通用剪贴板复制（navigator.clipboard 优先，老浏览器降级 execCommand）
function copyTextToClipboard(text, cb) {
    function fallback() {
        try {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            const ok = document.execCommand('copy');
            document.body.removeChild(ta);
            cb && cb(ok);
        } catch (e) {
            cb && cb(false);
        }
    }
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() { cb && cb(true); }, fallback);
    } else {
        fallback();
    }
}

// 渲染持仓出场诊断徽章（清仓/减仓/持有）
function renderPositionAdvice(advice) {
    if (!advice || !advice.status) return '';
    const map = {
        clear:  { badge: 'badge-bad',  label: '建议清仓' },
        reduce: { badge: 'badge-warn', label: '建议减仓' },
        hold:   { badge: 'badge-good', label: '持有' },
    };
    const m = map[advice.status] || map.hold;
    const reason = advice.reason ? ' · ' + advice.reason : '';
    // 生效止损价 + 来源。短线是「ATR 动态」：每天用最新交易日的 ATR14 重算，
    // 波动放大→止损放宽、收敛→收紧，所以止损价每天可能不同（不是 bug）。
    const det = advice.detail || {};
    let stopTxt = '';
    if (det.stop_price) {
        const pct = (det.stop_loss_pct != null) ? (det.stop_loss_pct * 100).toFixed(2) + '%' : '';
        const src = det.stop_mode === 'atr' ? 'ATR动态' : '固定';
        stopTxt = ` · 止损 ${Number(det.stop_price).toFixed(2)}（${src}${pct ? ' ' + pct : ''}）`;
    }
    return `<div style="padding:4px 10px;font-size:var(--fs-2);color:var(--text-secondary);border-left:2px solid var(--border);background:var(--bg-cell);margin-top:2px">诊断：<span class="badge ${m.badge}">${m.label}</span>${reason}${stopTxt}</div>`;
}

        </div>`;

        html += positions.map(p => {

            // 生效止损价：手填优先，否则 ATR 动态（每日重算）—— 让用户一眼看到当前止损位

// 空态引导：把今日短线推荐前 3 名加入自选（目标价取推荐止盈价）
async function addTopPicksToWatchlist() {
    try {
        const resp = await RequestManager.fetch('today-for-watch', API + '/investor/today');
        const groups = ((resp && resp.data) || {}).groups || {};
        const picks = (groups.short || []).slice(0, 3);
        if (!picks.length) { showToast('今日暂无推荐，先点「立即重算打分」', 'warning'); return; }
        let added = 0;
        for (const it of picks) {
            const ap = it.action_plan || {};
            try {
                await RequestManager.fetch('add-watch-' + it.code, API + '/investor/watchlist', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        code: it.code,
                        note: '来自今日推荐',
                        target_price: ap.take_profit || null,
                        alert_dir: 'above',
                    }),
                });
                added++;
            } catch(e) { /* 单只失败不阻断其余 */ }
        }
        showToast(added ? ('已加入 ' + added + ' 只自选，目标价默认为推荐止盈价') : '添加失败，请重试', added ? 'success' : 'error');
        if (added) await loadMyWatchlist();
    } catch(e) {
        showToast('获取今日推荐失败', 'error');
    }
}

// 推荐复盘统计区间（天）：与后端 recommend_outcome 回补窗口一致（自 2026-07-20 起有数据），
// 后端 days 上限 90，超窗部分自然为空
const REC_HISTORY_DAYS = 60;

async function loadRecHistory() {
    const summaryEl = document.getElementById('recHistorySummary');
    const tableEl = document.getElementById('recHistoryTable');
    const updEl = document.getElementById('recHistoryUpdatedAt');
    try {
        const resp = await RequestManager.fetch('rec-history',
            API + '/investor/recommendations/history?days=' + REC_HISTORY_DAYS,
            {cacheTtl: RequestManager.CACHE_TTL});
        const d = resp.data || {};
        const items = d.items || [];
        const summary = d.summary || {};
        if (updEl) updEl.textContent = '统计区间：近 ' + (d.days || REC_HISTORY_DAYS) + ' 天';

        if (!items || items.length === 0) {
            if (tableEl) tableEl.innerHTML = '<div class="empty-state">暂无历史推荐数据<br><span style="color:var(--text-muted);font-size:var(--fs-2)">先到首页点「立即重算打分」生成推荐</span></div>';
            return;
        }

        // 汇总卡片：T1/T2/T3/T5 总胜率 + 平均收益 + 原有收益统计
        if (summaryEl && summary.total) {
            const tStat = (k, label) => {
                const s = summary[k];
                if (!s || !s.n) return `<div class="metric-card secondary"><div class="val" style="color:var(--text-muted)">--</div><div class="lbl">${label} 胜率</div></div>`;
                // R2：胜率是质量判断，数字保持中性色，好坏只进徽标
                const badge = s.win_rate >= 50
                    ? '<span class="badge badge-good">达标</span>'
                    : '<span class="badge badge-warn">偏低</span>';
                const avg = s.avg_return;
                const avgHtml = avg != null
                    ? `<div style="font-size:var(--fs-1);margin-top:3px" class="${avg>=0?'idx-up':'idx-down'}">${label} 平均收益 ${avg>=0?'+':''}${avg}%</div>`
                    : '';
                return `<div class="metric-card secondary"><div class="val" style="color:var(--text-primary)">${s.win_rate}%</div><div class="lbl">${label} 胜率 <span style="opacity:.7">(${s.win}/${s.n})</span> ${badge}</div>${avgHtml}</div>`;
            };
            const avgCls = summary.avg_return >= 0 ? 'idx-up' : 'idx-down';
            const avgSign = summary.avg_return >= 0 ? '+' : '';
            const bestCls = summary.best_return >= 0 ? 'idx-up' : 'idx-down';
            const worstCls = summary.worst_return >= 0 ? 'idx-up' : 'idx-down';
            const pf = summary.profit_factor || 0;
            summaryEl.innerHTML = `
                <div class="metrics-row" style="margin-bottom:8px">
                    ${tStat('t1', 'T+1')}
                    ${tStat('t2', 'T+2')}
                    ${tStat('t3', 'T+3')}
                    ${tStat('t5', 'T+5')}
                </div>
                <div class="metrics-row" style="margin-bottom:12px">
                    <div class="metric-card secondary"><div class="val">${summary.total}</div><div class="lbl">连续推荐段数</div></div>
                    <div class="metric-card primary"><div class="val" style="color:var(--text-primary)">${summary.win_rate}%</div><div class="lbl">最终胜率 ${summary.win_rate>=50?'<span class="badge badge-good">达标</span>':'<span class="badge badge-warn">偏低</span>'}</div></div>
                    <div class="metric-card primary"><div class="val ${avgCls}">${avgSign}${summary.avg_return}%</div><div class="lbl">平均收益</div></div>
                    <div class="metric-card primary"><div class="val">${pf.toFixed(2)}</div><div class="lbl">盈亏比</div></div>
                    <div class="metric-card secondary"><div class="val ${bestCls}">+${summary.best_return}%</div><div class="lbl">最佳</div></div>
                    <div class="metric-card secondary"><div class="val ${worstCls}">${summary.worst_return}%</div><div class="lbl">最差</div></div>
                    <div class="metric-card secondary"><div class="val">${summary.stop_loss_count||0}</div><div class="lbl">触发止损 <span class="badge badge-bad">亏损离场</span></div></div>
                    <div class="metric-card secondary"><div class="val">${summary.take_profit_count||0}</div><div class="lbl">触发止盈 <span class="badge badge-good">盈利离场</span></div></div>
                </div>`;
        }

        // 明细表格（全量展示，滚动容器限高；连续推荐合并为一段，仅显示首次推荐日）
        if (tableEl) {
            let html = `<div style="font-size:var(--fs-2);color:var(--text-muted);margin-bottom:6px;">共 ${items.length} 段连续推荐（按首次推荐日降序，连续推荐仅记首次）</div>`;
            html += '<div class="table-wrapper" style="max-height:520px;overflow-y:auto;"><table><thead style="position:sticky;top:0;z-index:1;background:var(--bg-panel)"><tr>';
            html += '<th>代码</th><th>名称</th><th>首次推荐日</th><th>连续推荐</th><th>买入价</th><th>T+1</th><th>T+2</th><th>T+3</th><th>T+5</th><th>收益</th><th>状态</th>';
            html += '</tr></thead><tbody>';
            items.forEach(r => {
                const pnlCls = r.pnl_pct >= 0 ? 'positive' : 'negative';
                const sign = r.pnl_pct >= 0 ? '+' : '';
                let status = '持有中';
                if (r.hit_stop_loss) status = '<span class="badge badge-bad">已止损</span>';
                else if (r.exit_reason === 'trailing_stop') status = '<span class="badge badge-good">移止离场</span>';
                else if (r.hit_take_profit) status = '<span class="badge badge-good">已止盈</span>';
                else if (r.exit_reason === 'max_hold_days') status = '<span style="color:var(--text-muted)">到期出场</span>';
                const fmtRet = (v) => v != null ? `<span class="${v>=0?'positive':'negative'}">${v>=0?'+':''}${v}%</span>` : '--';
                const firstDate = r.first_scan_date || r.scan_date || '';
                const streak = r.streak_days ? `连续 ${r.streak_days} 天` : '--';
                const streakTip = r.last_scan_date ? `推荐至 ${r.last_scan_date}` : '';
                html += `<tr>
                    <td><span class="code-link" onclick="openKline('${r.code}')">${r.code}</span></td>
                    <td>${r.name||''}</td>
                    <td>${firstDate}</td>
                    <td title="${streakTip}">${streak}</td>
                    <td>${r.entry_price||'--'}</td>
                    <td>${fmtRet(r.t1_return)}</td>
                    <td>${fmtRet(r.t2_return)}</td>
                    <td>${fmtRet(r.t3_return)}</td>
                    <td>${fmtRet(r.t5_return)}</td>
                    <td class="${pnlCls}">${sign}${r.pnl_pct}%</td>
                    <td>${status}</td>
                </tr>`;
            });
            html += '</tbody></table></div>';
            tableEl.innerHTML = html;
        }
    } catch(e) {
        if (tableEl) tableEl.innerHTML = panelError('loadRecHistory');
    }
}

            html += `<div class="metrics-row" style="margin-bottom:12px">
                <div class="metric-card secondary"><div class="val">${s.total}</div><div class="lbl">近30天短线推荐</div></div>
                <div class="metric-card primary"><div class="val" style="color:var(--text-primary)">${s.win_rate}%</div><div class="lbl">胜率 ${s.win_rate>=50?'<span class="badge badge-good">达标</span>':'<span class="badge badge-warn">偏低</span>'}</div></div>
                <div class="metric-card primary"><div class="val ${s.avg_return>=0?'idx-up':'idx-down'}">${s.avg_return>=0?'+':''}${s.avg_return}%</div><div class="lbl">平均收益</div></div>
                <div class="metric-card secondary"><div class="val">${s.profit_factor}</div><div class="lbl">盈亏比</div></div>
                <div class="metric-card secondary"><div class="val">${s.stop_hit}</div><div class="lbl">触发止损 <span class="badge badge-bad">亏损离场</span></div></div>
            </div>`;
        }
        // ② 诊断结论
        const findings = (diag && diag.findings) || [];
        if (findings.length) {
            html += '<div style="margin-bottom:12px">' + findings.map(f =>
                `<div style="padding:8px 12px;margin-bottom:6px;background:rgba(255,171,64,0.06);border-left:3px solid var(--warning);border-radius:4px;font-size:var(--fs-3)">${f}</div>`
            ).join('') + '</div>';
        }
        // ③ 待采纳建议（含回放前后对比）
        if (suggestions.length) {
            html += '<div style="margin-bottom:8px;font-weight:600;color:var(--accent)">待采纳参数建议</div>';
            suggestions.forEach(sg => {
                const m = sg.metrics || {};
                const b = (m.baseline || {}).all || {};
                const c = (m.candidate || {}).all || {};
                const cmp = (b.oc_win != null && c.oc_win != null)
                    ? `<span class="text-muted" style="font-size:var(--fs-2);margin-left:8px">OC胜率 ${b.oc_win}%→${c.oc_win}% · CC胜率 ${b.cc_win}%→${c.cc_win}%</span>` : '';
                html += `<div style="padding:12px;margin-bottom:8px;background:rgba(var(--accent-rgb),0.05);border:1px solid var(--border);border-radius:6px">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                        <div><b>${optimizerParamLabel(sg.param_key)}</b>：
                            <span style="font-family:var(--font-mono)">${sg.current_value} → <span style="color:var(--accent)">${sg.suggest_value}</span></span>${cmp}
                        </div>
                        <div>
                            <button class="btn btn-primary btn-sm" onclick="applyOptSuggestion(${sg.id})">采纳</button>
                            <button class="btn btn-sm" onclick="dismissOptSuggestion(${sg.id})">忽略</button>
                        </div>
                    </div>
                    <div class="text-muted" style="font-size:var(--fs-2);margin-top:6px">${sg.reason || ''}</div>
                </div>`;
            });
        } else {
            html += '<div class="text-muted" style="font-size:var(--fs-2);margin-bottom:8px">暂无待采纳建议（每周五盘后自动寻优，或点右上「立即寻优」）</div>';
        }
        // ④ 当前生效的参数覆盖 + 一键回滚
        const overridden = Object.keys(params).filter(k => params[k].overridden);
        if (overridden.length) {
            html += '<div style="margin:8px 0;font-weight:600">当前生效的参数覆盖</div>';
            overridden.forEach(k => {
                const p = params[k];
                html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 12px;margin-bottom:4px;border:1px solid var(--border);border-radius:4px;font-size:var(--fs-3)">
                    <span>${p.label}：<span style="font-family:var(--font-mono);color:var(--accent)">${p.current}</span> <span class="text-muted">(默认 ${p.default})</span></span>
                    <button class="btn btn-sm" onclick="rollbackOptParam('${k}')">回滚</button>
                </div>`;
            });
        }
        // ⑤ 调参历史（折叠，最近5条）
        if (history.length) {
            html += '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:var(--fs-2);color:var(--text-muted)">调参历史（最近 ' + Math.min(history.length, 5) + ' 条）</summary>';
            history.slice(0, 5).forEach(h => {
                const act = h.action === 'apply' ? '采纳' : '回滚';
                html += `<div class="text-muted" style="font-size:var(--fs-2);padding:4px 12px">${h.created_at} · ${optimizerParamLabel(h.param_key)} ${h.old_value != null ? h.old_value : '默认'} → ${h.new_value}（${act}）</div>`;
            });
            html += '</details>';
        }
        box.innerHTML = html || '<div class="empty-state">暂无优化数据</div>';
    } catch(e) {
        box.innerHTML = panelError('loadOptimizerPanel');
    }
}

async function runOptimizerNow() {
    try {
        const r = await RequestManager.fetch('opt-run', API + '/optimizer/run', {method: 'POST'});
        showToast('优化任务已启动，约需十几秒…', 'info');
        const tid = (r.data || {}).task_id;
        if (!tid) return;
        // 旧实现轮询失败即终止；登记 timerManager 后切页也能正确清理（原来会泄漏）
        timerManager.poll('optTaskPoll', async () => {
            try {
                const st = await RequestManager.fetch(
                    'opt-task-' + tid, API + '/optimizer/task/' + tid);
                const t = st.data || {};
                if (t.status === 'success') {
                    timerManager.clear('optTaskPoll');
                    showToast('寻优完成：' + (t.result || ''), 'success', 6000);
                    loadOptimizerPanel();
                } else if (t.status === 'error') {
                    timerManager.clear('optTaskPoll');
                    showToast('寻优失败：' + (t.message || ''), 'error');
                }
            } catch(e) { timerManager.clear('optTaskPoll'); }
        }, 3000);
    } catch(e) { showToast(e.message, 'error'); }
}

async function submitSellPosition(pid, totalShares, isClose) {
    const priceEl = document.getElementById('sellPrice');
    const sharesEl = document.getElementById('sellShares');
    const price = parseFloat(priceEl ? priceEl.value : 0);
    const shares = isClose ? totalShares : (parseInt(sharesEl ? sharesEl.value : 0) || 0);
    if (!price || price <= 0) { showToast('请输入卖出价格', 'warning'); return; }
    if (!isClose && (!shares || shares <= 0)) { showToast('请输入减仓股数', 'warning'); return; }
    if (!isClose && shares > totalShares) { showToast('减仓股数不能超过当前持仓 ' + totalShares + ' 股', 'warning'); return; }
    try {
        const resp = await RequestManager.fetch('sell-pos-' + pid, API + '/investor/positions/' + pid + '/reduce', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ shares: shares, price: price }),
        });
        if (resp.success) {
            const d = resp.data || {};
            const label = d.action === 'close' ? '已平仓' : '已减仓 ' + d.sold_shares + ' 股';
            showToast(label + ' · 已实现盈亏 ' + fmtSignedPct(d.pnl_pct) + '（' + (d.pnl >= 0 ? '+' : '') + d.pnl + ' 元）', 'success');
            closeModal();
            loadMyPositions();
            loadPositionHistory();
            loadAlertsBanner();
        } else {
            showToast(resp.error || '操作失败', 'error');
        }
    } catch(e) { showToast('网络错误', 'error'); }
}

function fmtSignedPct(v) {
    v = Number(v) || 0;
    return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

async function loadPositionHistory() {
    const box = document.getElementById('positionHistory');
    try {
        const resp = await RequestManager.fetch('pos-history', API + '/investor/positions/history');
        const d = resp.data || {};
        const trades = d.trades || [];
        const s = d.summary || {};

        if (trades.length === 0) {
            box.innerHTML = '<div class="empty-state">还没有卖出记录<br><span style="color:var(--text-muted);font-size:var(--fs-2)">减仓或平仓后，这里会按卖出价与成本价统计你的历史收益率</span></div>';
            return;
        }

        const pnlCls = (s.total_pnl || 0) >= 0 ? 'idx-up' : 'idx-down';
        const sign = (s.total_pnl || 0) >= 0 ? '+' : '';

        let html = `<div class="position-summary">
            <div class="ps-cell"><div class="ps-lbl">已实现盈亏</div><div class="ps-val ${pnlCls}">${sign}¥${(s.total_pnl || 0).toLocaleString()}</div></div>
            <div class="ps-cell"><div class="ps-lbl">卖出笔数</div><div class="ps-val">${s.trade_count || 0}</div></div>
            <div class="ps-cell"><div class="ps-lbl">胜率</div><div class="ps-val">${s.win_rate || 0}%</div></div>
            <div class="ps-cell"><div class="ps-lbl">平均收益率</div><div class="ps-val ${(s.avg_pnl_pct || 0) >= 0 ? 'idx-up' : 'idx-down'}">${fmtSignedPct(s.avg_pnl_pct)}</div></div>
            <div class="ps-cell"><div class="ps-lbl">最好 / 最差</div><div class="ps-val" style="font-size:var(--fs-3)"><span class="idx-up">${fmtSignedPct(s.best_pnl_pct)}</span> / <span class="idx-down">${fmtSignedPct(s.worst_pnl_pct)}</span></div></div>
        </div>`;

        html += `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:var(--fs-2)">
            <thead><tr style="color:var(--text-muted);text-align:left;border-bottom:1px solid var(--border)">
                <th style="padding:6px 8px">时间</th>
                <th style="padding:6px 8px">股票</th>
                <th style="padding:6px 8px">操作</th>
                <th style="padding:6px 8px;text-align:right">股数</th>
                <th style="padding:6px 8px;text-align:right">成本价</th>
                <th style="padding:6px 8px;text-align:right">卖出价</th>
                <th style="padding:6px 8px;text-align:right">已实现盈亏</th>
                <th style="padding:6px 8px;text-align:right">收益率</th>
            </tr></thead><tbody>`;

        html += trades.map(t => {
            const isWin = (t.pnl || 0) >= 0;
            const cls = isWin ? 'idx-up' : 'idx-down';
            const sg = isWin ? '+' : '';
            const actLabel = t.action === 'close' ? '<span style="color:var(--danger)">平仓</span>' : '<span style="color:var(--warning)">减仓</span>';
            return `<tr style="border-bottom:1px solid rgba(var(--border-rgb),0.3)">
                <td style="padding:6px 8px;color:var(--text-muted);white-space:nowrap">${(t.traded_at || '').slice(0, 16)}</td>
                <td style="padding:6px 8px">${t.name || t.code} <span style="color:var(--text-muted)">${t.code}</span></td>
                <td style="padding:6px 8px">${actLabel}</td>
                <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono)">${t.shares}</td>
                <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono)">${(t.cost_price || 0).toFixed(2)}</td>
                <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono)">${(t.price || 0).toFixed(2)}</td>
                <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono)" class="${cls}">${sg}¥${(t.pnl || 0).toLocaleString()}</td>
                <td style="padding:6px 8px;text-align:right;font-family:var(--font-mono)" class="${cls}">${fmtSignedPct(t.pnl_pct)}</td>
            </tr>`;
        }).join('');

        html += '</tbody></table></div>';
        box.innerHTML = html;
    } catch(e) {
        if (box) box.innerHTML = '<div class="panel-error">历史收益加载失败 <button class="btn btn-sm" onclick="loadPositionHistory()">重试</button></div>';
    }
}

async function submitAddWatch() {
    const code = document.getElementById('addWatchCode').value.trim();
    const note = document.getElementById('addWatchNote').value.trim();
    const targetRaw = document.getElementById('addWatchTarget').value.trim();
    const target_price = targetRaw ? parseFloat(targetRaw) : null;
    const alert_dir = document.getElementById('addWatchDir').value || 'above';
    if (!code) { showToast('请填写代码', 'warning'); return; }
    try {
        const resp = await RequestManager.fetch('add-watch', API + '/investor/watchlist', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code, note, target_price, alert_dir}),
        });
        const data = (resp && resp.data) || {};
        if (data.sync_status === 'syncing') {
            showToast(`已加入自选，历史数据补拉中…`, 'success');
        } else if (data.sync_status === 'already_has_data') {
            showToast('已加入自选', 'success');
        } else if (data.sync_status === 'queued') {
            showToast('已加入自选（其它任务进行中，将稍后拉取）', 'info');
        } else {
            showToast('已加入自选', 'success');
        }
        closeModal();
        loadMyWatchlist();
        // 3.5 秒后自动刷新一次（让用户看到"刚补拉的数据已可见"）
        setTimeout(loadMyWatchlist, 3500);
    } catch(e) { showToast('操作失败：' + (e.message||e), 'error'); }
}

async function maybeAutoSync() {
    try {

// 检查今日推荐是否最新（基于 today 接口返回的 date），不是最近交易日就触发增量重算
async function ensureTodayRecs(silent) {
    try {
        const resp = await RequestManager.fetch('today-reco', API + '/investor/today?limit=1');
        const lastDate = resp && resp.data && resp.data.date;
        const latestTrade = resp && resp.data && resp.data.latest_trade_date;
        // 推荐已是最近交易日则无需重算（盘前/非交易日打开页面不误触发全量重算）
        if (lastDate && latestTrade && lastDate === latestTrade) return;
        if (silent) showToast('同步行情完成，开始增量重算今日打分…', 'info', 3500);
        // 触发增量重算（异步，只重写最新交易日信号，秒级~分钟级）
        const r = await RequestManager.fetch('recalc-inc-start-auto', API + '/sync/recalc_incremental', { method: 'POST' });
        const tid = r && r.data && r.data.task_id;
        if (!tid) {
            // 409（策略分未重算/任务互斥等）：给出可读提示，避免无限重试
            const msg = (r && r.message) || '自动重算启动失败，请手动点击"立即重算打分"';
            showToast(msg, 'warning', 4000);
            return;
        }
        pollRecalcTask(tid, function(ok, msg) {
            showToast(ok ? ('今日推荐已更新 · ' + (msg || '')) : ('重算失败: ' + (msg || '')), ok ? 'success' : 'error');
            // 重算完后，如果用户在首页就刷新一下数据
            if (typeof currentTab !== 'undefined' && currentTab === 'home') {
                const c = document.getElementById('content');
                if (c) loadHomeTab(c);
            }
        });
    } catch (e) {
        console.warn('[ensureTodayRecs] 失败:', e);
    }
}

function showSyncProgress() {
    document.getElementById('syncProgress').style.display = 'block';
}

function hideSyncProgress() {
    timerManager.clear('syncPoll');
    timerManager.setTimeout('syncHide', function() {
        document.getElementById('syncProgress').style.display = 'none';
    }, 5000);
}

function pollSyncProgress(onDone) {
    timerManager.poll('syncPoll', function() {
        return RequestManager.fetch('sync-progress', API + '/sync/progress').then(function(resp) {
            var p = resp.data;
            var pct = p.total > 0 ? Math.round(p.current / p.total * 100) : 0;
            document.getElementById('syncProgressFill').style.width = pct + '%';
            document.getElementById('syncProgressPct').textContent = pct + '%';
            document.getElementById('syncProgressText').textContent =
                '同步中: ' + p.current + '/' + p.total + '  成功:' + p.success + '  失败:' + p.failed;
            // 首页内联进度条同步更新（不在首页时 setInlineProgress 内部自动跳过）
            if (p.running) {
                setInlineProgress('sync', p.current, p.total,
                    p.total > 0 ? (p.current + '/' + p.total + ' 成功:' + p.success + ' 失败:' + p.failed) : '启动中...');
            }
            if (!p.running) {
                hideSyncProgress();
                showToast(p.message || '同步完成', p.last_error ? 'warning' : 'success');
                if (onDone) onDone(p.message || '同步完成');
            }
        }).catch(function(e) { hideSyncProgress(); if (onDone) onDone(''); });
    }, 1000);
}

// ─── 首页"数据状态"面板 ─────────────────────────────────
async function loadSyncStatusPanel() {
    const syncState = document.getElementById('syncDataState');
    const syncTime  = document.getElementById('syncDataTime');
    const calcState = document.getElementById('recalcState');
    const calcTime  = document.getElementById('recalcTime');
    const hint      = document.getElementById('dataStatusHint');
    if (!syncState || !calcState) return;

    const today = new Date().toISOString().slice(0, 10);

    // ① 行情数据状态：/api/sync/auto-status
    try {
        // POST /sync 成功后 RequestManager 自动清缓存，同步完再看必为新状态
        const r = await RequestManager.fetch('sync-auto-status', API + '/sync/auto-status',
            {cacheTtl: RequestManager.CACHE_TTL});
        const d = r.data || {};
        if (d.running) {
            syncState.className = 'state run';
            syncState.innerHTML = '<span class="badge badge-running">同步中</span>';
        } else if (!d.last_time) {
            syncState.className = 'state warn';
            syncState.innerHTML = '⚠ 今日尚未同步';
        } else {
            const lastDate = String(d.last_time).split(' ')[0];
            if (lastDate === today) {
                syncState.className = 'state ok';
                syncState.innerHTML = '✓ 今日已同步';
            } else {
                syncState.className = 'state warn';
                syncState.innerHTML = '⚠ 上次同步是 ' + lastDate;
            }
        }
        syncTime.textContent = d.last_time ? '上次同步: ' + d.last_time : '从未同步';
        if (hint && d.running) hint.textContent = '后台正在同步…';
    } catch (e) {
        syncState.className = 'state bad';
        syncState.innerHTML = '✗ 状态读取失败';
        syncTime.textContent = e.message || '';
    }

    // ② 推荐打分状态：/api/investor/today 返回的 date 字段就是 stock_signal 的最新 scan_date
    try {
        const r = await RequestManager.fetch('today-reco-status', API + '/investor/today?limit=1');
        const d = r.data || {};
        const lastDate = d.date;
        if (!lastDate) {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 暂无打分记录';
            calcTime.textContent = '请到"高级筛选"跑一次打分';
        } else if (lastDate === today) {
            calcState.className = 'state ok';
            calcState.innerHTML = '✓ 今日推荐已更新';
        } else {
            calcState.className = 'state warn';
            calcState.innerHTML = '⚠ 推荐基于 ' + lastDate + ' 数据';
        }
        calcTime.textContent = '最新打分日期: ' + (lastDate || '—');
    } catch (e) {
        calcState.className = 'state bad';
        calcState.innerHTML = '✗ 状态读取失败';
        calcTime.textContent = e.message || '';
    }

    // ③ 顺手提示：是否有正在跑的同步/重算任务
    const ip = document.getElementById('homeInlineProgress');
    if (ip && !ip.textContent) ip.textContent = '';
}

// 底部内联进度条（左文 + 中条 + 右百分比）
function setInlineProgress(stage, current, total, message) {
    const ip = document.getElementById('homeInlineProgress');
    if (!ip) return;
    if (!stage) {
        ip.innerHTML = '';
        return;
    }
    let pct = 0;
    if (typeof current === 'number' && typeof total === 'number' && total > 0) {
        pct = Math.min(100, Math.round(current / total * 100));
    } else if (stage === 'sync-finish' || stage === 'recalc-finish') {
        pct = 100;
    }
    const label = ({
        'sync':         '同步行情',
        'recalc':       '重算打分',
        'sync-finish':  '✓ 行情同步完成',
        'recalc-finish':'✓ 打分重算完成',
    })[stage] || stage;
    ip.innerHTML =
        '<span>' + label + '</span>' +
        '<span class="bar"><div style="width:' + pct + '%"></div></span>' +
        '<span style="font-family:var(--font-mono);min-width:42px;text-align:right;">' + pct + '%</span>' +
        (message ? ' <span style="color:var(--text-muted)">· ' + message + '</span>' : '');
}

// 轮询重算任务（task_queue 提交的任务）
function pollRecalcTask(taskId, onDone) {
    if (!taskId) { onDone && onDone(false, 'task_id 缺失'); return; }
    timerManager.poll('recalcPoll', function() {
        return RequestManager.fetch('recalc-status-' + taskId, API + '/sync/status/' + taskId)
            .then(function(resp) {
                const t = resp.data || {};
                setInlineProgress('recalc', t.progress || 0, 100, t.message || '');
                if (t.status === 'success') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(true, t.message || t.result || '');
                } else if (t.status === 'error') {
                    timerManager.clear('recalcPoll');
                    onDone && onDone(false, t.message || '重算失败');
                }
                // pending / running 继续轮询
            })
            .catch(function(e) {
                timerManager.clear('recalcPoll');
                onDone && onDone(false, e.message || '轮询失败');
            });
    }, 1500);
}

// ─── K-line overlay ───
var _klinePalette = null;
function resolveKlinePalette() {
    _klinePalette = {
        up: cssVar('--chart-up', '#EF5350'),
        down: cssVar('--chart-down', '#26A69A'),
        limitUp: cssVar('--limit-up', '#AB47BC'),
        limitDown: cssVar('--limit-down', '#42A5F5')
    };
}
function klineColor(d) {
    if (!_klinePalette) resolveKlinePalette();
    if (!d) return _klinePalette.up;
    if (d.limitType === 'limit_up') return _klinePalette.limitUp;
    if (d.limitType === 'limit_down') return _klinePalette.limitDown;
    return d.close >= d.open ? _klinePalette.up : _klinePalette.down;

// ─── 技术指标计算工具函数 ───

/**
 * 计算 EMA（指数移动平均线）
 * @param {number[]} data - 收盘价序列
 * @param {number} period - 周期
 * @returns {number[]} EMA 序列
 */
function calcEMA(data, period) {
    var k = 2 / (period + 1);
    var ema = [data[0]];
    for (var i = 1; i < data.length; i++) {
        ema.push(data[i] * k + ema[i - 1] * (1 - k));
    }
    return ema;
}

/**
 * 计算 MACD 指标
 * 返回 { dif, dea, macd } 三个数组，长度与 kdata 一致
 */
function calcMACD(kdata, shortPeriod, longPeriod, signalPeriod) {
    shortPeriod = shortPeriod || 12;
    longPeriod = longPeriod || 26;
    signalPeriod = signalPeriod || 9;
    var closes = kdata.map(function(d) { return d.close; });
    var emaShort = calcEMA(closes, shortPeriod);
    var emaLong = calcEMA(closes, longPeriod);
    var dif = emaShort.map(function(v, i) { return v - emaLong[i]; });
    var dea = calcEMA(dif, signalPeriod);
    // MACD柱 = (DIF - DEA) * 2，用于柱状图显示
    var macd = dif.map(function(v, i) { return (v - dea[i]) * 2; });
    return { dif: dif, dea: dea, macd: macd };
}

/**
 * 计算 KDJ 指标
 * 返回 { k, d, j } 三个数组
 */
function calcKDJ(kdata, n, m1, m2) {
    n = n || 9;
    m1 = m1 || 3;
    m2 = m2 || 3;
    var kArr = [], dArr = [], jArr = [];
    var prevK = 50, prevD = 50; // 初始值

    for (var i = 0; i < kdata.length; i++) {
        // 取最近 n 天的最高价和最低价
        var start = Math.max(0, i - n + 1);
        var highMax = -Infinity, lowMin = Infinity;
        for (var j = start; j <= i; j++) {
            if (kdata[j].high > highMax) highMax = kdata[j].high;
            if (kdata[j].low < lowMin) lowMin = kdata[j].low;
        }
        var rsv = highMax === lowMin ? 50 : ((kdata[i].close - lowMin) / (highMax - lowMin)) * 100;
        // K = 前K * (m1-1)/m1 + RSV/m1
        var curK = prevK * (m1 - 1) / m1 + rsv / m1;
        // D = 前D * (m2-1)/m2 + K/m2
        var curD = prevD * (m2 - 1) / m2 + curK / m2;
        // J = 3K - 2D
        var curJ = 3 * curK - 2 * curD;
        kArr.push(curK);
        dArr.push(curD);
        jArr.push(curJ);
        prevK = curK;
        prevD = curD;
    }
    return { k: kArr, d: dArr, j: jArr };
}

// 当前激活的副图指标（可多选）
var klineIndicators = { vol: true, macd: false, kdj: false };

/**
 * 根据当前激活的指标，动态构建 ECharts 配置
 */
function buildKlineOption(kdata, dates, ohlc, volData, marks, indicatorState, trackMarks) {
    var C = {
        // fallback 为纯回退值（CSS 变量缺失时才生效）
        axis: cssVar('--chart-axis', '#6B7A9A'),
        grid: cssVar('--chart-grid', '#182240'),
        split: cssVar('--chart-split', '#111832'),
        panel: cssVar('--chart-panel', '#0C1124'),
        title: cssVar('--chart-title', '#DDE4F0'),
        muted: cssVar('--chart-muted', '#9CA3C4'),
        up: cssVar('--chart-up', '#EF5350'),
        down: cssVar('--chart-down', '#26A69A'),
        l1: cssVar('--chart-line-1', '#00D4F0'),
        l2: cssVar('--chart-line-2', '#F5A623'),
        l3: cssVar('--chart-line-3', '#AB47BC'),
        accentRgb: cssVar('--accent-rgb', '0,212,240')
    };
    var ind = indicatorState || klineIndicators;
    // 决定需要哪些副图 grid
    var subCharts = [];
    if (ind.vol) subCharts.push('vol');
    if (ind.macd) subCharts.push('macd');
    if (ind.kdj) subCharts.push('kdj');
    // 至少保留成交量
    if (subCharts.length === 0) { subCharts.push('vol'); ind.vol = true; }

    var subCount = subCharts.length;
    // 主图占固定 55% 高度，剩余空间平分给副图
    var mainHeight = '55%';
    // 副图从 60% 开始，底部预留 6% 给 dataZoom 滑块，避免最后一个副图被挡住
    var gap = 2; // 副图之间间距百分比
    var availableSubPct = 34; // 副图可用百分比空间（60%~94%）
    var eachSubHeight = Math.floor((availableSubPct - gap * (subCount - 1)) / subCount);

    // 构建 grid 数组
    var grids = [{ left: '10%', right: '10%', top: 50, height: mainHeight }];
    // 日期标签只显示 MM-DD、不旋转，压缩主图与副图之间的空白带
    var xAxisArr = [{ type: 'category', data: dates, gridIndex: 0, axisLabel: { color: C.axis, fontSize: 10, formatter: function(v) { return String(v).slice(5); } }, axisLine: { lineStyle: { color: C.grid } } }];
    var yAxisArr = [{ id: 'price', scale: true, gridIndex: 0, axisLabel: { color: C.axis }, splitLine: { lineStyle: { color: C.split } } }];
    var seriesArr = [
        { id: 'kline', type: 'candlestick', data: ohlc, xAxisIndex: 0, yAxisIndex: 0, barWidth: '75%', barMaxWidth: 26 }
    ];

    // 动态计算每个副图的 top 位置
    // 主图底部约在 55% + 50px，从约 60% 开始放置副图
    var subStartTop = 60;
    for (var i = 0; i < subCharts.length; i++) {
        var topVal = (subStartTop + i * (eachSubHeight + gap)) + '%';
        var gridIdx = i + 1;
        grids.push({ left: '10%', right: '10%', top: topVal, height: eachSubHeight + '%' });
        xAxisArr.push({ type: 'category', data: dates, gridIndex: gridIdx, axisLabel: { show: false }, axisLine: { lineStyle: { color: C.grid } } });
        yAxisArr.push({ scale: true, gridIndex: gridIdx, axisLabel: { color: C.axis, fontSize: 10 }, splitLine: { show: false }, splitNumber: 2 });

        var chartType = subCharts[i];
        if (chartType === 'vol') {
            seriesArr.push({ type: 'bar', name: '成交量', data: volData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '75%' });
        } else if (chartType === 'macd') {
            // 读取 K 线弹窗自身的 MACD 参数输入框
            var mp = getKlineMacdParams();
            var macdData = calcMACD(kdata, mp.fast, mp.slow, mp.signal);
            // 参数标签，显示在系列名上，让用户知道当前用的是哪个参数
            var paramLabel = '(' + mp.fast + ',' + mp.slow + ',' + mp.signal + ')';
            // MACD 柱状图（正值红色，负值绿色）
            var macdBarData = macdData.macd.map(function(v) {
                return { value: v, itemStyle: { color: v >= 0 ? C.up : C.down } };
            });
            seriesArr.push(
                { type: 'bar', name: 'MACD' + paramLabel, data: macdBarData, xAxisIndex: gridIdx, yAxisIndex: gridIdx, barWidth: '75%' },
                { type: 'line', name: 'DIF' + paramLabel, data: macdData.dif, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: C.l1 } },
                { type: 'line', name: 'DEA' + paramLabel, data: macdData.dea, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: C.l2 } }
            );
        } else if (chartType === 'kdj') {
            var kdjData = calcKDJ(kdata);
            seriesArr.push(
                { type: 'line', name: 'K', data: kdjData.k, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: C.l1 } },
                { type: 'line', name: 'D', data: kdjData.d, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: C.l2 } },
                { type: 'line', name: 'J', data: kdjData.j, xAxisIndex: gridIdx, yAxisIndex: gridIdx, smooth: true, symbol: 'none', lineStyle: { width: 1, color: C.l3 } }
            );
        }
    }

    // dataZoom 联动所有 xAxis
    var allXAxisIndexes = [];
    for (var x = 0; x <= subCount; x++) allXAxisIndexes.push(x);

    // 买卖点按日期索引，供下方 tooltip 使用。axis 触发时悬停绘图区任意位置都会出
    // 当日 OHLC，把标记信息并进去即可；若改用 series 级 item 触发，会和 axis 抢显示。
    var markByDate = {};
    (marks || []).forEach(function(m) { if (m && m.date) markByDate[m.date] = m; });
    var trackByDate = {};
    (trackMarks || []).forEach(function(e) {
        if (!e || !e.date) return;
        (trackByDate[e.date] = trackByDate[e.date] || []).push(e);
    });
    var _mkPx = function(v) { return (v == null || isNaN(v)) ? '--' : Number(v).toFixed(2); };

    var opt = {
        title: { text: '', left: 'center', textStyle: { color: C.title, fontSize: 14, fontFamily: "'JetBrains Mono', monospace" } },
        tooltip: {
            trigger: 'axis',
            axisPointer: { type: 'cross' },
            // 默认 0.4s 位移动画 + 内容变高时翻到光标另一侧，是移动时“闪一下”的根源：
            // 经过 B/S 蜡烛时 tooltip 多出几行计划价/判因，高度变化导致翻转闪烁。动画关掉、
            // 位置固定偏移并夹在图内，tooltip 永不盖住光标。
            transitionDuration: 0,
            extraCssText: 'pointer-events:none;',
            position: function(point, params, dom, rect, size) {
                var gap = 14, pad = 4;
                var w = size.contentSize[0], h = size.contentSize[1];
                var viewW = size.viewSize[0], viewH = size.viewSize[1];
                var x = point[0] + gap;
                if (x + w > viewW - pad) x = point[0] - w - gap;   // 右侧放不下放左侧
                if (x < pad) x = pad;
                var y = point[1] - h - gap;                        // 默认悬在光标上方
                if (y < pad) y = point[1] + gap;                   // 顶部放不下改下方
                if (y + h > viewH - pad) y = viewH - h - pad;
                return [x, y];
            },
            formatter: function(params) {
                var idx = params[0]?.dataIndex;
                if (idx == null) return '';
                var d = kdata[idx];
                var chgColor = d.chgPct >= 0 ? C.up : C.down;
                var limitLabel = d.limitType === 'limit_up' ? ' [涨停]' : d.limitType === 'limit_down' ? ' [跌停]' : '';
                var html = '<b>' + d.date + '</b>' + limitLabel + '<br/>' +
                    '开: ' + d.open.toFixed(2) + ' &nbsp; 高: ' + d.high.toFixed(2) + '<br/>' +
                    '收: ' + d.close.toFixed(2) + ' &nbsp; 低: ' + d.low.toFixed(2) + '<br/>' +
                    '涨跌幅: <span style="color:' + chgColor + ';font-weight:bold">' + (d.chgPct >= 0 ? '+' : '') + d.chgPct.toFixed(2) + '%</span><br/>' +
                    '成交量: ' + (d.vol / 10000).toFixed(0) + '万';
                // 追加指标数据到 tooltip（seriesName 可能带参数后缀，用 indexOf 匹配）
                params.forEach(function(p) {
                    var sn = p.seriesName || '';
                    if (sn.indexOf('DIF') === 0) html += '<br/><span style="color:' + C.l1 + '">DIF</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn.indexOf('DEA') === 0) html += '<br/><span style="color:' + C.l2 + '">DEA</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn.indexOf('MACD') === 0 && sn.indexOf('MACD(') !== 0) {
                        // 纯 MACD 柱（不带参数后缀的不算，避免与 MACD(3,20,3) 重复）
                    }
                    if (sn.indexOf('MACD') === 0) html += '<br/><span style="color:' + C.muted + '">柱</span>: ' + (p.value != null ? p.value.toFixed(3) : '-');
                    if (sn === 'K') html += '<br/>K: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (sn === 'D') html += '<br/>D: ' + (p.value != null ? p.value.toFixed(2) : '-');
                    if (sn === 'J') html += '<br/>J: ' + (p.value != null ? p.value.toFixed(2) : '-');
                });
                // 该日若有 B/S 标记，补出判因与**当时那份**计划价。
                // 图上三条虚线是「今天」的计划、标记是「历史」信号切换日，
                // 不分开标注就会被读成「S 点 = 某个止盈位」。
                var mk = markByDate[d.date];
                if (mk) {
                    var a = mk.adv || {};
                    var mkColor = mk.type === 'buy' ? C.up : C.down;
                    var mkName = a.label || (mk.type === 'buy' ? '可建仓' : '谨慎减仓');
                    html += '<br/><span style="color:' + mkColor + ';font-weight:bold">' +
                            (mk.type === 'buy' ? 'B' : 'S') + ' ' + mkName + '</span>';
                    if (a.stop_loss != null) {
                        html += '<br/>当日计划 入场 ' + _mkPx(a.entry_price) +
                                ' / 止损 ' + _mkPx(a.stop_loss) +
                                ' / 止盈 ' + _mkPx(a.take_profit);
                    } else {
                        html += '<br/><span style="color:' + C.muted + '">该日不建仓，无止损/止盈价</span>';
                    }
                    if (a.brief) html += '<br/><span style="color:' + C.muted + '">' + a.brief + '</span>';
                }
                // 跟踪单实际成交点（价是真成交价，与上面档位标记分开标注来源）
                var tev = trackByDate[d.date];
                if (tev && tev.length) {
                    tev.forEach(function(e) {
                        if (e.kind === 'entry') {
                            html += '<br/><span style="color:' + C.l1 + ';font-weight:bold">建 跟踪单建仓 ' +
                                    _mkPx(e.price) + '</span><span style="color:' + C.muted +
                                    '">（' + (e.scan_date || '') + ' 推荐）</span>';
                        } else {
                            var rt = (e.return_pct == null || isNaN(e.return_pct)) ? '' :
                                ' <span style="color:' + (e.return_pct >= 0 ? C.up : C.down) + ';font-weight:bold">' +
                                (e.return_pct >= 0 ? '+' : '') + Number(e.return_pct).toFixed(2) + '%</span>';
                            html += '<br/><span style="color:' + C.l3 + ';font-weight:bold">卖 跟踪单卖出 ' +
                                    _mkPx(e.price) + '</span><span style="color:' + C.muted + '">（' +
                                    (e.reason || '平仓') + '）</span>' + rt;
                        }
                    });
                }
                return html;
            }
        },
        grid: grids,
        xAxis: xAxisArr,
        yAxis: yAxisArr,
        dataZoom: [
            { type: 'slider', xAxisIndex: allXAxisIndexes, start: 50, end: 100, height: 25, bottom: 0,
              borderColor: C.grid, backgroundColor: C.panel,
              dataBackground: { lineStyle: { color: C.l1 }, areaStyle: { color: 'rgba(' + C.accentRgb + ',0.08)' } },
              textStyle: { color: C.axis }, handleStyle: { color: C.l1 } },
            { type: 'inside', xAxisIndex: allXAxisIndexes, zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
        ],
        series: seriesArr
    };

    // 买卖点标记
    if (marks && marks.length > 0) {
        opt.series.push({
            type: 'scatter', name: '买卖点', data: marks.map(function(m) { return [m.date, m.price]; }), xAxisIndex: 0, yAxisIndex: 0,
            symbolSize: 14, symbol: 'pin',
            itemStyle: { color: function(p) { return marks[p.dataIndex]?.type === 'buy' ? C.up : C.down; } },
            label: { show: true, formatter: function(p) { return marks[p.dataIndex]?.type === 'buy' ? 'B' : 'S'; }, color: '#fff', fontSize: 10, fontWeight: 'bold', position: 'top' }
        });
    }

    // 跟踪单实际成交点：建仓=正三角(青)在下方，卖出=菱形(紫)在上方，y 用真实成交价。
    // 刻意与 B/S 的 pin+红绿分形分色：同屏两套口径不能靠颜色区分。
    if (trackMarks && trackMarks.length > 0) {
        opt.series.push({
            type: 'scatter', name: '跟踪单成交', xAxisIndex: 0, yAxisIndex: 0, z: 6,
            data: trackMarks.map(function(e) {
                var isEntry = e.kind === 'entry';
                return {
                    value: [e.date, e.price],
                    symbol: isEntry ? 'triangle' : 'diamond',
                    symbolSize: 13,
                    itemStyle: { color: isEntry ? C.l1 : C.l3, borderColor: C.panel, borderWidth: 1 },
                    label: {
                        show: true, formatter: isEntry ? '建' : '卖',
                        position: isEntry ? 'bottom' : 'top',
                        color: isEntry ? C.l1 : C.l3, fontSize: 10, fontWeight: 'bold'
                    }
                };
            })
        });
    }

    // MACD 数值面板：在 MACD 副图左上角显示参数 + 最新 DIF/DEA/柱体值
    if (ind.macd) {
        var mp2 = getKlineMacdParams();
        // 重新计算（确保拿到最新值）
        var macdPanelData = calcMACD(kdata, mp2.fast, mp2.slow, mp2.signal);
        var lastDif = macdPanelData.dif[macdPanelData.dif.length - 1];
        var lastDea = macdPanelData.dea[macdPanelData.dea.length - 1];
        var lastMacd = macdPanelData.macd[macdPanelData.macd.length - 1];
        var macdColor = lastMacd >= 0 ? C.up : C.down;
        // 找 MACD 副图的 grid 索引（成交量在第1个，MACD 在第2个；若无成交量则 MACD 在第1个）
        var macdGridIdx = ind.vol ? 2 : 1;
        var macdGridTop = grids[macdGridIdx] ? parseFloat(grids[macdGridIdx].top) : 70;

        opt.graphic = [{
            type: 'group',
            left: '12%',
            top: macdGridTop + 2 + '%',
            children: [
                // 参数标签
                { type: 'text', left: 0, top: 0, style: {
                    text: 'MACD(' + mp2.fast + ',' + mp2.slow + ',' + mp2.signal + ')',
                    fill: C.muted, fontSize: 11, fontWeight: 'bold'
                }},
                // DIF 值
                { type: 'text', left: 110, top: 0, style: {
                    text: 'DIF:' + (lastDif != null ? lastDif.toFixed(3) : '-'),
                    fill: C.l1, fontSize: 11, fontWeight: 'bold'
                }},
                // DEA 值
                { type: 'text', left: 185, top: 0, style: {
                    text: 'DEA:' + (lastDea != null ? lastDea.toFixed(3) : '-'),
                    fill: C.l2, fontSize: 11, fontWeight: 'bold'
                }},
                // 柱体值
                { type: 'text', left: 260, top: 0, style: {
                    text: '柱:' + (lastMacd != null ? lastMacd.toFixed(3) : '-'),
                    fill: macdColor, fontSize: 11, fontWeight: 'bold'
                }}
            ]
        }];
    }

    return opt;
}

/**
 * 读取 K 线弹窗 MACD 参数输入框的值（快线/慢线/信号），非法值回退默认
 */
function getKlineMacdParams() {
    var f = parseInt((document.getElementById('kl_macd_fast') || {}).value) || 12;
    var s = parseInt((document.getElementById('kl_macd_slow') || {}).value) || 26;
    var g = parseInt((document.getElementById('kl_macd_signal') || {}).value) || 9;
    return { fast: Math.max(2, f), slow: Math.max(2, s), signal: Math.max(2, g) };
}

/**
 * MACD 参数变更 → 用缓存数据即时重绘（防抖 300ms，避免连续输入时频繁渲染）
 */
var _macdParamTimer = null;
function onKlineMacdParamChange() {
    clearTimeout(_macdParamTimer);
    _macdParamTimer = setTimeout(function() {
        if (window._klineCache) renderKlineWithIndicators(window._klineCache);
    }, 300);
}

/**
 * 切换副图指标并重新渲染
 */
function toggleIndicator(name) {
    klineIndicators[name] = !klineIndicators[name];
    // 更新按钮样式（含 MACD 参数组显隐）
    updateIndicatorButtons();
    // 重新渲染（使用缓存的 kdata）
    if (window._klineCache) {
        renderKlineWithIndicators(window._klineCache);
    }
}

/**
 * 更新指标按钮的激活状态样式（含 MACD 参数组显隐）
 */
function updateIndicatorButtons() {
    var btns = document.querySelectorAll('.indicator-btn');
    btns.forEach(function(btn) {
        var key = btn.dataset.indicator;
        if (klineIndicators[key]) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
    // MACD 参数输入组跟随 MACD 激活状态显隐
    var paramsEl = document.getElementById('klMacdParams');
    if (paramsEl) paramsEl.style.display = klineIndicators.macd ? 'inline-flex' : 'none';
}

/**
 * 使用当前指标配置渲染K线图
 */
function renderKlineWithIndicators(cache) {
    resolveKlinePalette();
    var dates = cache.kdata.map(function(d) { return d.date; });
    var ohlc = cache.kdata.map(function(d) {
        var color = klineColor(d);
        return { value: [d.open, d.close, d.low, d.high], itemStyle: { color: color, color0: color, borderColor: color, borderColor0: color } };
    });
    var volData = cache.kdata.map(function(d) {
        return {
            value: d.vol,
            itemStyle: { color: d.chgPct >= 0 ? _klinePalette.up : _klinePalette.down }
        };
    });

    var klineChartInst = ChartManager.get('kline', document.getElementById('klineChart'));
    klineChartInst.clear();

    // 根据激活的副图数量动态调整图表高度
    var activeCount = Object.values(klineIndicators).filter(Boolean).length;
    var baseChartH = window.innerWidth < 480 ? 280 : window.innerWidth < 768 ? 380 : 560;
    var chartHeight = baseChartH + (activeCount - 1) * (window.innerWidth < 768 ? 70 : 100); // 每多一个副图增加100px
    chartHeight = Math.min(chartHeight, window.innerWidth < 768 ? 500 : 800); // 最大800px
    document.getElementById('klineChart').style.height = chartHeight + 'px';

    var opt = buildKlineOption(cache.kdata, dates, ohlc, volData, cache.marks);
    opt.title.text = cache.code + ' K线图';
    _fitKlineNarrowLayout(opt, document.getElementById('klineChart'));   // P4#8：375 bottom sheet 下成交量轴标防裁切
    klineChartInst.setOption(opt);
    klineChartInst.resize();
}

// 市场速览：点击指数卡片 → 打开指数K线（读 index_daily 表，/scoring/index-kline）
async function openIndexKline(code, name) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    window._klineCode = code;      // 供「实时行情」跳转按钮使用（指数走 zs 前缀）
    window._klineIsIndex = true;
    let start = '2024-01-01', end = new Date().toISOString().split('T')[0];
    let url = API + '/scoring/index-kline/' + code + '?start=' + start + '&end=' + end;

    let kdata = [], marks = [];
    try {
        const resp = await RequestManager.fetch('idx-kline-' + code, url,
            {cacheTtl: RequestManager.CACHE_TTL});
        kdata = (resp.data?.kline || []).map(d => ({ date: d[0], open: d[1], close: d[2], low: d[3], high: d[4], vol: d[5] || 0 }));
        marks = resp.data?.marks || [];
    } catch(e) {
        console.error('index kline fetch error:', e);
        showToast('K线数据获取失败', 'error');
    }

    if (kdata.length === 0) {
        document.getElementById('klineTradeInfo').innerHTML = '<p class="text-muted">无K线数据</p>';
        return;
    }

    // 计算涨跌幅；指数无涨跌停，limitType 全部为 normal
    for (let i = 0; i < kdata.length; i++) {
        kdata[i].prevClose = i > 0 ? kdata[i-1].close : kdata[i].open;
        kdata[i].chgPct = kdata[i].prevClose > 0 ? ((kdata[i].close / kdata[i].prevClose - 1) * 100) : 0;
        kdata[i].limitType = 'normal';
    }

    window._klineCache = { code: (name || '') + ' ' + code, kdata: kdata, marks: marks };
    updateIndicatorButtons();
    renderKlineWithIndicators(window._klineCache);
    document.getElementById('klineTradeInfo').innerHTML =
        `<h4 style="font-family:var(--font-mono);margin-bottom:8px;color:var(--text-primary)">${name || ''} ${code}</h4>`;
}

async function openKline(code, entryDate, entryPrice, exitDate, exitPrice, resultId) {
    const panel = document.getElementById('klinePanel'); panel.classList.add('open');
    window._klineCode = code;  // 供「实时行情」跳转按钮使用（即使K线拉取失败也能跳）
    window._klineIsIndex = false;
    let start = '2024-01-01', end = new Date().toISOString().split('T')[0];
    if (entryDate) { const d = new Date(entryDate); d.setMonth(d.getMonth()-2); start = d.toISOString().split('T')[0]; }
    if (exitDate) { const d = new Date(exitDate); d.setMonth(d.getMonth()+2); end = d.toISOString().split('T')[0]; }

    let url = API + '/scoring/kline/' + code + '?start=' + start + '&end=' + end;
    if (resultId) url += '&result_id=' + resultId;

    let kdata = [], marks = [];
    try {
        const resp = await RequestManager.fetch('kline-' + code, url,
            {cacheTtl: RequestManager.CACHE_TTL});
        kdata = (resp.data?.kline || []).map(d => ({ date: d[0], open: d[1], close: d[2], low: d[3], high: d[4], vol: d[5] || 0 }));
        marks = resp.data?.marks || [];
    } catch(e) {
        console.error('kline fetch error:', e);
        showToast('K线数据获取失败', 'error');
    }

    if (kdata.length === 0) {
        document.getElementById('klineTradeInfo').innerHTML = '<p class="text-muted">无K线数据</p>';
        return;
    }

    // 计算涨跌幅和涨跌停标记
    for (let i = 0; i < kdata.length; i++) {
        kdata[i].prevClose = i > 0 ? kdata[i-1].close : kdata[i].open;
        kdata[i].chgPct = kdata[i].prevClose > 0 ? ((kdata[i].close / kdata[i].prevClose - 1) * 100) : 0;
        kdata[i].limitType = (function() {
            if (!kdata[i].prevClose || kdata[i].prevClose <= 0) return 'normal';
            const chgPct = (kdata[i].close / kdata[i].prevClose - 1) * 100;
            const n = /^30/.test(code) || /^688/.test(code) ? 19.5 : /^[84]/.test(code) ? 29.5 : 9.5;
            if (chgPct >= n) return 'limit_up';
            if (chgPct <= -n) return 'limit_down';
            return 'normal';
        })();
    }

    // 缓存数据，供切换指标时复用（无需重新请求后端）
    window._klineCache = { code: code, kdata: kdata, marks: marks };

    // 更新指标按钮状态
    updateIndicatorButtons();

    // 使用动态指标渲染
    renderKlineWithIndicators(window._klineCache);

    let infoHtml = `<h4 style="font-family:var(--font-mono);margin-bottom:8px;color:var(--text-primary)">${code}</h4>`;
    if (entryDate && entryPrice) {
        infoHtml += `<p style="font-size:var(--fs-2);color:var(--text-secondary)">买入: ${entryDate} 价格: ${entryPrice}</p>`;
        if (exitDate && exitPrice && entryPrice > 0) {
            const pnl = ((exitPrice/entryPrice - 1)*100).toFixed(2);
            const cls = parseFloat(pnl) >= 0 ? 'positive' : 'negative';
            infoHtml += `<p style="font-size:var(--fs-2);color:var(--text-secondary)">卖出: ${exitDate} 价格: ${exitPrice} 收益: <span class="${cls}">${pnl}%</span></p>`;
        }
    }
    document.getElementById('klineTradeInfo').innerHTML = infoHtml;
}

function closeKline() {
    document.getElementById('klinePanel').classList.remove('open');
    window._klineCache = null; // 关闭弹窗时清理缓存
    window._klineCode = null;
    window._klineIsIndex = false;
}

// 跳转到东方财富实时行情页（新标签页打开）
function quoteUrlFor(code) {
    code = String(code || '');
    if (/^6/.test(code)) return 'https://quote.eastmoney.com/sh' + code + '.html';
    if (/^[489]/.test(code)) return 'https://quote.eastmoney.com/bj/' + code + '.html';
    return 'https://quote.eastmoney.com/sz' + code + '.html';
}
function openQuotePage() {
    const code = window._klineCode || (window._klineCache && window._klineCache.code);
    if (!code) { showToast('未获取到股票代码', 'warning'); return; }
    let url;
    if (window._klineIsIndex) {
        // 指数行情页走 zs 前缀（上证指数 zs000001、深证成指 zs399001、沪深300 zs000300）
        url = 'https://quote.eastmoney.com/zs' + String(code).replace(/[^0-9]/g, '') + '.html';
    } else {
        url = quoteUrlFor(code);
    }
    window.open(url, '_blank', 'noopener');
}

// ─── L06 验证闭环 + 纪律装置包视图（T3/T4 前端，契约：shared/specs/L06_spec.md §8、JH4_spec.md §8/§9）───
// 计时口径：倒计时只是显示层，判定以服务端 created_at→decided_at 为准（L06_spec §2，防关标签页绕计时）。

var L06_TRIAGE_BUDGET = 1800;   // 与后端 TRIAGE_BUDGET_SECONDS 对齐（仅显示层）

function rpEsc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
}
function rpPct(v, dp) {   // 小数口径（引擎指标）→ 百分比文本；max_drawdown 为负小数
    if (v == null || isNaN(v)) return '--';
    return (Number(v) * 100).toFixed(dp == null ? 1 : dp) + '%';
}
function rpSigned(v, txt) {
    var cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : '');
    return '<span class="' + cls + '">' + txt + '</span>';
}
function rpLocalDate(str) { return new Date(String(str || '').replace(' ', 'T')); }
function rpMmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function rpCountdownText(target) {
    var ms = target - Date.now();
    var neg = ms < 0;
    ms = Math.abs(ms);
    var h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = Math.floor(ms % 60000 / 1000);
    return (neg ? '已超 ' : '') + (h > 0 ? h + ' 时 ' : '') + m + ' 分 ' + s + ' 秒';
}
function rpIsoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y = t.getUTCFullYear(), ys = new Date(Date.UTC(y, 0, 1));
    return y + '-' + String(Math.ceil(((t - ys) / 86400000 + 1) / 7)).padStart(2, '0');
}
function rpJsonPost(key, url, body) {
    return RequestManager.fetch(key, url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
}

var L06_CHECKS = [
    ['T1', '条件可表达', '指标都能在目录取到？不成立 → LOGIC'],
    ['T2', '未来函数硬门', '仅 open/high/low/close/volume 可作当日决策依据；派生分（fusion_score 等）只能按决策日之前取数。此门不可跳过'],
    ['T3', '数据可得性', '窗口覆盖率 ≥80% 且指标非空率 ≥70%；不足 → defer（数据问题不杀想法）'],
    ['T4', '样本量下限', '预计成信号 ≥30 笔；不足 → SAMPLE（统计无意义）'],
    ['T5', '可成交性', '次日开盘口径不可成交占比 ≤30%；超 → LIQUIDITY'],
    ['T6', '重复覆盖', '与现有规则 Jaccard≥0.8 须写明「与已有规则不同在哪」才许 pass'],
    ['T7', '频率档位', '隐含持有 3~20 交易日才算中频；不符 → 改档或判死'],
];
var L06_DEATH_LABEL = {
    LOGIC: '逻辑不成立', DATA: '数据不可得', SAMPLE: '样本不足', LIQUIDITY: '不可成交',
    COST: '成本蚕食', REGIME: '环境依赖', WEAK: '信号偏弱', NONE: '值得推进',
    TIMEOUT: '不可验证（二次超时）',
};
var L06_DEATH_CODES = ['LOGIC', 'DATA', 'SAMPLE', 'LIQUIDITY', 'REGIME'];
var PF_ANCHOR_KINDS = ['price_below', 'drawdown_from_entry', 'giveback_from_peak', 'deadline', 'indicator_below', 'unlock_event'];
var PF_INDICATORS = ['fusion_score', 'vol_ratio', 'chip_conc', 'close_vs_ma20', 'j', 'rsi14'];

// ═══ Tab 验证(l06) ═══
var _l06Active = null;   // {idea, attempt, overtimeShown, verdict, bundleId}
