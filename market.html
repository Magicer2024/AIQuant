<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时行情监控 | AIQuant</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --up: #ef4444;
            --down: #22c55e;
            --accent: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.25rem; display: flex; align-items: center; gap: 0.5rem; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--muted); display: inline-block;
        }
        .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.disconnected { background: #ef4444; }
        .container { padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; }
        .panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
        }
        .panel h2 { font-size: 0.875rem; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        input[type="text"] {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            color: var(--text); padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        button {
            background: var(--accent); color: white; border: none;
            padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer;
            font-size: 0.875rem; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button.secondary { background: var(--border); }
        .stock-tag {
            display: inline-flex; align-items: center; gap: 0.375rem;
            background: var(--bg); border: 1px solid var(--border);
            padding: 0.375rem 0.75rem; border-radius: 0.375rem;
            font-size: 0.8125rem; margin: 0.25rem;
        }
        .stock-tag .remove { cursor: pointer; color: var(--muted); }
        .stock-tag .remove:hover { color: #ef4444; }
        .quote-row {
            display: grid; grid-template-columns: 80px 1fr 100px 100px 100px 80px;
            gap: 0.75rem; padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            align-items: center; font-size: 0.875rem;
        }
        .quote-row:hover { background: rgba(255,255,255,0.02); }
        .quote-row.header { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
        .code { font-weight: 600; font-family: monospace; }
        .price { font-family: monospace; font-size: 1rem; font-weight: 600; }
        .change { font-family: monospace; }
        .change.up { color: var(--up); }
        .change.down { color: var(--down); }
        .vol { color: var(--muted); font-size: 0.75rem; }
        .time { color: var(--muted); font-size: 0.75rem; }
        .logs {
            max-height: 200px; overflow-y: auto;
            font-family: monospace; font-size: 0.75rem;
            color: var(--muted); line-height: 1.6;
        }
        .log-entry { padding: 0.125rem 0; }
        .empty-state {
            text-align: center; padding: 3rem; color: var(--muted);
        }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span class="status-dot" id="wsStatus"></span>
            实时行情监控
        </h1>
        <div style="color: var(--muted); font-size: 0.875rem;">
            <a href="/dashboard" style="color:var(--muted);text-decoration:none;margin-right:1rem;">控制台</a>
            <a href="/quant" style="color:var(--muted);text-decoration:none;margin-right:1rem;">量化选股</a>
            AIQuant Market Monitor
        </div>
    </header>

    <div class="container">
        <div class="grid">
            <!-- 左侧控制面板 -->
            <div>
                <div class="panel" style="margin-bottom: 1.5rem;">
                    <h2>订阅管理</h2>
                    <div class="input-group">
                        <input type="text" id="stockInput" placeholder="输入股票代码，如 000001" />
                        <button onclick="addStock()">订阅</button>
                    </div>
                    <div id="stockList"></div>
                </div>

                <div class="panel">
                    <h2>连接日志</h2>
                    <div class="logs" id="logs"></div>
                </div>
            </div>

            <!-- 右侧行情面板 -->
            <div class="panel">
                <h2>行情报价</h2>
                <div class="quote-row header">
                    <div>代码</div>
                    <div></div>
                    <div style="text-align:right">最新价</div>
                    <div style="text-align:right">涨跌幅</div>
                    <div style="text-align:right">成交量</div>
                    <div style="text-align:right">时间</div>
                </div>
                <div id="quotes">
                    <div class="empty-state">暂无订阅，请在左侧添加股票代码</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const wsUrl = `ws://${location.host}/ws/market`;
        let ws = null;
        let subscribed = new Set();
        let quoteData = {};

        const $ = id => document.getElementById(id);
        const log = msg => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            $('logs').prepend(div);
        };

        function connect() {
            ws = new WebSocket(wsUrl);
            $('wsStatus').className = 'status-dot';

            ws.onopen = () => {
                $('wsStatus').className = 'status-dot connected';
                log('WebSocket 已连接');
                // 重新订阅
                if (subscribed.size > 0) {
                    send({ action: 'subscribe', payload: { codes: Array.from(subscribed) } });
                }
            };

            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleMessage(msg);
            };

            ws.onclose = () => {
                $('wsStatus').className = 'status-dot disconnected';
                log('WebSocket 已断开，5秒后重连...');
                setTimeout(connect, 5000);
            };

            ws.onerror = (err) => {
                log('WebSocket 错误: ' + err.message);
            };
        }

        function send(obj) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(obj));
            }
        }

        function handleMessage(msg) {
            const { type, data } = msg;

            if (type === 'connected') {
                log(`连接成功: ${data.ws_id}`);
            }
            else if (type === 'subscribed') {
                log(`订阅成功: ${data.subscribed?.join(', ') || ''}`);
            }
            else if (type === 'price_update') {
                updateQuote(data.code, data.data);
            }
            else if (type === 'system') {
                log(`系统: ${data.event} (客户端数: ${data.data?.total_clients})`);
            }
            else if (type === 'pong') {
                // 忽略心跳响应
            }
        }

        function updateQuote(code, d) {
            quoteData[code] = d;
            renderQuotes();
        }

        function renderQuotes() {
            const container = $('quotes');
            if (Object.keys(quoteData).length === 0) {
                container.innerHTML = '<div class="empty-state">暂无订阅，请在左侧添加股票代码</div>';
                return;
            }

            container.innerHTML = Object.entries(quoteData).map(([code, d]) => {
                const pct = d.pct_change || 0;
                const cls = pct >= 0 ? 'up' : 'down';
                const sign = pct >= 0 ? '+' : '';
                return `
                    <div class="quote-row">
                        <div class="code">${code}</div>
                        <div></div>
                        <div class="price" style="text-align:right">${d.close?.toFixed(2) || '--'}</div>
                        <div class="change ${cls}" style="text-align:right">${sign}${pct.toFixed(2)}%</div>
                        <div class="vol" style="text-align:right">${formatVol(d.volume)}</div>
                        <div class="time" style="text-align:right">${new Date(d.timestamp).toLocaleTimeString()}</div>
                    </div>
                `;
            }).join('');
        }

        function formatVol(v) {
            if (!v) return '--';
            if (v >= 100000000) return (v / 100000000).toFixed(1) + '亿';
            if (v >= 10000) return (v / 10000).toFixed(1) + '万';
            return v.toString();
        }

        function addStock() {
            const input = $('stockInput');
            const code = input.value.trim();
            if (!code) return;
            if (subscribed.has(code)) {
                log(`已订阅: ${code}`);
                return;
            }
            subscribed.add(code);
            input.value = '';
            renderStockList();
            send({ action: 'subscribe', payload: { codes: [code] } });
        }

        function removeStock(code) {
            subscribed.delete(code);
            delete quoteData[code];
            renderStockList();
            renderQuotes();
            send({ action: 'unsubscribe', payload: { codes: [code] } });
        }

        function renderStockList() {
            const container = $('stockList');
            if (subscribed.size === 0) {
                container.innerHTML = '<span style="color:var(--muted);font-size:0.8125rem">未订阅任何股票</span>';
                return;
            }
            container.innerHTML = Array.from(subscribed).map(code => `
                <span class="stock-tag">
                    ${code}
                    <span class="remove" onclick="removeStock('${code}')">&times;</span>
                </span>
            `).join('');
        }

        // 回车订阅
        $('stockInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addStock();
        });

        // 启动
        renderStockList();
        connect();

        // 定时心跳
        setInterval(() => {
            send({ action: 'ping', payload: { time: Date.now() } });
        }, 30000);
    </script>
</body>
</html>
