# LLM 配置文件
# 支持环境变量覆盖：LLM_API_KEY, LLM_BASE_URL, LLM_MODEL

# 默认模型（预设别名：gpt-4o, gpt-4o-mini, deepseek-chat, deepseek-reasoner, moonshot-v1, qwen-plus）
model: deepseek-v4-flash

# API Key（建议通过环境变量 LLM_API_KEY 设置，避免泄露）
api_key: ""

# Base URL（若使用预设模型可留空，自动填充）
base_url: "https://api.deepseek.com"

# 默认参数
default_temperature: 0.7
default_max_tokens: 2048
timeout: 60

# 功能开关
enabled: true
enhanced_intent_parsing: true    # 使用 LLM 增强策略意图解析
auto_trade_reason: false          # 自动为每笔交易生成 LLM 理由
market_analysis: true             # 启用大盘情绪分析
