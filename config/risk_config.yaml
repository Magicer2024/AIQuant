# AIQuant 风控规则配置
# 修改此文件无需重启服务，配置会自动热加载

version: "1.0"
last_modified: "2026-05-01"

# ─────────────────────────────────────────────
# 规则1: 最大回撤限制
# ─────────────────────────────────────────────
max_drawdown:
  enabled: true
  description: "账户回撤控制"
  thresholds:
    warning: 0.05      # 回撤 >= 5% 预警
    restrict: 0.10     # 回撤 >= 10% 限制（仓位减半）
    block: 0.15        # 回撤 >= 15% 禁止开仓
  messages:
    warning: "账户回撤 {drawdown:.1f}%，超过5%，请注意风险"
    restrict: "账户回撤 {drawdown:.1f}%，超过10%，限制开仓"
    block: "账户回撤 {drawdown:.1f}%，超过15%红线，禁止开仓"
  suggestions:
    warning: "密切关注持仓，考虑止盈"
    restrict: "建议将单股仓位降至平时的一半"
    block: "建议清仓观望，等待市场企稳"

# ─────────────────────────────────────────────
# 规则2: 单股集中度限制
# ─────────────────────────────────────────────
single_stock_limit:
  enabled: true
  description: "单只股票持仓不超过总资产的阈值"
  thresholds:
    warning: 0.25      # >= 25% 预警
    block: 0.30        # >= 30% 禁止
  messages:
    warning: "{stock} 持仓占比 {ratio:.1f}%，接近30%上限"
    block: "{stock} 持仓占比 {ratio:.1f}%，超过30%上限"
  suggestions:
    warning: "谨慎加仓，避免突破集中度限制"
    block: "禁止继续买入该股票，考虑减仓"

# ─────────────────────────────────────────────
# 规则3: 大盘择时（MA5/MA20）
# ─────────────────────────────────────────────
market_timing:
  enabled: true
  description: "沪深300指数 MA5 < MA20 时，空头市场预警"
  index_code: "000300"   # 沪深300
  ma_short: 5
  ma_long: 20
  threshold: 1.0
  level_when_bear: "RESTRICT"
  messages:
    restrict: "空头市场：沪深300 MA5({ma5:.0f}) < MA20({ma20:.0f})"
    pass: "多头市场：MA5({ma5:.0f}) > MA20({ma20:.0f})"
    skip: "大盘数据不可用，跳过择时检查"
  suggestions:
    restrict: "建议降低整体仓位至50%以下，减少开新仓"

# ─────────────────────────────────────────────
# 规则4: 连续亏损冷却期
# ─────────────────────────────────────────────
consecutive_loss:
  enabled: true
  description: "连续亏损后触发冷却期"
  thresholds:
    restrict: 3        # >= 3次 预警
    block: 5           # >= 5次 禁止开仓24小时
  messages:
    restrict: "连续亏损 {count} 次，进入预警状态"
    block: "连续亏损 {count} 次，触发强制冷却"
  suggestions:
    restrict: "降低仓位，下一笔交易强制人工确认"
    block: "暂停交易24小时，检查策略是否需要调整"

# ─────────────────────────────────────────────
# 规则5: 日交易频率限制
# ─────────────────────────────────────────────
daily_trade_limit:
  enabled: true
  description: "每日开仓次数上限"
  thresholds:
    warning: 3         # >= 3次 预警
    block: 5           # >= 5次 禁止
  messages:
    warning: "今日已开仓 {count} 次，接近上限"
    block: "今日已开仓 {count} 次，超过5次上限"
  suggestions:
    warning: "谨慎开仓，今日剩余额度有限"
    block: "今日不再开新仓，等待明日"

# ─────────────────────────────────────────────
# 规则6: 个股波动率限制（新增）
# ─────────────────────────────────────────────
volatility_limit:
  enabled: true
  description: "个股单日涨跌幅限制"
  thresholds:
    warning: 0.05      # >= 5% 预警
    block: 0.07        # >= 7% 禁止买入
  messages:
    warning: "{stock} 今日波动 {change:.1f}%，超过5%"
    block: "{stock} 今日波动 {change:.1f}%，超过7%，禁止追涨跌"
  suggestions:
    warning: "注意波动风险，避免冲动交易"
    block: "波动过大，建议等待价格企稳后再操作"

# ─────────────────────────────────────────────
# 规则7: 行业集中度限制（新增）
# ─────────────────────────────────────────────
sector_concentration:
  enabled: true
  description: "单一行业持仓占比限制"
  thresholds:
    warning: 0.35      # >= 35% 预警
    block: 0.40        # >= 40% 禁止
  messages:
    warning: "{sector} 行业持仓占比 {ratio:.1f}%，接近上限"
    block: "{sector} 行业持仓占比 {ratio:.1f}%，超过40%上限"
  suggestions:
    warning: "建议分散到其他行业"
    block: "禁止继续买入该行业股票，考虑减仓"

# ─────────────────────────────────────────────
# 规则8: 总仓位限制（新增）
# ─────────────────────────────────────────────
total_position_limit:
  enabled: true
  description: "总仓位上限"
  thresholds:
    warning: 0.80      # >= 80% 预警
    block: 0.90        # >= 90% 禁止新开仓
  messages:
    warning: "当前总仓位 {ratio:.1f}%，接近满仓"
    block: "当前总仓位 {ratio:.1f}%，已满仓，禁止开新仓"
  suggestions:
    warning: "注意保留现金应对突发情况"
    block: "必须先卖出部分持仓，才能开新仓"

# ─────────────────────────────────────────────
# 规则9: 节假日/周末持仓提醒（新增）
# ─────────────────────────────────────────────
weekend_hold:
  enabled: true
  description: "长假期前持仓风险提醒"
  threshold_days: 3    # 假期 >= 3 天触发
  level: "WARNING"
  messages:
    warning: "即将到来的假期共 {days} 天，请注意持仓风险"
  suggestions:
    warning: "建议假期前降低仓位，避免黑天鹅风险"

# ─────────────────────────────────────────────
# 黑名单设置
# ─────────────────────────────────────────────
blacklist:
  enabled: true
  description: "黑名单中的股票禁止交易"
  default_expiry_days: 30  # 默认黑名单有效期（天）

# ─────────────────────────────────────────────
# 豁免设置
# ─────────────────────────────────────────────
override:
  enabled: true
  description: "人工风控豁免"
  max_duration_hours: 4    # 单次豁免最长有效期
  require_reason: true     # 是否必须填写原因
  require_approval: false  # 是否需要审批（false=自动生效）
